        b.save(); b.translate(ox, oy); b.scale(s, s);
        const k = s * dpr;
        // Assiette
        b.shadowColor = 'rgba(150,90,120,0.28)'; b.shadowBlur = 26 * k; b.shadowOffsetY = 10 * k;
        b.beginPath(); b.arc(150, 140, 182, 0, Math.PI * 2); b.fillStyle = '#fffaf7'; b.fill();
        b.shadowColor = 'transparent';
        let g = b.createRadialGradient(150, 140, 120, 150, 140, 182);
        g.addColorStop(0, '#fff6f8'); g.addColorStop(0.8, '#ffe6ee'); g.addColorStop(1, '#f6cfdc');
        b.fillStyle = g; b.fill();
        b.beginPath(); b.arc(150, 140, 140, 0, Math.PI * 2);
        g = b.createRadialGradient(150, 115, 20, 150, 140, 140);
        g.addColorStop(0, '#fffefd'); g.addColorStop(1, '#fbedf2');
        b.fillStyle = g; b.fill();
        b.strokeStyle = 'rgba(220,165,190,0.45)'; b.lineWidth = 1.5; b.stroke();
        b.lineCap = 'round';
        b.beginPath(); b.arc(150, 140, 168, Math.PI * 1.08, Math.PI * 1.42);
        b.strokeStyle = 'rgba(255,255,255,0.9)'; b.lineWidth = 5; b.stroke();
        // Soucoupe
        b.shadowColor = 'rgba(100,140,125,0.3)'; b.shadowBlur = 18 * k; b.shadowOffsetY = 7 * k;
        b.beginPath(); b.ellipse(dish.x, dish.y + 6, 110, 70, 0, 0, Math.PI * 2); b.fillStyle = '#d6f5e6'; b.fill();
        b.shadowColor = 'transparent';
        g = b.createLinearGradient(0, dish.y - 64, 0, dish.y + 76);
        g.addColorStop(0, '#e9fff4'); g.addColorStop(1, '#bfe9d4');
        b.fillStyle = g; b.fill();
        b.beginPath(); b.ellipse(dish.x, dish.y + 8, 84, 50, 0, 0, Math.PI * 2);
        g = b.createLinearGradient(0, dish.y - 42, 0, dish.y + 58);
        g.addColorStop(0, '#c9eedc'); g.addColorStop(1, '#e2faee');
        b.fillStyle = g; b.fill();
        b.beginPath(); b.ellipse(dish.x, dish.y + 6, 104, 64, 0, Math.PI * 1.1, Math.PI * 1.5);
        b.strokeStyle = 'rgba(255,255,255,0.85)'; b.lineWidth = 3.5; b.stroke();
        b.restore();
      }

      // Pré-rendu de la tranche grillée
      function buildToast() {
        const c = tc;
        const k = toastLevel;
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.clearRect(0, 0, LW, LH);
        c.setTransform(RES, 0, 0, RES, -TB.x * RES, -TB.y * RES);
        c.shadowColor = 'rgba(110,60,30,0.38)'; c.shadowBlur = 12 * RES; c.shadowOffsetY = 7 * RES;
        c.fillStyle = U.hsl(26, 56, 36 - k * 7); c.fill(outerP);
        c.shadowColor = 'transparent';
        let g = c.createLinearGradient(0, 0, TW, TH);
        g.addColorStop(0, U.hsl(30, 58, 46 - k * 8)); g.addColorStop(1, U.hsl(23, 60, 32 - k * 7));
        c.fillStyle = g; c.fill(outerP);
        c.save(); c.clip(outerP);
        for (let i = 0; i < 700; i++) {
          const d = Math.random() < 0.6;
          c.fillStyle = d ? `rgba(80,35,10,${U.rand(0.1, 0.35)})` : `rgba(255,215,160,${U.rand(0.08, 0.25)})`;
          const r = U.rand(0.6, 2);
          c.fillRect(U.rand(-12, TW + 12), U.rand(-15, TH + 2), r, r);
        }
        c.lineWidth = 7; c.strokeStyle = 'rgba(80,35,10,0.35)'; c.stroke(outerP);
        c.lineWidth = 2.5; c.strokeStyle = 'rgba(255,215,160,0.3)'; c.stroke(clipP);
        c.restore();

        // Mie grillée
        c.save(); c.clip(innerP);
        g = c.createRadialGradient(150, 150, 20, 150, 140, 190);
        g.addColorStop(0, U.hsl(40, 82, 79 - k * 10));
        g.addColorStop(0.55, U.hsl(35, 74, 68 - k * 12));
        g.addColorStop(1, U.hsl(29, 64, 50 - k * 10));
        c.fillStyle = g; c.fillRect(-10, -20, TW + 20, TH + 30);
        for (let i = 0; i < 10; i++) {
          const x = U.rand(20, 280), y = U.rand(20, 260), r = U.rand(30, 85);
          g = c.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, `rgba(150,78,22,${0.1 + k * 0.14})`); g.addColorStop(1, 'rgba(150,78,22,0)');
          c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
        }
        for (let i = 0; i < 4; i++) {
          const x = U.rand(50, 250), y = U.rand(50, 230), r = U.rand(25, 60);
          g = c.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, 'rgba(255,238,195,0.22)'); g.addColorStop(1, 'rgba(255,238,195,0)');
          c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
        }
        for (let i = 0; i < 46; i++) {
          const x = U.rand(22, 278), y = U.rand(20, 258), rx = U.rand(1.2, 5.2), ry = rx * U.rand(0.45, 0.9), a = U.rand(-0.6, 0.6);
          c.beginPath(); c.ellipse(x, y, rx, ry, a, 0, Math.PI * 2);
          c.fillStyle = `rgba(110,52,15,${U.rand(0.25, 0.45)})`; c.fill();
          c.beginPath(); c.ellipse(x, y + ry * 0.25, rx, ry, a, 0.15 * Math.PI, 0.85 * Math.PI);
          c.strokeStyle = 'rgba(255,232,185,0.5)'; c.lineWidth = 0.9; c.stroke();
        }
        for (let i = 0; i < 2200; i++) {
          const d = Math.random() < 0.55;
          c.fillStyle = d ? `rgba(120,60,20,${U.rand(0.06, 0.22)})` : `rgba(255,240,205,${U.rand(0.08, 0.3)})`;
          const r = U.rand(0.5, 1.6);
          c.fillRect(U.rand(5, TW - 5), U.rand(-5, TH - 5), r, r);
        }
        c.lineWidth = 12; c.strokeStyle = 'rgba(130,62,18,0.22)'; c.stroke(innerP);
        c.lineWidth = 4; c.strokeStyle = 'rgba(110,50,15,0.3)'; c.stroke(innerP);
        c.restore();
      }

      /* ---------- Garniture : champ d'épaisseur ---------- */
      function markDirty(L, x0, y0, x1, y1) {
        L.dx0 = Math.min(L.dx0, Math.max(0, x0 - 3)); L.dy0 = Math.min(L.dy0, Math.max(0, y0 - 3));
        L.dx1 = Math.max(L.dx1, Math.min(GW - 1, x1 + 3)); L.dy1 = Math.max(L.dy1, Math.min(GH - 1, y1 + 3));
      }
      function flush(L) {
        if (L.dx1 < L.dx0 || L.dy1 < L.dy0) return;
        const x0 = L.dx0, y0 = L.dy0, x1 = L.dx1, y1 = L.dy1;
        shade(L, x0, y0, x1, y1);
        L.cx.putImageData(L.img, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
        L.dx0 = GW; L.dy0 = GH; L.dx1 = -1; L.dy1 = -1;
      }

      // Éclairage d'une zone : normale ← pente, diffus + reflet spéculaire + occlusion + ombre portée
      function shade(L, x0, y0, x1, y1) {
        const M = MODES[L.key], h = L.h, d = L.d, isB = L.key === 'butter';
        const NK = GR * 0.42;
        const tR = M.thin[0], tG = M.thin[1], tB = M.thin[2];
        const kR = M.thick[0] - tR, kG = M.thick[1] - tG, kB = M.thick[2] - tB;
        const shin = M.shin, gloss = M.gloss, kk = M.k, nv = M.nv;
        for (let y = y0; y <= y1; y++) {
          for (let x = x0; x <= x1; x++) {
            const i = y * GW + x, o = i * 4, hv = h[i];
            const sk = isB ? soak[i] : 0;
            const hs = (x > 1 && y > 1) ? h[i - 2 * GW - 2] : 0;
            let cs = hs - hv - 0.35;
            cs = cs > 0 ? (cs * 0.06 > 0.28 ? 0.28 : cs * 0.06) : 0;
            if (hv < 0.04) {
              if (sk > 0.01) {
                const sa = Math.min(0.55, sk * 0.6) + cs * 0.5;
                d[o] = 150 - cs * 200; d[o + 1] = 84 - cs * 120; d[o + 2] = 18; d[o + 3] = sa * 255;
              } else if (cs > 0.005) {
                d[o] = 95; d[o + 1] = 50; d[o + 2] = 18; d[o + 3] = cs * 200;
              } else d[o + 3] = 0;
              continue;
            }
            const hl = x > 1 ? h[i - 2] : hv, hr = x < GW - 2 ? h[i + 2] : hv;
            const hu = y > 1 ? h[i - 2 * GW] : hv, hd = y < GH - 2 ? h[i + 2 * GW] : hv;
            let nx = (hl - hr) * NK, ny = (hu - hd) * NK;
            if (nx > 1.3) nx = 1.3; else if (nx < -1.3) nx = -1.3;
            if (ny > 1.3) ny = 1.3; else if (ny < -1.3) ny = -1.3;
            const inv = 1 / Math.sqrt(nx * nx + ny * ny + 1);
            const lam = (nx * LX + ny * LY + LZ) * inv;
            const sp = (nx * HX + ny * HY + HZ) * inv;
            let lap = hl + hr + hu + hd - 4 * hv;
            lap = lap > 0 ? (lap * 0.03 > 0.18 ? 0.18 : lap * 0.03) : 0;
            const f = hv > 4 ? 1 : hv / 4;
            let r = tR + kR * f, g = tG + kG * f, b = tB + kB * f;
            let a = 1 - Math.exp(-hv * kk);
            let gl = gloss;
            if (isB) {
              const mm = melt[i];
              if (mm > 0.01) {
                r += (236 - r) * mm; g += (174 - g) * mm; b += (60 - b) * mm;
                a *= 1 - 0.5 * mm; gl *= 1 + mm * 1.6;
              }
            }
            const spec = sp > 0 ? Math.pow(sp, shin) * gl : 0;
            let sh = (0.42 + 0.86 * lam) * (1 + nz[i] * nv) - lap - cs;
            if (sh < 0.62) sh = 0.62;
            const s255 = spec * 255;
            r = r * sh + s255; g = g * sh + s255; b = b * sh + s255 * 0.9;
            a = a + spec * 0.6; if (a > 1) a = 1;
            if (sk > 0.01) {
              const sa = Math.min(0.55, sk * 0.6), oa = a + sa * (1 - a);
              r = (r * a + 150 * sa * (1 - a)) / oa; g = (g * a + 84 * sa * (1 - a)) / oa; b = (b * a + 18 * sa * (1 - a)) / oa;
              a = oa;
            }
            d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = a * 255;
          }
        }
      }

      // Fonte du beurre / coulure du miel, une bande de lignes par image
      function simulate(L, dtE) {
        const M = MODES[L.key], h = L.h, isB = L.key === 'butter';
        const y0 = L.strip, y1 = Math.min(GH - 1, y0 + STRIP - 1);
        L.strip = y1 + 1 >= GH ? 0 : y1 + 1;
        let bx0 = GW, bx1 = -1, by0 = GH, by1 = -1;
        const yl = M.yield;
        for (let y = y0; y <= y1; y++) {
          if (!L.rows[y]) continue;
          let rowAny = false;
          const row = y * GW;
          for (let x = 0; x < GW; x++) {
            const i = row + x;
            let hv = h[i];
            if (hv < 0.005) {
              if (hv !== 0) { h[i] = 0; if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y; }
              continue;
            }
            rowAny = true;
            let kf = M.flow;
            if (isB) {
              if (heat > 0.05) {
                let mm = melt[i] + dtE * heat * 0.07 / (1 + hv * 0.5);
                if (mm > 1) mm = 1;
                melt[i] = mm;
                const ab = dtE * mm * heat * 0.03 * (hv < 1.2 ? hv : 1.2);
                hv -= ab; soak[i] += ab * 0.9; h[i] = hv;
              }
              kf = melt[i] * 0.3 * heat;
            }
            if (kf > 0.001) {
              let k = kf * dtE; if (k > 0.2) k = 0.2;
              let j = i + 1;
              if (x + 1 < GW && outer[j]) {
                const hj = h[j];
                if (hv > yl || hj > yl) { const fl = (hv - hj) * k; hv -= fl; h[j] = hj + fl; }
              }
              j = i + GW;
              if (y + 1 < GH && outer[j]) {
                const hj = h[j];
                if (hv > yl || hj > yl) { const fl = (hv - hj) * k; hv -= fl; h[j] = hj + fl; if (h[j] > 0.005) L.rows[y + 1] = 1; }
              }
              h[i] = hv;
            }
            if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y;
          }
          if (!rowAny) L.rows[y] = 0;
        }
        if (bx1 >= bx0) markDirty(L, bx0, by0, bx1, by1 + 1);
      }

      function clearSpread() {
        KEYS.forEach((k) => {
          const L = layers[k];
          L.h.fill(0); L.rows.fill(0); L.d.fill(0);
          L.cx.clearRect(0, 0, GW, GH);
          L.dx0 = GW; L.dy0 = GH; L.dx1 = -1; L.dy1 = -1;
          celebrated[k] = false;
        });
        melt.fill(0); soak.fill(0);
        fruits.length = 0; sparks.length = 0;
        updateProgress(true);
      }

      // Conversions grille
      const cellX = (x) => Math.floor((x - GX0) * GR), cellY = (y) => Math.floor((y - GY0) * GR);
      const cellIdx = (x, y) => {
        const cx = cellX(x), cy = cellY(y);
        return cx < 0 || cy < 0 || cx >= GW || cy >= GH ? -1 : cy * GW + cx;
      };
      const onToast = (q) => { const i = cellIdx(q.x, q.y); return i >= 0 && outer[i] === 1; };

      // Interface
      const prog = SG.progress(stage, MODES[mode].name);
      const progLabel = prog.el.querySelector('.pl');
      function coverage() {
        const h = layers[mode].h, isB = mode === 'butter';
        let c = 0;
        for (let i = 0; i < h.length; i++) if (inner[i] && (h[i] >= 0.45 || (isB && soak[i] >= 0.3))) c++;
        return innerN ? c / innerN : 0;
      }
      function updateProgress(force) {
        const v = force ? 0 : coverage();
        prog.set(v / 0.92);
        if (!force && !celebrated[mode] && v >= 0.92) {
          celebrated[mode] = true;
          SG.celebrate(stage, MODES[mode].done);
          timers.push(setTimeout(() => SG.hint(stage, 'Encore ? Confiture, miel… ou nouvelle tartine 🍞', 3200), 2600));
        }
      }

      const narrow = stage.getBoundingClientRect().width < 470;
      const items = KEYS.map((key) => ({
        icon: MODES[key].icon, label: narrow ? '' : MODES[key].name, title: MODES[key].name,
        group: 'mode', active: key === mode, onClick: () => setMode(key),
      }));
      items.push({ icon: '🔪', label: narrow ? '' : 'Racler', title: 'Racler', group: 'mode', onClick: () => setTool('scrape') });
      items.push({ icon: '🍞', label: narrow ? '' : 'Nouvelle tartine', title: 'Nouvelle tartine', onClick: () => newSlice() });
      SG.toolbar(stage, items);
      SG.hint(stage, 'Prends du beurre avec le couteau, puis tartine !');

      function setMode(key) {
        tool = 'knife';
        if (key === mode) return;
        mode = key;
        if (ld.v > 0) { SG.audio.whoosh(0.12, 0.25); ld.film = 1; }
        ld.v = 0; ld.fruit = 0; wasFull = false;
        progLabel.textContent = MODES[key].name;
        updateProgress();
        SG.audio.squish(1.1, 0.25);
      }
      function setTool(t) {
        tool = t;
        if (t === 'scrape') SG.hint(stage, 'Racle la tartine pour enlever la garniture', 2400);
      }

      function newSlice() {
        if (leaving || slide !== 0) return;
        leaving = true;
        SG.audio.whoosh(0.3, 0.35);
        SG.audio.sand(0.15, 0.3);
        SG.haptic(8);
      }

      // Conversion écran → scène
      const toLocal = (p) => ({ x: (p.x - ox) / s, y: (p.y - oy) / s });

      function onSource(q) {
        if (mode === 'butter') return Math.abs(q.x - dish.x) < 70 && q.y > dish.y - 50 && q.y < dish.y + 40;
        return U.dist(q.x, q.y, dish.x, dish.y) < 58;
      }

      function ensureSound() {
        if (!snd && SG.audio.ctx()) {
          snd = SG.audio.loop('smear'); sndDry = SG.audio.loop('scrape'); sndSticky = SG.audio.loop('sticky');
        }
      }

      const knife = { x: dish.x - 10, y: dish.y - 70, a: 0.93, ta: 0.93, lift: 1 };
      function aimKnife(dx, dy, len) {
        let a = Math.atan2(dx / len, -dy / len);
        if (Math.abs(angDiff(a + Math.PI, knife.ta)) < Math.abs(angDiff(a, knife.ta))) a += Math.PI;
        if (Math.sin(a) < -0.55) a += Math.PI; // le manche ne pointe pas vers le haut
        knife.ta = a;
      }

      // Recharger le couteau
      function load(a, b, len) {
        if (tool !== 'knife') return;
        const m = marks[mode];
        m.push({ x0: a.x - dish.x, y0: a.y - dish.y, x1: b.x - dish.x, y1: b.y - dish.y, w: U.rand(7, 11) });
        if (m.length > 40) m.shift();
        ld.v = Math.min(LCAP, ld.v + len * 420);
        if (mode === 'jam') ld.fruit = Math.min(12, ld.fruit + len * 0.06);
        loadAcc += len;
        if (loadAcc > 38) {
          loadAcc = 0;
          if (mode === 'honey') SG.audio.bubble(U.rand(0.6, 0.9), 0.18);
          SG.audio.squish(U.rand(0.75, 1.1), mode === 'butter' ? 0.3 : 0.24);
        }
        if (ld.v >= LMAX && !wasFull) { wasFull = true; SG.audio.chime(4, 0.1); SG.haptic(10); }
        if (ld.v < LMAX * 0.8) wasFull = false;
        smearLv = Math.max(smearLv, U.clamp(len * 0.05, 0, 0.8)); smearTone = 0.12;
        if (mode === 'honey') stickyLv = Math.max(stickyLv, U.clamp(len * 0.05, 0, 0.8));
      }

      function line(c, ax, ay, bx, by) { c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke(); }

      // Passage de la lame à plat (une position) : prend le surplus, dépose la charge, bourrelets aux bords
      function blade(px, py, dx, dy, speed, st) {
        const nx = -dy, ny = dx, R = HW + 3;
        const ex = R * Math.abs(nx) + Math.abs(dx) + 1, ey = R * Math.abs(ny) + Math.abs(dy) + 1;
        const cx0 = Math.max(0, cellX(px - ex)), cx1 = Math.min(GW - 1, cellX(px + ex));
        const cy0 = Math.max(0, cellY(py - ey)), cy1 = Math.min(GH - 1, cellY(py + ey));
        if (cx1 < cx0 || cy1 < cy0) return;
        const scr = tool === 'scrape';
        const L = layers[mode], h = L.h, M = MODES[mode], isB = mode === 'butter';
        const t0 = M.t0 * U.lerp(1.25, 0.68, U.clamp(pressK / 1.3, 0, 1));
        let touched = false;
        for (let cy = cy0; cy <= cy1; cy++) {
          const yy = GY0 + (cy + 0.5) / GR - py;
          for (let cx = cx0; cx <= cx1; cx++) {
            const xx = GX0 + (cx + 0.5) / GR - px;
            const v = xx * dx + yy * dy;
            if (v < -1 || v > 1) continue;
            const u = xx * nx + yy * ny, au = u < 0 ? -u : u;
            if (au > R) continue;
            const i = cy * GW + cx;
            if (!outer[i]) continue;
            if (scr) {
              if (au > HW) continue;
              for (let k = 0; k < 3; k++) {
                const Lk = layers[KEYS[k]], cur = Lk.h[i];
                if (cur > 0.06) {
                  const take = (cur - 0.06) * 0.85;
                  Lk.h[i] = cur - take;
                  if (KEYS[k] === mode && ld.v < LCAP) ld.v += take * CA;
                  st.moved += take; st.contact++;
                }
              }
              continue;
            }
            const cur = h[i];
            if (au <= HW) {
              const edge = au > HW - 4 ? 1 - (au - (HW - 4)) * 0.11 : 1;
              const t = t0 * (1 + 0.17 * striAt(u) + 0.06 * nz[i]) * edge;
              if (cur > t) {
                let take = (cur - t) * 0.75;
                if (ld.v + take * CA > LCAP) take = Math.max(0, (LCAP - ld.v) / CA);
                h[i] = cur - take; ld.v += take * CA;
                st.moved += take; if (cur > 0.3) st.contact++;
                touched = true;
              } else if (ld.v > 0) {
                let give = (t - cur) * 0.6;
                const mx = ld.v / CA;
                if (give > mx) give = mx;
                h[i] = cur + give; ld.v -= give * CA;
                if (isB && melt[i] > 0) melt[i] *= cur / (cur + give);
                st.moved += give; st.contact++;
                L.rows[cy] = 1; touched = true;
              } else if (cur > 0.3) st.contact++;
            } else if (ld.v > 400) {
              const add = 0.18 * (1 - (au - HW) / 3) * Math.min(1, ld.v / 8000);
              h[i] = cur + add; ld.v -= add * CA;
              L.rows[cy] = 1; touched = true;
            }
          }
        }
        if (scr) { KEYS.forEach((k) => markDirty(layers[k], cx0, cy0, cx1, cy1)); pushFruits(px, py, dx, dy, true); return; }
        if (touched) markDirty(L, cx0, cy0, cx1, cy1);
        if (mode === 'jam') {
          pushFruits(px, py, dx, dy, false);
          if (ld.fruit >= 1 && ld.v > 300 && Math.random() < 0.05) {
            const o = U.rand(-HW + 3, HW - 3);
            addFruit(px + nx * o - dx * 2, py + ny * o - dy * 2);
            ld.fruit -= 1;
          }
        }
      }

      function addFruit(x, y) {
        if (fruits.length > 90) fruits.shift();
        fruits.push({ x, y, r: U.rand(2.6, 4.8), a: Math.random() * 6.3, sq: U.rand(0.6, 0.85), pale: Math.random() < 0.4 });
      }
      // Les morceaux de fruit sous la lame sont poussés devant elle (ou raclés)
      function pushFruits(px, py, dx, dy, remove) {
        const nx = -dy, ny = dx;
        for (let i = fruits.length - 1; i >= 0; i--) {
          const f = fruits[i], xx = f.x - px, yy = f.y - py;
          const v = xx * dx + yy * dy, u = xx * nx + yy * ny;
          if (v < -1.5 || v > 2.5 || Math.abs(u) > HW) continue;
          if (remove) { fruits.splice(i, 1); continue; }
          if (Math.random() < 0.55) { f.x += dx * 1.3; f.y += dy * 1.3; f.a += U.rand(-0.2, 0.2); }
        }
      }

      // Une noisette déposée d'un coup (toucher la tartine avec un couteau chargé)
      function glob(q, vol) {
        const L = layers[mode], h = L.h;
        const Hm = Math.min(8, 2.6 + vol / 3500);
        const r = Math.sqrt(vol * 1.9 / (Math.PI * Hm));
        const rx = r * 1.25, ry = r * 0.8, ca = Math.cos(knife.a), sa = Math.sin(knife.a), ph = Math.random() * 6.3;
        const R = rx + 1;
        const cx0 = Math.max(0, cellX(q.x - R)), cx1 = Math.min(GW - 1, cellX(q.x + R));
        const cy0 = Math.max(0, cellY(q.y - R)), cy1 = Math.min(GH - 1, cellY(q.y + R));
        let tot = 0;
        for (let cy = cy0; cy <= cy1; cy++) {
          const yy = GY0 + (cy + 0.5) / GR - q.y;
          for (let cx = cx0; cx <= cx1; cx++) {
            const i = cy * GW + cx;
            if (!outer[i]) continue;
            const xx = GX0 + (cx + 0.5) / GR - q.x;
            const lx = xx * ca + yy * sa, ly = -xx * sa + yy * ca;
            const q2 = (lx * lx) / (rx * rx) + (ly * ly) / (ry * ry);
            if (q2 >= 1) continue;
            const an = Math.atan2(ly, lx);
            const hh = Hm * Math.pow(1 - q2, 0.9) * (1 + 0.17 * Math.sin(an * 3 + Math.sqrt(q2) * 7 + ph));
            h[i] += hh; tot += hh * CA;
            if (mode === 'butter') melt[i] *= 0.3;
            L.rows[cy] = 1;
          }
        }
        ld.v = Math.max(0, ld.v - tot);
        markDirty(L, cx0, cy0, cx1, cy1);
        if (mode === 'jam') {
          const n = Math.min(Math.floor(ld.fruit), U.randInt(2, 4));
          for (let k = 0; k < n; k++) addFruit(q.x + U.rand(-r, r) * 0.7, q.y + U.rand(-r, r) * 0.5);
          ld.fruit -= n;
        }
        SG.audio.squish(U.rand(0.6, 0.75), 0.5);
        SG.audio.thud(0.18, 1.4);
        if (mode !== 'butter') SG.audio.drip(0.7, 0.25);
        SG.haptic(12);
      }

      // Lever le couteau : petits pics / crêtes là où la lame quitte la garniture
      function liftPeaks(q) {
        const amt = Math.min(ld.v * 0.16, 3200);
        if (amt < 150) return;
        const L = layers[mode], h = L.h;
        const ca = Math.cos(knife.a), sa = Math.sin(knife.a);
        const bumps = [];
        for (let k = 0; k < 4; k++) bumps.push({ c: U.rand(-HW + 3, HW - 3), w: U.rand(2, 5), a: U.rand(0.5, 1) });
        const Hp = 1 + amt / 1400;
        const R = HW + 3;
        const cx0 = Math.max(0, cellX(q.x - R)), cx1 = Math.min(GW - 1, cellX(q.x + R));
        const cy0 = Math.max(0, cellY(q.y - R)), cy1 = Math.min(GH - 1, cellY(q.y + R));
        let tot = 0;
        for (let cy = cy0; cy <= cy1; cy++) {
          const yy = GY0 + (cy + 0.5) / GR - q.y;
          for (let cx = cx0; cx <= cx1; cx++) {
            const i = cy * GW + cx;
            if (!outer[i]) continue;
            const xx = GX0 + (cx + 0.5) / GR - q.x;
            const u = xx * ca + yy * sa, v = -xx * sa + yy * ca;
            if (Math.abs(u) > HW || Math.abs(v) > 2.6) continue;
            let p = 0;
            for (const b of bumps) { const z = (u - b.c) / b.w; p += b.a * Math.exp(-z * z); }
            const hh = Hp * p * (1 - Math.abs(v) / 2.6);
            h[i] += hh; tot += hh * CA; L.rows[cy] = 1;
          }
        }
        ld.v = Math.max(0, ld.v - tot);
        markDirty(L, cx0, cy0, cx1, cy1);
        SG.audio.squish(U.rand(1.2, 1.45), 0.22);
        if (mode !== 'butter') SG.audio.bubble(U.rand(1.1, 1.5), 0.12);
      }

      function crumbs(x, y, n) {
        for (let i = 0; i < n; i++) {
          if (parts.length > 140) parts.shift();
          parts.push({
            x: x + U.rand(-8, 8), y: y + U.rand(-4, 4), vx: U.rand(-90, 90), vy: U.rand(-160, -40),
            r: U.rand(1, 2.6), rot: Math.random() * 6, vr: U.rand(-8, 8), life: U.rand(0.6, 1.1),
            col: U.pick(['#a8622a', '#c98242', '#8a4a1c', '#e0a865']),
          });
        }
      }

      function process(q, speed) {
        const dx = q.x - last.x, dy = q.y - last.y, len = Math.hypot(dx, dy);
        knife.x = q.x; knife.y = q.y;
        if (len < 1.2) return;
        aimKnife(dx, dy, len);
        if (onSource(last) || onSource(q)) load(last, q, len);
        if (slide === 0 && !leaving) {
          const ux = dx / len, uy = dy / len;
          pressK += (U.clamp(speed, 0, 2) - pressK) * 0.06;
          const st = { moved: 0, contact: 0 };
          const n = Math.ceil(len / 1.0);
          for (let k = 1; k <= n; k++) {
            const t = k / n;
            const px = last.x + dx * t, py = last.y + dy * t;
            if (px > GX0 - HW && px < GX0 + GWU + HW && py > GY0 - HW && py < GY0 + GHU + HW) blade(px, py, ux, uy, speed, st);
          }
          const on = onToast(q);
          if (on) movedOnToast += len;
          if (st.contact > 0) {
            const lv = U.clamp(speed * 0.85 + st.moved * 0.004, 0.08, 1);
            if (mode === 'honey' && tool === 'knife') stickyLv = Math.max(stickyLv, lv);
            else smearLv = Math.max(smearLv, lv * (tool === 'scrape' ? 0.6 : 1));
            smearTone = U.clamp(0.25 + speed * 0.3 - st.moved * 0.0006, 0.1, 0.9);
            if (tool === 'scrape') scrapeLv = Math.max(scrapeLv, U.clamp(speed * 0.5, 0, 0.6));
            dryDist = 0;
          } else if (on) {
            dryDist += len;
            scrapeLv = Math.max(scrapeLv, U.clamp(speed * 0.6, 0, 0.7));
            if (Math.random() < len / 120) crumbs(q.x, q.y, 1);
            const now = performance.now();
            if (tool === 'knife' && ld.v < 50 && dryDist > 260 && now - lastDryHint > 9000) {
              lastDryHint = now;
              SG.hint(stage, 'Recharge ton couteau dans le ' + MODES[mode].src + ' !', 2600);
            }
          }
          // Croûte qui craque
          const ci = cellIdx(q.x, q.y);
          const crust = ci >= 0 && outer[ci] === 1 && inner[ci] === 0;
          const now = performance.now();
          if (crust && now - lastCrunch > (wasCrust ? 85 : 30)) {
            lastCrunch = now;
            SG.audio.crunch(U.clamp(0.25 + speed * 0.35, 0.25, 0.85), 0.75);
            if (!wasCrust) SG.audio.tap('wood', 0.12, 1.4);
            SG.haptic(wasCrust ? 3 : 8);
            crumbs(q.x, q.y, U.randInt(1, 3));
          }
          wasCrust = crust;
        }
        if (Math.random() < len / 500) newStri();
        last = q;
      }

      const ptr = SG.pointer(cv.canvas, {
        down(p) {
          if (act !== null) return;
          act = p.id; pressed = true; movedOnToast = 0;
          ensureSound();
          const q = toLocal(p);
          knife.x = q.x; knife.y = q.y; last = q;
          newStri();
          if (onSource(q) && tool === 'knife') {
            ld.v = Math.min(LCAP, ld.v + 2200);
            if (mode === 'jam') ld.fruit = Math.min(12, ld.fruit + 1.5);
            SG.audio.squish(0.85, 0.4);
            if (mode === 'honey') SG.audio.bubble(0.7, 0.2, 0.04);
          } else if (slide === 0 && onToast(q)) {
            if (tool === 'knife' && ld.v > 3000) glob(q, ld.v * 0.4);
            else if (tool === 'knife' && ld.v > 0) SG.audio.squish(0.7, 0.22);
            else SG.audio.tap('wood', 0.16, 1.2);
          } else SG.audio.tap('ceramic', 0.1, 1.1);
          SG.haptic(5);
        },
        move(p) {
          if (p.id !== act) return;
          process(toLocal(p), p.speed);
        },
        hover(p) {
          if (act !== null) return;
          const q = toLocal(p);
          knife.x = q.x; knife.y = q.y;
        },
        up(p) {
          if (p.id !== act) return;
          act = null; pressed = false; wasCrust = false;
          if (tool === 'knife' && slide === 0 && movedOnToast > 8 && onToast(knife)) liftPeaks(knife);
        },
      });

      // Dessin du beurrier / pot
      function drawSource(c) {
        const d = dish, m = MODES[mode];
        if (mode === 'butter') {
          const w = 122, h = 62, dep = 15, x0 = d.x - w / 2, y0 = d.y - h / 2 - 8;
          c.fillStyle = 'rgba(120,150,120,0.22)';
          rr(c, x0 + 4, y0 + 8, w, h + dep, 14); c.fill();
          let g = c.createLinearGradient(0, y0 + h - 10, 0, y0 + h + dep);
          g.addColorStop(0, '#f8d77a'); g.addColorStop(1, '#e2ad48');
          rr(c, x0, y0, w, h + dep, 14); c.fillStyle = g; c.fill();
          g = c.createLinearGradient(0, y0, 0, y0 + h);
          g.addColorStop(0, '#fff6cc'); g.addColorStop(1, '#ffe190');
          rr(c, x0, y0, w, h, 14); c.fillStyle = g; c.fill();
          c.save(); c.clip();
          drawMarks(c);
          c.restore();
          c.fillStyle = 'rgba(255,255,255,0.5)';
          c.beginPath(); c.ellipse(x0 + 30, y0 + 13, 20, 5, -0.12, 0, Math.PI * 2); c.fill();
          c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 1.5; rr(c, x0 + 1, y0 + 1, w - 2, h - 2, 13); c.stroke();
        } else {
          const R = 60;
          c.fillStyle = 'rgba(110,140,120,0.25)';
          c.beginPath(); c.arc(d.x + 4, d.y + 7, R, 0, Math.PI * 2); c.fill();
          let g = c.createLinearGradient(0, d.y - R, 0, d.y + R);
          g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#f3d9e4');
          c.beginPath(); c.arc(d.x, d.y, R, 0, Math.PI * 2); c.fillStyle = g; c.fill();
          c.beginPath(); c.arc(d.x, d.y, R - 10, 0, Math.PI * 2);
          g = c.createRadialGradient(d.x - 14, d.y - 16, 4, d.x, d.y, R - 10);
          if (mode === 'jam') { g.addColorStop(0, '#f05a74'); g.addColorStop(0.6, '#c21c3c'); g.addColorStop(1, '#7e0b22'); } else { g.addColorStop(0, '#ffd86a'); g.addColorStop(0.6, '#f0a418'); g.addColorStop(1, '#b86a05'); }
          c.fillStyle = g; c.fill();
          c.save(); c.clip();
          if (mode === 'jam') {
            for (const j of jamBits) {
              c.fillStyle = 'rgba(120,5,28,0.8)';
              c.beginPath(); c.ellipse(d.x + j.x, d.y + j.y, j.r, j.r * 0.7, j.a, 0, Math.PI * 2); c.fill();
              c.fillStyle = 'rgba(255,170,185,0.45)';
              c.beginPath(); c.ellipse(d.x + j.x - j.r * 0.25, d.y + j.y - j.r * 0.2, j.r * 0.4, j.r * 0.25, j.a, 0, Math.PI * 2); c.fill();
            }
          }
          drawMarks(c);
          c.restore();
          c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineWidth = 3; c.lineCap = 'round';
          c.beginPath(); c.arc(d.x, d.y, R - 16, Math.PI * 1.1, Math.PI * 1.45); c.stroke();
          c.strokeStyle = 'rgba(200,150,170,0.5)'; c.lineWidth = 1.2;
          c.beginPath(); c.arc(d.x, d.y, R - 10, 0, Math.PI * 2); c.stroke();
          void m;
        }
      }
      // Sillons laissés par le couteau dans la source (creux + bord relevé éclairé)
      function drawMarks(c) {
        const m = MODES[mode];
        c.lineCap = 'round';
        const lo = mode === 'butter' ? '206,150,48' : (mode === 'jam' ? '70,0,15' : '150,80,0');
        const hi = mode === 'butter' ? '255,252,228' : (mode === 'jam' ? '255,150,170' : '255,236,180');
        for (const k of marks[mode]) {
          c.strokeStyle = `rgba(${lo},0.32)`; c.lineWidth = k.w;
          line(c, dish.x + k.x0, dish.y + k.y0 + 1, dish.x + k.x1, dish.y + k.y1 + 1);
          c.strokeStyle = `rgba(${hi},0.8)`; c.lineWidth = 1.6;
          line(c, dish.x + k.x0, dish.y + k.y0 + k.w * 0.5 + 0.5, dish.x + k.x1, dish.y + k.y1 + k.w * 0.5 + 0.5);
          c.strokeStyle = `rgba(${lo},0.25)`; c.lineWidth = 1.2;
          line(c, dish.x + k.x0, dish.y + k.y0 - k.w * 0.5, dish.x + k.x1, dish.y + k.y1 - k.w * 0.5);
        }
        void m;
      }

      // Noisette de garniture sur la lame : copeau roulé (beurre) ou goutte brillante
      function drawLoad(c) {
        const f = Math.sqrt(ld.v / LMAX);
        if (f < 0.03) return;
        const rx = 3.5 + 12 * f, ry = 2.6 + 5.5 * f, x = -3, y = 0.5;
        if (mode === 'butter') {
          c.fillStyle = 'rgba(150,100,30,0.25)';
          c.beginPath(); c.ellipse(x + 1, y + 2, rx, ry, 0, 0, Math.PI * 2); c.fill();
          const g = c.createLinearGradient(0, y - ry, 0, y + ry);
          g.addColorStop(0, '#fff7d0'); g.addColorStop(0.55, '#ffe69a'); g.addColorStop(1, '#e8bf5e');
          c.fillStyle = g;
          c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill();
          // spires du copeau
          c.strokeStyle = 'rgba(200,145,45,0.55)'; c.lineWidth = 0.8;
          const n = 2 + Math.floor(f * 4);
          for (let k = 1; k <= n; k++) {
            const t = k / (n + 1);
            c.beginPath(); c.ellipse(x - rx + rx * 2 * t, y, rx * 0.16, ry * 0.92, 0, -Math.PI / 2, Math.PI / 2); c.stroke();
          }
          c.fillStyle = 'rgba(255,255,255,0.75)';
          c.beginPath(); c.ellipse(x - rx * 0.25, y - ry * 0.45, rx * 0.5, ry * 0.2, 0, 0, Math.PI * 2); c.fill();
        } else {
          const M = MODES[mode];
          c.fillStyle = 'rgba(80,20,10,0.25)';
          c.beginPath(); c.ellipse(x + 1, y + 2, rx, ry, 0, 0, Math.PI * 2); c.fill();
          const g = c.createRadialGradient(x - rx * 0.3, y - ry * 0.4, 0, x, y, rx);
          if (mode === 'jam') { g.addColorStop(0, '#f05a74'); g.addColorStop(0.5, M.glob); g.addColorStop(1, '#6e0618'); } else { g.addColorStop(0, '#ffe08a'); g.addColorStop(0.5, M.glob); g.addColorStop(1, '#a35c05'); }
          c.fillStyle = g;
          c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill();
          if (mode === 'jam') {
            for (let k = 0; k < Math.min(4, Math.floor(ld.fruit)); k++) {
              c.fillStyle = 'rgba(110,0,20,0.85)';
              c.beginPath(); c.ellipse(x - rx * 0.6 + k * rx * 0.4, y + ((k % 2) - 0.5) * ry * 0.6, 2.2, 1.5, k, 0, Math.PI * 2); c.fill();
            }
          }
          c.fillStyle = 'rgba(255,255,255,0.85)';
          c.beginPath(); c.ellipse(x - rx * 0.3, y - ry * 0.45, rx * 0.35, ry * 0.18, 0, 0, Math.PI * 2); c.fill();
        }
      }

      // Couteau à beurre réaliste : lame courte arrondie, mitre, manche fin
      function drawKnife(c) {
        const m = MODES[mode];
        const scr = tool === 'scrape';
        const lift = knife.lift;
        c.save();
        c.translate(knife.x, knife.y);
        c.rotate(knife.a);
        // Ombre portée (plus loin et plus floue quand le couteau est levé)
        c.save();
        c.translate(3 + lift * 7, 4 + lift * 9);
        c.fillStyle = `rgba(90,50,60,${0.2 - lift * 0.08})`;
        c.beginPath(); c.ellipse(4, 0, HW + 4, 6.5, 0, 0, Math.PI * 2); c.fill();
        rr(c, HW + 6, -4.5, 48, 9, 4.5); c.fill();
        c.restore();
        c.translate(-lift * 2, -lift * 5);
        const bw = scr ? 3.4 : 5.4;
        // Lame
        c.beginPath();
        c.moveTo(HW + 5, -bw + 0.6);
        c.lineTo(-HW + 4, -bw);
        c.quadraticCurveTo(-HW - 3, -bw, -HW - 3, 0);
        c.quadraticCurveTo(-HW - 3, bw, -HW + 4, bw);
        c.lineTo(HW + 5, bw - 0.6);
        c.closePath();
        let g = c.createLinearGradient(0, -bw, 0, bw);
        g.addColorStop(0, '#fbfcff'); g.addColorStop(0.4, '#e3e8f0'); g.addColorStop(0.75, '#b9c2d0'); g.addColorStop(1, '#8e98a9');
        c.fillStyle = g; c.fill();
        c.strokeStyle = 'rgba(100,110,130,0.55)'; c.lineWidth = 0.6; c.stroke();
        // film de garniture resté sur la lame
        if (ld.film > 0.02) {
          c.save(); c.clip();
          c.fillStyle = `rgba(${m.film},${0.45 * ld.film})`;
          c.fillRect(-HW - 4, -bw, HW * 1.4, bw * 2);
          c.restore();
        }
        c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 1; c.lineCap = 'round';
        line(c, -HW + 2, -bw * 0.55, HW + 2, -bw * 0.5);
        // reflet doux mobile
        c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 2;
        line(c, -HW * 0.2, bw * 0.25, HW * 0.6, bw * 0.25);
        if (!scr) drawLoad(c);
        // Mitre
        g = c.createLinearGradient(0, -4, 0, 4);
        g.addColorStop(0, '#eef1f6'); g.addColorStop(1, '#9aa4b4');
        rr(c, HW + 4, -3.6, 5, 7.2, 1.6); c.fillStyle = g; c.fill();
        // Manche
        g = c.createLinearGradient(0, -4.6, 0, 4.6);
        g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, m.handle); g.addColorStop(1, m.handle);
        c.beginPath();
        c.moveTo(HW + 9, -3.6); c.lineTo(HW + 50, -4.6);
        c.quadraticCurveTo(HW + 56, 0, HW + 50, 4.6);
        c.lineTo(HW + 9, 3.6); c.closePath();
        c.fillStyle = g; c.fill();
        c.fillStyle = 'rgba(0,0,0,0.08)';
        rr(c, HW + 10, 1, 40, 3.2, 1.6); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.65)';
        rr(c, HW + 12, -3, 34, 1.6, 0.8); c.fill();
        c.fillStyle = 'rgba(200,205,215,0.95)';
        c.beginPath(); c.arc(HW + 20, 0, 1.2, 0, Math.PI * 2); c.arc(HW + 40, 0, 1.2, 0, Math.PI * 2); c.fill();
        c.restore();
      }

      function drawFruits(c) {
        for (const f of fruits) {
          c.save(); c.translate(f.x, f.y); c.rotate(f.a);
          c.fillStyle = 'rgba(70,0,12,0.35)';
          c.beginPath(); c.ellipse(0.7, 1, f.r, f.r * f.sq, 0, 0, Math.PI * 2); c.fill();
          c.fillStyle = f.pale ? '#c8283f' : '#a10f2a';
          c.beginPath(); c.ellipse(0, 0, f.r, f.r * f.sq, 0, 0, Math.PI * 2); c.fill();
          c.fillStyle = f.pale ? 'rgba(255,150,165,0.6)' : 'rgba(240,90,110,0.5)';
          c.beginPath(); c.ellipse(-f.r * 0.1, 0, f.r * 0.55, f.r * f.sq * 0.45, 0, 0, Math.PI * 2); c.fill();
          c.fillStyle = 'rgba(255,230,140,0.85)';
          c.fillRect(f.r * 0.35, -f.r * 0.2, 0.7, 0.9); c.fillRect(-f.r * 0.5, f.r * 0.2, 0.7, 0.9);
          c.restore();
          c.fillStyle = 'rgba(255,255,255,0.75)';
          c.beginPath(); c.ellipse(f.x - f.r * 0.35, f.y - f.r * 0.35, f.r * 0.32, f.r * 0.16, -0.5, 0, Math.PI * 2); c.fill();
        }
      }

      // Boucle principale
      layout(); buildBg(); buildToast(); clearSpread();
      knife.x = dish.x - 10; knife.y = dish.y - 70;
      cv.onResize(() => { layout(); buildBg(); });
      const loop = SG.loop((dt) => {
        // Glissement de la tranche
        if (leaving) {
          slide -= dt * 2200;
          if (slide < -700) {
            leaving = false; slide = 700;
            toastLevel = Math.random(); age = 0;
            buildToast(); clearSpread();
          }
        } else if (slide !== 0) {
          slide *= Math.exp(-dt * 9);
          if (Math.abs(slide) < 0.6) { slide = 0; SG.audio.tap('ceramic', 0.3, 0.9); SG.audio.thud(0.25, 1.2); SG.haptic(6); crumbs(150, 270, 5); }
        }
        knife.a += angDiff(knife.ta, knife.a) * (1 - Math.exp(-dt * 14));
        knife.lift += ((pressed ? 0 : 1) - knife.lift) * (1 - Math.exp(-dt * 16));
        ld.film = Math.max(ld.film * Math.exp(-dt * 0.05), Math.min(1, ld.v / 3000));

        // Chaleur du pain (diminue avec le temps) → fonte, vapeur
        if (slide === 0) age += dt;
        heat = 0.12 + 0.88 * Math.exp(-age / 55);
        const dtE = dt * GH / STRIP;
        simulate(layers.butter, dtE);
        simulate(layers.honey, dtE);
        simulate(layers.jam, dtE);
        KEYS.forEach((k) => flush(layers[k]));
        covT += dt;
        if (covT > 0.45) { covT = 0; if (slide === 0) updateProgress(); }

        // Petit grésillement du beurre qui fond sur le pain chaud
        const now = performance.now();
        if (heat > 0.4 && now - lastSizzle > 260 && Math.random() < 0.3) {
          const i = (Math.random() * GW * GH) | 0;
          if (layers.butter.h[i] > 0.3 && melt[i] < 0.95) { lastSizzle = now; SG.audio.bubble(U.rand(1.8, 2.8), 0.025 * heat); }
        }

        // Sons continus
        smearLv *= Math.exp(-dt * 9); scrapeLv *= Math.exp(-dt * 10); stickyLv *= Math.exp(-dt * 7);

          sndSticky.set(pressed ? stickyLv : 0, smearTone);
        }

        for (let i = parts.length - 1; i >= 0; i--) {
          const pt = parts[i];
          pt.vy += 700 * dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.rot += pt.vr * dt; pt.life -= dt;
          if (pt.life <= 0) parts.splice(i, 1);
        }
        // Vapeur
        if (slide === 0 && heat > 0.35 && Math.random() < heat * dt * 7 && steam.length < 30) {
          steam.push({ x: U.rand(30, 270), y: U.rand(40, 250), life: 0, max: U.rand(1.6, 2.6), r: U.rand(14, 26), vx: U.rand(-6, 6), w: Math.random() * 6 });
        }
        for (let i = steam.length - 1; i >= 0; i--) {
          const p = steam[i];
          p.life += dt; p.y -= dt * 22; p.x += (p.vx + Math.sin(p.life * 2.5 + p.w) * 8) * dt; p.r += dt * 8;
          if (p.life > p.max) steam.splice(i, 1);
        }

        for (let k = 0; k < 4; k++) {
          const key = k < 3 ? 'honey' : 'jam';
          const i = (Math.random() * GW * GH) | 0;
          if (layers[key].h[i] > 0.9 && sparks.length < 40) {
            sparks.push({ x: GX0 + ((i % GW) + 0.5) / GR, y: GY0 + (((i / GW) | 0) + 0.5) / GR, life: 0, max: U.rand(0.5, 1), s: U.rand(1.5, 3.2) });
          }
        }
        for (let i = sparks.length - 1; i >= 0; i--) { sparks[i].life += dt; if (sparks[i].life > sparks[i].max) sparks.splice(i, 1); }

        const W = cv.w, H = cv.h;
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(bgCv, 0, 0, W, H);
        ctx.save();
        ctx.translate(ox, oy); ctx.scale(s, s);
        ctx.save();
        ctx.translate(slide, 0);
        ctx.drawImage(toastCv, TB.x, TB.y, TB.w, TB.h);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        for (const k of KEYS) ctx.drawImage(layers[k].cv, GX0, GY0, GWU, GHU);
        drawFruits(ctx);
        if (sparks.length) {
          ctx.globalCompositeOperation = 'lighter';
          for (const sp of sparks) {
            const a = Math.sin(sp.life / sp.max * Math.PI);
            ctx.fillStyle = `rgba(255,250,225,${0.75 * a})`;
            const r = sp.s * a;
            ctx.beginPath();
            ctx.moveTo(sp.x - r * 1.8, sp.y); ctx.lineTo(sp.x, sp.y - r * 0.35); ctx.lineTo(sp.x + r * 1.8, sp.y); ctx.lineTo(sp.x, sp.y + r * 0.35); ctx.closePath();
            ctx.moveTo(sp.x, sp.y - r * 1.4); ctx.lineTo(sp.x + r * 0.3, sp.y); ctx.lineTo(sp.x, sp.y + r * 1.4); ctx.lineTo(sp.x - r * 0.3, sp.y); ctx.closePath();
            ctx.fill();
          }
          ctx.globalCompositeOperation = 'source-over';
        }
        for (const p of steam) {
          const a = Math.sin(p.life / p.max * Math.PI) * 0.22 * heat;
          ctx.globalAlpha = a;
          ctx.drawImage(steamSpr, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        drawSource(ctx);
        for (const pt of parts) {
          ctx.globalAlpha = U.clamp(pt.life * 2, 0, 1);
          ctx.fillStyle = pt.col;
          ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
          ctx.fillRect(-pt.r, -pt.r * 0.7, pt.r * 2, pt.r * 1.4);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        drawKnife(ctx);
        ctx.restore();
      });

      return {
        destroy() {
          loop.stop();
          ptr.destroy();
          timers.forEach(clearTimeout);
          if (snd) snd.stop();
          if (sndDry) sndDry.stop();
          if (sndSticky) sndSticky.stop();
          cv.destroy();
        },
      };
    },
  });
})();

(function () {

  function rr(c, x, y, w, h, r) {

    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function polyPath(c, pts) {
    c.beginPath();

  SG.registerGame({
    id: 'butter-cut',
    title: 'Beurre froid',
    emoji: '🧊',
    desc: 'Tranche un beurre bien froid qui craque, ou fais-en des copeaux.',

    create(stage) {

      const NC = narrow ? 56 : 80;
      const BB = { x: -6, y: -H0 - DV - 8, w: NC * CW + SX + 14, h: H0 + DV + 14 };

      const timers = [];
      let snd = null, sndB = null, sndLv = 0, sndTone = 0.5, brushLv = 0;
      let scrapeCount = 0, nextId = 1, lastImpact = 0;

      // Mise en page
      let s = 1, ox = 0, oy = 0, R = 2;
      function layout() {
        const W = cv.w, Hh = cv.h;
        const top = 58, bot = 86;
        const aw = W - 16, ah = Math.max(160, Hh - top - bot);
        const vw = view.x1 - view.x0, above = narrow ? 185 : 160;
        s = Math.min(aw / vw, ah / (above + 80), 2.1);
        Zf = U.clamp(ah / s - above - 24, 60, 220);
        const used = above + Zf + 24;
        ox = W / 2 - (view.x0 + vw / 2) * s;
        oy = top + (ah - used * s) / 2 + above * s;
        R = Math.min(3, s * cv.dpr);
        blockCv.width = Math.max(1, Math.round(BB.w * R)); blockCv.height = Math.max(1, Math.round(BB.h * R));

      }
      const P = (x, y, z) => [x + z * KX, -y - z * KY];

      function buildBg() {
        const W = cv.w, Hh = cv.h, dpr = cv.dpr;
        bgCv.width = Math.max(1, Math.round(W * dpr)); bgCv.height = Math.max(1, Math.round(Hh * dpr));
        const b = bgCv.getContext('2d');
        b.setTransform(dpr, 0, 0, dpr, 0, 0);
        // Crédence carrelée pastel
        let g = b.createLinearGradient(0, 0, 0, Hh);
        g.addColorStop(0, '#f1eaff'); g.addColorStop(1, '#fff0e6');
        b.fillStyle = g; b.fillRect(0, 0, W, Hh);

        b.save(); b.translate(ox, oy); b.scale(s, s);
        const k = s * dpr;
        // Grande planche à découper : seuls les bords arrière et avant sont visibles

        b.shadowColor = 'rgba(120,80,90,0.3)'; b.shadowBlur = 24 * k; b.shadowOffsetY = 12 * k;
        polyPath(b, [bl, br, [fr[0], fr[1] + 12], [fl[0], fl[1] + 12]]); b.fillStyle = '#cf9c6c'; b.fill();
        b.shadowColor = 'transparent';

        g = b.createLinearGradient(0, bl[1], 0, fl[1]);
        g.addColorStop(0, '#f6dab6'); g.addColorStop(1, '#e3b583');

        const span = fl[1] - bl[1];
        for (let i = 0; i < span / 5.5; i++) {
          const y = bl[1] + i * 5.5 + U.rand(-2, 2);
          b.strokeStyle = Math.random() < 0.5 ? `rgba(160,100,50,${U.rand(0.07, 0.18)})` : `rgba(255,240,215,${U.rand(0.2, 0.4)})`;
          b.lineWidth = U.rand(0.6, 1.8);
          b.beginPath(); b.moveTo(view.x0 - 300, y);
          b.bezierCurveTo(view.x0 + 60, y + U.rand(-8, 8), view.x1 - 60, y + U.rand(-8, 8), view.x1 + 300, y + U.rand(-4, 4));
          b.stroke();
        }
        for (let i = 0; i < 4; i++) {

          b.beginPath(); b.moveTo(x, y); b.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); b.stroke();
        }

        b.shadowColor = 'rgba(120,80,60,0.18)'; b.shadowBlur = 8 * k; b.shadowOffsetY = 3 * k;

        b.shadowColor = 'transparent';

        b.fillStyle = g; b.fill();
        b.save(); b.clip();
        b.strokeStyle = 'rgba(150,180,235,0.55)'; b.lineWidth = 3;
        let a = P(-30, 0, -12), c = P(L + 28, 0, -15);
        b.beginPath(); b.moveTo(a[0], a[1]); b.lineTo(c[0], c[1]); b.stroke();
        a = P(-30, 0, -7); c = P(L + 28, 0, -10);
        b.lineWidth = 1.2; b.beginPath(); b.moveTo(a[0], a[1]); b.lineTo(c[0], c[1]); b.stroke();
        b.strokeStyle = 'rgba(200,180,150,0.35)'; b.lineWidth = 1;
        for (let i = 0; i < 5; i++) {

          a = P(x, 0, -18); c = P(x + U.rand(-6, 6), 0, D + 22);
          b.beginPath(); b.moveTo(a[0], a[1]); b.lineTo(c[0], c[1]); b.stroke();
        }
        b.restore();
        b.font = '600 8px Fredoka, system-ui, sans-serif';
        b.fillStyle = 'rgba(120,150,215,0.7)';
        a = P(L + 26, 0, -15);
        b.save(); b.translate(a[0], a[1] + 1); b.rotate(0.013); b.textAlign = 'right';
        b.fillText('BEURRE DOUX · BEURRE DOUX', 0, 0);
        b.restore();
        b.restore();
      }

      // Pré-rendu du bloc (seulement quand il change)
      function renderBlock() {
        const c = bc;
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.globalCompositeOperation = 'source-over';
        c.clearRect(0, 0, blockCv.width, blockCv.height);
        c.setTransform(R, 0, 0, R, -BB.x * R, -BB.y * R);
        blockDirty = false;
        if (n <= 0) return;
        const gTop = c.createLinearGradient(0, -H0 - DV, 0, 0);
        gTop.addColorStop(0, COL.top); gTop.addColorStop(1, COL.top2);
        const gScr = c.createLinearGradient(0, -H0 - DV, 0, 0);
        gScr.addColorStop(0, '#fffbe2'); gScr.addColorStop(1, '#fff0bd');
        const gCut = c.createLinearGradient(0, -H0 - DV, 0, 0);
        gCut.addColorStop(0, '#fff8d6'); gCut.addColorStop(1, '#ffe9a6');
        for (let i = 0; i < n; i++) {
          const x0 = i * CW, x1 = x0 + CW, h = H[i], y = -h;
          c.fillStyle = scraped[i] ? gScr : gTop;
          c.beginPath();
          c.moveTo(x0 - 0.3, y); c.lineTo(x1 + 0.3, y); c.lineTo(x1 + SX + 0.3, y - DV); c.lineTo(x0 + SX - 0.3, y - DV);
          c.closePath(); c.fill();
          const hn = i === n - 1 ? 0 : H[i + 1];
          if (hn < h - 0.01) {
            c.beginPath();
            c.moveTo(x1, y); c.lineTo(x1 + SX, y - DV); c.lineTo(x1 + SX, -hn - DV); c.lineTo(x1, -hn);
            c.closePath();

          }
        }
        // Face avant
        const gF = c.createLinearGradient(0, -H0, 0, 0);
        gF.addColorStop(0, COL.front); gF.addColorStop(0.75, '#f7d273'); gF.addColorStop(1, COL.front2);
        c.beginPath(); c.moveTo(0, 0);
        for (let i = 0; i < n; i++) { c.lineTo(i * CW, -H[i]); c.lineTo(i * CW + CW, -H[i]); }
        c.lineTo(n * CW, 0); c.closePath();
        c.fillStyle = gF; c.fill();
        // Reflet cireux sur la face avant
        const gl = c.createLinearGradient(0, -H0, n * CW, 0);
        gl.addColorStop(0, 'rgba(255,255,255,0.0)'); gl.addColorStop(0.35, 'rgba(255,255,255,0.22)'); gl.addColorStop(0.5, 'rgba(255,255,255,0)');
        c.fillStyle = gl; c.fill();

        c.globalCompositeOperation = 'source-atop';
        c.fillStyle = c.createPattern(noiseCv, 'repeat');
        c.fillRect(BB.x, BB.y, BB.w, BB.h);
        c.globalCompositeOperation = 'source-over';
        // Stries laissées par le racloir
        c.strokeStyle = 'rgba(215,165,60,0.35)'; c.lineWidth = 0.6;
        c.beginPath();
        for (let i = 0; i < n; i++) {
          if (!scraped[i]) continue;
          for (let f = 0.15; f < 1; f += 0.17) {
            c.moveTo(i * CW + f * SX, -H[i] - f * DV); c.lineTo(i * CW + CW + f * SX, -H[i] - f * DV);
          }
        }
        c.stroke();
        // Traits de couteau sur la face coupée
        c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 0.7;
        const xe = n * CW, he = H[n - 1];
        c.beginPath();
        for (let f = 0.2; f < 1; f += 0.2) { c.moveTo(xe + 1, -he * f); c.lineTo(xe + SX - 1, -he * f - DV); }
        c.stroke();
        // Entailles inachevées
        c.strokeStyle = 'rgba(180,125,35,0.6)'; c.lineWidth = 1;
        for (let i = 0; i < n; i++) {
          if (kerf[i] <= 0) continue;
          const x = i * CW, h = H[i];
          c.beginPath(); c.moveTo(x, -h); c.lineTo(x + SX, -h - DV); c.moveTo(x, -h); c.lineTo(x, -h + kerf[i] * h); c.stroke();
        }
        // Arêtes lumineuses
        c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineWidth = 1.1;
        c.beginPath(); c.moveTo(0, -H[0]);
        for (let i = 0; i < n; i++) { c.lineTo(i * CW, -H[i]); c.lineTo(i * CW + CW, -H[i]); }
        c.stroke();
        c.beginPath(); c.moveTo(xe, -he); c.lineTo(xe + SX, -he - DV); c.stroke();
      }

      // Interface
      const prog = SG.progress(stage, 'Bloc');
      const updateProgress = () => prog.set(Math.min(1, (1 - volume() / vol0) / 0.9));
      SG.toolbar(stage, [
        { icon: '🔪', label: 'Trancher', group: 'mode', active: true, onClick: () => setMode('slice') },
        { icon: '🌀', label: 'Copeaux', group: 'mode', onClick: () => setMode('curl') },
        { icon: '✋', label: 'Déplacer', group: 'mode', onClick: () => setMode('hand') },
        { icon: '🧈', label: narrow ? '' : 'Nouveau', title: 'Nouveau bloc', onClick: () => newBlock() },
      ]);
      SG.hint(stage, 'Glisse le couteau de haut en bas (droit ou en biais) pour trancher');

      function setMode(m) {
        if (m === mode) return;
        abortCut();
        if (curl) releaseCurl();
        mode = m;
        const msg = { slice: 'Tranche le bloc… ou recoupe les morceaux posés', curl: 'Glisse sur le dessus du beurre pour faire des copeaux', hand: 'Attrape les morceaux pour les déplacer ou les empiler' };
        SG.hint(stage, msg[m], 2600);
      }

      function newBlock() {
        if (phase !== 'live') return;
        abortCut();
        if (curl) releaseCurl();
        grab = null;
        phase = 'out';
        SG.audio.whoosh(0.3, 0.4);
        SG.audio.sand(0.15, 0.4);
        bodies.forEach((b) => { b.fade = true; });
      }

      function checkDone() {
        updateProgress();
        if (done) return;
        if (1 - volume() / vol0 >= 0.9 || n * CW < 20) {
          done = true;
          SG.celebrate(stage, 'Bloc terminé !');
          timers.push(setTimeout(() => newBlock(), 2600));
        }
      }

      const toLocal = (p) => ({ x: (p.x - ox) / s, y: (p.y - oy) / s });
      const colAt = (x) => Math.floor((x - blockOx) / CW);
      function topAt(x) {
        const c = colAt(x);
        if (phase !== 'live' || c < 0 || c >= n) return null;
        return -H[c];
      }

      // Éclats de beurre
      function burst(x, y, k, spd = 1) {
        for (let i = 0; i < k; i++) {
          if (flakes.length > 160) flakes.shift();
          flakes.push({
            x: x + U.rand(-3, 3), y: y + U.rand(-3, 3), vx: U.rand(-120, 120) * spd, vy: U.rand(-220, -40) * spd,
            rot: Math.random() * 6, vr: U.rand(-12, 12), s: U.rand(1.2, 3.4), life: U.rand(0.9, 1.6),
            fl: U.rand(2, 14), fd: U.rand(0, DV * 0.5),
            col: U.pick(['#fff3c4', '#ffe594', '#f7d277', '#fffae0']),
          });
        }
      }

      /* ---------- Corps (morceaux, copeaux) ---------- */
      function boundsOf(pts) {
        let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
        for (const [x, y] of pts) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        return { x0, x1, y0, y1 };
      }
      // Crée un morceau posé à partir d'un profil (coordonnées « écran » : y négatif = en haut) absolu
      function makePiece(absPts, z, base, extra) {
        const b = boundsOf(absPts);
        const pts = absPts.map(([x, y]) => [x - b.x0, y - b.y1]);
        const pc = Object.assign({ id: nextId++, kind: 'piece', x: b.x0, z, base, pts, w: b.x1 - b.x0, h: b.y1 - b.y0,
          state: 'rest', vx: 0, vy: 0, vz: 0, alpha: 1, fade: false, born: performance.now() }, extra || {});
        bodies.push(pc);
        return pc;
      }
      // Empreinte au sol (x0..x1, z0..z1) et hauteur
      function fp(b) {
        if (b.kind === 'curl') return { x0: b.x - b.R, x1: b.x + b.R, z0: b.z, z1: b.z + D * 0.85, h: b.R * 2 };
        if (b.state === 'tip') {
          const bb = boundsOf(rotPts(b.tpts, b.theta));
          return { x0: b.pvx + bb.x0, x1: b.pvx + bb.x1, z0: b.z, z1: b.z + D, h: -bb.y0 };
        }
        return { x0: b.x, x1: b.x + b.w, z0: b.z, z1: b.z + D, h: b.h };
      }
      const overl = (a, b, m = 0.6) => a.x0 < b.x1 - m && b.x0 < a.x1 - m && a.z0 < b.z1 - m && b.z0 < a.z1 - m;
      function blockTop(f) {
        if (n <= 0 || phase === 'out') return 0;
        if (f.z1 <= 0.6 || f.z0 >= D - 0.6) return 0;
        const c0 = Math.max(0, Math.floor((f.x0 + 0.6 - blockOx) / CW)), c1 = Math.min(n - 1, Math.floor((f.x1 - 0.6 - blockOx) / CW));
        let m = 0;
        for (let i = c0; i <= c1; i++) if (H[i] > m) m = H[i];
        return m;
      }
      // Hauteur d'appui sous un corps (bloc + morceaux situés en dessous)
      function supportOf(b, f, all) {
        let sup = blockTop(f);
        if (!all && sup > b.base + 3) sup = 0;
        for (const o of bodies) {
          if (o === b || o.state === 'tip' || o.state === 'drag' || o.alpha <= 0.05) continue;
          const g = fp(o);
          if (!overl(f, g)) continue;
          if (!all) {
            if (o.base + g.h > b.base + 3) continue; // pas dessous : ce sera une poussée, pas un empilement
          }
          const t = o.base + g.h;

      }
      // Garde les corps sur la partie visible de la planche
      function clampBody(b) {
        const f = fp(b);

        if (f.z1 > zmax) b.z -= f.z1 - zmax;

        const sl = g.x0 + g.z0 * KX, sr = g.x1 + g.z1 * KX;
        const dl = view.x0 + 2 - sl, dr = sr - (view.x1 - 2);
        if (dl > 0) { if (b.kind === 'curl') b.x += dl; else b.x += dl; b.vx = Math.abs(b.vx) * 0.4; }
        else if (dr > 0) { b.x -= dr; b.vx = -Math.abs(b.vx) * 0.4; }
      }

      function impact(vol, toneK, kind) {
        const now = performance.now();
        if (now - lastImpact < 45) return;
        lastImpact = now;
        SG.audio.thud(vol, toneK);
        SG.audio.tap('wood', vol * 0.5, U.rand(0.9, 1.1));
        if (kind === 'piece' && vol > 0.15) SG.audio.crunch(vol * 0.6, 0.85);
        SG.haptic(vol > 0.25 ? 10 : 4);
      }

      /* ---------- Trancher le bloc ---------- */
      function abortCut() {
        if (!cut) return;
        kerf[cut.col] = Math.max(kerf[cut.col], cut.vis);
        blockDirty = true;
        cut = null;
      }
      function startCut(x) {
        const col = Math.round((x - blockOx) / CW);
        if (col < 2 || col > n - 2) return;
        cut = { col, xt: blockOx + col * CW, vis: kerf[col], target: kerf[col], lastTick: kerf[col], slope: 0, tslope: 0 };
        SG.audio.crunch(0.3, 1.05);
        SG.audio.tap('wood', 0.08, 2.2);
        SG.haptic(6);
      }
      // Profil (absolu) du bloc entre deux colonnes
      function blockProfile(c0, c1) {
        // sommets aux centres des colonnes : bords lisses plutôt qu'en escalier
        const pts = [[blockOx + c0 * CW, 0], [blockOx + c0 * CW, -H[c0]]];
        for (let i = c0; i < c1; i++) pts.push([blockOx + i * CW + CW / 2, -H[i]]);
        pts.push([blockOx + c1 * CW, -H[c1 - 1]], [blockOx + c1 * CW, 0]);
        return pts;
      }
      function tipPiece(absPts, omega) {
        const b = boundsOf(absPts);
        if (b.x1 - b.x0 < 1.5 || Math.abs(area(absPts)) < 8) return null;
        const pvx = b.x1;
        const pc = { id: nextId++, kind: 'piece', state: 'tip', z: 0, base: 0, pvx, theta: 0, omega,
          tpts: absPts.map(([x, y]) => [x - pvx, y]), landed: false, alpha: 1, fade: false, vx: 0, vy: 0, vz: 0, born: performance.now() };
        bodies.push(pc);
        return pc;
      }
      function snap() {
        const col = cut.col, xt = cut.xt, h = H[col];
        const slope = cut.slope;                 // dx par unité de descente
        const xb = xt + slope * h;
        const oldN = n;
        const whole = blockProfile(0, oldN);
        if (slope >= 0) {
          // Le bloc garde la partie gauche (bord en pente représentable en colonnes)
          const nn = U.clamp(Math.round((xb - blockOx) / CW), 1, oldN);
          for (let i = col; i < nn; i++) {
            const xc = blockOx + i * CW + CW / 2;
            const lim = slope > 0.001 ? (xb - xc) / slope : 0;
            H[i] = Math.min(H[i], Math.max(MINH * 0.3, lim));
          }
          const piece = clipHalf(whole, 1, -slope, -xb);           // x − slope·y − xb ≥ 0 → à droite de la coupe

          tipPiece(piece, 0.4);
        } else {
          // Coupe penchée dans l'autre sens : le bloc est coupé net en bas, un coin se détache aussi
          const nn = U.clamp(Math.round((xb - blockOx) / CW), 1, oldN);
          const xv = blockOx + nn * CW;
          const rest = clipHalf(whole, 1, 0, -xv);
          const slice = clipHalf(rest, 1, -slope, -xb);
          const wedge = clipHalf(rest, -1, slope, xb);
          n = nn;
          tipPiece(slice, 0.4);
          const w = tipPiece(wedge, 1.2);
          if (w) w.omega = 2.2;
        }
        for (let i = n; i < NC; i++) { kerf[i] = 0; scraped[i] = 0; }
        cut = null; blockDirty = true;
        SG.audio.crack(0.55, 0.75);
        SG.audio.crunch(0.95, 0.85);
        SG.audio.thud(0.25, 1.6);
        SG.haptic([14, 20, 8]);
        burst(xt, -h * 0.25, 10, 0.8);
        burst(xt + SX * 0.5, -h - DV * 0.5, 6, 0.6);

      }
      function limitBodies() {

      }

      // Une tranche couchée se fend parfois en 2–3 morceaux à l'atterrissage
      function landPiece(pc) {
        const pts = rotPts(pc.tpts, pc.theta).map(([x, y]) => [x + pc.pvx, y]);
        const bb = boundsOf(pts);
        const lifted = pts.map(([x, y]) => [x, y - bb.y1]);
        const spanW = bb.x1 - bb.x0;
        const parts = [];
        if (spanW > 24 && (Math.abs(area(lifted)) / spanW < 12 || Math.random() < 0.55)) {
          const k = Math.random() < 0.4 ? 2 : 1;
          const cuts = k === 1 ? [U.rand(0.38, 0.62)] : [U.rand(0.25, 0.42), U.rand(0.58, 0.75)];
          let rest = lifted;
          for (const f of cuts) {
            const xc = bb.x0 + spanW * f, sl = U.rand(-0.25, 0.25);
            const left = clipHalf(rest, -1, sl, xc), right = clipHalf(rest, 1, -sl, -xc);
            if (left.length > 2) parts.push(left);
            rest = right;
          }
          if (rest.length > 2) parts.push(rest);
          SG.audio.crack(0.45, 0.9);
          SG.audio.crunch(0.8, 0.95);
          SG.haptic([8, 15, 8]);
        } else parts.push(lifted);
        const idx = bodies.indexOf(pc);
        if (idx >= 0) bodies.splice(idx, 1);
        parts.forEach((p, j) => {

          const b = makePiece(p, pc.z, 0);
          if (parts.length > 1) { b.state = 'fall'; b.vx = (j - (parts.length - 1) / 2) * U.rand(25, 45); b.vy = U.rand(60, 130); b.base = 0.5; }
        });
      }

      /* ---------- Recouper un morceau posé ---------- */
      function hitBody(sx, sy) {
        const order = drawOrder();
        for (let i = order.length - 1; i >= 0; i--) {
          const b = order[i];
          if (b.kind === 'block' || b.state === 'tip' || b.alpha < 0.5) continue;
          if (b.kind === 'curl') {

            for (let f = 0; f <= 1; f += 0.25) if (U.dist(sx, sy, c[0] + SX * 0.85 * f, c[1] - DV * 0.85 * f) < b.R + 5) return b;
            continue;
          }
          const sp = b.pts.map(([x, y]) => [b.x + x + b.z * KX, y - b.base - b.z * KY]);
          for (let f = 0; f <= 1.001; f += 0.25) if (inPoly(sx - SX * f, sy + DV * f, sp)) return b;
        }
        return null;
      }
      function inPoly(x, y, pts) {

        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const [xi, yi] = pts[i], [xj, yj] = pts[j];

      function cutPiece(b, a, c) {

        const zm = b.z + D / 2;

        if (Math.abs(dy) < 0.35) return false; // la lame descend

        const A = clipHalf(b.pts, nx, ny, k), B = clipHalf(b.pts, -nx, -ny, -k);
        if (A.length < 3 || B.length < 3 || Math.abs(area(A)) < 8 || Math.abs(area(B)) < 8) return false;

        [[A, leftIsA ? -1 : 1], [B, leftIsA ? 1 : -1]].forEach(([p, sd]) => {
          const np = makePiece(p.map(([x, y]) => [x + b.x, y - b.base]), b.z, b.base);
          np.base = b.base; np.state = 'fall'; np.vx = sd * U.rand(18, 34); np.vy = U.rand(20, 50);
          // remettre la base à sa hauteur d'origine (les points ont été normalisés)
          const pb = boundsOf(p);
          np.base = b.base + (0 - pb.y1);
        });
        SG.audio.crack(0.4, 0.95);
        SG.audio.crunch(0.75, 0.95);
        SG.audio.tap('wood', 0.15, 1.6);
        SG.haptic([10, 15, 6]);
        const m = P(b.x + ax, -ay + b.base * 0, zm);
        burst(a.x, a.y, 6, 0.6);
        void m;

      }

      /* ---------- Copeaux ---------- */
      function releaseCurl(shatter) {

          burst(c.x, c.y, 16, 1.1);
          SG.audio.crunch(0.9, 1.2);
          SG.audio.crack(0.3, 1.3);
          SG.haptic([8, 10, 8]);
          return;
        }
        const t = topAt(c.x - c.dir * Rr);
        bodies.push({ id: nextId++, kind: 'curl', x: c.x, z: D * 0.07, base: Math.max(0, -(c.y + Rr)), R: Rr, rot: c.rot, len: c.len,
          vx: c.dir * U.rand(50, 120), vy: U.rand(40, 110), vz: U.rand(-30, -5), state: 'fall', alpha: 1, fade: false, born: performance.now() });
        void t;

        SG.audio.crunch(0.35, 1.15);

      }
      function scrapeTo(fromX, toX) {

            curl.len += CW * (rem / T) * 1.5;

            if (scrapeCount % 3 === 0) SG.audio.crunch(0.1 + Math.min(0.3, speed * 0.15), U.rand(1.15, 1.4));
            if (scrapeCount % 6 === 0) SG.haptic(2);
            if (Math.random() < 0.15) burst(blockOx + c * CW + U.rand(0, SX), -H[c] - U.rand(0, DV), 1, 0.4);
          }
          curl.last = c;
        }
        if (removedAny) {

      }

      /* ---------- Entrées ---------- */
      function onMove() {
        const t = topAt(q.x);
        if (mode === 'slice') {
          if (cut) {
            const h = H[cut.col];
            const top = -h;
            if (q.y < top - 14) { abortCut(); SG.audio.crunch(0.15, 1.3); return; }
            cut.target = Math.max(cut.target, U.clamp((q.y - top) / h, 0, 1));
            const dy = q.y - top;
            if (dy > 6) cut.tslope = U.clamp((q.x - cut.xt) / dy, -0.75, 0.75);
          } else if (pcut) {
            const l = U.dist(q.x, q.y, pcut.a.x, pcut.a.y);
            if (l > 22 && !pcut.done) {
              pcut.done = true;
              if (!cutPiece(pcut.b, pcut.a, q)) SG.audio.tap('wood', 0.08, 2);
            }
          } else if (pressed && t !== null && q.y > t - 2 && q.y < 4 && phase === 'live') {
            startCut(q.x);
            if (cut) cut.target = Math.max(cut.target, U.clamp((q.y - t) / -t, 0, 1));
          }
        } else if (mode === 'curl') {
          if (pressed && phase === 'live') {
            const over = t !== null && q.y > t - DV - 22 && q.y < t + 16;
            const dx = q.x - lastQ.x;
            if (Math.abs(dx) > 0.5) dir = dx > 0 ? 1 : -1;
            if (over && Math.abs(dx) > 0.3) scrapeTo(lastQ.x, q.x);
            else if (!over && curl) releaseCurl();
          }
        } else if (grab) {
          const b = grab.b;
          const dsx = q.x - lastQ.x, dsy = q.y - lastQ.y;
          const dz = -dsy / KY;
          b.z += dz; b.x += dsx - dz * KX;
          clampBody(b);
          grab.vx = dsx / Math.max(0.005, grab.dt); grab.vz = dz / Math.max(0.005, grab.dt);

        }
      }

      const ptr = SG.pointer(cv.canvas, {
        down(p) {
          if (act !== null) return;

          if (!snd && SG.audio.ctx()) { snd = SG.audio.loop('scrape'); sndB = SG.audio.loop('brush'); }
          const l = toLocal(p);
          q.x = lastQ.x = downQ.x = l.x; q.y = lastQ.y = downQ.y = l.y;
          speed = 0;
          SG.haptic(4);
          const t = topAt(q.x);
          const onBlock = t !== null && q.y > t - DV - 4 && q.y < 4 && q.x < blockOx + n * CW + SX;
          if (mode === 'slice' && !onBlock) {
            const b = hitBody(q.x, q.y);
            if (b && b.kind === 'piece' && b.state === 'rest') { pcut = { b, a: { x: q.x, y: q.y }, done: false }; SG.audio.tap('wood', 0.06, 2.4); }
          } else if (mode === 'hand') {

              b.state = 'drag'; b.vx = 0; b.vy = 0; b.vz = 0;

        },
        move(p) {
          if (p.id !== act) return;
          const l = toLocal(p);
          lastQ.x = q.x; lastQ.y = q.y;
          q.x = l.x; q.y = l.y;
          speed = p.speed;
          onMove();
        },
        hover(p) {
          if (act !== null) return;
          const l = toLocal(p);
          q.x = l.x; q.y = l.y;
        },
        up(p) {
          if (p.id !== act) return;
          act = null; pressed = false;
          if (cut && cut.target >= 0.85) { cut.slope = cut.tslope; snap(); } else abortCut();
          pcut = null;
          if (curl) releaseCurl();
          if (grab) {
            const b = grab.b;
            b.state = 'fall'; b.vy = 0;
            b.vx = U.clamp(grab.vx * 0.25, -160, 160); b.vz = U.clamp(grab.vz * 0.25, -160, 160);
            grab = null;
            SG.audio.whoosh(0.08, 0.15);
          }
        },
      });

      /* ---------- Dessin ---------- */
      function drawKnife(c, kx, ky) {
        const slope = cut ? cut.slope : 0;
        const fx = kx - SX * 0.2, fy = ky + DV * 0.2;
        c.save();
        if (cut) {
          const xt = blockOx + cut.col * CW, h = H[cut.col], xb = xt + slope * h;
          c.beginPath();
          c.rect(-2000, -2000, 4000, 4000);
          c.moveTo(xt, -h); c.lineTo(xt + SX, -h - DV); c.lineTo(xb + SX, -DV); c.lineTo(xb, 0); c.closePath();
