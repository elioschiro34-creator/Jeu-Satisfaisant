<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff4ec">
  <title>Douceurs</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Douceurs">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #fff4ec;
  --bg2: #ffe9f0;
  --ink: #5b4a5e;
  --ink-soft: #8d7a90;
  --card-ink: #4a3a4d;
  --white: #fffdfb;
  --shadow: 0 10px 30px -12px rgba(120, 70, 110, 0.35);
  --radius: 26px;
  --bar-h: 64px;
  font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--ink);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 80% at 10% 0%, #ffe3ef 0%, transparent 60%),
              radial-gradient(120% 80% at 100% 100%, #e3f0ff 0%, transparent 55%),
              var(--bg);
  min-height: 100dvh;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
[hidden] { display: none !important; }

/* ---------- Menu ---------- */
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#menu { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 40px; }
#logo { background: none; color: #ff8fb1; text-shadow: 0 3px 0 rgba(255,255,255,.8), 0 8px 20px rgba(255,120,170,.25); }
.ltr { display: inline-block; cursor: pointer; animation: ltr-in .7s cubic-bezier(.2,1.6,.4,1) both;
  animation-delay: calc(var(--i) * 55ms + 100ms); }
.ltr.jump { animation: ltr-jump .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes ltr-in { from { opacity: 0; transform: translateY(-40px) scale(.6) rotate(-10deg); } }
@keyframes ltr-jump { 30% { transform: translateY(-18px) scale(1.15, .9); } 60% { transform: translateY(2px) scale(.95, 1.08); } }
.pill { margin-top: 14px; padding: 10px 18px; border-radius: 999px; background: var(--white); box-shadow: var(--shadow);
  font-size: 16px; font-weight: 600; transition: transform .15s; }
.pill:active { transform: scale(.94); }
.card { --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 0%; }
.card.tilt { transform: perspective(700px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-4px) scale(1.03);
  transition: transform .08s linear; }
.card .shine { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.65), transparent 55%); }
.card.tilt .shine { opacity: 1; }
.card.lit { transform: scale(1.07); box-shadow: 0 0 0 4px #fff, 0 0 0 8px #ffb5c8, var(--shadow); transition: transform .1s; }
.hero { padding: 12px 4px 18px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: clamp(40px, 9vw, 68px); margin: 0; font-weight: 700; letter-spacing: -1px;
  background: linear-gradient(90deg, #ff8fb1, #ffb08a, #c3a6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
h1 .dot { color: #ffb08a; -webkit-text-fill-color: #ffb08a; }
.tagline { margin: 4px 0 0; color: var(--ink-soft); font-size: 18px; }
.toggles { display: flex; gap: 8px; }
.round { width: 46px; height: 46px; border-radius: 50%; background: var(--white); box-shadow: var(--shadow);
  font-size: 20px; display: grid; place-items: center; transition: transform .15s; flex: none; }
.round:active { transform: scale(.9); }
.round.off { opacity: .45; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
.card { position: relative; text-align: left; padding: 18px 16px 16px; min-height: 170px; border-radius: var(--radius);
  background: linear-gradient(160deg, color-mix(in srgb, var(--card) 65%, white) 0%, var(--card) 100%);
  box-shadow: var(--shadow), inset 0 2px 0 rgba(255,255,255,.7); color: var(--card-ink);
  display: flex; flex-direction: column; gap: 4px; overflow: hidden;
  animation: pop-in .5s cubic-bezier(.2,1.4,.4,1) both; transition: transform .2s cubic-bezier(.2,1.6,.4,1); }
.card::after { content: ''; position: absolute; width: 120px; height: 120px; border-radius: 50%; right: -40px; top: -40px;
  background: rgba(255,255,255,.35); }
.card:hover { transform: translateY(-4px) rotate(-1deg); }
.card:active { transform: scale(.95); }
.card .emoji { font-size: 46px; line-height: 1; margin-bottom: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,.12)); }
.card .name { font-size: 20px; font-weight: 600; margin-top: 14px; }
.card .desc { font-size: 13.5px; opacity: .78; line-height: 1.3; }
@keyframes pop-in { from { opacity: 0; transform: scale(.8) translateY(20px); } }
.foot { text-align: center; color: var(--ink-soft); margin-top: 28px; font-size: 14px; }

/* ---------- Écran de jeu ---------- */
#game { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.game-bar { height: calc(var(--bar-h) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0;
  display: flex; align-items: center; gap: 12px; flex: none; z-index: 5; }
.game-bar h2 { flex: 1; margin: 0; font-size: 20px; font-weight: 600; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#stage { position: relative; flex: 1; overflow: hidden; touch-action: none; }
.sg-canvas { position: absolute; inset: 0; display: block; touch-action: none; }
.err { text-align: center; margin-top: 30vh; }

/* Barre d'outils flottante */
.sg-toolbar { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  display: flex; gap: 8px; padding: 8px; border-radius: 999px; background: rgba(255,253,251,.85);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); z-index: 4;
  width: max-content; max-width: calc(100% - 24px); flex-wrap: wrap; justify-content: center; }
.sg-tool { flex: none; min-width: 44px; height: 44px; padding: 0 14px; border-radius: 999px; background: transparent;
  display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 500;
  transition: transform .15s, background .2s; }
.sg-tool .ic { font-size: 20px; }
.sg-tool:active { transform: scale(.9); }
.sg-tool.active { background: #ffe1ea; }
.sg-tool.swatch { padding: 0; width: 44px; background: var(--swatch); box-shadow: inset 0 0 0 3px rgba(255,255,255,.8); }
.sg-tool.swatch.active { box-shadow: inset 0 0 0 3px #fff, 0 0 0 3px var(--ink); transform: scale(1.06); }

.sg-hint { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); z-index: 4; pointer-events: none;
  background: rgba(255,253,251,.9); padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow);
  font-size: 15px; white-space: nowrap; transition: opacity .7s, transform .7s; max-width: calc(100% - 32px);
  overflow: hidden; text-overflow: ellipsis; }
.sg-hint.hide { opacity: 0; transform: translate(-50%, -10px); }

.sg-progress { position: absolute; top: 12px; right: 12px; left: 12px; margin: 0 auto; max-width: 360px; z-index: 3;
  display: flex; align-items: center; gap: 10px; background: rgba(255,253,251,.8); padding: 8px 14px; border-radius: 999px;
  box-shadow: var(--shadow); font-size: 14px; pointer-events: none; }
.sg-progress .pt { flex: 1; height: 10px; border-radius: 99px; background: #f3e4ea; overflow: hidden; }
.sg-progress .pf { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #ffb5c8, #ffc8a8);
  transition: width .2s; }
.sg-progress .pv { min-width: 36px; text-align: right; font-weight: 600; }

.sg-celebrate { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none;
  font-size: clamp(34px, 8vw, 60px); font-weight: 700; color: #fff; text-shadow: 0 4px 0 #ff9eb8, 0 10px 30px rgba(255,120,160,.5);
  animation: cele 2.2s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes cele { 0% { transform: translate(-50%,-50%) scale(.2); opacity: 0; } 20% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  80% { opacity: 1; } 100% { transform: translate(-50%,-60%) scale(1); opacity: 0; } }
.sg-confetti { position: absolute; top: 35%; width: 10px; height: 14px; border-radius: 3px; z-index: 6; pointer-events: none;
  animation: conf 2.4s cubic-bezier(.2,.7,.4,1) both; }
@keyframes conf { 0% { transform: translate(0,0) rotate(0); opacity: 1; }
  100% { transform: translate(var(--dx), 60vh) rotate(var(--rot)); opacity: 0; } }

/* ---------- Favoris ---------- */
.card .fav { position: absolute; top: 8px; right: 10px; z-index: 2; width: 34px; height: 34px; display: grid; place-items: center;
  font-size: 22px; line-height: 1; color: rgba(255,255,255,.95); text-shadow: 0 1px 3px rgba(120,70,110,.35);
  border-radius: 50%; transition: transform .2s cubic-bezier(.2,1.6,.4,1); }
.card .fav:active { transform: scale(.8); }
.card.is-fav .fav { color: #ffcf4d; animation: fav-pop .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes fav-pop { 40% { transform: scale(1.4) rotate(15deg); } }

/* ---------- Main qui montre le geste ---------- */
.sg-hand { position: absolute; left: 50%; top: 50%; z-index: 5; pointer-events: none; width: 0; height: 0;
  transition: opacity .4s; }
.sg-hand.bye { opacity: 0; }
.sg-hand .fing { position: absolute; left: -16px; top: -4px; font-size: 44px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.25));
  transform-origin: 30% 10%; }
.sg-hand .ring { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.95); box-shadow: 0 0 12px rgba(255,150,190,.6); opacity: 0; }
.g-tap .fing { animation: h-tap 1.1s ease-in-out infinite; }
.g-tap .ring { animation: h-ring 1.1s ease-out infinite; }
.g-hold .fing { animation: h-hold 1.8s ease-in-out infinite; }
.g-hold .ring { animation: h-ring-hold 1.8s ease-out infinite; }
.g-drag .fing, .g-drag .ring { animation: h-drag 1.8s ease-in-out infinite; }
.g-down .fing, .g-down .ring { animation: h-down 1.6s ease-in-out infinite; }
.g-diag .fing, .g-diag .ring { animation: h-diag 1.8s ease-in-out infinite; }
.g-drag .ring, .g-down .ring, .g-diag .ring { opacity: .7; }
@keyframes h-tap { 0%, 100% { transform: translateY(-14px); } 45% { transform: translateY(0) scale(.92); } }
@keyframes h-ring { 0%, 40% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes h-hold { 0%, 100% { transform: translateY(-14px); } 20%, 80% { transform: translateY(0) scale(.92); } }
@keyframes h-ring-hold { 0%, 20% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; } 80% { opacity: .2; transform: scale(1.8); } 100% { opacity: 0; } }
@keyframes h-drag { 0% { transform: translateX(-90px); } 50% { transform: translateX(90px); } 100% { transform: translateX(-90px); } }
@keyframes h-down { 0% { transform: translateY(-90px); opacity: 0; } 15% { opacity: 1; } 80% { transform: translateY(90px); opacity: 1; } 100% { transform: translateY(90px); opacity: 0; } }
@keyframes h-diag { 0% { transform: translate(-80px, -90px); } 60% { transform: translate(60px, 70px); } 100% { transform: translate(-80px, -90px); } }

/* ---------- Flash photo ---------- */
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 50; }
#flash.go { animation: flash .5s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }

/* ---------- Réglages ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; background: rgba(60,30,60,.25); backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px); display: grid; place-items: end center; padding: 16px; }
.sheet { width: 100%; max-width: 420px; background: var(--white); border-radius: 28px; padding: 22px 20px 18px;
  box-shadow: var(--shadow); animation: sheet-in .35s cubic-bezier(.2,1.4,.4,1); margin-bottom: env(safe-area-inset-bottom); }
@media (min-width: 600px) { .sheet-wrap { place-items: center; } }
@keyframes sheet-in { from { transform: translateY(40px); opacity: 0; } }
.sheet h3 { margin: 0 0 10px; font-size: 22px; }
.sheet .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 2px;
  font-size: 17px; border-bottom: 1px solid rgba(140,100,140,.12); }
.sheet .pill { width: 100%; margin-top: 16px; background: #ffe1ea; }
.sheet input[type=range] { flex: 1; max-width: 200px; accent-color: #ff8fb1; height: 28px; }
.switch { appearance: none; -webkit-appearance: none; width: 52px; height: 30px; border-radius: 99px; background: #eadbe3;
  position: relative; cursor: pointer; transition: background .2s; flex: none; margin: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .25s cubic-bezier(.2,1.5,.4,1); }
.switch:checked { background: #ff9fbf; }
.switch:checked::after { transform: translateX(22px); }

/* ---------- Mode nuit ---------- */
:root[data-theme="night"] {
  --bg: #1f1a2e; --bg2: #2a2140; --ink: #efe6f5; --ink-soft: #b6a8c6; --card-ink: #fff6fb; --white: #2f2645;
  --shadow: 0 12px 30px -12px rgba(0,0,0,.6);
}
:root[data-theme="night"] body {
  background: radial-gradient(120% 80% at 10% 0%, #3a2550 0%, transparent 60%),
              radial-gradient(120% 80% at 100% 100%, #1d2b4a 0%, transparent 55%), var(--bg);
}
:root[data-theme="night"] .card {
  background: linear-gradient(160deg, color-mix(in srgb, var(--card) 45%, #2a2140) 0%, color-mix(in srgb, var(--card) 70%, #1f1a2e) 100%);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.18);
}
:root[data-theme="night"] .card::after { background: rgba(255,255,255,.08); }
:root[data-theme="night"] #bg { opacity: .45; }
:root[data-theme="night"] .sg-toolbar, :root[data-theme="night"] .sg-hint, :root[data-theme="night"] .sg-progress {
  background: rgba(47,38,69,.88); color: var(--ink);
}
:root[data-theme="night"] .sg-tool.active { background: #4a3a63; }
:root[data-theme="night"] .sg-progress .pt { background: #3e3258; }
:root[data-theme="night"] .sheet .pill { background: #4a3a63; }
:root[data-theme="night"] .switch { background: #4a3d60; }
:root[data-theme="night"] .switch::after { background: #efe6f5; }

@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card { min-height: 150px; padding: 14px 12px; }
  .card .emoji { font-size: 38px; }
  .card .name { font-size: 17px; }
  .card .desc { font-size: 12.5px; }
  .tagline { font-size: 16px; }
  .sg-toolbar { gap: 2px; padding: 6px; border-radius: 22px; }
  .sg-tool { flex-direction: column; gap: 1px; height: 50px; min-width: 50px; padding: 0 8px; border-radius: 16px; }
  .sg-tool .ic { font-size: 19px; }
  .sg-tool .lb { font-size: 10.5px; line-height: 1; }
  .sg-tool.swatch { width: 38px; min-width: 38px; height: 38px; border-radius: 50%; align-self: center; }
}

</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <main id="menu">
    <header class="hero">
      <div class="hero-top">
        <h1 id="logo">Douceurs<span class="dot">.</span></h1>
        <div class="toggles">
          <button id="open-settings" class="round" title="Réglages">⚙️</button>
          <button id="toggle-sound" class="round" title="Son">🔊</button>
        </div>
      </div>
      <p class="tagline">Des petits moments très satisfaisants. Choisis, touche, écoute, respire.</p>
      <button id="random" class="pill">🎲 Au hasard</button>
    </header>
    <section id="grid" class="grid"></section>
    <footer class="foot">Monte le son 🎧 — tout fonctionne à la souris et au doigt.</footer>
  </main>

  <section id="game" hidden>
    <header class="game-bar">
      <button id="back" class="round" title="Retour">←</button>
      <h2 id="game-title"></h2>
      <button id="snap" class="round" title="Enregistrer une photo">📸</button>
      <button id="reset" class="round" title="Recommencer">↻</button>
    </header>
    <div id="stage"></div>
  </section>

  <div id="settings" class="sheet-wrap" hidden>
    <div class="sheet" role="dialog" aria-label="Réglages">
      <h3>Réglages</h3>
      <label class="row">🔉 Volume <input id="set-volume" type="range" min="0" max="1" step="0.01"></label>
      <label class="row">🎵 Musique douce <input id="set-music" type="checkbox" class="switch"></label>
      <label class="row" id="row-haptics">📳 Vibrations <input id="set-haptics" type="checkbox" class="switch"></label>
      <label class="row">🌙 Mode nuit <input id="set-night" type="checkbox" class="switch"></label>
      <button id="close-settings" class="pill">Fermer</button>
    </div>
  </div>
  <div id="flash"></div>

  <script>/* js/core.js */
/* Douceurs — socle commun : sons synthétisés, vibrations, canvas, pointeur, registre des jeux. */
(function () {
  'use strict';

  const SG = (window.SG = {});
  SG.games = [];
  SG.registerGame = (def) => SG.games.push(def);

  /* ---------- Utilitaires ---------- */
  SG.util = {
    clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
    lerp: (a, b, t) => a + (b - a) * t,
    rand: (a, b) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
    hsl: (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
  };

  /* Palette pastel partagée */
  SG.palette = {
    cream: '#fff7ec', butter: '#ffe39a', peach: '#ffc8a8', pink: '#ffb5c8',
    lilac: '#d6c4ff', sky: '#b8dcff', mint: '#b9f0d4', lemon: '#fff3a6',
    coral: '#ff9e9e', ink: '#5b4a5e',
    list: ['#ffb5c8', '#ffc8a8', '#ffe39a', '#b9f0d4', '#b8dcff', '#d6c4ff', '#ff9e9e', '#a8eee8'],
  };

  /* ---------- Vibrations ---------- */
  SG.haptic = (pattern = 10) => {
    if (!SG.settings.haptics) return;
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* ignore */ }
  };

  /* ---------- Réglages ---------- */
  SG.settings = { sound: true, haptics: true, volume: 0.8, music: false, night: false, favs: [] };
  try {
    const saved = JSON.parse(localStorage.getItem('douceurs-settings') || '{}');
    Object.assign(SG.settings, saved);
  } catch (e) { /* ignore */ }
  SG.saveSettings = () => {
    try { localStorage.setItem('douceurs-settings', JSON.stringify(SG.settings)); } catch (e) { /* ignore */ }
  };

  /* L'audio est dans js/audio.js */

  // ?test dans l'URL : boucle par minuterie (utile quand la page n'est pas affichée)
  const TEST = /[?&]test\b/.test(location.search);

  /* ---------- Qualité automatique ---------- */
  /*
   * Si le jeu rame (images trop lentes pendant ~3 s), on baisse la qualité d'un cran :
   * moins de pixels par canvas (dprCap), et SG.quality.level diminue (2 = haute, 1 = moyenne, 0 = basse).
   * Les jeux lourds peuvent lire SG.quality.level et s'abonner avec SG.quality.onChange(fn).
   * La qualité repart en haute à chaque ouverture de jeu (SG.quality.reset()).
   */
  const canvases = new Set();
  const qcbs = new Set();
  const DPR_CAP = [1, 1.5, 2];
  SG.quality = {
    level: 2,
    get dprCap() { return DPR_CAP[this.level]; },
    onChange(fn) { qcbs.add(fn); return () => qcbs.delete(fn); },
    set(level) {
      level = Math.max(0, Math.min(2, level));
      if (level === this.level) return;
      this.level = level;
      canvases.forEach((rs) => rs());
      qcbs.forEach((fn) => { try { fn(level); } catch (e) { console.error(e); } });
    },
    reset() { qcbs.clear(); slow = 0; ema = 1 / 60; this.level = 2; },
  };
  let ema = 1 / 60, slow = 0, grace = 0;
  function watchFrame(rawDt) {
    if (TEST || document.hidden) return;
    if (rawDt > 0.25) return; // onglet en pause, pas une vraie lenteur
    ema += (rawDt - ema) * 0.05;
    if (grace > 0) { grace -= rawDt; return; }
    if (ema > 1 / 34) slow += rawDt; else slow = Math.max(0, slow - rawDt * 0.5);
    if (slow > 3 && SG.quality.level > 0) {
      SG.quality.set(SG.quality.level - 1);
      slow = 0; grace = 2; ema = 1 / 60;
    }
  }

  /* ---------- Canvas plein cadre avec gestion du DPR ---------- */
  /**
   * Crée un canvas qui remplit `container` et se redimensionne.
   * Renvoie { canvas, ctx, w, h, dpr, onResize(fn), destroy() }.
   * ctx est déjà mis à l'échelle : on dessine en pixels CSS.
   */
  SG.makeCanvas = (container, opts = {}) => {
    const canvas = document.createElement('canvas');
    canvas.className = 'sg-canvas';
    container.appendChild(canvas);
    const c = canvas.getContext('2d', { willReadFrequently: !!opts.readback });
    const st = { canvas, ctx: c, w: 0, h: 0, dpr: 1, _cbs: [] };
    const resize = () => {
      const r = container.getBoundingClientRect();
      st.dpr = Math.min(window.devicePixelRatio || 1, opts.maxDpr || 2, SG.quality.dprCap);
      st.w = Math.max(1, Math.round(r.width)); st.h = Math.max(1, Math.round(r.height));
      canvas.width = Math.round(st.w * st.dpr); canvas.height = Math.round(st.h * st.dpr);
      canvas.style.width = st.w + 'px'; canvas.style.height = st.h + 'px';
      c.setTransform(st.dpr, 0, 0, st.dpr, 0, 0);
      st._cbs.forEach((fn) => fn(st.w, st.h));
    };
    const ro = new ResizeObserver(resize);
    ro.observe(container);
    resize();
    canvases.add(resize);
    st.onResize = (fn) => { st._cbs.push(fn); };
    st.destroy = () => { ro.disconnect(); canvases.delete(resize); canvas.remove(); };
    return st;
  };

  /* ---------- Pointeur unifié (souris + tactile) ---------- */
  /**
   * SG.pointer(el, { down(p), move(p), up(p) })
   * p = { x, y, dx, dy, speed (px/ms), id, pressed, e }
   * Coordonnées relatives à l'élément, en pixels CSS. Gère le multi-touch.
   */
  SG.pointer = (el, h) => {
    const pts = new Map();
    el.style.touchAction = 'none';
    const pos = (e) => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    const onDown = (e) => {
      SG.audio.init();
      try { el.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      const q = pos(e);
      const p = { x: q.x, y: q.y, dx: 0, dy: 0, speed: 0, id: e.pointerId, pressed: true, t: performance.now(), e };
      pts.set(e.pointerId, p);
      h.down && h.down(p);
      e.preventDefault();
    };
    const onMove = (e) => {
      const q = pos(e);
      let p = pts.get(e.pointerId);
      const now = performance.now();
      if (!p) { // survol sans clic (souris)
        h.hover && h.hover({ x: q.x, y: q.y, e });
        return;
      }
      const dt = Math.max(1, now - p.t);
      p.dx = q.x - p.x; p.dy = q.y - p.y;
      p.speed = SG.util.lerp(p.speed, Math.hypot(p.dx, p.dy) / dt, 0.5);
      p.x = q.x; p.y = q.y; p.t = now; p.e = e;
      h.move && h.move(p);
    };

      const p = pts.get(e.pointerId);
      if (!p) return;
      p.pressed = false; p.e = e;
      pts.delete(e.pointerId);
      h.up && h.up(p);
    };
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
    return {
      active: pts,
      destroy() {
        el.removeEventListener('pointerdown', onDown);
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onUp);
      },
    };
  };

  /* ---------- Boucle d'animation ---------- */
  /** SG.loop(fn(dt en secondes, t)) → { stop() } ; dt plafonné à 1/20 s */
  let lastWatched = 0;
  const raf = TEST ? (f) => setTimeout(() => f(performance.now()), 16) : (f) => requestAnimationFrame(f);
  const caf = TEST ? clearTimeout : cancelAnimationFrame;
  SG.loop = (fn) => {
    let id = 0, last = performance.now(), running = true;
    const tick = (now) => {
      if (!running) return;
      const raw = (now - last) / 1000;
      const dt = Math.min(0.05, raw); last = now;
      // une seule mesure de fluidité par image, même avec plusieurs boucles
      if (now !== lastWatched) { lastWatched = now; watchFrame(raw); }
      fn(dt, now / 1000);
      id = raf(tick);
    };
    id = raf(tick);
    return { stop() { running = false; caf(id); } };
  };

  /* ---------- Petits éléments d'interface dans un jeu ---------- */
  /**
   * SG.toolbar(container, items) : barre de boutons flottante en bas.
   * items: [{ label, icon?, onClick, active? , color? }]  → renvoie l'élément.
   */
  SG.toolbar = (container, items) => {
    const bar = document.createElement('div');
    bar.className = 'sg-toolbar';
    items.forEach((it) => {
      const b = document.createElement('button');
      b.className = 'sg-tool' + (it.active ? ' active' : '');
      if (it.color) { b.style.setProperty('--swatch', it.color); b.classList.add('swatch'); }
      b.innerHTML = (it.icon ? `<span class="ic">${it.icon}</span>` : '') + (it.label ? `<span class="lb">${it.label}</span>` : '');
      b.title = it.title || it.label || '';
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        SG.audio.init(); SG.audio.click(); SG.haptic(5);
        if (it.group) bar.querySelectorAll(`[data-group="${it.group}"]`).forEach((x) => x.classList.remove('active'));
        if (it.group) b.classList.add('active');
        it.onClick && it.onClick(b);
      });
      if (it.group) b.dataset.group = it.group;
      bar.appendChild(b);
    });
    container.appendChild(bar);
    return bar;
  };

  /** Indication discrète en haut (« Glisse pour tartiner »), disparaît seule. */
  SG.hint = (container, text, ms = 3500) => {
    const el = document.createElement('div');
    el.className = 'sg-hint';
    el.textContent = text;
    container.appendChild(el);
    setTimeout(() => el.classList.add('hide'), ms);
    setTimeout(() => el.remove(), ms + 800);
    return el;
  };

  /** Jauge de progression en haut (0..1). Renvoie { set(v) }. */
  SG.progress = (container, label = '') => {
    const el = document.createElement('div');
    el.className = 'sg-progress';
    el.innerHTML = `<span class="pl">${label}</span><div class="pt"><div class="pf"></div></div><span class="pv">0%</span>`;
    container.appendChild(el);
    const pf = el.querySelector('.pf'), pv = el.querySelector('.pv');
    return {
      el,
      set(v) {
        v = SG.util.clamp(v, 0, 1);
        pf.style.width = (v * 100).toFixed(1) + '%';
        pv.textContent = Math.floor(v * 100) + '%';
      },
    };
  };

  /** Petite célébration (confettis DOM légers + son) */
  SG.celebrate = (container, text = 'Parfait !') => {
    SG.audio.win(); SG.haptic([20, 40, 20]);
    const el = document.createElement('div');
    el.className = 'sg-celebrate';
    el.textContent = text;
    container.appendChild(el);
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('i');
      c.className = 'sg-confetti';
      c.style.left = SG.util.rand(10, 90) + '%';
      c.style.background = SG.util.pick(SG.palette.list);
      c.style.animationDelay = SG.util.rand(0, 0.4) + 's';
      c.style.setProperty('--dx', SG.util.rand(-80, 80) + 'px');
      c.style.setProperty('--rot', SG.util.rand(-720, 720) + 'deg');
      container.appendChild(c);
      setTimeout(() => c.remove(), 2600);
    }
    setTimeout(() => el.remove(), 2200);
  };
})();

  <script>/* js/audio.js */
/* Douceurs — moteur de sons ASMR, entièrement synthétisé (Web Audio API).
   Réverbération de petite pièce, sons à couches, crépitements granulaires. */
(function () {
  'use strict';
  const SG = window.SG;
  const A = (SG.audio = {});
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let ctx = null, master = null, dry = null, verb = null, verbIn = null;
  const buf = {};

  /* ---------- Mise en place ---------- */
  function makeNoise(kind) {
    const len = ctx.sampleRate * 2;
    const b = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = b.getChannelData(0);
    if (kind === 'white') {
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } else if (kind === 'pink') {
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.969 * b2 + w * 0.153852; b3 = 0.8665 * b3 + w * 0.3104856;
        b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
      }
    } else {
      let last = 0;
      for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    }
    return b;
  }
  // Réponse impulsionnelle synthétique : petite pièce chaleureuse
  function makeImpulse(sec, decay) {
    const len = Math.floor(ctx.sampleRate * sec);
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        lp = lp * 0.6 + (Math.random() * 2 - 1) * 0.4; // un peu feutré
        d[i] = lp * Math.pow(1 - t, decay) * (i < 40 ? i / 40 : 1);
      }
    }
    return b;
  }

  A.init = () => {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 3.5;
    comp.attack.value = 0.003; comp.release.value = 0.15;
    master = ctx.createGain();
    master.gain.value = level();
    // Bus sec + envoi réverbération
    dry = ctx.createGain(); dry.gain.value = 1;
    verbIn = ctx.createGain(); verbIn.gain.value = 1;
    verb = ctx.createConvolver();
    verb.buffer = makeImpulse(1.4, 3.2);
    const verbOut = ctx.createGain(); verbOut.gain.value = 0.55;
    const verbHp = ctx.createBiquadFilter(); verbHp.type = 'highpass'; verbHp.frequency.value = 180;
    verbIn.connect(verbHp); verbHp.connect(verb); verb.connect(verbOut); verbOut.connect(master);
    dry.connect(master);
    master.connect(comp); comp.connect(ctx.destination);
    buf.white = makeNoise('white'); buf.pink = makeNoise('pink'); buf.brown = makeNoise('brown');
    if (SG.settings.music) A.music(true);
  };
  A.ctx = () => ctx;
  A.out = () => dry;
  // Volume général (courbe douce : la moitié du curseur ≈ moitié du ressenti)
  const level = () => (SG.settings.sound ? 1.1 * Math.pow(clamp(SG.settings.volume ?? 0.8, 0, 1), 1.6) : 0);
  const applyLevel = () => { if (master) master.gain.setTargetAtTime(level(), ctx.currentTime, 0.05); };
  A.setEnabled = (on) => { SG.settings.sound = on; SG.saveSettings(); applyLevel(); };
  A.setVolume = (v) => { SG.settings.volume = clamp(v, 0, 1); SG.saveSettings(); applyLevel(); };

  /* ---------- Musique d'ambiance générative (douce, optionnelle) ---------- */
  // Accords planants Fmaj9 → Am7 → Dm9 → Bbmaj7 (lents), + petites notes de boîte à musique
  const CHORDS = [[53, 57, 60, 64, 67], [57, 60, 64, 67, 71], [50, 57, 60, 64, 65], [46, 53, 57, 60, 62]];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  let music = null;
  A.music = (on) => {
    SG.settings.music = !!on; SG.saveSettings();
    if (!ctx) return;
    if (!on) {
      if (music) {
        const m = music; music = null;
        clearInterval(m.iv); clearTimeout(m.bell);
        m.bus.gain.setTargetAtTime(0, ctx.currentTime, 0.6);
        setTimeout(() => { try { m.bus.disconnect(); } catch (e) { /* ignore */ } }, 4000);
      }
      return;
    }
    if (music) return;
    const bus = ctx.createGain(); bus.gain.value = 0;
    const lp = filt('lowpass', 1400, 0.5);
    bus.connect(lp); lp.connect(dry);
    const sendV = ctx.createGain(); sendV.gain.value = 0.9; lp.connect(sendV); sendV.connect(verbIn);
    bus.gain.setTargetAtTime(0.16, ctx.currentTime, 1.5);
    let ci = 0;
    const playChord = () => {
      const t = ctx.currentTime + 0.05, dur = 7.5;
      CHORDS[ci % CHORDS.length].forEach((m, k) => {
        [-4, 4].forEach((det) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = k === 0 ? 'triangle' : 'sine';
          o.frequency.value = mtof(m - (k === 0 ? 12 : 0)); o.detune.value = det + Math.random() * 3;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(0.09 / (1 + k * 0.3), t + 2.5);
          g.gain.linearRampToValueAtTime(0.0001, t + dur);
          o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.1);
        });
      });
      ci++;
    };
    // Boîte à musique : notes de la gamme, rares et aléatoires
    const SCALE = [65, 67, 69, 72, 74, 76, 77, 79, 81, 84];
    const bell = () => {
      if (!music) return;
      if (SG.settings.sound) {
        const f = mtof(SCALE[Math.floor(Math.random() * SCALE.length)]), t = ctx.currentTime + 0.02;
        [[1, 0.06, 1.6], [2.76, 0.015, 0.6], [5.4, 0.006, 0.3]].forEach(([r, v, d]) => {
          const o = ctx.createOscillator(), g = gainEnv(t, 0.004, v, d);
          o.frequency.value = f * r; o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + 0.1);
        });
      }
      music.bell = setTimeout(bell, 900 + Math.random() * 2600);
    };
    playChord();
    music = { bus, iv: setInterval(playChord, 6000), bell: 0 };
    music.bell = setTimeout(bell, 2000);
  };
  const ready = () => ctx && SG.settings.sound && ctx.state !== 'closed';

  /* ---------- Briques ---------- */
  // Envoie un nœud vers la sortie (sec + réverb)
  function send(node, wet = 0.15) {
    node.connect(dry);
    if (wet > 0) { const g = ctx.createGain(); g.gain.value = wet; node.connect(g); g.connect(verbIn); }
  }
  function noise(kind = 'white') {
    const s = ctx.createBufferSource();
    s.buffer = buf[kind]; s.loop = true;
    return s;
  }
  function filt(type, f, q = 1) {
    const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b;
  }
  function gainEnv(t, a, peak, d, curve = 'exp') {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    if (a <= 0.0005) g.gain.setValueAtTime(Math.max(peak, 0.0002), t);
    else g.gain.linearRampToValueAtTime(Math.max(peak, 0.0002), t + a);
    if (curve === 'exp') g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    else g.gain.linearRampToValueAtTime(0.0001, t + a + d);
    return g;
  }
  // Rafale de bruit filtré
  function burst(t, { kind = 'white', type = 'bandpass', f = 2000, q = 1, a = 0.001, d = 0.03, vol = 0.5, wet = 0.1, fEnd = 0 }) {
    const n = noise(kind), b = filt(type, f, q), g = gainEnv(t, a, vol, d);
    if (fEnd) b.frequency.exponentialRampToValueAtTime(fEnd, t + a + d);
    n.connect(b); b.connect(g); send(g, wet);
    n.start(t, Math.random() * 1.5); n.stop(t + a + d + 0.05);
  }
  // Oscillateur avec glissando
  function tone(t, { type = 'sine', f0 = 440, f1 = 0, a = 0.002, d = 0.1, vol = 0.3, wet = 0.15, glide = 0 }) {
    const o = ctx.createOscillator(), g = gainEnv(t, a, vol, d);
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + (glide || a + d));
    o.connect(g); send(g, wet);
    o.start(t); o.stop(t + a + d + 0.05);
  }
  const now = () => ctx.currentTime + 0.005;

  /* ---------- Sons ponctuels ---------- */

  /** Bulle qui éclate (papier bulle) : claquement sec + résonance de l'air */
  A.pop = (pitch = 1, vol = 0.7) => {
    if (!ready()) return;
    const t = now(), p = pitch * rnd(0.9, 1.12);
    burst(t, { type: 'highpass', f: 2500 * p, q: 0.7, d: 0.012, vol: vol * 0.9, wet: 0.08 });
    burst(t, { type: 'bandpass', f: 1300 * p, q: 6, d: rnd(0.03, 0.05), vol: vol * 0.7, wet: 0.12 });
    tone(t, { f0: 260 * p, f1: 90 * p, d: 0.06, vol: vol * 0.35, wet: 0 });
    // petit souffle d'air qui s'échappe
    burst(t + 0.006, { kind: 'pink', type: 'bandpass', f: 3500 * p, q: 1.5, a: 0.004, d: 0.06, vol: vol * 0.12, wet: 0.2 });
  };

  /** « Plop » doux du silicone (pop-it) */
  A.plop = (pitch = 1, vol = 0.6) => {
    if (!ready()) return;
    const t = now(), p = pitch * rnd(0.94, 1.06);
    tone(t, { f0: 520 * p, f1: 170 * p, d: 0.08, vol: vol * 0.55, wet: 0.18, glide: 0.05 });
    tone(t, { type: 'triangle', f0: 1100 * p, f1: 500 * p, d: 0.025, vol: vol * 0.12, wet: 0.1 });
    burst(t, { kind: 'pink', type: 'lowpass', f: 900 * p, q: 2, d: 0.04, vol: vol * 0.45, wet: 0.1 });
  };

  /** Craquement granulaire (beurre froid, savon, croûte, sable, caramel). intensity 0..1, tone ~0.5..2 */
  A.crunch = (intensity = 0.6, toneK = 1) => {
    if (!ready()) return;
    const t0 = now();
    const n = 4 + Math.floor(intensity * 18);
    const span = 0.04 + intensity * 0.12;
    let t = t0;
    for (let i = 0; i < n; i++) {
      t += -Math.log(1 - Math.random()) * span / n; // arrivées en grappes
      const hi = Math.random() < 0.75;
      burst(t, {
        type: 'bandpass', f: (hi ? rnd(1800, 6500) : rnd(450, 1200)) * toneK, q: rnd(1.5, 7),
        d: hi ? rnd(0.004, 0.018) : rnd(0.012, 0.035), vol: (hi ? rnd(0.25, 0.7) : rnd(0.3, 0.6)) * intensity, wet: 0.12,
      });
    }
    // corps sourd
    burst(t0, { kind: 'pink', type: 'lowpass', f: 500 * toneK, q: 1, d: 0.06, vol: 0.35 * intensity, wet: 0.05 });
  };

  /** Cassure nette (tablette, caramel, glace) */
  A.crack = (vol = 0.7, toneK = 1) => {
    if (!ready()) return;
    const t = now();
    burst(t, { type: 'highpass', f: 3000 * toneK, q: 0.8, d: 0.008, vol: vol, wet: 0.2 });
    burst(t, { type: 'bandpass', f: rnd(2200, 3200) * toneK, q: 12, d: 0.05, vol: vol * 0.5, wet: 0.25 });
    tone(t, { f0: 140 * toneK, f1: 70, d: 0.07, vol: vol * 0.4, wet: 0 });
    A.crunch(vol * 0.5, toneK * 1.2);
  };

  /** Bruit mouillé, gluant (slime, peinture, crème) */
  A.squish = (pitch = 1, vol = 0.6) => {
    if (!ready()) return;
    const t = now(), p = pitch * rnd(0.9, 1.1), d = rnd(0.16, 0.26);
    // deux formants qui glissent : effet « bouche » humide
    [[280, 1100, 260], [700, 2200, 600]].forEach(([a, b, c], k) => {
      const n = noise('brown'), f = filt('bandpass', a * p, 6), g = gainEnv(t, 0.012, vol * (k ? 0.35 : 0.8), d);
      f.frequency.setValueAtTime(a * p, t);
      f.frequency.exponentialRampToValueAtTime(b * p, t + d * 0.35);
      f.frequency.exponentialRampToValueAtTime(c * p, t + d);
      n.connect(f); f.connect(g); send(g, 0.15);
      n.start(t, Math.random()); n.stop(t + d + 0.1);
    });
    // micro-bulles qui claquent
    const nb = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < nb; i++) A.bubble(p * rnd(0.8, 1.6), vol * 0.25, rnd(0.02, d));
  };

  /** Petite bulle liquide (blup) — delay en secondes */
  A.bubble = (pitch = 1, vol = 0.3, delay = 0) => {
    if (!ready()) return;
    const t = now() + delay, f = rnd(500, 900) * pitch;
    tone(t, { f0: f, f1: f * rnd(1.6, 2.4), d: rnd(0.02, 0.04), vol, wet: 0.2, glide: 0.03 });
  };

  /** Goutte / blob qui tombe (peinture, glaçage) */
  A.drip = (pitch = 1, vol = 0.5) => {
    if (!ready()) return;
    const t = now(), p = pitch * rnd(0.9, 1.1);
    tone(t, { f0: 300 * p, f1: 1000 * p, d: 0.05, vol: vol * 0.45, wet: 0.3, glide: 0.04 });
    burst(t, { kind: 'brown', type: 'lowpass', f: 600 * p, q: 3, d: 0.08, vol: vol * 0.5, wet: 0.1 });
  };

  /** Atterrissage mou (morceau qui tombe sur une planche / un tapis) */
  A.thud = (vol = 0.5, pitch = 1) => {
    if (!ready()) return;
    const t = now();
    tone(t, { f0: 120 * pitch, f1: 55 * pitch, d: 0.09, vol: vol * 0.7, wet: 0.05 });
    burst(t, { kind: 'pink', type: 'lowpass', f: 700 * pitch, q: 1, d: 0.05, vol: vol * 0.5, wet: 0.08 });
  };

  /** Petit choc sur un matériau : 'wood' | 'ceramic' | 'glass' | 'metal' | 'plastic' */
  const MODES = {
    wood: { f: 420, r: [1, 2.6, 4.1], d: 0.06 },
    ceramic: { f: 1150, r: [1, 2.32, 4.25, 6.6], d: 0.25 },
    glass: { f: 1800, r: [1, 2.76, 5.4, 8.9], d: 0.5 },
    metal: { f: 900, r: [1, 2.43, 3.87, 5.6], d: 0.6 },
    plastic: { f: 700, r: [1, 2.1, 3.3], d: 0.05 },
  };
  A.tap = (material = 'wood', vol = 0.5, pitch = 1) => {
    if (!ready()) return;
    const m = MODES[material] || MODES.wood, t = now(), f = m.f * pitch * rnd(0.97, 1.03);
    m.r.forEach((r, i) => tone(t, { f0: f * r, d: m.d / (1 + i * 0.7), vol: vol * 0.35 / (1 + i), wet: 0.25 }));
    burst(t, { type: 'bandpass', f: f * 3, q: 1, d: 0.006, vol: vol * 0.5, wet: 0.1 });
  };

  /** Froissement de plastique / papier (film, emballage) */
  A.rustle = (vol = 0.4, dur = 0.3) => {
    if (!ready()) return;
    const t0 = now(), n = Math.floor(10 + dur * 60);
    for (let i = 0; i < n; i++) {
      const t = t0 + Math.random() * dur;
      burst(t, { type: 'bandpass', f: rnd(2500, 8000), q: rnd(2, 8), d: rnd(0.003, 0.012), vol: vol * rnd(0.2, 0.7), wet: 0.12 });
    }
  };

  /** Souffle (objet qui glisse, nouvelle feuille) */
  A.whoosh = (vol = 0.4, dur = 0.4, up = false) => {
    if (!ready()) return;
    const t = now();
    const n = noise('pink'), f = filt('bandpass', up ? 300 : 2500, 1.2), g = ctx.createGain();
    f.frequency.exponentialRampToValueAtTime(up ? 2500 : 300, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f); f.connect(g); send(g, 0.2);
    n.start(t, Math.random()); n.stop(t + dur + 0.05);
  };

  /** Bruit de chute de sable */
  A.sand = (vol = 0.4, dur = 0.25) => {
    if (!ready()) return;
    const t0 = now(), n = Math.floor(20 + dur * 140);
    for (let i = 0; i < n; i++) {
      const t = t0 + Math.pow(Math.random(), 0.7) * dur;
      burst(t, { type: 'bandpass', f: rnd(3000, 9000), q: rnd(2, 6), d: rnd(0.002, 0.006), vol: vol * rnd(0.1, 0.45), wet: 0.08 });
    }
    burst(t0, { kind: 'pink', type: 'highpass', f: 2500, q: 0.7, a: 0.03, d: dur, vol: vol * 0.25, wet: 0.1 });
  };

  /** Note cristalline pentatonique (récompense) */
  const PENTA = [0, 2, 4, 7, 9];
  A.chime = (step = 0, vol = 0.3, type = 'sine') => {
    if (!ready()) return;
    const t = now();
    const oct = Math.floor(step / 5), semis = PENTA[((step % 5) + 5) % 5] + oct * 12;
    const f = 523.25 * Math.pow(2, semis / 12);
    [[1, 1, 1.2], [2.01, 0.35, 0.6], [3.02, 0.12, 0.35], [4.1, 0.05, 0.2]].forEach(([m, v, d], i) => {
      tone(t, { type: i === 0 ? type : 'sine', f0: f * m, a: 0.003, d, vol: vol * v, wet: 0.45 });
    });
  };

  /** Arpège de victoire, scintillant */
  A.win = () => {
    if (!ready()) return;
    [0, 2, 4, 5, 7, 9].forEach((s, i) => setTimeout(() => A.chime(s, 0.22), i * 85));
    setTimeout(() => A.sparkle(0.25), 450);
  };

  /** Pluie de petites étincelles sonores */
  A.sparkle = (vol = 0.2) => {
    if (!ready()) return;
    for (let i = 0; i < 10; i++) {
      const t = now() + i * 0.04 + Math.random() * 0.03;
      tone(t, { f0: rnd(2500, 5000), d: rnd(0.05, 0.15), vol: vol * rnd(0.2, 0.6), wet: 0.6 });
    }
  };

  /** Clic d'interface doux */
  A.click = () => {
    if (!ready()) return;
    const t = now();
    tone(t, { type: 'triangle', f0: 1100, f1: 600, d: 0.04, vol: 0.12, wet: 0.1 });
    burst(t, { type: 'highpass', f: 4000, d: 0.004, vol: 0.12, wet: 0 });
  };

  /* ---------- Sons continus pilotés par le geste ---------- */
  /*
   * A.loop(type) → { set(level 0..1, tone 0..1), stop() }
   * Types : 'smear' (beurre, crème, peinture épaisse), 'paint' (pinceau mouillé),
   * 'scrape' (lame sur surface sèche), 'brush' (frottement léger), 'sand' (sable fin),
   * 'hum' (versement, ronronnement), 'sticky' (slime qui s'étire), 'peel' (film plastique),
   * 'flame' (chalumeau), 'pour' (liquide qui coule).
   * Chaque type mélange un bruit filtré continu et des « grains » (micro-craquements)
   * dont la densité suit le niveau : c'est ce qui rend le son vivant.
   */
  const LOOPS = {
    smear:  { kind: 'brown', ft: 'lowpass',  f0: 260,  f1: 1300, q: 4,   max: 0.55, grains: 26, grain: 'wet' },
    paint:  { kind: 'brown', ft: 'bandpass', f0: 400,  f1: 1500, q: 2,   max: 0.45, grains: 30, grain: 'wet' },
    scrape: { kind: 'pink',  ft: 'bandpass', f0: 1500, f1: 4200, q: 1.4, max: 0.32, grains: 70, grain: 'dry' },
    brush:  { kind: 'pink',  ft: 'bandpass', f0: 2500, f1: 6500, q: 0.8, max: 0.2,  grains: 20, grain: 'fine' },
    sand:   { kind: 'white', ft: 'highpass', f0: 3000, f1: 6000, q: 0.7, max: 0.16, grains: 220, grain: 'fine' },
    hum:    { kind: 'brown', ft: 'lowpass',  f0: 220,  f1: 700,  q: 5,   max: 0.45, grains: 6,  grain: 'wet' },
    sticky: { kind: 'brown', ft: 'bandpass', f0: 300,  f1: 1100, q: 5,   max: 0.5,  grains: 18, grain: 'stick' },
    peel:   { kind: 'pink',  ft: 'bandpass', f0: 2500, f1: 6000, q: 2.5, max: 0.18, grains: 90, grain: 'crackle' },
    flame:  { kind: 'brown', ft: 'bandpass', f0: 500,  f1: 900,  q: 0.8, max: 0.6,  grains: 40, grain: 'fine', hiss: true },
    pour:   { kind: 'brown', ft: 'lowpass',  f0: 500,  f1: 1400, q: 3,   max: 0.4,  grains: 40, grain: 'bub' },
  };
  function grainOf(kind, t, lv, tn) {
    switch (kind) {
      case 'wet':
        if (Math.random() < 0.5) tone(t, { f0: rnd(350, 700), f1: rnd(900, 1600), d: rnd(0.012, 0.025), vol: 0.12 * lv, wet: 0.15 });
        else burst(t, { kind: 'brown', type: 'bandpass', f: rnd(500, 1500), q: 6, d: rnd(0.01, 0.03), vol: 0.35 * lv, wet: 0.1 });
        break;
      case 'dry':
        burst(t, { type: 'bandpass', f: rnd(1800, 6000) * (0.8 + tn * 0.4), q: rnd(2, 6), d: rnd(0.002, 0.008), vol: rnd(0.15, 0.5) * lv, wet: 0.08 });
        break;
      case 'fine':
        burst(t, { type: 'bandpass', f: rnd(4000, 9000), q: rnd(2, 5), d: rnd(0.0015, 0.004), vol: rnd(0.08, 0.3) * lv, wet: 0.05 });
        break;
      case 'stick':
        tone(t, { f0: rnd(200, 420), f1: rnd(600, 1200), d: rnd(0.02, 0.05), vol: 0.14 * lv, wet: 0.2, glide: 0.03 });
        break;
      case 'crackle':
        burst(t, { type: 'highpass', f: rnd(2500, 6000), q: 1, d: rnd(0.001, 0.004), vol: rnd(0.2, 0.7) * lv, wet: 0.1 });
        break;
      case 'bub':
        tone(t, { f0: rnd(300, 800), f1: rnd(900, 1800), d: rnd(0.015, 0.035), vol: 0.1 * lv, wet: 0.3 });
        break;
    }
  }
  A.loop = (type = 'smear') => {
    const dummy = { set() {}, stop() {} };
    if (!ctx) return dummy;
    const c = LOOPS[type] || LOOPS.smear;
    const n = noise(c.kind), f = filt(c.ft, c.f0, c.q), g = ctx.createGain();
    g.gain.value = 0;
    n.connect(f); f.connect(g); send(g, 0.12);
    n.start(0, Math.random());
    let hiss = null, hg = null;
    if (c.hiss) {
      hiss = noise('white'); const hf = filt('highpass', 5000, 0.7); hg = ctx.createGain(); hg.gain.value = 0;
      hiss.connect(hf); hf.connect(hg); send(hg, 0.05); hiss.start();
    }
    let level = 0, tn = 0.5, stopped = false;
    // Planificateur de grains : densité ∝ niveau
    const iv = setInterval(() => {
      if (stopped || !SG.settings.sound || level < 0.02) return;
      const t0 = ctx.currentTime + 0.02;
      const expect = c.grains * level * 0.03;
      let k = Math.floor(expect) + (Math.random() < expect % 1 ? 1 : 0);
      k = Math.min(k, 12);
      for (let i = 0; i < k; i++) grainOf(c.grain, t0 + Math.random() * 0.03, level, tn);
    }, 30);
    return {
      set(lv = 0, tone01 = 0.5) {
        if (stopped) return;
        level = clamp(lv, 0, 1); tn = clamp(tone01, 0, 1);
        const t = ctx.currentTime;
        g.gain.setTargetAtTime(level * c.max, t, 0.035);
        f.frequency.setTargetAtTime(c.f0 + (c.f1 - c.f0) * tn, t, 0.05);
        if (hg) hg.gain.setTargetAtTime(level * 0.08, t, 0.05);
      },
      stop() {
        if (stopped) return; stopped = true;
        clearInterval(iv);
        const t = ctx.currentTime;
        g.gain.setTargetAtTime(0, t, 0.03);
        if (hg) hg.gain.setTargetAtTime(0, t, 0.03);
        try { n.stop(t + 0.25); if (hiss) hiss.stop(t + 0.25); } catch (e) { /* ignore */ }
      },
    };
  };
})();

  <script>/* js/games/butter-spread.js */
/* Tartine — étaler du beurre (ou de la confiture, du miel) sur une tranche grillée.
   La garniture est un champ de hauteurs (épaisseur) éclairé : stries, bourrelets,
   pics quand on lève le couteau, beurre qui fond et imbibe le pain chaud. */
(function () {
  'use strict';
  const U = SG.util;

  // Repère local : la tartine occupe 0..300 × 0..280 (unités de scène)
  const TW = 300, TH = 280, CT = 15;
  const TB = { x: -30, y: -30, w: 360, h: 345 }; // zone du calque de la tranche
  const RES = 1.6;                                // résolution du calque de pain
  // Grille d'épaisseur de garniture
  const GR = 1.5, GX0 = -8, GY0 = -16, GWU = 316, GHU = 302;
  const GW = Math.round(GWU * GR), GH = Math.round(GHU * GR), CA = 1 / (GR * GR);
  const HW = 17;                                  // demi-longueur de contact de la lame
  const LMAX = 24000, LCAP = LMAX * 1.4;          // volume de garniture sur le couteau
  const STRIP = 24;                               // lignes simulées par image (fonte, coulure)
  // Lumière (haut-gauche) et vecteur demi-angle pour les reflets
  const LX = -0.45, LY = -0.585, LZ = 0.675, HX = -0.246, HY = -0.32, HZ = 0.915;

  const MODES = {
    butter: { name: 'Beurre', icon: '🧈', thin: [255, 220, 105], thick: [255, 234, 150], k: 1.7, gloss: 0.38, shin: 22, nv: 0.06,
      t0: 2.1, flow: 0, yield: 0.8, src: 'beurrier', done: 'Tartine parfaite !', handle: '#ffc8a8', film: '255,236,160', glob: '#ffeaa6' },
    jam: { name: 'Confiture', icon: '🍓', thin: [208, 34, 66], thick: [116, 4, 26], k: 0.95, gloss: 1.1, shin: 60, nv: 0.04,
      t0: 1.6, flow: 0.05, yield: 1.6, src: 'pot de confiture', done: 'Miam, la confiture !', handle: '#ffb5c8', film: '170,20,45', glob: '#b5122f' },
    honey: { name: 'Miel', icon: '🍯', thin: [250, 184, 52], thick: [192, 100, 6], k: 0.6, gloss: 1.35, shin: 70, nv: 0.02,
      t0: 1.4, flow: 0.55, yield: 0.45, src: 'pot de miel', done: 'Tout doré !', handle: '#ffe39a', film: '240,160,30', glob: '#e9a020' },
  };
  const KEYS = ['butter', 'jam', 'honey'];

  // Silhouette de tranche de pain de mie (dôme en haut)
  function breadPath(p, x, y, w, h) {
    const r = w * 0.09;
    p.moveTo(x + r, y + h);
    p.lineTo(x + w - r, y + h);
    p.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    p.lineTo(x + w, y + h * 0.34);
    p.bezierCurveTo(x + w * 1.07, y + h * 0.26, x + w * 1.05, y + h * 0.02, x + w * 0.74, y + h * 0.02);
    p.bezierCurveTo(x + w * 0.62, y - h * 0.035, x + w * 0.38, y - h * 0.035, x + w * 0.26, y + h * 0.02);
    p.bezierCurveTo(x - w * 0.05, y + h * 0.02, x - w * 0.07, y + h * 0.26, x, y + h * 0.34);
    p.lineTo(x, y + h - r);
    p.quadraticCurveTo(x, y + h, x + r, y + h);
    p.closePath();
    return p;
  }

  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();

  const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  // Masque de la grille à partir d'un chemin (rendu une fois, pas de isPointInPath par cellule)
  function maskFrom(path) {
    const c = mk(GW, GH), x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(GR, 0, 0, GR, -GX0 * GR, -GY0 * GR);
    x.fillStyle = '#000'; x.fill(path);
    const d = x.getImageData(0, 0, GW, GH).data, m = new Uint8Array(GW * GH);
    for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;

  }
  // Bruit doux (variations du grain de la garniture)
  function makeNoise() {
    const S = 6, cw = Math.ceil(GW / S) + 2, ch = Math.ceil(GH / S) + 2;

    for (let i = 0; i < co.length; i++) co[i] = Math.random() * 2 - 1;

    for (let y = 0; y < GH; y++) {
      const fy = y / S, iy = Math.floor(fy), ty = fy - iy;
      for (let x = 0; x < GW; x++) {
        const fx = x / S, ix = Math.floor(fx), tx = fx - ix, k = iy * cw + ix;
        const a = co[k] + (co[k + 1] - co[k]) * tx, b = co[k + cw] + (co[k + cw + 1] - co[k + cw]) * tx;
        nz[y * GW + x] = (a + (b - a) * ty) * 0.75 + (Math.random() * 2 - 1) * 0.25;
      }
    }
    return nz;
  }

  SG.registerGame({
    id: 'butter-spread',
    title: 'Tartine',
    emoji: '🧈',
    desc: 'Étale un beurre bien crémeux sur une tartine grillée.',
    color: '#ffe39a',
    bg: 'linear-gradient(180deg,#fff6ea 0%,#ffeaf0 100%)',
    order: 1,
    create(stage) {
      const cv = SG.makeCanvas(stage);

      const nz = makeNoise();

      const melt = new Float32Array(GW * GH), soak = new Float32Array(GW * GH);

      // État
      let mode = 'butter', tool = 'knife';
      const ld = { v: 0, fruit: 0, film: 0 };
      let toastLevel = Math.random(), age = 0, heat = 1;
      let slide = 700, leaving = false;

      let loadAcc = 0, wasFull = false, lastCrunch = 0, wasCrust = false, dryDist = 0, lastDryHint = 0;
      let smearLv = 0, smearTone = 0.5, scrapeLv = 0, stickyLv = 0;
      let snd = null, sndDry = null, sndSticky = null;
      let covT = 0, lastSizzle = 0, pressK = 0.4;
      const celebrated = {}; KEYS.forEach((k) => { celebrated[k] = false; });
      const marks = {}; KEYS.forEach((k) => { marks[k] = []; });

      }

      function buildBg() {
