  function drawWatch(g, W, H, dpr) {
    const sg = g.createLinearGradient(W * 0.24, 0, W * 0.76, 0);
    sg.addColorStop(0, '#ffc8a8'); sg.addColorStop(0.5, '#ffdcc8'); sg.addColorStop(1, '#f7b394');
    g.fillStyle = sg;
    rr(g, W * 0.24, 0, W * 0.52, H * 0.3, W * 0.1); g.fill();
    rr(g, W * 0.24, H * 0.7, W * 0.52, H * 0.3, W * 0.1); g.fill();
    g.fillStyle = 'rgba(170,100,90,.3)';
    for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(W / 2, H * (0.8 + i * 0.055), W * 0.02, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = '#f5a7c0';
    rr(g, W * 0.9, H * 0.42, W * 0.1, H * 0.1, 4); g.fill();
    g.save();
    g.shadowColor = 'rgba(160,80,120,.35)'; g.shadowBlur = 22 * dpr; g.shadowOffsetY = 8 * dpr;
    rr(g, W * 0.04, H * 0.17, W * 0.92, H * 0.66, W * 0.26);
    const cg = g.createLinearGradient(0, H * 0.17, W, H * 0.83);
    cg.addColorStop(0, '#ffe1ea'); cg.addColorStop(1, '#f5a7c0');
    g.fillStyle = cg; g.fill();
    g.restore();

    const cx = W / 2, cy = sy + sh * 0.55, base = sw * 0.36, lw = sw * 0.075;
    [['#ffb5c8', 0.78], ['#b9f0d4', 0.55], ['#b8dcff', 0.88]].forEach(([c, fr], i) => {
      const rad = base - i * (lw + 3);
      g.lineWidth = lw; g.lineCap = 'round';

      g.beginPath(); g.arc(cx, cy, rad, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * fr); g.strokeStyle = c; g.stroke();
    });
    g.fillStyle = 'rgba(255,255,255,.9)'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.font = `600 ${Math.round(sw * 0.1)}px Fredoka, system-ui, sans-serif`;
    g.fillText('10:09', cx, sy + sh * 0.15);

  }

  const OBJECTS = [
    { name: 'Téléphone', aspect: 0.49, maxW: 300, draw: drawPhone },
    { name: 'Console de poche', aspect: 1.9, maxW: 560, draw: drawConsole },
    { name: 'Planche de stickers', aspect: 0.74, maxW: 380, draw: drawStickers },
    { name: 'Montre', aspect: 0.62, maxW: 260, draw: drawWatch },
  ];

  SG.registerGame({
    id: 'peel',
    title: 'Film à peler',
    emoji: '📱',
    desc: 'Décolle le film protecteur des objets tout neufs.',
    color: '#d6c4ff',
    bg: 'radial-gradient(120% 90% at 50% 0%, #fbf6ff 0%, #f1ecff 55%, #e6f2ff 100%)',
    order: 12,
    create(stage) {
      const S = SG.makeCanvas(stage);
      const ctx = S.ctx;
      const prog = SG.progress(stage, 'Décollé');

      let idx = U.randInt(0, OBJECTS.length - 1);
      let obj = null, G = null, state = 'peel', trans = null, flyer = null;
      let drag = null, auto = null, wiggle = 0;
      let lastF = 0, crackAcc = 0, hapAcc = 0, scrapeLv = 0, scrapeTone = 0.5;
      let scrape = null, peelLoop = null, nextTimer = 0, lastW = S.w, lastH = S.h;
      let bDrag = null, sDrag = null, light = { x: 0.35, y: 0.3 }, hintEl = null;
      const timers = [];
      const rings = [];

      const ensureLoop = () => {
        if (!SG.audio.ctx()) return;
        if (!scrape) scrape = SG.audio.loop('scrape');
        if (!peelLoop) peelLoop = SG.audio.loop('peel');
      };
      const hint = (txt, ms) => { if (hintEl) hintEl.remove(); hintEl = SG.hint(stage, txt, ms); };
      // Point du contour du film le plus proche (pour décoller depuis n'importe quel bord)
      function nearestOnFilm(film, x, y) {
        let best = null, bd = Infinity;
        for (let i = 0; i < film.length; i++) {
          const a = film[i], b = film[(i + 1) % film.length];
          const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy || 1;
          const t = U.clamp(((x - a.x) * dx + (y - a.y) * dy) / L2, 0, 1);
          const qx = a.x + dx * t, qy = a.y + dy * t, d = Math.hypot(x - qx, y - qy);
          if (d < bd) { bd = d; best = { x: qx, y: qy }; }
        }
        return { p: best, d: bd };
      }
      function stickerCache(s, lifted) {
        const key = lifted ? 'cvL' : 'cv';
        if (s[key]) return s[key];
        const pad = 18, size = s.R * 2.4 + pad * 2, dpr = S.dpr, c = document.createElement('canvas');
        c.width = Math.ceil(size * dpr); c.height = Math.ceil(size * dpr);
        const g = c.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, (size / 2 - s.cx) * dpr, (size / 2 - s.cy) * dpr);
        sticker(g, s.path, s.fill, s.hx, s.hy, s.hr, dpr, lifted);
        s[key] = c; s.size = size;
        return c;
      }
      function stickerAt(o, x, y) {
        const list = o.stickers.slice().sort((a, b) => (b.moved - a.moved));
        for (const s of list) if (Math.hypot(x - s.x, y - s.y) < s.R) return s;
        return null;
      }

      /* ---------- Construction d'un objet ---------- */
      function makeFilmTex(o) {
        const s = o.surf, dpr = S.dpr, c = document.createElement('canvas');
        c.width = Math.ceil(s.w * dpr); c.height = Math.ceil(s.h * dpr);
        const g = c.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        rr(g, 0, 0, s.w, s.h, s.r);
        g.clip();
        g.fillStyle = 'rgba(246,248,255,.42)'; g.fillRect(0, 0, s.w, s.h);
        const lg = g.createLinearGradient(0, 0, s.w, s.h);
        lg.addColorStop(0, 'rgba(255,255,255,.32)'); lg.addColorStop(0.5, 'rgba(210,220,245,.14)'); lg.addColorStop(1, 'rgba(255,255,255,.26)');
        g.fillStyle = lg; g.fillRect(0, 0, s.w, s.h);
        g.save();
        g.translate(s.w / 2, s.h / 2); g.rotate(-0.45);
        g.font = '600 11px Fredoka, system-ui, sans-serif';
        g.fillStyle = 'rgba(120,130,175,.24)'; g.textAlign = 'center';
        const D = Math.hypot(s.w, s.h), txt = 'FILM PROTECTEUR  ·  À RETIRER  ·  ';
        for (let y = -D / 2, k = 0; y < D / 2; y += 34, k++) g.fillText(txt.repeat(4), (k % 2) * 40, y);
        g.restore();
        g.fillStyle = 'rgba(255,255,255,.6)';
        for (let i = 0; i < 40; i++) g.fillRect(Math.random() * s.w, Math.random() * s.h, 1, 1);
        return c;
      }
      function build(i) {
        const def = OBJECTS[((i % OBJECTS.length) + OBJECTS.length) % OBJECTS.length];
        const availW = S.w - 40, availH = Math.max(160, S.h - 66 - 96);
        const W = Math.max(60, Math.min(availW, availH * def.aspect, def.maxW)), H = W / def.aspect;
        const X = (S.w - W) / 2, Y = 66 + (availH - H) / 2;
        const m = 40, dpr = S.dpr, cache = document.createElement('canvas');
        cache.width = Math.ceil((W + m * 2) * dpr); cache.height = Math.ceil((H + m * 2) * dpr);
        const g = cache.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, m * dpr, m * dpr);
        const s = def.draw(g, W, H, dpr);
        const surf = { x: X + s.x, y: Y + s.y, w: s.w, h: s.h, r: s.r };
        const film = rrPoly(surf.x + 0.5, surf.y + 0.5, surf.w - 1, surf.h - 1, surf.r - 0.5, 8);
        const ci = U.randInt(0, 3), right = ci === 1 || ci === 2, bottom = ci >= 2;
        const C0 = { x: right ? surf.x + surf.w : surf.x, y: bottom ? surf.y + surf.h : surf.y };
        const dg = { x: (right ? 1 : -1) * Math.SQRT1_2, y: (bottom ? 1 : -1) * Math.SQRT1_2 };
        // Languette au coin
        const tc = { x: C0.x + dg.x * 10, y: C0.y + dg.y * 10 }, vx = -dg.y, vy = dg.x, hl = 16, hw = 11;
        const tab = [
          { x: tc.x - dg.x * hl + vx * hw, y: tc.y - dg.y * hl + vy * hw },
          { x: tc.x - dg.x * hl - vx * hw, y: tc.y - dg.y * hl - vy * hw },
        ];
        for (let k = 0; k <= 8; k++) {
          const a = -Math.PI / 2 + (k / 8) * Math.PI, ca = Math.cos(a), sa = Math.sin(a);
          tab.push({ x: tc.x + dg.x * 6 + (dg.x * ca + vx * sa) * hw, y: tc.y + dg.y * 6 + (dg.y * ca + vy * sa) * hw });
        }
        // Petites bulles d'air
        const bubbles = [], nb = U.randInt(4, 7);
        for (let k = 0, tries = 0; k < nb && tries < 60; tries++) {
          const x = U.rand(surf.x + 18, surf.x + surf.w - 18), y = U.rand(surf.y + 18, surf.y + surf.h - 18);
          if (U.dist(x, y, C0.x, C0.y) < 60 || !inside(film, x, y)) continue;
          bubbles.push({ x, y, r: U.rand(3.5, 8), alive: true });
          k++;
        }
        const o = { def, X, Y, W, H, m, cache, surf, film, area: Math.abs(polyArea(film)), C0, tabC: { x: C0.x, y: C0.y }, dg, tab, bubbles, P: { x: C0.x, y: C0.y }, tex: null };
        o.stickers = (s.stickers || []).map((d, id) => Object.assign({}, d, { id, x: X + d.cx, y: Y + d.cy, rot: 0, moved: false, lifted: false, cv: null }));
        o.tex = makeFilmTex(o);
        return o;
      }

      /* ---------- Géométrie du pli ---------- */
      function geom(o) {
        const dx = o.P.x - o.C0.x, dy = o.P.y - o.C0.y, L = Math.hypot(dx, dy);
        if (L < 0.5) return { f: null, F: 0, attached: o.film, peeled: [], flap: [], maxD: 0, foldPts: [] };
        const f = { nx: dx / L, ny: dy / L, mx: o.C0.x + dx / 2, my: o.C0.y + dy / 2, L };
        const peeled = clipHalf(o.film, f, true), attached = clipHalf(o.film, f, false);
        const flap = peeled.map((q) => reflect(q, f));
        const F = peeled.length > 2 ? Math.abs(polyArea(peeled)) / o.area : 0;
        let maxD = 0;
        peeled.forEach((q) => { const d = -side(q, f); if (d > maxD) maxD = d; });
        return { f, F, attached, peeled, flap, maxD, foldPts: peeled.filter((q) => q.cut) };
      }

      function popBubble(b) {
        b.alive = false;
        rings.push({ x: b.x, y: b.y, r: b.r, t: 0 });
        SG.audio.pop(U.rand(1.8, 2.6), 0.18);
        SG.haptic(3);
      }

      function complete() {
        state = 'fly'; drag = null; auto = null;
        const pts = G.flap.length > 2 ? G.flap : obj.film;
        let cx = 0, cy = 0;
        pts.forEach((q) => { cx += q.x; cy += q.y; });
        cx /= pts.length; cy /= pts.length;
        const c0 = { x: U.clamp(cx, 60, S.w - 60), y: U.clamp(cy, 90, S.h - 140) };
        const Rb = U.clamp(Math.sqrt(obj.area) * 0.16, 22, 42), dir = c0.x < S.w / 2 ? -1 : 1;
        flyer = {
          t: 0, c0, dir, rot: U.rand(3, 6) * dir,
          pts: pts.map((q) => ({ x: q.x, y: q.y, a: Math.atan2(q.y - cy, q.x - cx), r: Rb * U.rand(0.55, 1.05) })),
        };
        obj.bubbles.forEach((b) => { if (b.alive) popBubble(b); });
        prog.set(1);
        SG.audio.crunch(0.8, 1.1); SG.audio.squish(1.4, 0.4); SG.haptic(25);
        timers.push(setTimeout(() => {
          if (state !== 'fly') return;
          state = 'done';
          SG.audio.chime(7, 0.25);
          SG.celebrate(stage, 'Tout neuf !');
          if (obj.stickers.length) timers.push(setTimeout(() => hint('Décolle les stickers et colle-les où tu veux !', 3600), 1800));
        }, 650));
        clearTimeout(nextTimer);
        if (!obj.stickers.length) nextTimer = setTimeout(next, 3800);
      }

      function next() {
        if (state === 'trans') return;
        clearTimeout(nextTimer);
        const old = obj, oldG = state === 'peel' ? G : null;
        idx++;
        obj = build(idx);
        G = geom(obj);
        lastF = 0; drag = null; auto = null; flyer = null; wiggle = 0; bDrag = null; sDrag = null;
        if (old) old.stickers.forEach((s) => { s.lifted = false; });
        trans = { t: 0, old, oldG };
        state = 'trans';
        prog.set(0);
        SG.audio.sand(0.25, 0.35);
      }

      /* ---------- Entrées ---------- */
      const ptr = SG.pointer(S.canvas, {
        down(p) {
          ensureLoop();
          setLight(p);
          // Stickers : une fois le film retiré, on les décolle de la planche
          if ((state === 'done' || state === 'fly') && obj.stickers.length) {
            if (sDrag) return;
            const s = stickerAt(obj, p.x, p.y);
            if (s) {
              sDrag = { id: p.id, s, offx: s.x - p.x, offy: s.y - p.y, vx: 0 };
              s.lifted = true;
              if (!s.moved) { SG.audio.rustle(0.16, 0.3); SG.audio.crunch(0.12, 1.8); } else SG.audio.rustle(0.1, 0.15);
              obj.stickers.splice(obj.stickers.indexOf(s), 1); obj.stickers.push(s); // au premier plan
              SG.haptic(8);
            }
            return;
          }
          if (state === 'done') { next(); return; }
          if (state !== 'peel' || drag) return;
          const o = obj;
          let grab = false;
          if (!G.f) {
            grab = U.dist(p.x, p.y, o.tabC.x, o.tabC.y) < 48 || inside(o.tab, p.x, p.y);
            if (grab) { o.C0 = { x: o.tabC.x, y: o.tabC.y }; o.P = { x: o.C0.x, y: o.C0.y }; }
            else {
              // n'importe quel bord ou coin du film fait l'affaire
              const nb = nearestOnFilm(o.film, p.x, p.y);
              if (nb.d < 22) {
                let c = nb.p;
                // près d'un coin arrondi : on part du coin lui-même
                const s = o.surf;
                for (const cn of [{ x: s.x, y: s.y }, { x: s.x + s.w, y: s.y }, { x: s.x, y: s.y + s.h }, { x: s.x + s.w, y: s.y + s.h }]) {
                  if (U.dist(p.x, p.y, cn.x, cn.y) < Math.max(40, s.r * 1.1)) c = cn;
                }
                o.C0 = { x: c.x, y: c.y }; o.P = { x: c.x, y: c.y };
                grab = true;
                SG.audio.crunch(0.08, 1.8);
              }
            }
          } else {
            grab = (G.flap.length > 2 && inside(G.flap, p.x, p.y)) ||
              (G.peeled.length > 2 && inside(G.peeled, p.x, p.y)) ||
              U.dist(p.x, p.y, o.P.x, o.P.y) < 50 ||
              (Math.abs(side(p, G.f)) < 28 && inside(o.film, p.x, p.y));
          }
          if (grab) {
            drag = { id: p.id, gx: p.x, gy: p.y, px: o.P.x, py: o.P.y };
            auto = null;
            SG.audio.crunch(0.15, 1.4); SG.haptic(6);
            return;
          }
          for (const b of o.bubbles) {
            if (b.alive && U.dist(p.x, p.y, b.x, b.y) < b.r + 14) {
              // on pousse la bulle vers le bord (ou on l'écrase si on tape)
              bDrag = { id: p.id, b, moved: 0, t0: performance.now() };
              SG.audio.squish(2.2, 0.1); SG.haptic(4);
              return;
            }
          }
          wiggle = 0.6;
          SG.audio.tap('plastic', 0.18, 1.5);
        },
        move(p) {
          setLight(p);
          if (sDrag && p.id === sDrag.id) {
            const s = sDrag.s;
            s.x = U.clamp(p.x + sDrag.offx, 0, S.w); s.y = U.clamp(p.y + sDrag.offy, 0, S.h);
            sDrag.vx = U.lerp(sDrag.vx, p.dx, 0.3);
            s.rot = U.clamp(sDrag.vx * 0.02, -0.3, 0.3);
            return;
          }
          if (bDrag && p.id === bDrag.id) { pushBubble(bDrag, p); return; }
          if (!drag || p.id !== drag.id || state !== 'peel') return;
          obj.P.x = drag.px + (p.x - drag.gx) * K;
          obj.P.y = drag.py + (p.y - drag.gy) * K;
          // ramené tout contre son coin : le film est recollé, on peut repartir d'ailleurs
          if (U.dist(obj.P.x, obj.P.y, obj.C0.x, obj.C0.y) < 4) { obj.P.x = obj.C0.x; obj.P.y = obj.C0.y; }
        },
        up(p) {
          if (sDrag && p.id === sDrag.id) {
            const s = sDrag.s;
            sDrag = null;
            s.lifted = false; s.moved = s.moved || U.dist(s.x, s.y, obj.X + s.cx, obj.Y + s.cy) > 4;
            if (!s.moved) { s.x = obj.X + s.cx; s.y = obj.Y + s.cy; s.rot = 0; }
            s.rot *= 0.5;
            SG.audio.tap('plastic', 0.14, 1.6); SG.audio.rustle(0.06, 0.08); SG.haptic(6);
            return;
          }
          if (bDrag && p.id === bDrag.id) {
            const b = bDrag.b;
            if (b.alive && bDrag.moved < 5 && performance.now() - bDrag.t0 < 400) popBubble(b);
            bDrag = null;
            return;
          }
          if (!drag || p.id !== drag.id) return;
          drag = null;
          if (state === 'peel' && G.F > 0.55) auto = { v: 380 };
          else if (state === 'peel' && G.f) SG.audio.rustle(0.08, 0.12);
        },
        hover(p) { setLight(p); },
      });
      function setLight(p) { light.x = U.clamp(p.x / Math.max(1, S.w), 0, 1); light.y = U.clamp(p.y / Math.max(1, S.h), 0, 1); }
      function pushBubble(bd, p) {
        const b = bd.b;
        if (!b.alive) return;
        const tx = p.x, ty = p.y, d = Math.hypot(tx - b.x, ty - b.y);
        bd.moved += Math.hypot(p.dx, p.dy);

        const k = Math.min(1, 0.45);
        b.x += (tx - b.x) * k; b.y += (ty - b.y) * k;
        b.sq = Math.min(0.5, (b.sq || 0) + 0.1);
        if (Math.random() < 0.3) SG.audio.squish(U.rand(2, 2.6), 0.05);

        for (const c of obj.bubbles) {
          if (c === b || !c.alive) continue;
          if (U.dist(b.x, b.y, c.x, c.y) < b.r + c.r) {
            c.alive = false;
            b.r = Math.min(16, Math.sqrt(b.r * b.r + c.r * c.r));

        // sortie par le bord : l'air s'échappe
        const film = G.attached.length > 2 ? G.attached : obj.film;
        if (!inside(film, b.x, b.y)) {
          b.alive = false;
          rings.push({ x: b.x, y: b.y, r: b.r, t: 0 });
          SG.audio.whoosh(0.1, 0.15); SG.audio.pop(2.6, 0.08); SG.haptic(6);
          bDrag = null;
        }
      }

      SG.toolbar(stage, [{ icon: '⏭️', label: 'Objet suivant', onClick: next }]);

      // Au redimensionnement on reconstruit l'objet en gardant le film déjà décollé, les bulles et les stickers
      function rebuild() {
        const done = state !== 'peel' && state !== 'trans';
        const old = obj;
        obj = build(idx);
        trans = null; drag = null; auto = null; flyer = null; bDrag = null; sDrag = null;
        if (old && old.def === obj.def) {
          const k = obj.W / old.W, map = (q) => ({ x: obj.X + (q.x - old.X) * k, y: obj.Y + (q.y - old.Y) * k });
          obj.C0 = map(old.C0); obj.P = map(old.P); obj.tabC = map(old.tabC); obj.dg = old.dg;
          obj.tab = old.tab.map(map);
          obj.bubbles = old.bubbles.filter((b) => b.alive).map((b) => Object.assign(map(b), { r: b.r, alive: true }));
          const fresh = obj.stickers;
          obj.stickers = old.stickers.map((os) => {
            const s = fresh[os.id];
            if (os.moved) { const q = map(os); s.x = U.clamp(q.x, 10, S.w - 10); s.y = U.clamp(q.y, 10, S.h - 10); s.rot = os.rot; s.moved = true; }
            return s;
          });
        }
        if (done) { state = 'done'; obj.P = { x: obj.C0.x, y: obj.C0.y }; obj.bubbles = []; prog.set(1); }
        else state = 'peel';
        G = geom(obj); lastF = G.F;
        if (!done) prog.set(G.F);
      }
      S.onResize((w, h) => {
        if (w === lastW && h === lastH && obj) return;
        lastW = w; lastH = h;
        rebuild();
      });
      rebuild();
      hint('Tire la languette — ou n’importe quel bord — pour décoller le film', 4000);

      /* ---------- Rendu ---------- */
      function shine(o, t, strong) {
        const s = o.surf, per = strong ? 2.2 : 3.4, ph = (t % per) / per;
        if (ph > 0.7) return;
        ctx.save();
        rr(ctx, s.x, s.y, s.w, s.h, s.r);
        ctx.clip();
        ctx.translate(s.x + s.w / 2, s.y + s.h / 2);
        ctx.rotate(-0.6);
        const D = Math.hypot(s.w, s.h), px = -D + (ph / 0.7) * D * 2, bw = Math.max(30, D * 0.12);
        const lg = ctx.createLinearGradient(px - bw, 0, px + bw, 0);
        lg.addColorStop(0, 'rgba(255,255,255,0)');
        lg.addColorStop(0.5, `rgba(255,255,255,${strong ? 0.55 : 0.3})`);
        lg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = lg; ctx.fillRect(px - bw, -D, bw * 2, D * 2);
        ctx.fillStyle = `rgba(255,255,255,${strong ? 0.35 : 0.18})`;
        ctx.fillRect(px + bw * 1.4, -D, bw * 0.25, D * 2);
        ctx.restore();
      }
      function drawTab(pts) {
        ctx.save();
        ctx.shadowColor = 'rgba(160,80,110,.3)'; ctx.shadowBlur = 5 * S.dpr; ctx.shadowOffsetY = 2 * S.dpr;
        trace(ctx, pts);
        ctx.fillStyle = '#ff9fb8'; ctx.fill();
        ctx.restore();
        trace(ctx, pts);
        ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
        let cx = 0, cy = 0;
        pts.forEach((q) => { cx += q.x; cy += q.y; });
        cx /= pts.length; cy /= pts.length;
        ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill();
      }
      function drawFilm(o, g, t) {
        const s = o.surf;
        if (g.attached.length > 2) {
          ctx.save();
          trace(ctx, g.attached);
          ctx.clip();
          ctx.drawImage(o.tex, s.x, s.y, s.w, s.h);
          // Reflet spéculaire qui bouge avec le doigt (le film est un miroir souple)
          const lx = s.x + s.w * (1.1 - light.x * 1.2), ly = s.y + s.h * (1.0 - light.y * 1.1), R = Math.max(s.w, s.h) * 0.55;
          const sp = ctx.createRadialGradient(lx, ly, 0, lx, ly, R);
          sp.addColorStop(0, 'rgba(255,255,255,.32)'); sp.addColorStop(0.4, 'rgba(255,255,255,.1)'); sp.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = sp; ctx.fillRect(s.x, s.y, s.w, s.h);
          ctx.save();
          ctx.translate(lx, ly); ctx.rotate(-0.7);
          const st = ctx.createLinearGradient(-R * 0.08, 0, R * 0.08, 0);
          st.addColorStop(0, 'rgba(255,255,255,0)'); st.addColorStop(0.5, 'rgba(255,255,255,.28)'); st.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = st; ctx.fillRect(-R * 0.08 - R * 0.35, -R * 2, R * 0.16, R * 4);
          ctx.restore();
          for (const b of o.bubbles) {
            if (!b.alive) continue;
            if (b.sq) b.sq *= 0.92;
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (1 + (b.sq || 0) * 0.25), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fill();
            ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke();
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 0.5, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.strokeStyle = 'rgba(110,110,160,.28)'; ctx.stroke();
            ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.28, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill();
          }
          if (g.f) { // ombre portée par la courbure du pli
            const f = g.f, lg = ctx.createLinearGradient(f.mx, f.my, f.mx + f.nx * 18, f.my + f.ny * 18);
            lg.addColorStop(0, 'rgba(70,50,100,.25)'); lg.addColorStop(1, 'rgba(70,50,100,0)');
            ctx.fillStyle = lg; ctx.fillRect(s.x - 2, s.y - 2, s.w + 4, s.h + 4);
          }
          ctx.restore();
          // Épaisseur du film : liseré sombre décalé, arête claire, légère irisation
          ctx.save(); ctx.translate(0.6, 0.9);
          trace(ctx, g.attached);
          ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(80,90,140,.2)'; ctx.stroke();
          ctx.restore();
          trace(ctx, g.attached);
          ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
          const ir = ctx.createLinearGradient(s.x, s.y, s.x + s.w, s.y + s.h);
          ir.addColorStop(0, 'rgba(255,170,210,.0)'); ir.addColorStop(0.3, 'rgba(255,190,220,.35)');
          ir.addColorStop(0.5, 'rgba(180,220,255,.35)'); ir.addColorStop(0.7, 'rgba(200,255,220,.3)'); ir.addColorStop(1, 'rgba(255,255,255,0)');
          trace(ctx, g.attached);
          ctx.lineWidth = 0.8; ctx.strokeStyle = ir; ctx.stroke();
        }
        if (g.f && g.flap.length > 2) {
          const f = g.f, md = Math.max(1, g.maxD);
          ctx.save();
          ctx.shadowColor = 'rgba(70,50,100,.32)'; ctx.shadowBlur = 16 * S.dpr;
          ctx.shadowOffsetX = (f.nx * 5 + 2) * S.dpr; ctx.shadowOffsetY = (f.ny * 5 + 5) * S.dpr;
          trace(ctx, g.flap);
          ctx.fillStyle = 'rgba(240,244,255,.55)'; ctx.fill();
          ctx.restore();
          const ex = f.mx + f.nx * md, ey = f.my + f.ny * md;
          const lg = ctx.createLinearGradient(f.mx, f.my, ex, ey);
          lg.addColorStop(0, 'rgba(255,255,255,.95)');
          lg.addColorStop(0.06, 'rgba(228,234,252,.85)');
          lg.addColorStop(0.2, 'rgba(206,214,240,.72)');
          lg.addColorStop(0.5, 'rgba(242,246,255,.6)');
          lg.addColorStop(1, 'rgba(222,230,250,.72)');
          trace(ctx, g.flap);
          ctx.fillStyle = lg; ctx.fill();
          // Reflet qui glisse sur le rabat
          ctx.save();
          ctx.clip();
          const ph = (t * 0.35) % 1;
          const sp = ctx.createLinearGradient(f.mx, f.my, ex, ey);
          sp.addColorStop(U.clamp(ph - 0.1, 0, 1), 'rgba(255,255,255,0)');
          sp.addColorStop(U.clamp(ph, 0, 1), 'rgba(255,255,255,.5)');
          sp.addColorStop(U.clamp(ph + 0.1, 0, 1), 'rgba(255,255,255,0)');
          ctx.fillStyle = sp; ctx.fill();
          ctx.restore();
          trace(ctx, g.flap);
          ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.stroke();
          if (g.foldPts.length >= 2) {
            const a = g.foldPts[0], b = g.foldPts[g.foldPts.length - 1];
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
            ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();
            ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.stroke();
          }
        }
        if (g.f && side(o.tabC, g.f) < 0) drawTab(o.tab.map((q) => reflect(q, g.f)));
        else if (g.f) drawTab(o.tab);
        else {
          const bob = Math.sin(t * 4) * 1.5 + wiggle * Math.sin(t * 30) * 4;
          drawTab(o.tab.map((q) => ({ x: q.x + o.dg.x * bob, y: q.y + o.dg.y * bob })));
        }
      }
      function drawObj(o, dx, g, t) {
        ctx.save();
        ctx.translate(dx, 0);
        ctx.drawImage(o.cache, o.X - o.m, o.Y - o.m, o.W + o.m * 2, o.H + o.m * 2);
        // Emplacements vides des stickers décollés : papier support siliconé + découpe
        for (const s of o.stickers) {
          if (!s.moved && !s.lifted) continue;
          ctx.save();
          ctx.translate(o.X, o.Y);
          s.path(ctx);
          ctx.lineJoin = 'round'; ctx.lineWidth = 9; ctx.strokeStyle = '#f4ede8'; ctx.stroke();
          ctx.fillStyle = '#f4ede8'; ctx.fill();
          ctx.save(); s.path(ctx); ctx.clip();
          ctx.shadowColor = 'rgba(140,100,120,.35)'; ctx.shadowBlur = 4 * S.dpr; ctx.shadowOffsetY = 1.5 * S.dpr;
          s.path(ctx); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,1)'; ctx.stroke();
          ctx.restore();
          s.path(ctx); ctx.setLineDash([2, 3]); ctx.lineWidth = 0.8; ctx.strokeStyle = 'rgba(170,130,150,.55)'; ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
        }
        shine(o, t, !g);
        if (g) drawFilm(o, g, t);
        // Stickers déplacés (au-dessus), celui qu'on tient encore plus haut
        for (const s of o.stickers) {
          if (!s.moved && !s.lifted) continue;
          const c = stickerCache(s, s.lifted), sc = s.lifted ? 1.07 : 1;
          ctx.save();
          ctx.translate(s.x, s.y - (s.lifted ? 6 : 0)); ctx.rotate(s.rot); ctx.scale(sc, sc);
          ctx.drawImage(c, -s.size / 2, -s.size / 2, s.size, s.size);
          ctx.restore();
        }
        ctx.restore();
      }
      function drawFlyer(dt) {
        const f = flyer;
        f.t += dt;
        const k = Math.min(1, f.t / 0.35), e = 1 - Math.pow(1 - k, 3), tt = Math.max(0, f.t - 0.25);
        const cx = f.c0.x + f.dir * (120 * tt + 500 * tt * tt), cy = f.c0.y - 200 * tt - 500 * tt * tt;
        const rot = f.rot * tt, sc = 1 - 0.3 * Math.min(1, tt);
        const alpha = f.t > 1.0 ? Math.max(0, 1 - (f.t - 1.0) / 0.4) : 1;
        const pts = f.pts.map((q) => {
          const tx = cx + Math.cos(q.a + rot) * q.r * sc, ty = cy + Math.sin(q.a + rot) * q.r * sc;
          return { x: U.lerp(q.x, tx, e), y: U.lerp(q.y, ty, e) };
        });
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = 'rgba(70,50,100,.3)'; ctx.shadowBlur = 12 * S.dpr; ctx.shadowOffsetY = 6 * S.dpr;
        trace(ctx, pts);
        ctx.fillStyle = 'rgba(238,242,255,.9)'; ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.stroke();
        // plis froissés
        ctx.beginPath();
        for (let i = 0; i < pts.length; i += 3) {
          ctx.moveTo(U.lerp(pts[i].x, cx, 0.85 * e), U.lerp(pts[i].y, cy, 0.85 * e));
          ctx.lineTo(U.lerp(pts[i].x, cx, 0.25), U.lerp(pts[i].y, cy, 0.25));
        }
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(160,170,215,.45)'; ctx.stroke();
        ctx.restore();
        if (f.t > 1.4) flyer = null;
      }

      const loop = SG.loop((dt, t) => {
        wiggle = Math.max(0, wiggle - dt);
        let lv = 0;
        if (state === 'peel' && obj) {
          if (auto && G.f) {
            auto.v += 2400 * dt;
            obj.P.x += G.f.nx * auto.v * dt;
            obj.P.y += G.f.ny * auto.v * dt;
          }
          G = geom(obj);
          if (G.f) obj.bubbles.forEach((b) => { if (b.alive && side(b, G.f) < 0) popBubble(b); });
          const dF = G.F - lastF;
          lastF = G.F;
          if (dF > 0.0004) {
            lv = U.clamp(0.25 + dF * 40, 0, 1); scrapeTone = U.clamp(0.25 + dF * 25 + U.rand(-0.05, 0.05), 0, 1);
            crackAcc += dF;
            while (crackAcc > 0.012) { crackAcc -= 0.012; SG.audio.crunch(U.rand(0.06, 0.14), U.rand(1.3, 1.9)); }
            hapAcc += dF;
            if (hapAcc > 0.06) { hapAcc = 0; SG.haptic(4); }
          } else if (dF < -0.0004) { lv = 0.15; scrapeTone = 0.1; }
          prog.set(G.F);
          if (G.F >= 0.985) complete();
        }
        scrapeLv += (lv - scrapeLv) * 0.3;
        // Film qui se décolle : crépitement de l'adhésif (peel) + léger frottement (scrape)
        if (peelLoop) peelLoop.set(scrapeLv, scrapeTone);
        if (scrape) scrape.set(scrapeLv * 0.35, scrapeTone * 0.5);

        ctx.clearRect(0, 0, S.w, S.h);
        if (state === 'trans' && trans) {
          trans.t += dt;
          const k = Math.min(1, trans.t / 0.6), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
          if (trans.old) drawObj(trans.old, -S.w * e, trans.oldG, t);
          drawObj(obj, S.w * (1 - e), G, t);
          if (k >= 1) {
            trans = null; state = 'peel';
            hint(`${obj.def.name} : attrape la languette !`, 2200);
          }
        } else if (obj) {
          drawObj(obj, 0, state === 'peel' ? G : null, t);
        }
        if (flyer) drawFlyer(dt);
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i];
          r.t += dt;
          if (r.t > 0.35) { rings.splice(i, 1); continue; }
          ctx.beginPath(); ctx.arc(r.x, r.y, r.r + r.t * 30, 0, Math.PI * 2);
          ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(255,255,255,${1 - r.t / 0.35})`; ctx.stroke();
        }
      });

      return {
        destroy() {
          loop.stop();
          ptr.destroy();
          clearTimeout(nextTimer);
          timers.forEach(clearTimeout);
          if (scrape) scrape.stop();
          if (peelLoop) peelLoop.stop();
          scrape = peelLoop = null;
          S.destroy();
        },
      };
    },
  });
})();

  <script>/* js/games/creme-brulee.js */
/* Crème brûlée — tapoter la croûte de caramel (fissures qui courent), la casser (éclats qui
   basculent et s'enfoncent dans la crème), creuser la crème à la cuillère, refaire la croûte au chalumeau. */
(function () {
  'use strict';
  const { rand, clamp, dist, pick } = SG.util;
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };

  SG.registerGame({
    id: 'creme-brulee',
    title: 'Crème brûlée',
    emoji: '🍮',
    desc: 'Fais craquer la croûte de caramel à la cuillère.',
    color: '#ffd9a0',
    bg: 'linear-gradient(180deg,#fff1e2,#ffe2d0)',
    order: 13,
    create(stage) {
      const cv = SG.makeCanvas(stage);
      const g = cv.ctx;
      let cx = 0, cy = 0, R = 100, K = 1, S = 2, painted = false;
      // Calques : crème (dessous, garde les creux), croûte (dessus, trouée), croûte intacte (référence)
      const custard = mk(2, 2), crust = mk(2, 2), crustFull = mk(2, 2), bgCv = mk(2, 2), rimCv = mk(2, 2), brush = mk(2, 2);
      const cg = custard.getContext('2d'), kg = crust.getContext('2d'), fg = crustFull.getContext('2d'), bg = brush.getContext('2d');
      let shards = [], crumbs = [], growers = [], bubbles = [], flames = [], spoonBits = [];
      let mode = 'spoon';
      const spoon = { x: -100, y: -100, hit: 0, load: 0, loadA: 0 };
      let hits = [];
      let broken = 0, celebrated = false;
      let torchOn = false, torchLoop = null, smearLoop = null, heatT = 0;
      let pressed = false, scooping = false, lastScoop = null, scoopDist = 0;
      let lastCrackle = 0, lastBub = 0, smearLv = 0, shardPat = null, bakePat = null;
      const custardFull = mk(2, 2), cfg = custardFull.getContext('2d');
      const timers = [];
      const GRID = 32;
      let cells = new Uint8Array(GRID * GRID); // 1 = caramel cassé
      const prog = SG.progress(stage, 'Craquelé');
      SG.hint(stage, 'Tapote la croûte de caramel 🥄');

      function layout() {
        const w = cv.w, h = cv.h;
        cx = w / 2; cy = 58 + (h - 58 - 86) / 2;
        R = Math.min(w * 0.38, (h - 150) * 0.36, 260);
        K = cv.dpr;
        const NS = Math.ceil(R * 2 * K);
        buildBg();
        if (painted && NS === S) return;
        // Garder l'état en le remettant à l'échelle
        let oldK = null, oldC = null;
        if (painted) {
          oldK = mk(crust.width, crust.height); oldK.getContext('2d').drawImage(crust, 0, 0);
          oldC = mk(custard.width, custard.height); oldC.getContext('2d').drawImage(custard, 0, 0);
        }
        const ratio = painted ? NS / S : 1;
        hits.forEach((q) => { q.x *= ratio; q.y *= ratio; });
        shards.forEach((s) => { s.x *= ratio; s.y *= ratio; s.pts = s.pts.map(([a, b]) => [a * ratio, b * ratio]); });
        growers = [];
        S = NS;
        [custard, crust, crustFull, custardFull].forEach((c) => { c.width = S; c.height = S; });
        paintCrustFull();
        if (oldK) {
          paintCustard();
          cg.drawImage(oldC, 0, 0, S, S);
          kg.drawImage(oldK, 0, 0, S, S);
        } else {
          paintCustard();
          kg.drawImage(crustFull, 0, 0);
        }
        shardPat = null; bakePat = null;
        painted = true;
      }

      // Nappe, soucoupe, ramequin cannelé : pré-rendus une fois
      function buildBg() {
        const w = cv.w, h = cv.h, d = cv.dpr;
        bgCv.width = Math.round(w * d); bgCv.height = Math.round(h * d);
        const b = bgCv.getContext('2d');
        b.setTransform(d, 0, 0, d, 0, 0);
        b.fillStyle = '#ffeede'; b.fillRect(0, 0, w, h);
        b.fillStyle = 'rgba(255,190,200,0.18)';
        const sq = 40;
        for (let y = 0; y < h; y += sq) for (let x = ((y / sq) % 2) * sq; x < w; x += sq * 2) b.fillRect(x, y, sq, sq);
        // Soucoupe
        b.save();
        b.shadowColor = 'rgba(120,70,60,0.25)'; b.shadowBlur = 40; b.shadowOffsetY = 18;
        b.fillStyle = '#fffaf6';
        b.beginPath(); b.ellipse(cx, cy + R * 0.08, R * 1.4, R * 1.34, 0, 0, Math.PI * 2); b.fill();
        b.restore();
        let gr = b.createRadialGradient(cx, cy, R * 1.1, cx, cy + R * 0.08, R * 1.4);
        gr.addColorStop(0, '#fff7f2'); gr.addColorStop(1, '#f3e1db');
        b.fillStyle = gr;
        b.beginPath(); b.ellipse(cx, cy + R * 0.08, R * 1.4, R * 1.34, 0, 0, Math.PI * 2); b.fill();
        // Ramequin cannelé
        const fl = 28;
        b.save();
        b.shadowColor = 'rgba(120,70,60,0.28)'; b.shadowBlur = 18; b.shadowOffsetY = 8;
        b.beginPath();
        for (let i = 0; i <= fl * 4; i++) {
          const a = (i / (fl * 4)) * Math.PI * 2;
          const rr = R * 1.16 + Math.cos(a * fl) * R * 0.025;
          const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
          if (i) b.lineTo(x, y); else b.moveTo(x, y);
        }
        gr = b.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
        gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#efe2df');
        b.fillStyle = gr; b.fill();
        b.restore();
        // cannelures éclairées
        b.save();
        for (let i = 0; i < fl; i++) {
          const a = (i / fl) * Math.PI * 2;
          const lit = Math.cos(a + 2.3) * 0.5 + 0.5;
          b.strokeStyle = `rgba(${lit > 0.5 ? '255,255,255' : '190,160,155'},${0.25 + Math.abs(lit - 0.5) * 0.5})`;
          b.lineWidth = 1.2;
          b.beginPath(); b.moveTo(cx + Math.cos(a) * R * 1.06, cy + Math.sin(a) * R * 1.06); b.lineTo(cx + Math.cos(a) * R * 1.15, cy + Math.sin(a) * R * 1.15); b.stroke();
        }
        b.restore();
        // Lèvre + paroi intérieure
        b.lineWidth = R * 0.05;
        b.strokeStyle = '#fffdfb';
        b.beginPath(); b.arc(cx, cy, R * 1.055, 0, Math.PI * 2); b.stroke();
        gr = b.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
        gr.addColorStop(0, '#e6d6d2'); gr.addColorStop(1, '#f9efec');
        b.fillStyle = gr;
        b.beginPath(); b.arc(cx, cy, R * 1.03, 0, Math.PI * 2); b.fill();
        // Ombre intérieure par-dessus la crème (calque séparé)
        rimCv.width = Math.round(w * d); rimCv.height = Math.round(h * d);
        const r = rimCv.getContext('2d');
        r.setTransform(d, 0, 0, d, 0, 0);
        r.beginPath(); r.arc(cx, cy, R, 0, Math.PI * 2); r.clip();
        gr = r.createRadialGradient(cx + R * 0.06, cy + R * 0.08, R * 0.86, cx, cy, R * 1.02);
        gr.addColorStop(0, 'rgba(60,25,10,0)'); gr.addColorStop(1, 'rgba(60,25,10,0.35)');
        r.fillStyle = gr; r.fillRect(cx - R, cy - R, R * 2, R * 2);
        r.strokeStyle = 'rgba(255,250,240,0.55)'; r.lineWidth = 1.2;
        r.beginPath(); r.arc(cx, cy, R - 0.8, Math.PI * 0.1, Math.PI * 0.75); r.stroke();
      }

      // Crème vanillée avec grains de vanille
      function paintCustard() {
        const r = S / 2;
        cg.clearRect(0, 0, S, S);
        const gr = cg.createRadialGradient(r * 0.8, r * 0.7, r * 0.1, r, r, r);
        gr.addColorStop(0, '#fff7d4'); gr.addColorStop(0.7, '#fbe7a6'); gr.addColorStop(1, '#f1d084');
        cg.fillStyle = gr; cg.fillRect(0, 0, S, S);
        for (let i = 0; i < S * 0.7; i++) {
          cg.fillStyle = `rgba(60,35,18,${rand(0.15, 0.45)})`;
          const sz = rand(0.5, 1.4) * K;
          cg.fillRect(rand(0, S), rand(0, S), sz, sz * rand(0.5, 1));
        }
        // Brillance satinée
        const sh = cg.createRadialGradient(r * 0.65, r * 0.55, 0, r * 0.65, r * 0.55, r * 0.7);
        sh.addColorStop(0, 'rgba(255,255,255,0.25)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
        cg.fillStyle = sh; cg.fillRect(0, 0, S, S);
        cfg.clearRect(0, 0, S, S); cfg.drawImage(custard, 0, 0);
      }

      // Caramel vitreux : ambre marbré, taches de chalumeau, bulles figées, reflets « réfractés »
      function paintCrustFull() {
        const r = S / 2, c = fg;
        c.clearRect(0, 0, S, S);
        c.save();
        c.beginPath(); c.arc(r, r, r, 0, Math.PI * 2); c.clip();
        let gr = c.createRadialGradient(r * 0.75, r * 0.65, 0, r, r, r);
        gr.addColorStop(0, '#f0b45e'); gr.addColorStop(0.55, '#de9038'); gr.addColorStop(0.9, '#bb6a1f'); gr.addColorStop(1, '#9c5216');
        c.fillStyle = gr; c.fillRect(0, 0, S, S);
        for (let i = 0; i < 30; i++) {
          const x = rand(0, S), y = rand(0, S), rr = rand(S * 0.05, S * 0.16);
          const sp = c.createRadialGradient(x, y, 0, x, y, rr);
          sp.addColorStop(0, `rgba(110,42,8,${rand(0.12, 0.32)})`);
          sp.addColorStop(1, 'rgba(110,42,8,0)');
          c.fillStyle = sp; c.fillRect(x - rr, y - rr, rr * 2, rr * 2);
        }
        for (let i = 0; i < 10; i++) {
          const x = rand(0, S), y = rand(0, S), rr = rand(S * 0.05, S * 0.12);
          const sp = c.createRadialGradient(x, y, 0, x, y, rr);
          sp.addColorStop(0, 'rgba(255,205,120,0.25)'); sp.addColorStop(1, 'rgba(255,205,120,0)');
          c.fillStyle = sp; c.fillRect(x - rr, y - rr, rr * 2, rr * 2);
        }
        // Bulles de sucre figées dans le verre
        for (let i = 0; i < 90; i++) {
          const x = rand(0, S), y = rand(0, S), br = rand(0.6, 2.4) * K;
          c.fillStyle = 'rgba(120,50,10,0.25)';
          c.beginPath(); c.arc(x, y, br, 0, Math.PI * 2); c.fill();
          c.strokeStyle = 'rgba(255,230,170,0.5)'; c.lineWidth = 0.5 * K;
          c.beginPath(); c.arc(x - br * 0.2, y - br * 0.2, br * 0.8, Math.PI * 1, Math.PI * 1.6); c.stroke();
        }
        // Grains de sucre
        for (let i = 0; i < 160; i++) {
          c.fillStyle = `rgba(255,232,175,${rand(0.12, 0.35)})`;
          c.fillRect(rand(0, S), rand(0, S), rand(0.4, 1.2) * K, rand(0.4, 1.2) * K);
        }
        // Bord plus épais, plus sombre ; liseré clair (réfraction sur l'arête)
        gr = c.createRadialGradient(r, r, r * 0.86, r, r, r);
        gr.addColorStop(0, 'rgba(90,35,5,0)'); gr.addColorStop(1, 'rgba(90,35,5,0.35)');
        c.fillStyle = gr; c.fillRect(0, 0, S, S);
        c.strokeStyle = 'rgba(255,215,150,0.35)'; c.lineWidth = 1.5 * K;
        c.beginPath(); c.arc(r, r, r * 0.965, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
        // Grand reflet doux (fenêtre) + reflet net incurvé + petites caustiques
        c.save();
        c.translate(r * 0.62, r * 0.5); c.rotate(-0.55);
        gr = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.42);
        gr.addColorStop(0, 'rgba(255,255,255,0.32)'); gr.addColorStop(0.6, 'rgba(255,255,255,0.08)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        c.scale(1, 0.45);
        c.fillStyle = gr; c.beginPath(); c.arc(0, 0, r * 0.42, 0, Math.PI * 2); c.fill();
        c.restore();
        c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineCap = 'round';
        c.lineWidth = 2.2 * K;
        c.beginPath(); c.arc(r, r, r * 0.8, Math.PI * 1.13, Math.PI * 1.3); c.stroke();
        c.lineWidth = 1 * K; c.strokeStyle = 'rgba(255,255,255,0.55)';
        c.beginPath(); c.arc(r, r, r * 0.74, Math.PI * 1.15, Math.PI * 1.22); c.stroke();
        c.strokeStyle = 'rgba(255,240,200,0.25)'; c.lineWidth = 3 * K;
        c.beginPath(); c.arc(r, r, r * 0.86, Math.PI * 0.2, Math.PI * 0.38); c.stroke();
        for (let i = 0; i < 26; i++) {
          const a = rand(Math.PI * 1.0, Math.PI * 1.55), d = rand(0.35, 0.9) * r;
          const x = r + Math.cos(a) * d, y = r + Math.sin(a) * d;
          c.fillStyle = `rgba(255,255,240,${rand(0.3, 0.8)})`;
          c.beginPath(); c.arc(x, y, rand(0.4, 1.3) * K, 0, Math.PI * 2); c.fill();
        }
        c.restore();
      }

      const toLocal = (x, y) => ({ x: (x - cx + R) * K, y: (y - cy + R) * K });
      const cellOf = (lx, ly) => {
        const i = Math.floor(lx / S * GRID), j = Math.floor(ly / S * GRID);
        return i < 0 || j < 0 || i >= GRID || j >= GRID ? -1 : j * GRID + i;
      };
      const isBroken = (x, y) => { const p = toLocal(x, y), c = cellOf(p.x, p.y); return c >= 0 && cells[c] === 1; };

      /* ---------- Fissures qui courent ---------- */
      function addGrower(x, y, ang, len, depth) {
        if (growers.length > 60) return;
        growers.push({ x, y, ang, left: len, depth, w: (1.6 - depth * 0.35) });
      }
      function growCracks(dt) {
        if (!growers.length) return;
        const r = S / 2, step = 4 * K;
        let budget = Math.ceil(dt * 520 * K / step) + 1;
        kg.save();
        kg.globalCompositeOperation = 'source-atop';
        kg.lineJoin = 'round'; kg.lineCap = 'round';
        let drawn = 0;
        for (let gi = growers.length - 1; gi >= 0; gi--) {
          const gw = growers[gi];
          for (let b = 0; b < budget && gw.left > 0; b++) {
            gw.ang += rand(-0.45, 0.45);
            const nx = gw.x + Math.cos(gw.ang) * step, ny = gw.y + Math.sin(gw.ang) * step;
            kg.strokeStyle = 'rgba(55,18,3,0.85)'; kg.lineWidth = gw.w * K;
            kg.beginPath(); kg.moveTo(gw.x, gw.y); kg.lineTo(nx, ny); kg.stroke();
            kg.strokeStyle = 'rgba(255,228,165,0.7)'; kg.lineWidth = 0.7 * K;
            kg.beginPath(); kg.moveTo(gw.x + K * 0.9, gw.y + K * 0.9); kg.lineTo(nx + K * 0.9, ny + K * 0.9); kg.stroke();
            if (Math.random() < 0.08) { kg.fillStyle = 'rgba(255,255,240,0.8)'; kg.fillRect(nx - K * 0.5, ny - K * 0.5, K, K); }
            gw.x = nx; gw.y = ny; gw.left -= step; drawn++;
            if (dist(nx, ny, r, r) > r * 0.985) gw.left = 0;
            if (gw.depth < 3 && Math.random() < 0.07) addGrower(nx, ny, gw.ang + rand(-1.3, 1.3), gw.left * rand(0.35, 0.6), gw.depth + 1);
          }
          if (gw.left <= 0) growers.splice(gi, 1);
        }
        kg.restore();
        const now = performance.now();
        if (drawn > 0 && now - lastCrackle > 45) {
          lastCrackle = now;
          SG.audio.crunch(clamp(0.06 + drawn * 0.012, 0.06, 0.22), rand(1.7, 2.2));
        }
      }

      /* ---------- Casse : trou irrégulier + éclats qui basculent et coulent ---------- */
      function breakAt(lx, ly, rad) {
        const n = 9, poly = [];
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + rand(-0.2, 0.2);
          const rr = rad * rand(0.65, 1.15);
          poly.push([lx + Math.cos(a) * rr, ly + Math.sin(a) * rr]);
        }
        const c0 = [lx + rand(-rad, rad) * 0.2, ly + rand(-rad, rad) * 0.2];
        for (let i = 0; i < n; i++) {
          const a = poly[i], b = poly[(i + 1) % n];
          // chaque secteur en deux éclats (pointe + bord)
          const m = rand(0.4, 0.6);
          const pa = [c0[0] + (a[0] - c0[0]) * m, c0[1] + (a[1] - c0[1]) * m], pb = [c0[0] + (b[0] - c0[0]) * m, c0[1] + (b[1] - c0[1]) * m];
          addShard([c0, pa, pb], lx, ly);
          addShard([pa, a, b, pb], lx, ly);
        }
        if (shards.length > 140) shards.splice(0, shards.length - 140).forEach(bakeShard);
        kg.save();
        kg.globalCompositeOperation = 'destination-out';
        kg.beginPath(); poly.forEach((p, i) => (i ? kg.lineTo(p[0], p[1]) : kg.moveTo(p[0], p[1]))); kg.closePath(); kg.fill();
        kg.restore();
        // Épaisseur du caramel au bord du trou : tranche sombre + liseré lumineux
        kg.save();
        kg.globalCompositeOperation = 'source-atop';
        kg.lineJoin = 'round';
        kg.strokeStyle = 'rgba(100,40,6,0.75)'; kg.lineWidth = 4 * K;
        kg.beginPath(); poly.forEach((p, i) => (i ? kg.lineTo(p[0], p[1]) : kg.moveTo(p[0], p[1]))); kg.closePath(); kg.stroke();
        kg.strokeStyle = 'rgba(255,225,160,0.7)'; kg.lineWidth = 1 * K;
        kg.beginPath(); poly.forEach((p, i) => { const x = p[0] + (p[0] - lx) * 0.06, y = p[1] + (p[1] - ly) * 0.06; if (i) kg.lineTo(x, y); else kg.moveTo(x, y); }); kg.closePath(); kg.stroke();
        kg.restore();
        markCells(lx, ly, rad);
      }
      function addShard(pts, hx, hy) {
        let mx = 0, my = 0;
        pts.forEach((p) => { mx += p[0]; my += p[1]; });
        mx /= pts.length; my /= pts.length;
        shards.push({
          pts: pts.map((p) => [p[0] - mx, p[1] - my]), ox: mx, oy: my, x: mx, y: my,
          rot: 0, vr: rand(-0.4, 0.4), axis: rand(0, Math.PI), tilt: 0, tiltT: rand(0.35, 1.05) * (Math.random() < 0.5 ? -1 : 1),
          sink: 0, sinkT: rand(0.2, 0.55), sinkV: rand(0.15, 0.4), melt: 0,
          dx: (hx - mx) * rand(0.05, 0.15), dy: (hy - my) * rand(0.05, 0.15), bubbled: false,
        });
      }

      function markCells(lx, ly, rad) {
        for (let j = 0; j < GRID; j++) for (let i = 0; i < GRID; i++) {
          const x = (i + 0.5) / GRID * S, y = (j + 0.5) / GRID * S;
          if (dist(x, y, S / 2, S / 2) > S / 2) continue;
          if (dist(x, y, lx, ly) < rad * 0.9) cells[j * GRID + i] = 1;
        }
        updateProgress();
      }

      function updateProgress() {
        let tot = 0, br = 0;
        for (let j = 0; j < GRID; j++) for (let i = 0; i < GRID; i++) {
          const x = (i + 0.5) / GRID * S, y = (j + 0.5) / GRID * S;
          if (dist(x, y, S / 2, S / 2) > S / 2 * 0.92) continue;
          tot++; if (cells[j * GRID + i]) br++;
        }
        broken = tot ? br / tot : 0;
        prog.set(broken / 0.85);
        if (!celebrated && broken >= 0.85) {
          celebrated = true;
          SG.celebrate(stage, 'Croustillant !');
          timers.push(setTimeout(() => SG.hint(stage, 'Creuse la crème 🥄 ou passe le chalumeau 🔥'), 2200));
        }
      }

      function tap(x, y) {
        if (dist(x, y, cx, cy) > R * 0.98) return;
        const p = toLocal(x, y);
        spoon.hit = 1;
        if (isBroken(x, y)) { startScoop(x, y); return; }
        let h = hits.find((q) => dist(q.x, q.y, p.x, p.y) < R * 0.22 * K);
        if (!h) { h = { x: p.x, y: p.y, n: 0 }; hits.push(h); }
        h.n++;
        const nCr = SG.util.randInt(3, 5) + (h.n > 1 ? 2 : 0);
        for (let i = 0; i < nCr; i++) addGrower(p.x, p.y, rand(0, Math.PI * 2), R * K * rand(0.25, 0.55) * (0.7 + h.n * 0.35), 0);
        for (let i = 0; i < 9; i++) crumbs.push({ x, y, vx: rand(-70, 70), vy: rand(-150, -40), life: 1, s: rand(1.5, 3.5), c: pick(['#f2b45c', '#e9a14a', '#ffd690', '#c97a2a']) });
        SG.audio.tap('glass', 0.22, rand(0.6, 0.75));
        if (h.n >= 2) {
          breakAt(p.x, p.y, R * K * rand(0.17, 0.25));
          SG.audio.crack(0.85, 1.05);
          SG.audio.crunch(0.95, 1.25);
          SG.audio.thud(0.18, 1.5);
          timers.push(setTimeout(() => { SG.audio.crunch(0.45, 1.6); SG.audio.sand(0.12, 0.2); }, 55));
          SG.haptic([12, 20, 8]);
          if (h.n >= 3) h.n = 1;
        } else {
          SG.audio.crack(0.4, 1.35);
          SG.audio.crunch(0.5, 1.5);
          SG.haptic(8);
        }
      }

      /* ---------- Cuillère dans la crème : creux brillants ---------- */
      function startScoop(x, y) {
        scooping = true; lastScoop = { x, y }; scoopDist = 0;
        SG.audio.squish(0.85, 0.45);
        if (!smearLoop && SG.audio.ctx()) smearLoop = SG.audio.loop('smear');
        scoopStamp(x, y, 0, 1);
        SG.haptic(6);
      }
      // Révèle une source (croûte intacte, crème fraîche) avec une brosse douce
      function reveal(dst, src, px, py, rad, a) {
        const bs = Math.ceil(rad * 2);
        if (brush.width !== bs) { brush.width = bs; brush.height = bs; }
        bg.globalCompositeOperation = 'source-over';
        bg.clearRect(0, 0, bs, bs);
        const gr = bg.createRadialGradient(bs / 2, bs / 2, 0, bs / 2, bs / 2, bs / 2);
        gr.addColorStop(0, `rgba(0,0,0,${clamp(a, 0, 1)})`); gr.addColorStop(0.6, `rgba(0,0,0,${clamp(a, 0, 1) * 0.8})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
        bg.fillStyle = gr; bg.fillRect(0, 0, bs, bs);
        bg.globalCompositeOperation = 'source-in';
        bg.drawImage(src, px - bs / 2, py - bs / 2, bs, bs, 0, 0, bs, bs);
        dst.drawImage(brush, px - bs / 2, py - bs / 2);
      }
      function scoopStamp(x, y, ang, k0) {
        const p = toLocal(x, y), rr = R * K * 0.085;
        reveal(cg, custardFull, p.x, p.y, rr * 1.15, 0.75);
        const c = cg;
        c.save();
        c.translate(p.x, p.y); c.rotate(ang);
        // creux plus profond : ombre côté lumière (haut-gauche), crème plus dense
        let gr = c.createRadialGradient(-rr * 0.25, -rr * 0.3, rr * 0.2, 0, 0, rr * 1.2);
        gr.addColorStop(0, 'rgba(225,170,70,0.10)'); gr.addColorStop(0.75, 'rgba(200,140,50,0.16)'); gr.addColorStop(1, 'rgba(200,140,50,0)');
        c.fillStyle = gr;
        c.beginPath(); c.ellipse(0, 0, rr * 1.25, rr, 0, 0, Math.PI * 2); c.fill();
        c.restore();
        // paroi éclairée en bas-droite, ombre en haut-gauche
        c.save();
        c.globalAlpha = 0.5 * k0;
        c.strokeStyle = 'rgba(150,95,30,0.45)'; c.lineWidth = rr * 0.22;
        c.beginPath(); c.arc(p.x, p.y, rr * 0.92, Math.PI * 0.95, Math.PI * 1.65); c.stroke();
        c.strokeStyle = 'rgba(255,250,225,0.8)'; c.lineWidth = rr * 0.16;
        c.beginPath(); c.arc(p.x, p.y, rr * 0.85, Math.PI * 0.05, Math.PI * 0.6); c.stroke();
        c.restore();
        // reflet humide
        c.fillStyle = 'rgba(255,255,255,0.35)';
        c.beginPath(); c.ellipse(p.x + rr * 0.35, p.y + rr * 0.3, rr * 0.28, rr * 0.12, -0.6, 0, Math.PI * 2); c.fill();
        // la cuillère emporte les éclats coulés là
        for (let i = shards.length - 1; i >= 0; i--) {
          const s = shards[i];
          if (dist(s.x, s.y, p.x, p.y) < rr * 1.3) { shards.splice(i, 1); spoonBits.push(1); }
        }
        spoon.load = Math.min(1, spoon.load + 0.08);
      }

      /* ---------- Chalumeau : refond la croûte petit à petit ---------- */
      function torchAt(x, y, dt) {
        if (dist(x, y, cx, cy) > R * 1.08) return false;
        const p = toLocal(x, y);
        const rr = R * K * 0.22;
        // brosse douce = croûte intacte révélée progressivement
        const bs = Math.ceil(rr * 2);
        if (brush.width !== bs) { brush.width = bs; brush.height = bs; }
        bg.globalCompositeOperation = 'source-over';
        bg.clearRect(0, 0, bs, bs);
        let gr = bg.createRadialGradient(bs / 2, bs / 2, 0, bs / 2, bs / 2, bs / 2);
        gr.addColorStop(0, `rgba(0,0,0,${clamp(dt * 2.6, 0, 1)})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
        bg.fillStyle = gr; bg.fillRect(0, 0, bs, bs);
        bg.globalCompositeOperation = 'source-in';
        bg.drawImage(crustFull, p.x - bs / 2, p.y - bs / 2, bs, bs, 0, 0, bs, bs);
        kg.drawImage(brush, p.x - bs / 2, p.y - bs / 2);
        // le sucre fonce un peu sous la flamme
        kg.save();
        kg.globalCompositeOperation = 'source-atop';
        gr = kg.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr * 0.7);
        gr.addColorStop(0, `rgba(105,40,5,${clamp(dt * 0.35, 0, 0.05)})`); gr.addColorStop(1, 'rgba(105,40,5,0)');
        kg.fillStyle = gr; kg.fillRect(p.x - rr, p.y - rr, rr * 2, rr * 2);
        kg.restore();
        // éclats qui fondent
        for (const s of shards) if (dist(s.x, s.y, p.x, p.y) < rr) s.melt = Math.min(1, s.melt + dt * 1.2);
        // Réparer la grille
        let changed = false;
        for (let j = 0; j < GRID; j++) for (let i = 0; i < GRID; i++) {
          const c2x = (i + 0.5) / GRID * S, c2y = (j + 0.5) / GRID * S;
          if (cells[j * GRID + i] && dist(c2x, c2y, p.x, p.y) < rr * 0.55 && Math.random() < dt * 3) { cells[j * GRID + i] = 0; changed = true; }
        }
        if (changed) {
          hits = hits.filter((q) => dist(q.x, q.y, p.x, p.y) > rr);
          updateProgress();
          if (broken < 0.1) celebrated = false;
        }
        // bulles de sucre qui frémissent
        if (Math.random() < dt * 22 && bubbles.length < 40) {
          const a = rand(0, Math.PI * 2), d = rand(0, R * 0.16);
          bubbles.push({ x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, r: 0, max: rand(1.2, 3.6), life: 0, dur: rand(0.25, 0.6) });
        }
        return true;
      }

      const ptr = SG.pointer(cv.canvas, {
        hover(p) { spoon.x = p.x; spoon.y = p.y; },
        down(p) {
          pressed = true;
          spoon.x = p.x; spoon.y = p.y;
          if (mode === 'spoon') tap(p.x, p.y);
          else {
            torchOn = true; heatT = 0;
            if (!torchLoop && SG.audio.ctx()) torchLoop = SG.audio.loop('flame');
            SG.audio.tap('metal', 0.18, 1.6);
            SG.audio.whoosh(0.35, 0.3, true);
            SG.haptic(10);
          }
        },
        move(p) {
          const dx = p.x - spoon.x, dy = p.y - spoon.y;
          spoon.x = p.x; spoon.y = p.y;
          if (mode === 'spoon' && pressed && scooping) {
            if (dist(p.x, p.y, cx, cy) > R * 0.96 || !isBroken(p.x, p.y)) return;
            const d = Math.hypot(p.x - lastScoop.x, p.y - lastScoop.y);
            if (d > R * 0.03) {
              scoopStamp(p.x, p.y, Math.atan2(dy, dx), 1);
              lastScoop = { x: p.x, y: p.y };
              scoopDist += d;
              smearLv = Math.max(smearLv, clamp(p.speed * 0.9, 0.15, 0.9));
              if (scoopDist > R * 0.5) { scoopDist = 0; SG.audio.squish(rand(0.8, 1.1), 0.25); }
            }
          }
        },
        up() {
          pressed = false;
          if (scooping) {
            scooping = false;
            SG.audio.squish(1.3, 0.3);
            SG.audio.bubble(1.2, 0.12, 0.05);
            spoon.loadA = 1;
          }
          if (torchOn) {
            torchOn = false;
            SG.audio.whoosh(0.15, 0.25);
          }
        },
      });

      SG.toolbar(stage, [
        { icon: '🥄', label: 'Cuillère', group: 'm', active: true, onClick: () => { mode = 'spoon'; } },
        { icon: '🔥', label: 'Chalumeau', group: 'm', onClick: () => { mode = 'torch'; } },
        { icon: '✨', label: 'Nouvelle', onClick: () => { reset(); SG.audio.chime(4, 0.25); } },
      ]);

      function reset() {
        cells = new Uint8Array(GRID * GRID); hits = []; shards = []; growers = []; bubbles = []; celebrated = false;
        paintCustard();
        kg.clearRect(0, 0, S, S); kg.drawImage(crustFull, 0, 0);
        spoon.load = 0; spoon.loadA = 0;
        updateProgress();
      }

      cv.onResize(layout);
      layout();

      function drawShard(g, s, pat) {
        const x = cx - R + s.x / K, y = cy - R + s.y / K;
        const ct = Math.cos(s.tilt);
        const alpha = clamp((1 - s.melt) * 1.2, 0, 1);
        if (alpha <= 0) return;
        g.save();
        g.globalAlpha = alpha;
        g.translate(x, y); g.rotate(s.axis); g.scale(1, Math.max(0.15, Math.abs(ct))); g.rotate(-s.axis + s.rot);
        const shrink = 1 - s.sink * 0.12;
        g.scale(shrink, shrink);
        const path = new Path2D();
        s.pts.forEach((p, i) => (i ? path.lineTo(p[0] / K, p[1] / K) : path.moveTo(p[0] / K, p[1] / K)));
        path.closePath();
        // épaisseur du verre (tranche sombre décalée)
        g.save(); g.translate(0.8, 1.6); g.fillStyle = 'rgba(95,38,6,0.85)'; g.fill(path); g.restore();
        // texture du caramel d'origine
        try {
          pat.setTransform(new DOMMatrix([1 / K, 0, 0, 1 / K, -s.ox / K, -s.oy / K]));
          g.fillStyle = pat;
        } catch (e) { g.fillStyle = '#d98a32'; }
        g.fill(path);
        // inclinaison : face qui prend la lumière ou non
        const lit = Math.sin(s.tilt) * Math.cos(s.axis - 0.8);
        g.fillStyle = lit > 0 ? `rgba(255,215,140,${Math.min(0.3, lit * 0.4)})` : `rgba(60,20,0,${Math.min(0.4, -lit * 0.5)})`;
        g.fill(path);
        // partie immergée : la crème recouvre l'éclat
        if (s.sink > 0.02) { g.fillStyle = `rgba(246,214,130,${s.sink * 0.5})`; g.fill(path); }
        g.strokeStyle = `rgba(255,236,190,${0.75 - s.sink * 0.6})`; g.lineWidth = 0.8; g.stroke(path);
        g.restore();
        // ménisque de crème autour
        if (s.sink > 0.15) {
          g.strokeStyle = `rgba(255,248,215,${0.25 * s.sink * alpha})`; g.lineWidth = 1.2;
          g.beginPath(); g.ellipse(x, y, R * 0.04 + 2, R * 0.03 + 1.5, s.axis, 0, Math.PI * 2); g.stroke();
        }
      }

      // Un éclat immobile est « cuit » dans la crème : il ne coûte plus rien à dessiner
      function bakeShard(s) {
        if (!bakePat) bakePat = cg.createPattern(crustFull, 'no-repeat');
        cg.save();
        cg.setTransform(K, 0, 0, K, -(cx - R) * K, -(cy - R) * K);
        drawShard(cg, s, bakePat);
        cg.restore();
      }
      const loop = SG.loop((dt, t) => {
        const w = cv.w, h = cv.h;
        g.clearRect(0, 0, w, h);
        g.drawImage(bgCv, 0, 0, w, h);
        growCracks(dt);
        // Crème + éclats + croûte
        g.save();
        g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip();
        g.drawImage(custard, cx - R, cy - R, R * 2, R * 2);
        for (let i = shards.length - 1; i >= 0; i--) {
          const s = shards[i];
          s.tilt += (s.tiltT - s.tilt) * (1 - Math.exp(-dt * 3));
          if (s.sink < s.sinkT) s.sink = Math.min(s.sinkT, s.sink + s.sinkV * dt * (1 - s.sink));
          s.rot += s.vr * dt * (1 - s.sink); s.vr *= Math.exp(-dt * 1.5);
          const k2 = Math.exp(-dt * 2);
          s.x += s.dx * dt; s.y += s.dy * dt; s.dx *= k2; s.dy *= k2;
          if (!s.bubbled && s.sink > s.sinkT * 0.6) { s.bubbled = true; if (Math.random() < 0.25) SG.audio.bubble(rand(0.9, 1.4), 0.05); }
          if (s.melt >= 1) { shards.splice(i, 1); continue; }
          if (s.melt === 0 && Math.abs(s.tilt - s.tiltT) < 0.01 && s.sink >= s.sinkT - 0.003 && Math.abs(s.vr) < 0.02 && Math.abs(s.dx) + Math.abs(s.dy) < 0.5) { bakeShard(s); shards.splice(i, 1); continue; }
          if (!shardPat) shardPat = g.createPattern(crustFull, 'no-repeat');
          drawShard(g, s, shardPat);
        }
        g.drawImage(crust, cx - R, cy - R, R * 2, R * 2);
        g.restore();
        g.drawImage(rimCv, 0, 0, w, h);
        // Miettes de caramel
        crumbs.forEach((c) => {
          c.vy += 520 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.life -= dt * 1.6;
          g.globalAlpha = clamp(c.life, 0, 1);
          g.fillStyle = c.c;
          g.beginPath(); g.moveTo(c.x, c.y - c.s * 0.6); g.lineTo(c.x + c.s * 0.6, c.y + c.s * 0.4); g.lineTo(c.x - c.s * 0.5, c.y + c.s * 0.5); g.closePath(); g.fill();
        });
        g.globalAlpha = 1;
        crumbs = crumbs.filter((c) => c.life > 0);

        smearLv *= Math.exp(-dt * 8);
        if (smearLoop) smearLoop.set(scooping ? smearLv : 0, 0.3);

        // Outil
        spoon.hit = Math.max(0, spoon.hit - dt * 6);
        if (spoon.loadA > 0 && !scooping) {
          spoon.loadA -= dt * 1.2;
          if (spoon.loadA <= 0) { spoon.load = 0; spoonBits = []; }
        }
        if (mode === 'spoon') {
          if (torchLoop) torchLoop.set(0, 0.5);
          drawSpoon(spoon.x, spoon.y, spoon.hit);
        } else {
          const fx = spoon.x, fy = spoon.y + 34; // pointe de flamme
          if (torchOn) {
            heatT += dt;
            const on = torchAt(fx, fy, dt);
            if (torchLoop) torchLoop.set(0.75 + Math.sin(t * 23) * 0.06, on ? 0.65 : 0.45);
            const now = performance.now();
            if (on && now - lastBub > 70 && Math.random() < 0.6) { lastBub = now; SG.audio.bubble(rand(1.6, 2.6), 0.05); if (Math.random() < 0.3) SG.audio.crunch(0.06, 2.2); }
            for (let i = 0; i < 3; i++) flames.push({ x: spoon.x + rand(-2, 2), y: spoon.y + 4, vx: rand(-14, 14), vy: rand(150, 230), life: 1 });
          } else if (torchLoop) torchLoop.set(0, 0.5);
          // bulles de sucre
          for (let i = bubbles.length - 1; i >= 0; i--) {
            const b = bubbles[i];
            b.life += dt; b.r = b.max * Math.sin(Math.min(1, b.life / b.dur) * Math.PI * 0.5);
            if (b.life > b.dur) bubbles.splice(i, 1);
          }
          for (const b of bubbles) {
            g.strokeStyle = 'rgba(255,225,160,0.8)'; g.lineWidth = 0.7;
            g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.stroke();
            g.fillStyle = 'rgba(255,255,240,0.7)'; g.fillRect(b.x - b.r * 0.4, b.y - b.r * 0.5, 0.9, 0.9);
          }
          flames.forEach((f) => { f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt * 4.2; });
          flames = flames.filter((f) => f.life > 0);
          // lueur chaude sur le caramel
          if (torchOn && dist(fx, fy, cx, cy) < R * 1.1) {
            g.save();
            g.globalCompositeOperation = 'lighter';
            const gl = g.createRadialGradient(fx, fy, 0, fx, fy, R * 0.32);
            gl.addColorStop(0, `rgba(255,150,50,${0.35 + Math.sin(t * 31) * 0.05})`); gl.addColorStop(1, 'rgba(255,120,30,0)');
            g.fillStyle = gl; g.fillRect(fx - R * 0.4, fy - R * 0.4, R * 0.8, R * 0.8);
            g.restore();
          }
          drawFlame(spoon.x, spoon.y + 4, t);
          drawTorch(spoon.x, spoon.y);
        }
      });

      function drawFlame(x, y, t) {
        if (!torchOn && !flames.length) return;
        g.save();
        g.globalCompositeOperation = 'lighter';
        flames.forEach((f) => {
          const r = 5 * f.life + 2;
          g.fillStyle = f.life > 0.45 ? `rgba(110,150,255,${f.life * 0.35})` : `rgba(255,150,70,${f.life * 0.5})`;
          g.beginPath(); g.arc(f.x, f.y, r, 0, Math.PI * 2); g.fill();
        });
        if (torchOn) {
          const L = 30 + Math.sin(t * 40) * 2 + Math.sin(t * 17) * 2;
          // flamme externe (bleu-violet)
          let gr = g.createLinearGradient(x, y, x, y + L);
          gr.addColorStop(0, 'rgba(120,160,255,0.9)'); gr.addColorStop(0.7, 'rgba(90,110,255,0.45)'); gr.addColorStop(1, 'rgba(255,140,80,0)');
          g.fillStyle = gr;
          g.beginPath(); g.moveTo(x - 6, y); g.quadraticCurveTo(x - 7, y + L * 0.5, x, y + L); g.quadraticCurveTo(x + 7, y + L * 0.5, x + 6, y); g.closePath(); g.fill();
          // cône intérieur (bleu clair, presque blanc)
          gr = g.createLinearGradient(x, y, x, y + L * 0.5);
          gr.addColorStop(0, 'rgba(235,245,255,0.95)'); gr.addColorStop(1, 'rgba(150,200,255,0)');
          g.fillStyle = gr;
          g.beginPath(); g.moveTo(x - 3, y); g.quadraticCurveTo(x - 3, y + L * 0.3, x, y + L * 0.5); g.quadraticCurveTo(x + 3, y + L * 0.3, x + 3, y); g.closePath(); g.fill();
        }
        g.restore();
      }

      function drawSpoon(x, y, hit) {
        if (x < 0) return;
        g.save();
        g.translate(x, y - hit * 10);
        g.rotate(-0.6 + hit * 0.25);
        g.save();
        g.shadowColor = 'rgba(0,0,0,0.22)'; g.shadowBlur = 10; g.shadowOffsetY = 6 + hit * 8;
        // manche
        let mg = g.createLinearGradient(-4, 0, 4, 0);
        mg.addColorStop(0, '#c9ced8'); mg.addColorStop(0.5, '#ffffff'); mg.addColorStop(1, '#9ea5b4');
        g.fillStyle = mg;
        g.beginPath();
        g.moveTo(-2.5, 14); g.lineTo(-4.2, 80); g.quadraticCurveTo(0, 86, 4.2, 80); g.lineTo(2.5, 14); g.closePath(); g.fill();
        // cuilleron
        mg = g.createRadialGradient(-4, -5, 1, 0, 0, 19);
        mg.addColorStop(0, '#ffffff'); mg.addColorStop(0.5, '#e4e8ef'); mg.addColorStop(1, '#a9b0bd');
        g.fillStyle = mg;
        g.beginPath(); g.ellipse(0, 0, 13, 18, 0, 0, Math.PI * 2); g.fill();
        g.restore();
        g.strokeStyle = 'rgba(120,128,145,0.5)'; g.lineWidth = 0.8;
        g.beginPath(); g.ellipse(0, 0, 13, 18, 0, 0, Math.PI * 2); g.stroke();
        // crème dans la cuillère
        if (spoon.load > 0.02) {
          const a = scooping ? 1 : clamp(spoon.loadA, 0, 1);
          g.globalAlpha = a;
          const lr = 6 + spoon.load * 5;
          const cgd = g.createRadialGradient(-3, -4, 1, 0, 0, lr * 1.3);
          cgd.addColorStop(0, '#fffbe6'); cgd.addColorStop(1, '#f3d48a');
          g.fillStyle = cgd;
          g.beginPath(); g.ellipse(0, 1, lr, lr * 1.25, 0, 0, Math.PI * 2); g.fill();
          for (let i = 0; i < Math.min(4, spoonBits.length); i++) {
            g.fillStyle = '#d98a32';
            g.beginPath(); g.moveTo(-4 + i * 3, -2 + (i % 2) * 4); g.lineTo(-1 + i * 3, -4 + (i % 2) * 4); g.lineTo(-2 + i * 3, 1 + (i % 2) * 4); g.closePath(); g.fill();
          }
          g.fillStyle = 'rgba(255,255,255,0.7)';
          g.beginPath(); g.ellipse(-2.5, -3.5, lr * 0.35, lr * 0.2, -0.5, 0, Math.PI * 2); g.fill();
          g.globalAlpha = 1;
        } else {
          g.fillStyle = 'rgba(255,255,255,0.8)';
          g.beginPath(); g.ellipse(-4, -6, 3.5, 6, -0.3, 0, Math.PI * 2); g.fill();
        }
        g.restore();
      }

      function drawTorch(x, y) {
        g.save();
        g.translate(x, y);
        g.save();
        g.shadowColor = 'rgba(0,0,0,0.22)'; g.shadowBlur = 12; g.shadowOffsetY = 8;
        // cartouche
        let gr = g.createLinearGradient(-13, 0, 13, 0);
        gr.addColorStop(0, '#ff8fae'); gr.addColorStop(0.35, '#ffc2d2'); gr.addColorStop(1, '#e5728f');
        g.fillStyle = gr;
        g.beginPath(); g.roundRect ? g.roundRect(-13, -84, 26, 56, 9) : g.rect(-13, -84, 26, 56); g.fill();
        g.restore();
        // gâchette et molette
        g.fillStyle = '#fff1f5'; g.fillRect(-13, -50, 26, 3);
        g.fillStyle = '#ffd6e0';
        g.beginPath(); g.roundRect ? g.roundRect(12, -60, 9, 14, 3) : g.rect(12, -60, 9, 14); g.fill();
        // buse métallique
        gr = g.createLinearGradient(-6, 0, 6, 0);
        gr.addColorStop(0, '#9aa2b1'); gr.addColorStop(0.45, '#f4f6fa'); gr.addColorStop(1, '#7d8595');
        g.fillStyle = gr;
        g.beginPath(); g.moveTo(-7, -28); g.lineTo(7, -28); g.lineTo(4.5, 4); g.lineTo(-4.5, 4); g.closePath(); g.fill();
        g.fillStyle = 'rgba(40,40,50,0.6)'; g.fillRect(-3.5, 2, 7, 2.5);
        g.fillStyle = 'rgba(255,255,255,0.6)'; g.fillRect(-9, -80, 3, 44);
        g.restore();
      }

      return {
        destroy() {
          loop.stop(); ptr.destroy();
          timers.forEach(clearTimeout);
          if (torchLoop) torchLoop.stop();
          if (smearLoop) smearLoop.stop();
          cv.destroy();
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/zen.js */
/* Jardin zen — sable fin modelé (carte de hauteurs éclairée par une lumière rasante),
   râteaux de plusieurs largeurs, galets et décorations que l'on déplace librement. */
(function () {
  'use strict';
  const { rand, clamp, pick, randInt } = SG.util;
  const TAU = Math.PI * 2;

  // Lumière rasante venant du haut-gauche : les ombres des sillons suivent n'importe quelle direction
  const LN = Math.hypot(-0.55, -0.62, 0.56);
  const LX = -0.55 / LN, LY = -0.62 / LN, LZ = 0.56 / LN;
  const BASE = [239, 228, 207], HI = [255, 251, 241], SH = [150, 127, 121];
  const AMP = 0.95;      // demi-profondeur d'un sillon (px)
  const GAP = 9.5;       // écart entre dents du râteau
  const EX = 1.7;        // exagération du relief pour l'éclairage
  const RAKE_W = [3, 5, 8];
  const DECOS = [
    { kind: 'moss', icon: '🌿', label: 'Mousse' },
    { kind: 'plant', icon: '🌾', label: 'Herbes' },
    { kind: 'lantern', icon: '🏮', label: 'Lanterne' },
  ];
  const STONE_COLS = ['#a3a7ab', '#8b8f94', '#b9b1a6', '#9a9389', '#aab6b2', '#7f838b', '#c2bab0'];

  function shadeHex(hex, k) {
    const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    const t = k < 0 ? [40, 34, 38] : [255, 255, 255], m = Math.abs(k);
    return `rgb(${Math.round(c[0] + (t[0] - c[0]) * m)},${Math.round(c[1] + (t[1] - c[1]) * m)},${Math.round(c[2] + (t[2] - c[2]) * m)})`;
  }

  SG.registerGame({
    id: 'zen',
    title: 'Jardin zen',
    emoji: '🪨',
    desc: 'Ratisse le sable fin et pose des galets.',
    color: '#e8dcc6',
    bg: '#efe4d0',
    order: 14,
    create(stage) {
      const cv = SG.makeCanvas(stage);
      const g = cv.ctx;
      const A = SG.audio;

      /* ---------- État ---------- */
      let W = 0, Hh = 0, cs = 2, gw = 0, gh = 0, H = null, NZ = null;
      const shadeCv = document.createElement('canvas');
      const shg = shadeCv.getContext('2d');
      let img = null, px = null, dirty = null;
      const grainCv = document.createElement('canvas');
      let objs = [], leaves = [], puffs = [], glints = [];
      let tool = 'rake', rakeIdx = 1, decoIdx = 0;
      const strokes = new Map();
      let sweep = -1, sweepPrev = 0;
      let sandLoop = null, bodyLoop = null, windLoop = null, lv = 0, lvTone = 0.5;
      let chimeT = rand(8, 14), leafT = rand(15, 25), lastDpr = cv.dpr;

      const ensureAudio = () => {
        if (!A.ctx()) return;
        if (!sandLoop) sandLoop = A.loop('sand');
        if (!bodyLoop) bodyLoop = A.loop('brush');
        if (!windLoop) windLoop = A.loop('brush');

            const wg = c.createRadialGradient(0, -r * 2.62, 0, 0, -r * 2.62, r * 0.5);

            c.strokeStyle = 'rgba(90,70,60,.5)'; c.lineWidth = 1; c.strokeRect(-r * 0.3, -r * 2.92, r * 0.6, r * 0.55);

            c.beginPath();

            c.fillStyle = '#8d8886'; c.beginPath(); c.ellipse(0, -r * 3.8, r * 0.22, r * 0.12, 0, 0, TAU); c.fill();
            c.fillStyle = st(-r * 0.15, r * 0.15); c.beginPath(); c.arc(0, -r * 3.98, r * 0.2, 0, TAU); c.fill();

            for (let k = 0; k < 14; k++) { c.beginPath(); c.arc(rand(-r * 0.9, r * 0.9), -r * 0.3 + rand(-3, 4), rand(0.8, 2), 0, TAU); c.fill(); }

      }
      function mkObj(kind, x, y) {
        const o = { kind, x, y, sx: 1, sy: 1, rot: 0, lift: 1, held: false, vfall: 0, ring: null, seed: rand(0, 10), tall: false };
        if (kind === 'stone') {
          o.fr = rand(16, 32); o.sx = rand(1, 1.3); o.sy = rand(0.78, 0.95); o.rot = rand(-0.5, 0.5);

      function objAt(x, y) {

      function landSound(o, other) {

      /* ---------- Feuilles et pétales ---------- */
      function newLeaf() {

      /* ---------- Entrées ---------- */
      const ptr = SG.pointer(cv.canvas, {
        down(p) {

            if (o.lift < 0.05) { disturb(o); o.ring = null; }
            A.sand(0.18, 0.25); A.tap(o.kind === 'stone' || o.kind === 'lantern' ? 'ceramic' : 'wood', 0.08, 1.4);

          strokes.set(p.id, { last: { x: p.x, y: p.y }, first: true, dist: 0, dir: 0, T: toolDef(), x: p.x, y: p.y });

        move(p) {
          const st = strokes.get(p.id);

          st.dir = Math.atan2(nb.y - st.last.y, nb.x - st.last.x);

      /* ---------- Barre d'outils ---------- */

      /* ---------- Mise en place ---------- */

      }

      /* ---------- Rendu ---------- */
      function drawShadow(o, lift) {
        const off = lift * 22;
        if (o.tall && o.sil) {
          g.save();
          g.globalAlpha = 0.2 * (1 - o.lift * 0.5);
          g.setTransform(cv.dpr, 0, 0, cv.dpr, 0, 0);
          g.translate(o.x + off * 0.7, o.y + off * 0.9);
          g.transform(1, 0, -0.62, -0.42, 0, 0);
          for (const [ox, oy] of [[0, 0], [1.5, 1], [-1, 1.5]]) g.drawImage(o.sil, -o.ax + ox, -o.ay + oy, o.cw, o.ch);

        g.restore();

      const loop = SG.loop((dt, t) => {
        const w = W, h = Hh;
        // Lissage complet animé
        if (sweep >= 0) {
          sweep += dt * 0.85;
          const y1 = Math.min(h + GAP, sweep * h);
          const near = nearObjs(0, sweepPrev - 2, w, y1 + 2, 4);
          const cy0 = Math.max(0, Math.floor(sweepPrev / cs)), cy1 = Math.min(gh - 1, Math.ceil(y1 / cs));
          for (let y = cy0; y <= cy1; y++) {
            const v = rowPattern(y * cs);
            for (let x = 0; x < gw; x++) {
              if (near.length && near.some((o) => footIn(o, x * cs, y * cs, 0.92))) continue;
              H[y * gw + x] = v + NZ[y * gw + x] * 0.03;
            }

          markDirty(0, cy0, gw - 1, cy1);
          leaves.forEach((l) => { if (l.landed && l.y < y1 + 8 && l.y > sweepPrev - 20) l.y = y1 + 8; });
          sweepPrev = y1;
          lv = Math.max(lv, 0.55); lvTone = 0.3;
          if (sweep * h >= h + GAP) {

            objs.forEach((o) => { o.ring = { r: ringsSpec(o).rb - 3 }; });
            A.chime(4, 0.12);
          }

        // Objets : soulever / tomber / ondes
        for (const o of objs) {
          if (o.held) o.lift += (1 - o.lift) * Math.min(1, dt * 14);
          else if (o.lift > 0) {
            o.vfall += dt * 9;
            o.lift -= o.vfall * dt;
            if (o.lift <= 0) land(o);
          }
          if (o.ring) {
            const s = ringsSpec(o), r0 = o.ring.r, r1 = Math.min(s.re + GAP, r0 + dt * 120);
            carveRings(o, r0, r1);
            o.ring.r = r1;
            lv = Math.max(lv, 0.3); lvTone = 0.4;
            if (r1 >= s.re + GAP) o.ring = null;
          }
        }
        shade();

        // Son
        lv *= Math.pow(0.0015, dt);
        if (sandLoop) sandLoop.set(lv, lvTone);
        if (bodyLoop) bodyLoop.set(lv * 0.55, 0.12 + lvTone * 0.2);
        if (windLoop) windLoop.set(0.05 + 0.04 * Math.sin(t * 0.37) + 0.025 * Math.sin(t * 1.13), 0.05);
        if (A.ctx()) {
          chimeT -= dt;
          if (chimeT <= 0) { chimeT = rand(14, 26); const b = randInt(0, 4); for (let k = 0; k < randInt(1, 3); k++) setTimeout(() => A.chime(b + k * 2, 0.045), k * 260); }
        }
        leafT -= dt;
        if (leafT <= 0) { leafT = rand(18, 30); if (leaves.length < 30) leaves.push(newLeaf()); }

        // Sable
        g.imageSmoothingEnabled = true;
        g.drawImage(shadeCv, -cs / 2, -cs / 2, gw * cs, gh * cs);
        g.drawImage(grainCv, 0, 0, w, h);
        // Scintillements
        if (Math.random() < 0.5) glints.push({ x: rand(0, w), y: rand(0, h), life: 1 });
        for (let i = glints.length - 1; i >= 0; i--) {
          const q = glints[i];
          q.life -= dt * 2.2;
          if (q.life <= 0) { glints.splice(i, 1); continue; }
          const a = Math.sin(q.life * Math.PI);
          g.fillStyle = `rgba(255,255,250,${0.85 * a})`;
          g.fillRect(q.x - 1.5 * a, q.y - 0.4, 3 * a, 0.8); g.fillRect(q.x - 0.4, q.y - 1.5 * a, 0.8, 3 * a);
        }
        if (sweep >= 0) {
          const y = Math.min(h, sweep * h);
          g.fillStyle = 'rgba(70,50,40,.18)'; g.fillRect(0, y + 2, w, 10);
          const bg = g.createLinearGradient(0, y - 5, 0, y + 5);
          bg.addColorStop(0, '#d7b98f'); bg.addColorStop(1, '#a5825b');
          g.fillStyle = bg; g.fillRect(0, y - 5, w, 10);
          g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, y - 5, w, 2);
        }
        // Feuilles posées (sous les objets)
        for (const l of leaves) if (l.landed) drawLeaf(l, true);
        // Ombres puis objets, triés par profondeur ; les objets tenus passent au-dessus
        const order = objs.slice().sort((a, b) => (a.held - b.held) || (a.y - b.y));
        for (const o of order) if (!o.held) drawShadow(o, o.lift);
        for (const o of order) {
          if (o.held) drawShadow(o, o.lift);
          const lift = o.lift * 24, sc = 1 + o.lift * 0.05;
          g.save();
          g.translate(o.x, o.y - lift);
          g.scale(sc, sc);
          g.drawImage(o.cv, -o.ax, -o.ay, o.cw, o.ch);
          if (o.kind === 'lantern') { // lueur qui vacille
            const fl = 0.5 + 0.2 * Math.sin(t * 7 + o.seed) + 0.1 * Math.sin(t * 13);
            const gl = g.createRadialGradient(0, -o.fr * 2.62, 0, 0, -o.fr * 2.62, o.fr * 1.3);
            gl.addColorStop(0, `rgba(255,214,140,${0.35 * fl})`); gl.addColorStop(1, 'rgba(255,214,140,0)');
            g.fillStyle = gl; g.fillRect(-o.fr * 1.3, -o.fr * 3.9, o.fr * 2.6, o.fr * 2.6);
          }
          g.restore();
        }
        // Poussière soulevée
        for (let i = puffs.length - 1; i >= 0; i--) {
          const q = puffs[i];
          q.life -= dt * 2.5; q.vy += 60 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92;
          if (q.life <= 0) { puffs.splice(i, 1); continue; }
          g.fillStyle = `rgba(214,196,166,${q.life * 0.8})`;
          g.beginPath(); g.arc(q.x, q.y, q.r, 0, TAU); g.fill();
        }
        // Feuilles qui tombent en virevoltant
        for (const l of leaves) {
          if (!l.landed) {
            l.x += (l.vx + Math.sin(t * 2 + l.ph) * 30) * dt; l.y += l.vy * dt; l.rot += l.vr * dt * 2;
            if (l.y >= l.ly) { l.landed = true; if (Math.random() < 0.5) A.rustle(0.04, 0.08); }
            drawLeaf(l, false);
          } else l.life -= dt * 0.015;
        }
        leaves = leaves.filter((l) => l.life > 0 && l.x < w + 40 && l.y < h + 30);
        // Outil sous le doigt
        for (const st of strokes.values()) if (!st.obj && !st.first) drawRakeHead(st);
      });

      return {
        destroy() {
          loop.stop(); ptr.destroy(); cv.destroy();
          [sandLoop, bodyLoop, windLoop].forEach((l) => l && l.stop());
          sandLoop = bodyLoop = windLoop = null;
        },
      };
    },
  });
})();
