          ctx.beginPath(); ctx.ellipse(-12, 3, 10 + 14 * k, 6 + 7 * k, 0.05, 0, TAU); ctx.fill();
          ctx.fillStyle = ksCss(s.lk, 0.82);
          ctx.beginPath(); ctx.ellipse(-10, 7, 8 + 12 * k, 2.5 + 2 * k, 0.05, 0, TAU); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          ctx.beginPath(); ctx.ellipse(-16, -1, 6 * k + 2, 1.6, -0.15, 0, TAU); ctx.fill();
          ctx.restore();
        }
        ctx.strokeStyle = 'rgba(90,100,120,0.55)'; ctx.lineWidth = 1; bladePath(); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-24, -3); ctx.quadraticCurveTo(-4, -9, 14, -7); ctx.stroke();
        ctx.restore();
      }
      function drawBrush(x, y, ang, pressed, alpha, s) {
        const R = brushR, lift = pressed ? 4 : 12;
        const k = s ? s.lk : color, load = s ? s.load : 1;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y); ctx.rotate(ang + Math.PI);
        // ombre portée
        ctx.save(); ctx.translate(lift * 0.7, lift);
        ctx.fillStyle = 'rgba(70,40,80,0.16)';
        ctx.beginPath(); ctx.moveTo(0, -R); ctx.lineTo(30, -R * 0.75); ctx.lineTo(96, -4); ctx.lineTo(96, 4); ctx.lineTo(30, R * 0.75); ctx.lineTo(0, R); ctx.closePath(); ctx.fill();
        ctx.restore();
        // manche en bois laqué
        const hg = ctx.createLinearGradient(0, -6, 0, 6);
        hg.addColorStop(0, '#f6b6cf'); hg.addColorStop(0.35, '#ffe2ee'); hg.addColorStop(1, '#d886a8');
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.moveTo(32, -5.5); ctx.lineTo(100, -3); ctx.quadraticCurveTo(105, 0, 100, 3); ctx.lineTo(32, 5.5); ctx.closePath(); ctx.fill();
        // virole
        const fg = ctx.createLinearGradient(0, -R * 0.8, 0, R * 0.8);
        fg.addColorStop(0, '#9aa3b1'); fg.addColorStop(0.35, '#f5f7fb'); fg.addColorStop(1, '#8a93a1');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.moveTo(15, -R * 0.82); ctx.lineTo(33, -6); ctx.lineTo(33, 6); ctx.lineTo(15, R * 0.82); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(90,100,120,0.4)'; ctx.lineWidth = 1; line(20, -R * 0.68, 20, R * 0.68);
        // poils
        ctx.fillStyle = '#f2e3c8';
        ctx.beginPath(); ctx.moveTo(16, -R * 0.82); ctx.quadraticCurveTo(4, -R * 0.95, -1, -R * 0.9); ctx.lineTo(-1, R * 0.9); ctx.quadraticCurveTo(4, R * 0.95, 16, R * 0.82); ctx.closePath(); ctx.fill();
        if (load > 0.02) {
          ctx.fillStyle = ksCss(k, 1, Math.min(1, 0.35 + load));
          ctx.beginPath(); ctx.moveTo(10, -R * 0.88); ctx.quadraticCurveTo(3, -R * 0.95, -1.5, -R * 0.9); ctx.lineTo(-1.5, R * 0.9); ctx.quadraticCurveTo(3, R * 0.95, 10, R * 0.88); ctx.closePath(); ctx.fill();
        }
        ctx.strokeStyle = 'rgba(120,90,70,0.25)'; ctx.lineWidth = 0.7;
        for (let b = -R * 0.8; b <= R * 0.8; b += 2.2) line(16, b * 0.95, 0, b);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fillRect(2, -R * 0.6, 9, 1.2);
        ctx.restore();
      }
      function drawRoller(x, y, ang, pressed, alpha, s) {
        const L = rollL, lift = pressed ? 3 : 10;
        let fr = 1, fg = 0.95, fb = 0.96;
        if (s && s.load > 0.01) {
          const k = Math.min(0.9, s.load * 3);
          fr = U.lerp(fr, fromKS(s.lk[0]), k); fg = U.lerp(fg, fromKS(s.lk[1]), k); fb = U.lerp(fb, fromKS(s.lk[2]), k);
        }
        const css = (r, g, b) => `rgb(${Math.min(255, r * 255) | 0},${Math.min(255, g * 255) | 0},${Math.min(255, b * 255) | 0})`;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.fillStyle = 'rgba(70,40,80,0.16)';
        rrect(ctx, -L + lift * 0.6, -11 + lift, 2 * L, 22, 10); ctx.fill();
        ctx.strokeStyle = '#a3abb8'; ctx.lineWidth = 3.4;
        ctx.beginPath(); ctx.moveTo(L - 2, 0); ctx.lineTo(L + 9, 0); ctx.lineTo(L + 9, 18); ctx.lineTo(16, 36); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(L + 8, 1); ctx.lineTo(L + 8, 17); ctx.stroke();
        ctx.strokeStyle = '#7fc4a8'; ctx.lineWidth = 13; line(16, 36, 6, 76);
        ctx.strokeStyle = '#a8e6cc'; ctx.lineWidth = 10; line(16, 36, 6, 76);
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2.5; line(13, 40, 5, 70);
        const g = ctx.createLinearGradient(0, -11, 0, 11);
        g.addColorStop(0, css(fr * 0.78, fg * 0.78, fb * 0.8));
        g.addColorStop(0.32, css(U.lerp(fr, 1, 0.5), U.lerp(fg, 1, 0.5), U.lerp(fb, 1, 0.5)));
        g.addColorStop(0.62, css(fr, fg, fb));
        g.addColorStop(1, css(fr * 0.7, fg * 0.7, fb * 0.73));
        ctx.fillStyle = g; rrect(ctx, -L, -11, 2 * L, 22, 10); ctx.fill();
        ctx.fillStyle = 'rgba(90,60,90,0.09)';
        for (const f of FOAM) { ctx.beginPath(); ctx.arc(f[0] * (L - 6), f[1] * 8, f[2], 0, TAU); ctx.fill(); }
        ctx.fillStyle = 'rgba(80,50,80,0.1)';
        ctx.beginPath(); ctx.ellipse(-L + 3, 0, 3, 10.5, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(L - 3, 0, 3, 10.5, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
      function drawTube(x, y, k, squeeze) {
        ctx.save();
        ctx.translate(x, y); ctx.rotate(-0.55);
        const sq = 1 - squeeze * 0.12;
        ctx.fillStyle = 'rgba(70,40,80,0.16)';
        ctx.beginPath(); ctx.ellipse(16, 30, 26, 8, 0.5, 0, TAU); ctx.fill();
        // bouchon / embout
        const mg = ctx.createLinearGradient(-5, 0, 5, 0);
        mg.addColorStop(0, '#a7afbb'); mg.addColorStop(0.4, '#f6f8fb'); mg.addColorStop(1, '#8f98a6');
        ctx.fillStyle = mg;
        ctx.beginPath(); ctx.moveTo(-3, -4); ctx.lineTo(3, -4); ctx.lineTo(4.5, -14); ctx.lineTo(-4.5, -14); ctx.closePath(); ctx.fill();
        ctx.fillRect(-9, -20, 18, 7);
        // corps du tube
        ctx.save(); ctx.translate(0, -20); ctx.scale(1 / sq, 1);
        const bg2 = ctx.createLinearGradient(-15, 0, 15, 0);
        bg2.addColorStop(0, '#d9dde4'); bg2.addColorStop(0.35, '#ffffff'); bg2.addColorStop(1, '#c3c8d2');
        ctx.fillStyle = bg2;
        ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.lineTo(15, -62); ctx.lineTo(-15, -62); ctx.closePath(); ctx.fill();
        ctx.fillStyle = ksCss(k);
        ctx.fillRect(-12.5, -44, 25, 18);
        ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(-8, -42, 3, 14);
        ctx.fillStyle = '#c9ced8'; ctx.fillRect(-16, -68, 32, 7);
        ctx.restore();
        ctx.restore();
      }
      function drawSqueegee() {
        const x = tx + (wipe.bx + 0.5) * cell;
        ctx.save();
        // bourrelet de peinture poussé devant la raclette
        if (wipe.mass > 0.5) {
          const k = [wipe.kr / wipe.mass, wipe.kg / wipe.mass, wipe.kb / wipe.mass];
          ctx.fillStyle = ksCss(k);
          ctx.beginPath(); ctx.moveTo(x, ty);
          const step = 6;
          for (let y = 0; y <= th; y += step) {
            const gy = Math.min(gh - 1, Math.floor(y / cell));
            const wv = Math.min(16, Math.sqrt(wipe.carry[gy]) * 2.2);
            ctx.lineTo(x + 3 + wv, ty + y);
          }
          ctx.lineTo(x, ty + th); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
        }
        ctx.fillStyle = 'rgba(70,40,80,0.18)'; ctx.fillRect(x - 2, ty + 6, 10, th);
        const g = ctx.createLinearGradient(x - 8, 0, x + 4, 0);
        g.addColorStop(0, '#b6bec9'); g.addColorStop(0.5, '#f7f9fc'); g.addColorStop(1, '#a2abb7');
        ctx.fillStyle = g; rrect(ctx, x - 8, ty - 6, 11, th + 12, 4); ctx.fill();
        ctx.fillStyle = '#ffc8d8'; rrect(ctx, x - 20, ty + th * 0.3, 14, th * 0.4, 7); ctx.fill();
        ctx.restore();
      }

      function drawToolFor(s, x, y, ang, pressed, alpha) {
        const t = s ? s.tool : tool;
        if (t === 'knife') drawKnife(x, y, ang, pressed, alpha, s);
        else if (t === 'brush') drawBrush(x, y, ang, pressed, alpha, s);
        else drawRoller(x, y, ang, pressed, alpha, s);
      }

      function draw() {
        ctx.clearRect(0, 0, W, Hs);
        ctx.drawImage(bg, 0, 0, W, Hs);
        ctx.save();
        rrect(ctx, tx, ty, tw, th, rad); ctx.clip();
        ctx.drawImage(off, tx, ty, OW / dpr, OH / dpr);
        ctx.restore();
        // éclaboussures en vol (ombre au sol puis goutte)
        for (const p of splash) {
          ctx.fillStyle = 'rgba(70,40,80,0.14)';
          ctx.beginPath(); ctx.ellipse(p.x + p.z * 0.25, p.y + p.z * 0.1, p.r, p.r * 0.6, 0, 0, TAU); ctx.fill();
        }
        for (const p of splash) {
          const g = ctx.createRadialGradient(p.x - p.r * 0.4, p.y - p.z - p.r * 0.4, 0, p.x, p.y - p.z, p.r);
          g.addColorStop(0, '#fff'); g.addColorStop(0.35, ksCss(p.col)); g.addColorStop(1, ksCss(p.col, 0.8));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(p.x, p.y - p.z, p.r, 0, TAU); ctx.fill();
        }
        if (wipe) drawSqueegee();
        // outils (toujours au-dessus de la peinture et des gouttes)
        let any = false;
        strokes.forEach((s) => {
          if (s.squeezing) { any = true; drawTube(s.x, s.y, s.col, 1); }
          else if (s.moved) { any = true; drawToolFor(s, s.x, s.y, s.ang, true, 1); }
        });
        if (!any && hover && strokes.size === 0 && !wipe && inToile(hover.x, hover.y)) drawToolFor(null, hover.x, hover.y, lastAng, false, 0.85);
      }

      /* ---------- Entrées ---------- */
      function ensureAudio() {
        if (loops.smear) return;
        loops.smear = SG.audio.loop('smear'); loops.scrape = SG.audio.loop('scrape');
        loops.paint = SG.audio.loop('paint'); loops.brush = SG.audio.loop('brush');
        loops.sticky = SG.audio.loop('sticky');
      }
      const ptr = SG.pointer(cv.canvas, {
        down(p) {
          ensureAudio();
          pop.hide();
          if (!inToile(p.x, p.y)) return;
          const s = {
            tool, x0: p.x, y0: p.y, x: p.x, y: p.y, moved: false, gx: 0, gy: 0, ang: lastAng, t: 0,
            squeezing: false, sq: 0, sqT: 0, coil: Math.random() * TAU, col: color.slice(),
            load: tool === 'brush' ? 1 : 0, lk: tool === 'brush' ? color.slice() : [0, 0, 0],
            seed: Math.random() * 1000, press: 1, travel: 0, under: 0, speed: 0,
          };
          strokes.set(p.id, s);
          if (tool === 'brush') { SG.audio.squish(1.6, 0.18); }
        },
        move(p) {
          const s = strokes.get(p.id);
          if (!s) return;
          s.x = p.x; s.y = p.y;
          s.speed = p.speed;
          if (s.squeezing) return;
          if (!s.moved) {
            if (U.dist(s.x0, s.y0, p.x, p.y) < 7) return;
            s.moved = true;
            s.gx = toGX(s.x0); s.gy = toGY(s.y0);
            s.ang = Math.atan2(p.y - s.y0, p.x - s.x0);
            if (s.tool === 'knife') SG.audio.squish(1.3, 0.2);
          }
          if (Math.abs(p.dx) + Math.abs(p.dy) > 0.5) {
            let da = Math.atan2(p.dy, p.dx) - s.ang;
            while (da > Math.PI) da -= TAU;
            while (da < -Math.PI) da += TAU;
            s.ang += da * 0.3; lastAng = s.ang;
          }
          strokeTo(s, p.x, p.y);
          s.travel += Math.hypot(p.dx, p.dy);
          if (s.travel > 90 && s.under > 0.2) { s.travel = 0; SG.haptic(4); }
        },
        up(p) {
          const s = strokes.get(p.id);
          strokes.delete(p.id);
          if (!s) return;
          if (s.squeezing) { SG.audio.plop(0.7, 0.3); SG.haptic(8); return; }
          if (!s.moved && inToile(p.x, p.y)) dropBlob(p.x, p.y, color, 1);
          else if (s.moved && s.under > 0.3) SG.audio.squish(1.5, 0.18); // la lame décolle de la pâte
        },
        hover(p) { hover = p.e && p.e.pointerType === 'mouse' ? { x: p.x, y: p.y } : null; },
      });
      const onLeave = () => { hover = null; };
      cv.canvas.addEventListener('pointerleave', onLeave);

      /* ---------- Barre d'outils ---------- */
      const items = [
        { color: colorHex, title: 'Couleur', onClick() { pop.toggle(bar.offsetHeight + 24); } },
        { icon: '🔪', label: 'Couteau', group: 'tool', active: true, onClick() { tool = 'knife'; pop.hide(); } },
        { icon: '🖌️', label: 'Pinceau', group: 'tool', onClick() { tool = 'brush'; pop.hide(); } },
        { icon: '🧻', label: 'Rouleau', group: 'tool', onClick() { tool = 'roller'; pop.hide(); } },
        {
          icon: '🧽', label: 'Effacer',
          onClick() {
            pop.hide();
            if (wipe) return;
            wipe = { p: 0, bx: 0, carry: new Float32Array(gh), mass: 0, kr: 0, kg: 0, kb: 0 };
            queue.length = 0; drops.length = 0;
            SG.audio.whoosh(0.35, 0.7, true); SG.haptic(20);
          },
        },
      ];
      bar = SG.toolbar(stage, items);
      swatchBtn = bar.children[0];
      const pop = colorPop(stage, PALETTE, (hex) => {
        colorHex = hex; color = toKS(hex);
        swatchBtn.style.setProperty('--swatch', hex);
        SG.audio.plop(1.2, 0.3);
      });
      SG.hint(stage, 'Touche pour une noix de peinture, maintiens pour presser le tube, glisse pour étaler', 4200);

      cv.onResize(layout);
      layout(cv.w, cv.h);
      seedBlobs(0.35);

      /* ---------- Boucle ---------- */
      const loop = SG.loop((dt) => {
        for (let i = queue.length - 1; i >= 0; i--) {
          const q = queue[i];
          q.at -= dt;
          if (q.at <= 0) { queue.splice(i, 1); dropBlob(tx + q.fx * tw, ty + q.fy * th, q.col, 1.1); }
        }
        // noix qui s'étalent avec un léger rebond
        for (let k = drops.length - 1; k >= 0; k--) {
          const d = drops[k];
          d.t += dt;
          const s = d.t >= 0.6 ? 1 : 1 - Math.exp(-d.t * 14) * Math.cos(d.t * 22);
          const ds = s - d.applied; d.applied = s;
          for (let j = 0; j < d.idx.length; j++) addPaint(d.idx[j], d.val[j] * ds, d.col);
          markDirty(Math.max(0, d.bx), Math.max(0, d.by), Math.min(gw - 1, d.bx1), Math.min(gh - 1, d.by1));
          if (d.t >= 0.6) drops.splice(k, 1);
        }
        for (let k = splash.length - 1; k >= 0; k--) {
          const p = splash[k];
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.vz -= 900 * dt; p.z += p.vz * dt;
          if (p.z <= 0) {
            splash.splice(k, 1);
            if (inToile(p.x, p.y)) { dab(p.x, p.y, p.r * 1.6, p.col, 0.08); if (Math.random() < 0.4) SG.audio.bubble(U.rand(1.2, 1.8), 0.06); }
          }
        }
        // tube : maintien sans bouger
        strokes.forEach((s) => {
          if (s.moved) return;
          s.t += dt;
          if (!s.squeezing && s.t > 0.24) { s.squeezing = true; SG.haptic(10); SG.audio.squish(0.8, 0.4); }
          if (s.squeezing && inToile(s.x, s.y)) squeezeStep(s, dt);
        });
        // raclette
        if (wipe) {
          wipe.p += dt / 0.8;
          const nbx = Math.min(gw, Math.floor(Math.min(1, wipe.p) * (gw + 1)));
          for (let x = wipe.bx; x < nbx; x++) {
            for (let y = 0; y < gh; y++) {
              const i = y * gw + x, h = HF[i];
              if (h > 0) { wipe.carry[y] += h; wipe.mass += h; wipe.kr += KR[i] * h; wipe.kg += KG[i] * h; wipe.kb += KB[i] * h; HF[i] = 0; }
            }
          }
          if (nbx > wipe.bx) markDirty(Math.max(0, wipe.bx - 1), 0, Math.min(gw - 1, nbx), gh - 1);
          wipe.bx = nbx;
          if (wipe.p >= 1) {
            wipe = null;
            HF.fill(0); KR.fill(0); KG.fill(0); KB.fill(0);
            markDirty(Math.max(0, gw - 12), 0, gw - 1, gh - 1);
            SG.audio.squish(0.6, 0.4); SG.haptic(10);
          }
        }
        // sons pilotés par le geste
        let kL = 0, bL = 0, rL = 0, dryL = 0, scr = 0, under = 0, br = 0;
        strokes.forEach((s) => {
          if (!s.moved) return;
          const sp = Math.min(1, s.speed * 1.3);
          if (s.tool === 'knife') { kL = Math.max(kL, sp * (0.3 + 0.7 * Math.min(1, s.under + s.load * 0.3))); scr = Math.max(scr, sp * Math.max(0, 1 - s.under * 4)); }
          else if (s.tool === 'brush') { bL = Math.max(bL, sp * (0.25 + 0.75 * Math.min(1, s.under * 2 + s.load * 0.5))); dryL = Math.max(dryL, sp * (1 - s.load) * 0.8); }
          else rL = Math.max(rL, sp * (0.4 + 0.6 * Math.min(1, s.under * 2)));
          under = Math.max(under, s.under); br = Math.max(br, sp);
        });
        if (wipe) scr = Math.max(scr, 0.55);
        const sm = (a, b) => U.lerp(a, b, b > a ? 0.5 : 0.18);
        lvKnife = sm(lvKnife, kL); lvBrush = sm(lvBrush, bL); lvRoll = sm(lvRoll, rL); lvDry = sm(lvDry, Math.max(dryL, scr));
        if (loops.smear) {
          loops.smear.set(Math.max(lvKnife, lvRoll * 0.5), 0.25 + 0.45 * lvKnife);
          loops.scrape.set(lvDry * 0.55, 0.3 + 0.4 * lvDry);
          loops.paint.set(lvBrush, 0.3 + 0.4 * lvBrush);
          loops.brush.set(Math.max(lvDry * 0.7, lvBrush * 0.3), 0.4 + 0.3 * lvBrush);
          loops.sticky.set(lvRoll * 0.8, 0.2 + 0.4 * lvRoll);
        }
        flush();
        draw();
      });

      return {
        destroy() {
          alive = false;
          loop.stop();
          ptr.destroy();
          cv.canvas.removeEventListener('pointerleave', onLeave);
          Object.values(loops).forEach((l) => l.stop());
          cv.destroy();
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/cake.js */
/* Glaçage — gâteau sur plateau tournant : verser une ganache brillante qui s'étale et coule,
   lisser à la spatule jusqu'au miroir, puis décorer librement (poche, fruits, vermicelles).
   Le dessus est une grille polaire (épaisseur, couleur, rugosité) éclairée par cellule puis
   rééchantillonnée pixel par pixel directement dans l'ellipse à l'écran (net, sans bruit). */
(function () {
  'use strict';
  const U = SG.util;

  const ICINGS = [
    '#ffb5c8', '#fff3e2', '#b9f0d4', '#d6c4ff', '#b8dcff', '#ffe39a', '#ffc8a8',
    '#ff7fa8', '#ffffff', '#8fd3ff', '#c9a0ff', '#f6c453', '#a8786a', '#5a3328',
  ];
  const SPRINK = ['#ff7fa8', '#ffd36b', '#7fd9b0', '#8fc4ff', '#c49bff', '#ffffff', '#ff9e7a'];
  const FLAVORS = [
    { sponge: '#f4d29c', fill: '#fff6ea', jam: '#ff9fb4' }, // vanille
    { sponge: '#b98066', fill: '#fff1e6', jam: '#ffcfa0' }, // chocolat
    { sponge: '#f7c1bd', fill: '#fffaf2', jam: '#ff8fa8' }, // fraise
    { sponge: '#cfe6b4', fill: '#fff8ec', jam: '#ffe27a' }, // pistache
  ];
  const FRUITS = [
    { id: 'fraise', icon: '🍓' }, { id: 'myrtille', icon: '🫐' },
    { id: 'cerise', icon: '🍒' }, { id: 'framboise', icon: '🌸' },
  ];
  const toRgb = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
  const css = (r, g, b, a = 1) => `rgba(${Math.min(255, Math.max(0, r * 255)) | 0},${Math.min(255, Math.max(0, g * 255)) | 0},${Math.min(255, Math.max(0, b * 255)) | 0},${a})`;
  const TAU = Math.PI * 2;

  // Grille polaire du dessus
  const NA = 256, NR = 64, NC = NA * NR;
  const colCos = new Float32Array(NA), colSin = new Float32Array(NA);

  // Lumière (arrière-gauche) et demi-vecteur

          const a = { mode: tool, off, tx: p.x, ty: p.y - off, t: now, moveT: now, onCake: false, cur: -1, rose: null, last: null, acc: 0, sqT: 0 };
          acts.set(p.id, a);
          if (tool === 'pour') SG.haptic(8);
          if (tool === 'spatula') { ld.fill(0); SG.audio.tap('metal', 0.18, 1.4); SG.haptic(10); }
          if (tool === 'pipe') {
            const L = toLocal(T.X, T.Y);
            a.rose = addDeco(L.lx, L.ly, 'rose', 0.02);
            a.last = L;
            SG.audio.squish(1.3, 0.4);
          }
          if (tool === 'fruit') {
            const L = toLocal(T.X, T.Y);
            addDeco(L.lx, L.ly, 'fruit', U.rand(0.1, 0.125), { fruit: FRUITS[fruitK].id, z: 70, vz: 0, rotA: U.rand(-0.35, 0.35), bounced: 0 });

        },
        move(p) {

            const T0 = toTop(a.x, a.y), T1 = toTop(p.x, p.y);

          }

            const T = toTop(a.tx, a.ty);

        },
        up(p) {

            a.rose.done = true;

      /* ---------- Interface ---------- */
      let hintEl = null;
      const hint = (t, ms = 3000) => { if (hintEl) hintEl.remove(); hintEl = SG.hint(stage, t, ms); };
      const toolNames = ['pour', 'spatula', 'pipe', 'fruit', 'sprinkles'];
      const items = [
        { color: icing, title: 'Couleur', onClick() { pop.toggle(bar.offsetHeight + 24); } },
        { icon: '🫗', label: 'Verser', onClick() { setTool('pour', true); } },
        { icon: '🥄', label: 'Spatule', onClick() { setTool('spatula', true); } },
        { icon: '🧁', label: 'Poche', onClick() { setTool('pipe', true); } },
        {
          icon: FRUITS[0].icon, label: 'Fruits',
          onClick() {
            if (tool === 'fruit') { fruitK = (fruitK + 1) % FRUITS.length; SG.audio.plop(1.3, 0.25); }
            fruitBtn.querySelector('.ic').textContent = FRUITS[fruitK].icon;
            setTool('fruit', true);
          },
        },
        { icon: '✨', label: 'Vermicelles', onClick() { setTool('sprinkles', true); } },
      ];

      swatchBtn = bar.children[0];
      const toolBtns = Array.from(bar.children).slice(1, 6);
      fruitBtn = toolBtns[3];
      const pop = colorPop(stage, ICINGS, (hex) => {
        icing = hex; icingRgb = toRgb(hex);
        swatchBtn.style.setProperty('--swatch', hex);
        SG.audio.plop(1.1, 0.3);
        if (tool === 'spatula' || tool === 'sprinkles' || tool === 'fruit') setTool('pour');
      });
      function setTool(name, fromBtn) {
        tool = name;
        pop.hide();
        toolBtns.forEach((b, i) => b.classList.toggle('active', toolNames[i] === name));
        if (!fromBtn) return;
        if (name === 'pour') hint('Maintiens sur le gâteau pour verser — fais tourner le plateau d’un geste');
        if (name === 'spatula') hint('Pose la spatule et fais tourner le plateau');
        if (name === 'pipe') hint('Maintiens pour une rosace, glisse pour des perles');
        if (name === 'fruit') hint('Touche le gâteau pour poser un fruit — retouche le bouton pour changer');

      layout(cv.w, cv.h);

      /* ---------- Boucle ---------- */

            const dir = Math.sign(diff), n = Math.min(64, Math.abs(diff));

            if (totalIcing < 0.05) onBare = 1;
          } else if (a.mode === 'pipe') {
            const now = performance.now();
            if (a.rose && !a.rose.done) {
              a.rose.size = Math.min(0.12, a.rose.size + dt * 0.1);
              a.sqT += dt;
              if (a.sqT > 0.13) { a.sqT = 0; SG.audio.squish(1.1 + a.rose.size * 5, 0.2); }
              if (a.rose.size >= 0.12) { a.rose.done = true; SG.audio.chime(U.randInt(3, 8), 0.12); SG.haptic(10); }
            } else if (now - a.moveT > 280 && T.r <= 0.98 && !a.rose) {
              const L = toLocal(T.X, T.Y);
              a.rose = addDeco(L.lx, L.ly, 'rose', 0.02);
              a.last = L;
            }
          } else if (a.mode === 'sprinkles') {
            shaking = true;
            a.acc += dt * 75;
            while (a.acc >= 1) { a.acc -= 1; spawnSprinkle(T.X, T.Y); }
          }
        });
        // plateau tournant : roue libre avec inertie ; la spatule aide un peu
        let spin = false;
        acts.forEach((a) => { if (a.mode === 'spin') spin = true; });
        if (!spin) {
          omega *= Math.exp(-dt * 0.28);
          const spat = [...acts.values()].some((a) => a.mode === 'spatula');

          d.t += dt;
          if (d.kind === 'fruit' && (d.z > 0 || d.vz > 0)) {
            d.vz -= 900 * dt; d.z += d.vz * dt;
            if (d.z <= 0) {
              d.z = 0;
              if (d.bounced < 1 && d.vz < -120) { d.vz = -d.vz * 0.22; d.bounced++; SG.audio.thud(0.35, 1.5); SG.audio.squish(U.rand(1.2, 1.6), 0.28); SG.haptic(8); }
              else { d.vz = 0; d.t = 0; }
            }
          }
        }
        updateSprinkles(dt);
        const now = performance.now();
        if (landCount && now - lastLand > 50) {
          SG.audio.crunch(Math.min(0.45, 0.06 + landCount * 0.03), 2.2);

        if (topDirty) {
          topDirty = false; lastRot = rot;

        }

          if (!celebrated && prog >= 0.95) {

            SG.celebrate(stage, 'Lisse comme un miroir !');

          }

        sandLv = U.lerp(sandLv, shaking ? 0.6 : 0, 0.3);
        if (loops.pour) {
          loops.pour.set(pourLv, 0.35 + 0.2 * Math.sin(t * 3));
          loops.smear.set(smearLv, 0.35 + 0.3 * sweepK);
          loops.scrape.set(scrapeLv, 0.4);
          loops.sand.set(sandLv, 0.5);
          loops.hum.set(Math.min(1, Math.abs(omega) / 5) * 0.3, 0.15 + Math.min(0.6, Math.abs(omega) / 12));
        }

      });

      return {
        destroy() {
          alive = false;
          clearTimeout(celebTimer);
          loop.stop();
          ptr.destroy();
          cv.canvas.removeEventListener('pointerleave', onLeave);
          Object.values(loops).forEach((l) => l.stop());
          cv.destroy();
        },
      };
    },
  });

  <script>/* js/games/pour.js */
/* Pouring — acrylique fluide versée en anneaux, toile inclinée pour marbrer, cellules au chalumeau.
   Grille fine (≈1,25 px). Les couleurs sont transportées avec un échantillonnage « quasi-plus-proche »
   (poids bilinéaires élevés à la puissance 8) : les couches restent nettes et saturées au lieu de

(function () {

  // Qualité (SG.quality.level 0/1/2) : nombre de cellules de la grille, pas minimal d'inclinaison

  /* Sélecteur de couleurs (bulle au-dessus de la barre d'outils) */

  }

  SG.registerGame({
    id: 'pour', title: 'Pouring', emoji: '🌈', order: 6,
    desc: 'Verse des couleurs en anneaux, incline et regarde les cellules naître.',
    color: '#b8dcff',
    bg: 'radial-gradient(120% 90% at 80% 0%, #eaf4ff 0%, #f3ecff 50%, #fff0f4 100%)',
    create(stage) {
      const cv = SG.makeCanvas(stage);
      const ctx = cv.ctx;

      let cell = 1.25, gw = 0, gh = 0, N = 0;
      let R = null, G = null, B = null, Hh = null, BU = null, R2 = null, G2 = null, B2 = null, H2 = null, BU2 = null;
      let n1 = null, cX = null, cY = null;

      let mixList = [];

      const acts = new Map();
      let hover = null;
      let gX = 0, gY = 0, tgX = 0, tgY = 0, autoT = 0, autoPh = 0, tiltAcc = 0;
      let cellBudget = 0, cellT = 0, laceWhite = Math.random() < 0.6;

      let wiping = 0, celebrated = false, cover = 0, covT = 0, chimeStep = 0;

      let bar = null, swatchBtn = null;

      /* ---------- Bruit lisse ---------- */
      function makeNoise(sc) {

            const a = c[y0 * cw + x0], b = c[y0 * cw + x0 + 1], d = c[(y0 + 1) * cw + x0], e = c[(y0 + 1) * cw + x0 + 1];

      }

      function alloc(ngw, ngh) {
        const n = ngw * ngh;
        const nr = new Float32Array(n), ng = new Float32Array(n), nb = new Float32Array(n), nh = new Float32Array(n), nu = new Float32Array(n);
        nr.fill(1); ng.fill(1); nb.fill(1);

              const sx = Math.min(gw - 1, ((x * gw) / ngw) | 0);
              const s = sy * gw + sx, d = y * ngw + x;
              nr[d] = R[s]; ng[d] = G[s]; nb[d] = B[s]; nh[d] = Hh[s]; nu[d] = BU[s];

          }
        }
        R = nr; G = ng; B = nb; Hh = nh; BU = nu;
        gw = ngw; gh = ngh; N = n;
        R2 = new Float32Array(n); G2 = new Float32Array(n); B2 = new Float32Array(n); H2 = new Float32Array(n); BU2 = new Float32Array(n);
        SR = new Float32Array(n); SG2 = new Float32Array(n); SB = new Float32Array(n); SH = new Float32Array(n); SU = new Float32Array(n);
        rowL = new Int32Array(ngh).fill(ngw); rowR = new Int32Array(ngh).fill(-1); dY0 = 1e9; dY1 = -1;
        sess = null;
        n1 = makeNoise(22);
        const pot = makeNoise(28);
        cX = new Float32Array(n); cY = new Float32Array(n);
        for (let y = 0; y < gh; y++) {

            const pl = pot[x > 0 ? i - 1 : i], pr = pot[x < gw - 1 ? i + 1 : i];

      }

      function layout(w, h) {
        W = w; Hs = h;
        const barH = bar ? bar.offsetHeight + 26 : 90;
        const m = w < 500 ? 12 : 22;
        tw = w - 2 * m; th = h - m - barH - 46;
        if (th < 120) th = h - 2 * m;
        const maxA = 420000;
        if (tw * th > maxA) { const k = Math.sqrt(maxA / (tw * th)); tw *= k; th *= k; }
        tw = Math.floor(tw); th = Math.floor(th);
        tx = Math.round((w - tw) / 2); ty = m + 46;
        rad = w < 500 ? 10 : 14;
        cell = Math.max(1.4, Math.sqrt((tw * th) / QCELLS[SG.quality.level]));
        alloc(Math.max(8, Math.ceil(tw / cell)), Math.max(8, Math.ceil(th / cell)));
        buildBg();
        markDirty(0, 0, gw - 1, gh - 1);
      }

      function buildBg() {
        const dpr = cv.dpr;
        bg = bg || document.createElement('canvas');
        bg.width = Math.round(W * dpr); bg.height = Math.round(Hs * dpr);
        const c = bg.getContext('2d');

        c.fillStyle = g; c.fillRect(tx, ty, tw, th);
        c.lineWidth = 0.8;
        for (let y = ty + 1; y < ty + th; y += 2.4) {
          c.strokeStyle = `rgba(150,140,170,${U.rand(0.03, 0.07).toFixed(3)})`;
          c.beginPath(); c.moveTo(tx, y); c.lineTo(tx + tw, y); c.stroke();
        }
        for (let x = tx + 1; x < tx + tw; x += 2.4) {
          c.strokeStyle = `rgba(150,140,170,${U.rand(0.03, 0.06).toFixed(3)})`;
          c.beginPath(); c.moveTo(x, ty); c.lineTo(x, ty + th); c.stroke();
        }
        c.restore();
      }

      // zones à redessiner, ligne par ligne
      function markRow(y, x0, x1) {
        if (x0 < rowL[y]) rowL[y] = x0;
        if (x1 > rowR[y]) rowR[y] = x1;
        if (y < dY0) dY0 = y; if (y > dY1) dY1 = y;
      }
      function markDirty(x0, y0, x1, y1) {
        for (let y = y0; y <= y1; y++) markRow(y, x0, x1);
      }

      /* ---------- Échantillonnage net ---------- */
      // Hauteur bilinéaire ; couleur et relief des cellules « quasi-plus-proche » (poids^8)
      let sH = 0, sR = 1, sG = 1, sB = 1, sU = 0;
      const sampSharp = (x, y) => sampArr(R, G, B, Hh, BU, x, y, false);
      // version plus douce pour l'écoulement (évite les marbrures « en escalier »)
      const sampFlow = (x, y) => sampArr(R, G, B, Hh, BU, x, y, true);
      function sampArr(R, G, B, Hh, BU, x, y, soft) {
        if (x < 0) x = 0; else if (x > gw - 1.001) x = gw - 1.001;
        if (y < 0) y = 0; else if (y > gh - 1.001) y = gh - 1.001;
        const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
        const i0 = y0 * gw + x0, i1 = i0 + 1, i2 = i0 + gw, i3 = i2 + 1;
        const a0 = (1 - fx) * (1 - fy), a1 = fx * (1 - fy), a2 = (1 - fx) * fy, a3 = fx * fy;
        const hb = Hh[i0] * a0 + Hh[i1] * a1 + Hh[i2] * a2 + Hh[i3] * a3;
        // poids accentués, et seulement là où il y a de la peinture
        let w0 = a0 * a0, w1 = a1 * a1, w2 = a2 * a2, w3 = a3 * a3;
        w0 *= w0; w1 *= w1; w2 *= w2; w3 *= w3;
        if (!soft) { w0 *= w0; w1 *= w1; w2 *= w2; w3 *= w3; }
        w0 *= (Hh[i0] > 0.05 ? 1 : 1e-4); w1 *= (Hh[i1] > 0.05 ? 1 : 1e-4);
        w2 *= (Hh[i2] > 0.05 ? 1 : 1e-4); w3 *= (Hh[i3] > 0.05 ? 1 : 1e-4);
        const k = 1 / (w0 + w1 + w2 + w3 + 1e-12);
        sR = (R[i0] * w0 + R[i1] * w1 + R[i2] * w2 + R[i3] * w3) * k;
        sG = (G[i0] * w0 + G[i1] * w1 + G[i2] * w2 + G[i3] * w3) * k;
        sB = (B[i0] * w0 + B[i1] * w1 + B[i2] * w2 + B[i3] * w3) * k;
        sU = (BU[i0] * w0 + BU[i1] * w1 + BU[i2] * w2 + BU[i3] * w3) * k;
        // épaisseur nette aussi (bords de flaque francs), avec un peu de bilinéaire
        let v0 = a0 * a0, v1 = a1 * a1, v2 = a2 * a2, v3 = a3 * a3; v0 *= v0; v1 *= v1; v2 *= v2; v3 *= v3;
        sH = ((Hh[i0] * v0 + Hh[i1] * v1 + Hh[i2] * v2 + Hh[i3] * v3) / (v0 + v1 + v2 + v3)) * 0.85 + hb * 0.15;
      }
      function copyRect(x0, y0, x1, y1) {
        for (let y = y0; y <= y1; y++) {
          const a = y * gw + x0, b = y * gw + x1 + 1;
          R2.set(R.subarray(a, b), a); G2.set(G.subarray(a, b), a); B2.set(B.subarray(a, b), a);

        t = Hh; Hh = H2; H2 = t;
        t = BU; BU = BU2; BU2 = t;
      }

      /* ---------- Versement : la nouvelle peinture repousse l'ancienne en anneaux ----------
         Une « session » = un point de versement. On garde une photo de la toile au début et
         l'historique des couleurs versées (en aire cumulée). Chaque image est recalculée
         exactement depuis la photo : aucun flou ne s'accumule, les anneaux restent parfaits. */
      let sess = null;
      function startSession(px, py, owner) {
        SR.set(R); SG2.set(G); SB.set(B); SH.set(Hh); SU.set(BU);
        OW = Math.ceil(gw / 8); OH = Math.ceil(gh / 8);
        if (!OCC || OCC.length < OW * OH) OCC = new Uint8Array(OW * OH);
        OCC.fill(0);
        // blocs 8×8 contenant de la peinture (élargis de 2 cellules : l'échantillonnage lit les voisines)
        for (let y = 0; y < gh; y++) {
          for (let x = 0; x < gw; x++) {
            if (Hh[y * gw + x] <= 0.05) continue;
            const bx0 = Math.max(0, x - 2) >> 3, bx1 = Math.min(gw - 1, x + 2) >> 3;
            const by0 = Math.max(0, y - 2) >> 3, by1 = Math.min(gh - 1, y + 2) >> 3;
            OCC[by0 * OW + bx0] = 1; OCC[by0 * OW + bx1] = 1; OCC[by1 * OW + bx0] = 1; OCC[by1 * OW + bx1] = 1;
          }
        }
        sess = { px, py, A: 0, segs: [], owner };
      }
      function sessionPour(dA, col) {
        const sg = sess.segs, last = sg[sg.length - 1];
        if (last && last.col === col) last.a1 += dA;
        else sg.push({ a0: sess.A, a1: sess.A + dA, col });
        sess.A += dA;
        applySession();
      }
      function applySession() {
        const { px, py, A, segs } = sess;
        const reach = Math.min(Math.hypot(gw, gh), Math.sqrt(A) + 2 * A + 3), re2 = reach * reach;
        const x0 = Math.max(0, Math.floor(px - reach)), x1 = Math.min(gw - 1, Math.ceil(px + reach));
        const y0 = Math.max(0, Math.floor(py - reach)), y1 = Math.min(gh - 1, Math.ceil(py + reach));
        const nseg = segs.length;
        for (let y = y0; y <= y1; y++) {
          const dy = y - py;
          let lo = gw, hi = -1;
          for (let x = x0; x <= x1; x++) {
            const dx = x - px, d2 = dx * dx + dy * dy;
            if (d2 > re2) continue;
            const i = y * gw + x;
            let nr, ng, nb, nh, nu;
            if (d2 <= A) {
              const al = A - d2;
              let k = nseg - 1; while (k > 0 && segs[k].a0 > al) k--;

              nr = c[0]; ng = c[1]; nb = c[2]; nh = 1; nu = 0;
            } else {
              const s = Math.sqrt((d2 - A) / d2), sx = px + dx * s, sy = py + dy * s;
              const bx = sx < 0 ? 0 : sx >= gw ? (gw - 1) >> 3 : (sx | 0) >> 3, by = sy < 0 ? 0 : sy >= gh ? (gh - 1) >> 3 : (sy | 0) >> 3;
              if (!OCC[by * OW + bx] && !OCC[(y >> 3) * OW + (x >> 3)]) continue;
              sampArr(SR, SG2, SB, SH, SU, sx, sy);
              nr = sR; ng = sG; nb = sB; nh = sH; nu = sU;
            }
            if (Math.abs(nr - R[i]) + Math.abs(ng - G[i]) + Math.abs(nb - B[i]) + Math.abs(nh - Hh[i]) + Math.abs(nu - BU[i]) > 1e-3) {
              R[i] = nr; G[i] = ng; B[i] = nb; Hh[i] = nh; BU[i] = nu;
              if (x < lo) lo = x; if (x > hi) hi = x;
            }
          }
          if (hi >= lo) markRow(y, lo, hi);
        }
      }

      /* ---------- Inclinaison : écoulement + tourbillons = marbrure ---------- */
      let tiltOcc = null, tiltOcc2 = null;
      function tiltStep(k) {
        sess = null;
        const gl = Math.hypot(gX, gY), sw = 0.3 * gl;
        // blocs 8×8 qui peuvent recevoir de la peinture (épaisse à proximité) : ailleurs, la toile nue est recopiée telle quelle
        const bw = (gw + 7) >> 3, bh = (gh + 7) >> 3, nb = bw * bh;
        if (!tiltOcc || tiltOcc.length < nb) { tiltOcc = new Uint8Array(nb); tiltOcc2 = new Uint8Array(nb); }

          for (let x = 0; x < gw; x++) if (Hh[row + x] > 0.6) tiltOcc[brow + (x >> 3)] = 1;
        }

        for (let by = 0; by < bh; by++) {

            let o = 0;
            for (let yy = Math.max(0, by - dil); yy <= Math.min(bh - 1, by + dil) && !o; yy++) {
              for (let xx = Math.max(0, bx - dil); xx <= Math.min(bw - 1, bx + dil); xx++) if (tiltOcc[yy * bw + xx]) { o = 1; break; }
            }
            tiltOcc2[by * bw + bx] = o;
          }
        }
        for (let y = 0; y < gh; y++) {
          const brow = (y >> 3) * bw;
          let lo = gw, hi = -1;
          for (let x = 0; x < gw; x++) {
            const i = y * gw + x, h = Hh[i];
            if (h < 0.3 && !tiltOcc2[brow + (x >> 3)]) { R2[i] = R[i]; G2[i] = G[i]; B2[i] = B[i]; H2[i] = h; BU2[i] = BU[i]; continue; }
            if (x < lo) lo = x;
            hi = x;
            // une cellule nue (ou presque) peut recevoir la peinture qui descend vers elle
            const mob = (h < 0.3 ? 1 : h > 1 ? 1 : 0.15 + 0.85 * (h - 0.3) / 0.7) * k;
            const nv = 0.7 + 0.5 * n1[i];
            const vx = (gX * nv + cX[i] * sw) * mob, vy = (gY * nv + cY[i] * sw) * mob;
            const sx = x - vx, sy = y - vy;
            if (h < 0.3) {
              if (sx < 0 || sy < 0 || sx > gw - 1 || sy > gh - 1) { R2[i] = R[i]; G2[i] = G[i]; B2[i] = B[i]; H2[i] = h; BU2[i] = BU[i]; continue; }
              sampFlow(sx, sy);
              if (sH > 0.6) { R2[i] = sR; G2[i] = sG; B2[i] = sB; H2[i] = sH * 0.92; BU2[i] = sU; }
              else { R2[i] = R[i]; G2[i] = G[i]; B2[i] = B[i]; H2[i] = h; BU2[i] = BU[i]; }
              continue;
            }
            if (sx < 0 || sy < 0 || sx > gw - 1 || sy > gh - 1) {
              // rien en amont : il reste une fine pellicule de la même couleur
              R2[i] = R[i]; G2[i] = G[i]; B2[i] = B[i]; H2[i] = Math.max(0.3, h * 0.97); BU2[i] = BU[i];
              continue;
            }
            sampFlow(sx, sy);
            if (sH < 0.3) { R2[i] = R[i]; G2[i] = G[i]; B2[i] = B[i]; H2[i] = Math.max(0.3, h * 0.98); BU2[i] = BU[i]; continue; }
            R2[i] = sR; G2[i] = sG; B2[i] = sB; H2[i] = Math.max(sH, h * 0.99); BU2[i] = sU * 0.995;
          }
          if (hi >= lo) markRow(y, lo, hi);
        }
        swap();
      }

      /* ---------- Étaler au doigt : déplacement local (swipe) ---------- */
      function swipeStep(cx, cy, dx, dy, r) {
        sess = null;
        const [x0, y0, x1, y1] = [Math.max(0, Math.floor(cx - r - 2)), Math.max(0, Math.floor(cy - r - 2)), Math.min(gw - 1, Math.ceil(cx + r + 2)), Math.min(gh - 1, Math.ceil(cy + r + 2))];
        if (x0 > x1 || y0 > y1) return;
        copyRect(x0, y0, x1, y1);
        const ir2 = 1 / (r * r);
        for (let y = y0; y <= y1; y++) {
          for (let x = x0; x <= x1; x++) {
            const d2 = ((x - cx) * (x - cx) + (y - cy) * (y - cy)) * ir2;
            if (d2 >= 1) continue;
            const i = y * gw + x;
            let w = 1 - d2; w = w * w;
            sampSharp(x - dx * w, y - dy * w);
            if (sH < 0.05 && Hh[i] < 0.05) continue;
            R2[i] = sR; G2[i] = sG; B2[i] = sB; H2[i] = Math.max(sH, Hh[i] * 0.5); BU2[i] = sU;
          }
        }
        swap();
        markDirty(x0, y0, x1, y1);
      }

      /* ---------- Cellules : trous ronds qui révèlent la couche du dessous, liseré dentelé ---------- */
      function pickCellSpot() {
        let best = -1, bd = 0;
        for (let k = 0; k < 14; k++) {
          const x = U.randInt(4, gw - 5), y = U.randInt(4, gh - 5), i = y * gw + x;
          if (Hh[i] < 0.8) continue;
          const j = i + 3 * (Math.random() < 0.5 ? 1 : gw);
          const dc = Math.abs(R[j] - R[i]) + Math.abs(G[j] - G[i]) + Math.abs(B[j] - B[i]);
          if (best < 0 || dc > bd) { best = i; bd = dc; }
        }
        return best;
      }
      function spawnCell(cxp, cyp, rr, quiet) {
        sess = null;
        let i = -1, x = 0, y = 0;
        if (cxp == null) { i = pickCellSpot(); if (i < 0) return; x = i % gw; y = (i / gw) | 0; }
        else { x = Math.round(cxp); y = Math.round(cyp); if (x < 2 || y < 2 || x > gw - 3 || y > gh - 3) return; i = y * gw + x; if (Hh[i] < 0.6) return; }
        // couleur « du dessous » : une autre couleur versée, un peu éclaircie
        let cr = R[i], cg = G[i], cb = B[i];
        const alt = used.filter((c) => Math.abs(c[0] - R[i]) + Math.abs(c[1] - G[i]) + Math.abs(c[2] - B[i]) > 0.3);
        if (alt.length && Math.random() < 0.85) { const c = U.pick(alt); cr = c[0]; cg = c[1]; cb = c[2]; }
        const lift = U.rand(0.0, 0.15);
        cr = U.lerp(cr, 1, lift); cg = U.lerp(cg, 1, lift); cb = U.lerp(cb, 1, lift);
        const lace = laceWhite ? [1, 0.99, 0.98] : [R[i] * 0.55, G[i] * 0.52, B[i] * 0.6];
        const r = rr || U.rand(1.1, 4.2) * Math.max(1, 2.2 / cell) * (Math.random() < 0.15 ? 1.8 : 1);
        const n = Math.ceil(r + 2.5);
        const ph = Math.random() * TAU;
        const x0 = Math.max(0, x - n), x1 = Math.min(gw - 1, x + n), y0 = Math.max(0, y - n), y1 = Math.min(gh - 1, y + n);
        for (let yy = y0; yy <= y1; yy++) {
          for (let xx = x0; xx <= x1; xx++) {
            const j = yy * gw + xx;
            if (Hh[j] < 0.5) continue;
            const a = Math.atan2(yy - y, xx - x);
            const d = Math.hypot(xx - x, yy - y) / (1 + 0.035 * Math.sin(a * 5 + ph) + 0.025 * Math.sin(a * 3 - ph));
            if (d < r) {
              const t = d / r;
              R[j] = U.lerp(cr, R[j], t * t * t * 0.2); G[j] = U.lerp(cg, G[j], t * t * t * 0.2); B[j] = U.lerp(cb, B[j], t * t * t * 0.2);
              BU[j] = -0.12 * (1 - t * t);
            } else if (d < r + 1.1) {
              const k = 0.95 * Math.min(1, 1.6 * (1 - (d - r) / 1.1));
              R[j] = U.lerp(R[j], lace[0], k); G[j] = U.lerp(G[j], lace[1], k); B[j] = U.lerp(B[j], lace[2], k);
              BU[j] = 0.07 * k;
            }
          }
        }
        // petites cellules satellites
        if (r > 2.6 && Math.random() < 0.6) {
          for (let k = 0; k < U.randInt(1, 3); k++) {
            const a = Math.random() * TAU, dd = r + U.rand(1.5, 4);
            spawnCell(x + Math.cos(a) * dd, y + Math.sin(a) * dd, U.rand(0.8, 1.6), true);
          }
        }
        markDirty(x0, y0, x1, y1);
        if (!quiet && Math.random() < 0.5) SG.audio.pop(U.rand(2.2, 3), 0.04);
      }

      /* ---------- Rendu (vernis brillant), par cellule et par zone ---------- */
      function renderRows(y0, y1, L, Rr) {
        const d = img.data, S = 2.2;
        const iw = 1 / gw, ih = 1 / gh;
        const HH = Hh, BB = BU;
        const hgt = (j) => (HH[j] > 0.6 ? 0.6 : HH[j]) + BB[j];
        for (let y = y0; y <= y1; y++) {
          const x0 = L[y], x1 = Rr[y];
          if (x1 < x0) continue;
          const yu = y > 0 ? -gw : 0, yd = y < gh - 1 ? gw : 0;
          for (let x = x0; x <= x1; x++) {
            const i = y * gw + x, o = i * 4;
            const h = Hh[i];
            let a = (h - 0.03) * 9;
            if (a <= 0) { d[o + 3] = 0; continue; }
            if (a > 1) a = 1;
            const xl = x > 0 ? i - 1 : i, xr = x < gw - 1 ? i + 1 : i;
            let nx = (hgt(xl) - hgt(xr)) * S, ny = (hgt(i + yu) - hgt(i + yd)) * S;
            const inv = 1 / Math.sqrt(nx * nx + ny * ny + 1);
            nx *= inv; ny *= inv;
            let df = nx * LX + ny * LY + inv * LZ; if (df < 0) df = 0;

            if (sp > 0) { const s2 = sp * sp, s4 = s2 * s2, s8 = s4 * s4, s16 = s8 * s8, s32 = s16 * s16; sp = s32 * s32; } else sp = 0;
            // vernis : reflet doux qui glisse en diagonale + spéculaire sur les reliefs
            const u = x * iw + y * ih * 0.6 + (nx + ny) * 0.4;

            d[o] = r > 1 ? 255 : r * 255;
            d[o + 1] = g > 1 ? 255 : g * 255;

          }

      }
      // Spans élargis d'une cellule (les normales dépendent des voisines), puis un seul putImageData
      let spL = null, spR = null;
      function flush() {
        if (dY1 < 0) return;
        if (!spL || spL.length !== gh) { spL = new Int32Array(gh); spR = new Int32Array(gh); }
        const y0 = Math.max(0, dY0 - 1), y1 = Math.min(gh - 1, dY1 + 1);
        let mnx = gw, mxx = -1;
        for (let y = y0; y <= y1; y++) {
          let l = gw, r = -1;
          for (let k = -1; k <= 1; k++) {
            const yy = y + k;
            if (yy < 0 || yy >= gh) continue;
            if (rowL[yy] < l) l = rowL[yy];
            if (rowR[yy] > r) r = rowR[yy];
          }
          if (r >= l) { l = Math.max(0, l - 1); r = Math.min(gw - 1, r + 1); if (l < mnx) mnx = l; if (r > mxx) mxx = r; }
          spL[y] = l; spR[y] = r;
        }
        for (let y = Math.max(0, dY0); y <= Math.min(gh - 1, dY1); y++) { rowL[y] = gw; rowR[y] = -1; }
        dY0 = 1e9; dY1 = -1;
        if (mxx < mnx) return;
        renderRows(y0, y1, spL, spR);
        offCtx.putImageData(img, 0, 0, mnx, y0, mxx - mnx + 1, y1 - y0 + 1);
      }

      /* ---------- Gobelet, chalumeau ---------- */
      function cupColors(a) {
        if (a && a.col) return a.col;
        if (cupHex !== 'mix') return toRgb(cupHex);
        return toRgb(mixList[0] || CUPS[0]);
      }
      function drawCup(x, y, a, pouring) {
        const col = cupColors(a);
        const tilt = pouring ? -1.0 : -0.35;
        ctx.save();
        ctx.fillStyle = 'rgba(80,60,120,0.12)';
        ctx.beginPath(); ctx.ellipse(x + 30, y + 4, 22, 7, 0, 0, TAU); ctx.fill();
        if (pouring) {
          const lx = x - 3.8, ly = y - 53.5;
          const wob = Math.sin(performance.now() / 45) * 1.5;
          ctx.lineCap = 'round';
          ctx.strokeStyle = css(col[0] * 0.88, col[1] * 0.86, col[2] * 0.9); ctx.lineWidth = 7;
          ctx.beginPath(); ctx.moveTo(lx, ly); ctx.quadraticCurveTo(x - 6 + wob, y - 26, x, y); ctx.stroke();
          ctx.strokeStyle = css(col[0], col[1], col[2]); ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(lx, ly); ctx.quadraticCurveTo(x - 6 + wob, y - 26, x, y); ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(lx - 1.5, ly + 2); ctx.quadraticCurveTo(x - 8 + wob, y - 26, x - 1.8, y - 4); ctx.stroke();
          ctx.fillStyle = css(col[0], col[1], col[2]);
          ctx.beginPath(); ctx.ellipse(x, y, 8, 5, 0, 0, TAU); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.beginPath(); ctx.ellipse(x - 2, y - 1.5, 3, 1.5, 0, 0, TAU); ctx.fill();
        }
        ctx.translate(x + 30, y - 58); ctx.rotate(tilt);
        const body = () => {
          ctx.beginPath();
          ctx.moveTo(-22, -26); ctx.lineTo(22, -26); ctx.lineTo(16, 26);
          ctx.quadraticCurveTo(0, 30, -16, 26); ctx.closePath();
        };
        ctx.save(); body(); ctx.clip();
        ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(-24, -28, 48, 60);
        if (cupHex === 'mix' && mixList.length) {
          for (let k = 0; k < 4; k++) {
            const c = toRgb(mixList[k % mixList.length]);
            ctx.fillStyle = css(c[0], c[1], c[2]);
            ctx.beginPath(); ctx.moveTo(-24, -12 + k * 10); ctx.bezierCurveTo(-8, -16 + k * 10, 8, -6 + k * 10, 24, -12 + k * 10); ctx.lineTo(24, 32); ctx.lineTo(-24, 32); ctx.fill();
          }
        } else {
          ctx.fillStyle = css(col[0], col[1], col[2]); ctx.fillRect(-24, -12, 48, 44);
        }
        const g = ctx.createLinearGradient(-22, 0, 22, 0);
        g.addColorStop(0, 'rgba(255,255,255,0.15)'); g.addColorStop(0.3, 'rgba(255,255,255,0.45)');
        g.addColorStop(0.55, 'rgba(255,255,255,0.05)'); g.addColorStop(1, 'rgba(80,60,110,0.18)');
        ctx.fillStyle = g; ctx.fillRect(-24, -28, 48, 60);
        ctx.restore();
        ctx.strokeStyle = 'rgba(150,140,180,0.45)'; ctx.lineWidth = 1.2; body(); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.ellipse(0, -26, 22, 4.5, 0, 0, TAU); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-13, -18); ctx.lineTo(-10, 18); ctx.stroke();
        ctx.restore();
      }
      function drawTorch(x, y, on) {
        ctx.save();
        ctx.translate(x, y);
        if (on) {
          // lueur chaude sur la peinture
          const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, 34);
          gl.addColorStop(0, 'rgba(255,200,120,0.35)'); gl.addColorStop(1, 'rgba(255,200,120,0)');
          ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fill();
          const fl = 1 + Math.sin(performance.now() / 30) * 0.08;
          const f1 = ctx.createLinearGradient(0, -46, 0, -2);
          f1.addColorStop(0, 'rgba(90,140,255,0.9)'); f1.addColorStop(0.55, 'rgba(140,190,255,0.7)'); f1.addColorStop(1, 'rgba(255,220,160,0.15)');
          ctx.fillStyle = f1;
          ctx.beginPath(); ctx.moveTo(-5, -46); ctx.quadraticCurveTo(-9 * fl, -20, 0, -2); ctx.quadraticCurveTo(9 * fl, -20, 5, -46); ctx.closePath(); ctx.fill();
          ctx.fillStyle = 'rgba(230,245,255,0.9)';
          ctx.beginPath(); ctx.moveTo(-2.5, -46); ctx.quadraticCurveTo(-3.5, -30, 0, -20); ctx.quadraticCurveTo(3.5, -30, 2.5, -46); ctx.closePath(); ctx.fill();
        }
        // corps du chalumeau
        ctx.fillStyle = 'rgba(70,50,90,0.15)';
        ctx.beginPath(); ctx.ellipse(22, 8, 24, 7, 0, 0, TAU); ctx.fill();
        const mg = ctx.createLinearGradient(-6, 0, 6, 0);
        mg.addColorStop(0, '#9aa3b1'); mg.addColorStop(0.4, '#f4f6fa'); mg.addColorStop(1, '#8a93a1');
        ctx.fillStyle = mg;
        ctx.fillRect(-5, -66, 10, 20);
        const bgc = ctx.createLinearGradient(-14, 0, 14, 0);
        bgc.addColorStop(0, '#ff8fb1'); bgc.addColorStop(0.4, '#ffc2d4'); bgc.addColorStop(1, '#e8789c');
        ctx.fillStyle = bgc;
        rrect(ctx, -14, -116, 28, 52, 9); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(-9, -110, 4, 40);
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, W, Hs);
        ctx.save();
        const mx = tx + tw / 2, my = ty + th / 2;
        ctx.translate(mx, my);
        ctx.transform(1, gY * 0.03, gX * 0.03, 1, 0, 0);
        const sc = 1 - Math.hypot(gX, gY) * 0.015;
        ctx.scale(sc, sc);
        ctx.translate(-mx, -my);
        ctx.drawImage(bg, 0, 0, W, Hs);
        ctx.save();
        rrect(ctx, tx, ty, tw, th, rad); ctx.clip();
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(off, tx, ty, gw * cell, gh * cell);
        for (const r of ripples) {
          ctx.strokeStyle = `rgba(255,255,255,${(0.45 * (1 - r.t)).toFixed(3)})`;
          ctx.lineWidth = 1.3;
          ctx.beginPath(); ctx.ellipse(r.x, r.y, 6 + r.t * 26, (6 + r.t * 26) * 0.85, 0, 0, TAU); ctx.stroke();
        }
        ctx.restore();
        // coulures sur la tranche
        for (const p of drips) {
          ctx.fillStyle = css(p.col[0], p.col[1], p.col[2], Math.min(1, p.life * 1.5));
          ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * (1 + p.st), Math.atan2(p.vy, p.vx) + Math.PI / 2, 0, TAU); ctx.fill();
          ctx.fillStyle = `rgba(255,255,255,${(0.5 * Math.min(1, p.life)).toFixed(3)})`;
          ctx.beginPath(); ctx.arc(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.3, 0, TAU); ctx.fill();
        }
        ctx.restore();
        // étincelles de chaleur
        for (const s of sparks) {
          ctx.fillStyle = `rgba(255,${(200 + 55 * s.life) | 0},150,${(s.life * 0.8).toFixed(3)})`;
          ctx.beginPath(); ctx.arc(s.x, s.y, 1.2, 0, TAU); ctx.fill();
        }
        // outils au premier plan
        let any = false;
        acts.forEach((a) => {
          if (a.mode === 'pour') { any = true; drawCup(a.x, a.y - a.off, a, a.inside); }
          else if (a.mode === 'torch') { any = true; drawTorch(a.x, a.y - a.off, true); }
          else if (a.mode === 'swipe') {
            any = true;
            ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, TAU); ctx.fill(); ctx.stroke();
          }
        });
        if (!any && hover) {
          if (mode === 'pour') drawCup(hover.x, hover.y, null, false);
          else if (mode === 'torch') drawTorch(hover.x, hover.y, false);
        }
      }

      /* ---------- Entrées ---------- */
      function ensureAudio() {
        if (loops.pour) return;
        loops.pour = SG.audio.loop('pour'); loops.hum = SG.audio.loop('hum');
        loops.smear = SG.audio.loop('smear'); loops.paint = SG.audio.loop('paint'); loops.flame = SG.audio.loop('flame');
      }
      function nextMix(a) {
        a.mixI = (a.mixI + 1) % mixList.length;
        a.col = toRgb(mixList[a.mixI]);
        a.mixT = U.rand(0.18, 0.38);
      }
      function noteUsed(col) {
        if (!used.some((c) => Math.abs(c[0] - col[0]) + Math.abs(c[1] - col[1]) + Math.abs(c[2] - col[2]) < 0.05)) {
          used.push(col.slice()); if (used.length > 10) used.shift();
        }
      }
      const inToile = (x, y) => x > tx + 2 && x < tx + tw - 2 && y > ty + 2 && y < ty + th - 2;
      const touchOff = (p) => (p.e && p.e.pointerType === 'touch' ? 40 : 0);
      const ptr = SG.pointer(cv.canvas, {
        down(p) {
          ensureAudio();
          pop.hide();
          if (mode === 'tilt') {
            acts.set(p.id, { mode: 'tilt', x0: p.x, y0: p.y, bx: tgX, by: tgY });
            autoT = 0;
            SG.haptic(10);
            return;
          }
          if (mode === 'swipe') {
            acts.set(p.id, { mode: 'swipe', x: p.x, y: p.y, r: Math.max(14, Math.min(tw, th) * 0.06), travel: 0, speed: 0 });
            SG.audio.squish(1.2, 0.2);
            return;
          }
          if (mode === 'torch') {
            acts.set(p.id, { mode: 'torch', x: p.x, y: p.y, off: touchOff(p), acc: 0 });
            SG.audio.whoosh(0.25, 0.25, true); SG.haptic(10);
            return;
          }
          const a = {
            mode: 'pour', x: p.x, y: p.y, off: touchOff(p),
            hold: 0, acc: 0, col: null, mixI: -1, mixT: 0, inside: false, chT: 0, lx: p.x, ly: p.y,
          };
          if (cupHex === 'mix') nextMix(a); else a.col = toRgb(cupHex);
          acts.set(p.id, a);
          SG.haptic(10);
        },
        move(p) {
          const a = acts.get(p.id);
          if (!a) return;
          if (a.mode === 'tilt') {
            const dx = a.bx + (p.x - a.x0) / 110, dy = a.by + (p.y - a.y0) / 110;
            const l = Math.hypot(dx, dy), k = l > 1 ? 1 / l : 1;
            tgX = dx * k; tgY = dy * k;
            return;
          }
          if (a.mode === 'swipe') {
            const gx0 = (a.x - tx) / cell - 0.5, gy0 = (a.y - ty) / cell - 0.5;
            const gx1 = (p.x - tx) / cell - 0.5, gy1 = (p.y - ty) / cell - 0.5;
            const dist = Math.hypot(gx1 - gx0, gy1 - gy0);
            const steps = Math.min(40, Math.ceil(dist / 1.2));
            for (let k = 1; k <= steps; k++) {
              const t0 = (k - 1) / steps, t1 = k / steps;
              swipeStep(U.lerp(gx0, gx1, t1), U.lerp(gy0, gy1, t1), (gx1 - gx0) * (t1 - t0) * 1.1, (gy1 - gy0) * (t1 - t0) * 1.1, a.r / cell);
            }
            a.travel += Math.hypot(p.dx, p.dy);
            a.speed = p.speed;
            if (a.travel > 26) { // la traîne fait éclore de petites cellules
              a.travel = 0;
              const back = Math.atan2(-(p.dy), -(p.dx)) + U.rand(-0.8, 0.8);
              spawnCell(gx1 + Math.cos(back) * (a.r / cell) * 0.9, gy1 + Math.sin(back) * (a.r / cell) * 0.9, null, true);
            }
          }
          a.x = p.x; a.y = p.y;
        },
        up(p) {
          const a = acts.get(p.id);
          acts.delete(p.id);
          if (!a) return;
          if (a.mode === 'tilt') { tgX = 0; tgY = 0; } // la toile revient doucement à plat
          else if (a.mode === 'pour') {
            if (sess && sess.owner === a) sess = null;
            if (a.hold > 0.3) { cellBudget += 4; SG.audio.chime(chimeStep++ % 10, 0.07); }
            if (a.inside) SG.audio.drip(U.rand(0.9, 1.2), 0.25);
          }
        },
        hover(p) { hover = p.e && p.e.pointerType === 'mouse' ? { x: p.x, y: p.y } : null; },
      });
      const onLeave = () => { hover = null; };
      cv.canvas.addEventListener('pointerleave', onLeave);

      /* ---------- Interface ---------- */
      function newMix() { mixList = CUPS.slice(0, 12).sort(() => Math.random() - 0.5).slice(0, 4); }
      newMix();
      let hintEl = null;
      const hint = (t, ms = 2800) => { if (hintEl) hintEl.remove(); hintEl = SG.hint(stage, t, ms); };
      const toolNames = ['pour', 'swipe', 'tilt', 'torch'];
      const items = [
        { color: 'conic-gradient(#ff8fb8,#ffd95e,#6fdcb0,#6fb7ff,#a98bff,#ff8fb8)', title: 'Couleur', onClick() { pop.toggle(bar.offsetHeight + 24); } },
        { icon: '🫗', label: 'Verser', onClick() { setMode('pour'); } },
        { icon: '👆', label: 'Étaler', onClick() { setMode('swipe'); hint('Glisse le doigt pour étirer la peinture'); } },
        {
          icon: '↗️', label: 'Incliner',
          onClick() {
            setMode('tilt'); autoT = 3.6; autoPh = Math.random() * TAU;
            SG.haptic(15); SG.audio.whoosh(0.2, 0.6);
            hint('Glisse pour incliner la toile dans tous les sens');
          },
        },
        { icon: '🔥', label: 'Torche', onClick() { setMode('torch'); hint('Maintiens au-dessus de la peinture : les cellules éclosent'); } },
        {
          icon: '🖼️', title: 'Nouvelle toile',
          onClick() {
            pop.hide();
            if (wiping > 0) return;
            wiping = 0.45; laceWhite = Math.random() < 0.6;
            SG.audio.whoosh(0.35, 0.5, true); SG.audio.squish(0.5, 0.4); SG.haptic(20);
          },
        },
      ];
      bar = SG.toolbar(stage, items);
      swatchBtn = bar.children[0];
      const toolBtns = Array.from(bar.children).slice(1, 5);
      function setMode(m) {
        mode = m; pop.hide();
        toolBtns.forEach((b, i) => b.classList.toggle('active', toolNames[i] === m));
      }
      const pop = colorPop(stage, CUPS, (hex) => {
        cupHex = hex;
        if (hex === 'mix') newMix();
        swatchBtn.style.setProperty('--swatch', hex === 'mix' ? 'conic-gradient(#ff8fb8,#ffd95e,#6fdcb0,#6fb7ff,#a98bff,#ff8fb8)' : hex);
        SG.audio.plop(1.2, 0.3);
        setMode('pour');
      });
      setMode('pour');
      const progress = SG.progress(stage, 'Toile');
      hint('Maintiens appuyé pour verser, puis incline la toile', 4200);

      cv.onResize(layout);
      layout(cv.w, cv.h);

      /* ---------- Boucle ---------- */
      const loop = SG.loop((dt) => {
        let pouring = false, flaming = false, swiping = 0;
        acts.forEach((a) => {
          if (a.mode === 'pour') {
            const lx = a.x, ly = a.y - a.off;
            a.inside = inToile(lx, ly);
            if (!a.inside) return;
            pouring = true;
            a.hold += dt;
            if (cupHex === 'mix') {
              a.mixT -= dt;
              if (a.mixT <= 0) { nextMix(a); SG.audio.chime(chimeStep++ % 10, 0.04); }
            }
            a.chT += dt;
            if (a.chT > 0.35) { a.chT = 0; SG.audio.bubble(U.rand(0.6, 1), 0.08); }
            const rate = gw * gh * 0.055 * (0.6 + Math.min(1, a.hold / 1.2) * 0.8);
            a.acc += rate * dt;
            // en bougeant, on verse le long du chemin
            const moved = Math.hypot(lx - a.lx, ly - (a.ly - a.off));
            // petites poussées fréquentes : plus fluide et bien moins coûteux qu'une grosse
            // nouvelle session si le gobelet s'est déplacé (ou un autre doigt versait)
            if (!sess || sess.owner !== a || moved > 7) {
              startSession((lx - tx) / cell - 0.5, (ly - ty) / cell - 0.5, a);
              a.lx = lx; a.ly = a.y;
            }
            if (a.acc > 0) {
              sessionPour(a.acc / Math.PI, a.col);
              noteUsed(a.col);
              a.acc = 0;
              if (ripples.length < 5 && Math.random() < 0.08) ripples.push({ x: lx, y: ly, t: 0 });
            }
          } else if (a.mode === 'torch') {
            const x = a.x, y = a.y - a.off;
            if (!inToile(x, y)) return;
            flaming = true;
            a.acc += dt * 22;
            const gx = (x - tx) / cell - 0.5, gy = (y - ty) / cell - 0.5, rr = 26 / cell;
            while (a.acc >= 1) {
              a.acc -= 1;
              const an = Math.random() * TAU, dd = Math.sqrt(Math.random()) * rr;
              spawnCell(gx + Math.cos(an) * dd, gy + Math.sin(an) * dd, null, Math.random() < 0.6);
            }
            if (Math.random() < 0.5 && sparks.length < 60) sparks.push({ x: x + U.rand(-10, 10), y: y - U.rand(0, 8), vx: U.rand(-20, 20), vy: U.rand(-60, -20), life: 1 });
          } else if (a.mode === 'swipe') {
            swiping = Math.max(swiping, Math.min(1, a.speed * 1.5));
            a.speed *= 0.85;
          }
        });
        for (let k = ripples.length - 1; k >= 0; k--) { ripples[k].t += dt * 1.8; if (ripples[k].t >= 1) ripples.splice(k, 1); }
        for (let k = sparks.length - 1; k >= 0; k--) { const s = sparks[k]; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 2; if (s.life <= 0) sparks.splice(k, 1); }
        // inclinaison (auto ou au doigt)
        let tiltDrag = false;
        acts.forEach((a) => { if (a.mode === 'tilt') tiltDrag = true; });
        if (autoT > 0 && !tiltDrag) {
          autoT -= dt; autoPh += dt * 1.7;
          const amp = 0.85 * Math.sin(Math.PI * U.clamp(1 - autoT / 3.6, 0, 1));
          tgX = Math.cos(autoPh) * amp; tgY = Math.sin(autoPh) * amp;
          if (autoT <= 0) { tgX = 0; tgY = 0; }
        }
        gX = U.lerp(gX, tgX, Math.min(1, dt * 5)); gY = U.lerp(gY, tgY, Math.min(1, dt * 5));
        const gl = Math.hypot(gX, gY);
        if (gl > 0.03) {
          tiltAcc += gl * dt * 34;
          if (tiltAcc >= TILT_MIN[SG.quality.level]) {
            tiltStep(tiltAcc / gl); tiltAcc = 0;
          }
          if (gl > 0.3 && Math.random() < gl * 0.6 && drips.length < 40) {
            let ex, ey;
            if (Math.abs(gX) > Math.abs(gY)) { ex = gX > 0 ? gw - 2 : 1; ey = U.randInt(2, gh - 3); }
            else { ey = gY > 0 ? gh - 2 : 1; ex = U.randInt(2, gw - 3); }
            const i = ey * gw + ex;
            if (Hh[i] > 0.6) {
              drips.push({
                x: tx + (ex + 0.5) * cell, y: ty + (ey + 0.5) * cell, vx: (gX / gl) * U.rand(20, 40), vy: (gY / gl) * U.rand(20, 40),
                r: U.rand(2.5, 4.5), col: [R[i], G[i], B[i]], life: 1, st: 0,
              });
              if (Math.random() < 0.15) SG.audio.drip(U.rand(1.1, 1.5), 0.12);
            }
          }
          if (Math.random() < gl * 0.1) cellBudget += 1;
        }
        for (let k = drips.length - 1; k >= 0; k--) {
          const p = drips[k];
          p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 + dt; p.vy *= 1 + dt;
          p.st = Math.min(1.8, p.st + dt * 2); p.life -= dt * 0.9;
          if (p.life <= 0) drips.splice(k, 1);
        }
        if (cellBudget > 0 && !pouring) {
          cellT -= dt;
          if (cellT <= 0) { cellT = U.rand(0.06, 0.2); cellBudget--; spawnCell(); }
        }
        // nouvelle toile
        if (wiping > 0) {
          wiping -= dt;
          for (let i = 0; i < N; i++) Hh[i] *= 0.8;
          markDirty(0, 0, gw - 1, gh - 1);
          if (wiping <= 0) {
            Hh.fill(0); R.fill(1); G.fill(1); B.fill(1); BU.fill(0); sess = null;
            celebrated = false; cellBudget = 0; newMix(); used.length = 0;
          }
        }
        covT += dt;
        if (covT > 0.3) {
          covT = 0;
          let c = 0;
          for (let i = 0; i < N; i += 3) if (Hh[i] > 0.5) c++;
          cover = (c * 3) / N;
          progress.set(cover / 0.97);
          if (!celebrated && cover >= 0.97) { celebrated = true; SG.celebrate(stage, 'Chef-d’œuvre !'); }
        }
        // sons
        const sm = (a, b, k) => U.lerp(a, b, k);
        lvPour = sm(lvPour, pouring ? 0.6 : 0, 0.15);
        lvFlow = sm(lvFlow, gl > 0.05 && cover > 0.02 ? Math.min(1, gl * 0.9) : 0, 0.12);
        lvSwipe = sm(lvSwipe, swiping, 0.3);
        lvFlame = sm(lvFlame, flaming ? 0.75 : 0, 0.25);
        if (loops.pour) {
          loops.pour.set(lvPour, 0.3 + 0.15 * Math.sin(performance.now() / 300));
          loops.hum.set(lvPour * 0.35, 0.3);
          loops.smear.set(lvFlow * 0.8, 0.12 + gl * 0.3);
          loops.paint.set(lvSwipe, 0.25 + 0.4 * lvSwipe);
          loops.flame.set(lvFlame, 0.5);
        }
        flush();
        draw();
      });

      return {
        destroy() {
          loop.stop();
          ptr.destroy();
          cv.canvas.removeEventListener('pointerleave', onLeave);
          Object.values(loops).forEach((l) => l.stop());
          cv.destroy();
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/bubble.js */
/* Papier bulle — éclate les bulles une à une, presse-les lentement pour les faire gonfler et claquer,
   glisse pour en éclater des rangées, ou froisse la feuille (deux doigts / outil « Froisser »). */
(function () {
  'use strict';
  const U = SG.util;
  const TAU = Math.PI * 2;
  const HUES = [200, 330, 160, 265, 28, 185, 300];
  const SIZES = { s: 15, m: 21, l: 28 };

  // Générateur pseudo-aléatoire reproductible (froissures, reflets)
  const rng = (seed) => {
    let s = (seed >>> 0) || 1;
    return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
  };
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  function rrect(g, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function sprite(half, dpr, draw) {
    const c = document.createElement('canvas');
    c.width = c.height = Math.max(2, Math.ceil(half * 2 * dpr));
    const g = c.getContext('2d');
    g.scale(c.width / (half * 2), c.height / (half * 2));
    g.translate(half, half);
    draw(g);
    c.half = half;
    return c;
  }

  function star(g, x, y, s, a) {
    if (s <= 0 || a <= 0) return;
    g.globalAlpha = a;
    g.beginPath();
    g.moveTo(x, y - s);
    g.quadraticCurveTo(x, y, x + s, y);
    g.quadraticCurveTo(x, y, x, y + s);
    g.quadraticCurveTo(x, y, x - s, y);
    g.quadraticCurveTo(x, y, x, y - s);
    g.fill();
    g.globalAlpha = 1;
  }

  // Bulle intacte : plastique translucide bombé (ombre dessinée à part)
  function drawBubble(g, r, hue, sup) {
    // Collerette soudée autour de la bulle
    g.lineWidth = 1;
    g.strokeStyle = U.hsl(hue, 40, 98, 0.55);
    g.beginPath(); g.arc(0, 0, r * 1.08, 0, TAU); g.stroke();
    let gr = g.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.05, 0, 0, r);
    if (sup) {
      gr.addColorStop(0, 'rgba(255,255,255,0.95)');
      gr.addColorStop(0.5, 'rgba(255,236,200,0.6)');
      gr.addColorStop(1, 'rgba(255,180,160,0.75)');
    } else {
      gr.addColorStop(0, 'rgba(255,255,255,0.8)');
      gr.addColorStop(0.45, U.hsl(hue, 75, 93, 0.32));
      gr.addColorStop(0.85, U.hsl(hue, 55, 82, 0.42));
      gr.addColorStop(1, U.hsl(hue, 45, 70, 0.6));
    }
    g.fillStyle = gr;
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    // lumière qui traverse la bulle et se concentre sur la feuille (caustique)
    gr = g.createRadialGradient(r * 0.3, r * 0.38, 0, r * 0.3, r * 0.38, r * 0.5);
    gr.addColorStop(0, 'rgba(255,255,255,0.55)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(r * 0.3, r * 0.38, r * 0.5, 0, TAU); g.fill();
    if (sup) {
      let ir;
      if (g.createConicGradient) {
        ir = g.createConicGradient(0.6, 0, 0);
        const cs = ['#ffb5c8', '#ffe39a', '#b9f0d4', '#b8dcff', '#d6c4ff', '#ffb5c8'];
        cs.forEach((c, i) => ir.addColorStop(i / (cs.length - 1), c));
      } else {
        ir = g.createLinearGradient(-r, -r, r, r);
        ir.addColorStop(0, '#ffb5c8'); ir.addColorStop(0.5, '#b8dcff'); ir.addColorStop(1, '#d6c4ff');
      }
      g.globalAlpha = 0.5;
      g.fillStyle = ir;
      g.beginPath(); g.arc(0, 0, r * 0.97, 0, TAU); g.fill();
      g.globalAlpha = 1;
      gr = g.createRadialGradient(-r * 0.3, -r * 0.35, 0, 0, 0, r);
      gr.addColorStop(0, 'rgba(255,255,255,0.75)');
      gr.addColorStop(0.6, 'rgba(255,255,255,0)');
      g.fillStyle = gr;
      g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    }
    g.lineWidth = Math.max(1, r * 0.06);
    g.strokeStyle = 'rgba(255,255,255,0.8)';
    g.beginPath(); g.arc(0, 0, r * 0.96, 0, TAU); g.stroke();
    g.lineWidth = Math.max(1, r * 0.08);
    g.strokeStyle = sup ? 'rgba(220,140,120,0.35)' : U.hsl(hue, 40, 60, 0.3);
    g.beginPath(); g.arc(0, 0, r * 0.97, -0.1 * Math.PI, 0.75 * Math.PI); g.stroke();
    g.lineCap = 'round';
    g.lineWidth = r * 0.09;
    g.strokeStyle = 'rgba(255,255,255,0.5)';
    g.beginPath(); g.arc(0, 0, r * 0.76, 0.12 * Math.PI, 0.5 * Math.PI); g.stroke();
    g.save();
    g.translate(-r * 0.36, -r * 0.42);
    g.rotate(-0.7);
    g.scale(1, 0.55);
    gr = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.34);
    gr.addColorStop(0, 'rgba(255,255,255,0.95)');
    gr.addColorStop(0.6, 'rgba(255,255,255,0.55)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(0, 0, r * 0.34, 0, TAU); g.fill();
    g.restore();
    g.fillStyle = 'rgba(255,255,255,0.95)';
    g.beginPath(); g.arc(-r * 0.08, -r * 0.62, r * 0.07, 0, TAU); g.fill();
  }

  // Ombre douce d'une bulle sur la feuille
  function drawShadow(g, r) {
    const gr = g.createRadialGradient(r * 0.18, r * 0.3, r * 0.3, r * 0.18, r * 0.3, r * 1.2);
    gr.addColorStop(0, 'rgba(90,60,110,0.24)');
    gr.addColorStop(1, 'rgba(90,60,110,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(r * 0.18, r * 0.3, r * 1.2, 0, TAU); g.fill();
  }

  // Bulle éclatée : film aplati et froissé
  function drawPopped(g, r, hue, seed) {
    const R = rng(seed);
    const n = 22, pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const rr = r * (0.78 + R() * 0.12 + (i % 2) * 0.05);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    g.beginPath();
    pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
    g.closePath();
    let gr = g.createRadialGradient(r * 0.25, r * 0.3, 0, 0, 0, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.32)');
    gr.addColorStop(0.65, U.hsl(hue, 45, 86, 0.22));
    gr.addColorStop(1, U.hsl(hue, 35, 68, 0.32));
    g.fillStyle = gr;
    g.fill();
    g.lineJoin = 'round';
    g.lineWidth = 1;
    g.strokeStyle = 'rgba(255,255,255,0.65)';
    g.stroke();
    g.lineCap = 'round';
    for (let k = 0; k < 8; k++) {
      let a = R() * TAU;
      const d0 = R() * r * 0.35;
      let x = Math.cos(a) * d0, y = Math.sin(a) * d0;
      const seg = [[x, y]];
      for (let s = 0; s < 3; s++) {
        a += (R() - 0.5) * 1.6;
        const l = r * (0.14 + R() * 0.2);
        x += Math.cos(a) * l; y += Math.sin(a) * l;
        if (Math.hypot(x, y) > r * 0.78) break;
        seg.push([x, y]);
      }
      if (seg.length < 2) continue;
      [[0.9, U.hsl(hue, 30, 45, 0.18)], [0, 'rgba(255,255,255,0.7)']].forEach(([o, c]) => {
        g.strokeStyle = c;
        g.lineWidth = o ? 1.2 : 1;
        g.beginPath();
        seg.forEach((p, i) => (i ? g.lineTo(p[0] + o, p[1] + o) : g.moveTo(p[0] + o, p[1] + o)));
        g.stroke();
      });
    }
    const fa = R() * TAU;
    g.strokeStyle = U.hsl(hue, 30, 50, 0.4);
    g.lineWidth = 1.3;
    g.beginPath(); g.arc(0, 0, r * 0.45, fa, fa + 0.7); g.stroke();
  }

  SG.registerGame({
    id: 'bubble',
    title: 'Papier bulle',
    emoji: '🫧',
    desc: 'Éclate les bulles, presse-les doucement, ou froisse toute la feuille.',
    color: '#b8dcff',
    bg: 'linear-gradient(160deg, #fdf1f6 0%, #eef4ff 100%)',
    order: 7,
    create(stage) {
      const cv = SG.makeCanvas(stage);
      const ctx = cv.ctx;
      const A = SG.audio;
      let size = 's';
      let hueIdx = U.randInt(0, HUES.length - 1);
      let cur = null, trans = null, rollSnd = null, crinkleL = null, crinkleLv = 0;
      let nextSheetIn = 0, lastHaptic = 0, crumpleMode = false;
      const parts = [];
      const sndQ = [];
      const cascade = [];
      const fingers = new Map();
      const timers = [];
      const later = (fn, ms) => timers.push(setTimeout(fn, ms));

      const prog = SG.progress(stage, 'Bulles');
      const progLabel = prog.el.querySelector('.pl');
      const updateProg = () => {
        if (!cur) return;
        const n = cur.total - cur.left;
        prog.set(n / cur.total);
        progLabel.textContent = n + ' / ' + cur.total;
      };

      /* ---------- Feuille ---------- */
      function sheetRect() {
        const { w, h } = cv;
        return { x: 8, y: 8, W: w - 16, H: h - 16, rad: 22 };
      }
      function buildBg(sh) {
        const { w, h, dpr } = cv;
        const c = sh.bg || document.createElement('canvas');
        c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
        const g = c.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, w, h);
        const { x, y, W, H, rad } = sheetRect();
        g.save();
        g.shadowColor = 'rgba(120,80,120,0.22)';
        g.shadowBlur = 22 * dpr; g.shadowOffsetY = 8 * dpr;
        const lg = g.createLinearGradient(0, y, 0, y + H);
        lg.addColorStop(0, U.hsl(sh.hue, 70, 96, 0.94));
        lg.addColorStop(1, U.hsl(sh.hue, 55, 90, 0.94));
        g.fillStyle = lg;
        rrect(g, x, y, W, H, rad); g.fill();
        g.restore();
        const R = rng(sh.seed);
        g.save();
        rrect(g, x, y, W, H, rad); g.clip();
        for (let i = 0; i < 5; i++) {
          const sx = x + R() * (W + H * 0.6);
          const bw = 30 + R() * 90;
          g.fillStyle = `rgba(255,255,255,${0.08 + R() * 0.14})`;
          g.beginPath();
          g.moveTo(sx, y); g.lineTo(sx + bw, y);
          g.lineTo(sx + bw - H * 0.6, y + H); g.lineTo(sx - H * 0.6, y + H);
          g.closePath(); g.fill();
        }
        g.strokeStyle = 'rgba(255,255,255,0.18)';
        g.lineWidth = 1;
        for (let yy = y + 5; yy < y + H; yy += 7) {
          g.beginPath(); g.moveTo(x, yy); g.lineTo(x + W, yy + 3); g.stroke();
        }
        g.restore();
        g.lineWidth = 1.5;
        g.strokeStyle = 'rgba(255,255,255,0.9)';
        rrect(g, x + 1, y + 1, W - 2, H - 2, rad - 1); g.stroke();
        g.strokeStyle = U.hsl(sh.hue, 40, 70, 0.35);
        rrect(g, x, y, W, H, rad); g.stroke();
        sh.bg = c;
        sh.wrinkles.forEach((wr) => paintWrinkle(sh, wr));
      }

      // Pli permanent dans le film (attaché à une bulle pour survivre au redimensionnement)
      function paintWrinkle(sh, wr) {
        const b = sh.grid[wr.row] && sh.grid[wr.row][wr.col];
        if (!b || !sh.bg) return;
        const g = sh.bg.getContext('2d');
        const { x, y, W, H, rad } = sheetRect();
        g.save();
        rrect(g, x, y, W, H, rad); g.clip();
        const x0 = b.x + Math.cos(wr.a) * sh.r * 1.05, y0 = b.y + Math.sin(wr.a) * sh.r * 1.05;
        const L = sh.r * wr.len;
        const mx = x0 + Math.cos(wr.a + wr.bend) * L * 0.5, my = y0 + Math.sin(wr.a + wr.bend) * L * 0.5;
        const x1 = x0 + Math.cos(wr.a) * L, y1 = y0 + Math.sin(wr.a) * L;
        g.lineCap = 'round';
        g.strokeStyle = U.hsl(sh.hue, 30, 55, 0.13 * wr.k);
        g.lineWidth = 1.6;
        g.beginPath(); g.moveTo(x0 + 0.8, y0 + 0.8); g.quadraticCurveTo(mx + 0.8, my + 0.8, x1 + 0.8, y1 + 0.8); g.stroke();
        g.strokeStyle = `rgba(255,255,255,${(0.5 * wr.k).toFixed(3)})`;
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(mx, my, x1, y1); g.stroke();
        g.restore();
      }
      function addWrinkles(b, n, k = 1) {
        const sh = cur;
        for (let i = 0; i < n; i++) {
          const wr = { row: b.row, col: b.col, a: U.rand(0, TAU), len: U.rand(0.5, 1.6), bend: U.rand(-0.5, 0.5), k: U.rand(0.5, 1) * k };
          sh.wrinkles.push(wr);
          paintWrinkle(sh, wr);
        }
        if (sh.wrinkles.length > 900) sh.wrinkles.splice(0, 100);
      }

      function buildSprites(sh) {
        const dpr = cv.dpr, r = sh.r, half = r * 1.45;
        sh.spr = sprite(half, dpr, (g) => drawBubble(g, r, sh.hue, false));
        sh.sprSup = sprite(half, dpr, (g) => drawBubble(g, r, sh.hue, true));
        sh.sprSh = sprite(half, dpr, (g) => drawShadow(g, r));
        sh.sprPop = [0, 1, 2].map((k) => sprite(half, dpr, (g) => drawPopped(g, r, sh.hue, sh.seed * 7 + k * 101)));
      }

      function layoutSheet(sh, fresh) {
        const { w, h } = cv;
        const r = sh.r, d = r * 2 + Math.max(5, r * 0.38), rowH = d * 0.866;
        const bar = stage.querySelector('.sg-toolbar');
        let ay1 = h - 84;
        if (bar) {
          const br = bar.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          if (br.height) ay1 = Math.min(ay1, br.top - sr.top - 6);
        }
        const ax0 = 14, ax1 = w - 14, ay0 = 62;
        const cols = Math.max(1, Math.floor((ax1 - ax0 - d * 0.5) / d));
        const rows = Math.max(1, Math.floor((ay1 - ay0 - d) / rowH) + 1);
        const x0 = (w - (cols * d + d * 0.5)) / 2 + d / 2;
        const y0 = ay0 + Math.max(0, (ay1 - ay0 - ((rows - 1) * rowH + d)) / 2) + d / 2;
        const oldGrid = !fresh && (rows !== sh.rows || cols !== sh.cols) ? sh.grid : null;
        Object.assign(sh, { d, rowH, x0, y0 });
        if (fresh || oldGrid) {
          sh.rows = rows; sh.cols = cols; sh.grid = []; sh.list = [];
          for (let rr = 0; rr < rows; rr++) {
            const line = [];
            for (let cc = 0; cc < cols; cc++) {
              const prev = oldGrid && oldGrid[rr] && oldGrid[rr][cc];
              const b = prev || {
                row: rr, col: cc, x: 0, y: 0, popped: false, popT: 9, wob: 0,
                ph: U.rand(0, TAU), v: U.randInt(0, 2), sup: Math.random() < 0.035,
                sq: 0, held: null, tough: U.rand(0.28, 0.75), pitch: U.rand(0.86, 1.2), ox: 0, oy: 0,
              };
              b.row = rr; b.col = cc;
              line.push(b); sh.list.push(b);
            }
            sh.grid.push(line);
          }
          if (!oldGrid && !sh.list.some((b) => b.sup) && sh.list.length > 12) U.pick(sh.list).sup = true;
          sh.total = sh.list.length;
          sh.left = sh.list.filter((b) => !b.popped).length;
          if (oldGrid) sh.wrinkles = sh.wrinkles.filter((wr) => wr.row < rows && wr.col < cols);
        }
        sh.list.forEach((b) => {
          b.x = x0 + b.col * d + (b.row % 2) * d * 0.5;
          b.y = y0 + b.row * rowH;
        });
        buildBg(sh);
        buildSprites(sh);
      }

      function newSheet() {
        hueIdx = (hueIdx + 1) % HUES.length;
        const sh = { hue: HUES[hueIdx], r: SIZES[size], seed: U.randInt(1, 999999), wrinkles: [] };
        layoutSheet(sh, true);
        trans = { old: cur, t: 0 };
        cur = sh;
        nextSheetIn = 0;
        cascade.length = 0;
        fingers.forEach((f) => { f.b = null; });
        updateProg();
        if (rollSnd) rollSnd.stop();
        rollSnd = A.loop('brush');
        A.rustle(0.25, 0.5);
        A.whoosh(0.2, 0.6, true);
      }

      /* ---------- Éclatement ---------- */
      function hit(sh, x, y, k = 1.05) {
        const row = Math.round((y - sh.y0) / sh.rowH);
        let best = null, bd = sh.r * k;
        for (let rr = row - 1; rr <= row + 1; rr++) {
          const line = sh.grid[rr];
          if (!line) continue;
          const col = Math.round((x - sh.x0 - (rr % 2) * sh.d * 0.5) / sh.d);
          for (let cc = col - 1; cc <= col + 1; cc++) {
            const b = line[cc];
            if (!b) continue;
            const dd = Math.hypot(b.x - x, b.y - y);
            if (dd < bd) { bd = dd; best = b; }
          }
        }
        return best;
      }
      function neighbors(sh, b, fn) {
        for (let rr = b.row - 1; rr <= b.row + 1; rr++) {
