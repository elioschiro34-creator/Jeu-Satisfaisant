        b.fillStyle = 'rgba(255,170,190,0.35)';
        for (let x = 0; x < cv.w; x += cw * 2) b.fillRect(x, cy0, cw, cv.h);
        for (let y = cy0; y < cv.h; y += cw * 2) b.fillRect(0, y, cv.w, cw);
        b.restore();
        b.fillStyle = 'rgba(150,100,80,0.12)'; b.fillRect(0, cy0, cv.w, 3);
      }

      /* ---------- Dépôt du liquide ---------- */
      const LY = (l) => T.layers[l] || T.layers[1];
      function bake(x, y, r, l, amp = 1) {
        splat(LY(l), x, y, r, amp);
        cover(x, y, r);
      }
      function cover(x, y, r) {
        const { GX, GY } = T;
        const i0 = Math.max(0, Math.floor((x - r) / VW * GX)), i1 = Math.min(GX - 1, Math.floor((x + r) / VW * GX));
        const j0 = Math.max(0, Math.floor((y - r) / VH * GY)), j1 = Math.min(GY - 1, Math.floor((y + r) / VH * GY));
        for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
          const k = j * GX + i;
          if (!T.mask[k] || T.cov[k]) continue;
          if (Math.hypot((i + 0.5) * VW / GX - x, (j + 0.5) * VH / GY - y) < r) { T.cov[k] = 1; T.covered++; }
        }
      }
      function deposit(x, y, w) {
        const tgt = TARGETS[tgtId];
        const side = tgt.side(x, y);
        if (side) { drips.push({ x, y, len: 0, max: side.max, w: w * 0.55, spd: 26 * liq.spread, detach: false, l: 1 }); return; }
        const l = layerOf(x, y);
        const b = { x, y, r0: w * 0.6, r1: w * (1.35 + 0.45 * liq.spread), t: 0, r: w * 0.6, l };
        splat(LY(l), x, y, b.r0, 1);
        blobs.push(b);
        if (tgt.inside(x, y)) {
          const e = tgt.edge(x, y);
          if (e && Math.random() < 0.25) drips.push({ x: x + rand(-2, 2), y: y + 2, len: 0, max: e.max, w: w * rand(0.45, 0.7), spd: rand(14, 26) * liq.spread, detach: e.detach, l: 1 });
        }
      }

      /* ---------- Sons ---------- */
      function soundOn() {
        if (!sticky) { sticky = A.loop('sticky'); pour = A.loop('pour'); }
      }
      function soundOff() { if (sticky) { sticky.stop(); pour.stop(); sticky = pour = null; } }

      /* ---------- Pointeur ---------- */
      const ids = new Set();
      const toV = (p) => {
        const off = p.e && p.e.pointerType === 'touch' ? 50 : 0;
        return { x: clamp((p.x - ox) / s, 14, VW - 14), y: clamp((p.y - off - oy) / s, 170, VH - 14) };
      };
      const ptr = SG.pointer(cv.canvas, {
        hover(p) { if (!pressing) { P = toV(p); if (!B) B = { ...P }; } },
        down(p) {
          ids.add(p.id); pressing = ids.size;
          P = toV(p); if (!B || flow < 0.05) B = { ...P };
          soundOn(); SG.haptic(5);
          A.squish(0.6, 0.2);
        },
        move(p) { if (ids.has(p.id) || !pressing) P = toV(p); },
        up(p) { ids.delete(p.id); pressing = ids.size; },
      });

      SG.toolbar(stage, [
        ...Object.entries(LIQUIDS).map(([id, l], i) => ({
          color: l.swatch, title: l.name, group: 'l', active: i === 0,
          onClick: () => { liq = l; lrgb = hex2rgb(l.body); drgb = hex2rgb(l.dark); hrgb = hex2rgb(l.light); SG.hint(stage, l.name, 1400); A.drip(0.8, 0.3); },
        })),
        { icon: '🍞', label: 'Tartine', group: 't', active: true, onClick: () => setTarget('tartine') },
        { icon: '🥞', label: 'Pancakes', group: 't', onClick: () => setTarget('pancakes') },
        { icon: '🥄', label: 'Cuillère', group: 't', onClick: () => setTarget('cuillere') },
        { icon: '🧻', label: 'Nettoyer', onClick: () => { delete states[tgtId]; setTarget(tgtId); A.whoosh(0.25, 0.35); } },
      ]);

      /* ---------- Dessin ---------- */
      function drawDipper(x, y) {
        // Cuillère à miel en bois : tête striée nappée de miel, manche vers le haut
        g.save(); g.translate(x, y); g.rotate(0.35);
        g.fillStyle = 'rgba(90,50,30,0.15)'; g.beginPath(); g.ellipse(8, 10, 20, 26, 0, 0, Math.PI * 2); g.fill();
        const hg = g.createLinearGradient(-5, 0, 5, 0);
        hg.addColorStop(0, '#c99a66'); hg.addColorStop(0.5, '#f0d2a6'); hg.addColorStop(1, '#b8875a');
        g.fillStyle = hg; rr(g, -4.5, -150, 9, 130, 4.5); g.fill();
        g.fillStyle = '#e8c08c'; g.beginPath(); g.arc(0, -150, 6, 0, Math.PI * 2); g.fill();
        for (let i = 0; i < 5; i++) {
          const yy = -18 + i * 8, w = 16 - Math.abs(i - 2) * 2.5;
          const rg = g.createLinearGradient(-w, 0, w, 0);
          rg.addColorStop(0, '#b98552'); rg.addColorStop(0.45, '#f3d5a8'); rg.addColorStop(1, '#a8754a');
          g.fillStyle = rg; g.beginPath(); g.ellipse(0, yy, w, 5, 0, 0, Math.PI * 2); g.fill();
          g.strokeStyle = 'rgba(110,70,40,0.4)'; g.lineWidth = 1; g.stroke();
        }
        // Nappage
        g.globalAlpha = 0.8 * liq.alpha;
        g.fillStyle = rgba(lrgb, 1);
        g.beginPath(); g.ellipse(0, 4, 13, 22, 0, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
        g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.ellipse(-6, -6, 2.5, 9, 0.1, 0, Math.PI * 2); g.fill();
        g.restore();
      }
      function drawStream(tx, ty, bx, by, w0, w1) {
        const N = 14, L = [], R = [];
        const cx = tx + (bx - tx) * 0.15, cy = (ty + by) / 2;
        for (let i = 0; i <= N; i++) {
          const t = i / N, u = 1 - t;
          const x = u * u * tx + 2 * u * t * cx + t * t * bx, y = u * u * ty + 2 * u * t * cy + t * t * by;
          const dx = 2 * u * (cx - tx) + 2 * t * (bx - cx), dy = 2 * u * (cy - ty) + 2 * t * (by - cy);
          const l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
          const w = lerp(w0, w1, Math.sqrt(t)) * (1 + Math.sin(t * 20 - performance.now() / 60) * 0.04);
          L.push([x + nx * w / 2, y + ny * w / 2]); R.push([x - nx * w / 2, y - ny * w / 2]);
        }
        g.beginPath();
        L.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
        for (let i = R.length - 1; i >= 0; i--) g.lineTo(R[i][0], R[i][1]);
        g.closePath();
        g.globalAlpha = liq.alpha;
        const gr = g.createLinearGradient(tx - w0, 0, tx + w0, 0);
        gr.addColorStop(0, rgba(drgb, 1)); gr.addColorStop(0.35, rgba(hrgb, 1)); gr.addColorStop(0.6, rgba(lrgb, 1)); gr.addColorStop(1, rgba(drgb, 1));
        g.fillStyle = gr; g.fill();
        g.globalAlpha = 1;
        g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = Math.max(0.6, w1 * 0.3);
        g.beginPath();
        L.forEach((p, i) => { const q = R[i], x = lerp(p[0], q[0], 0.3), y = lerp(p[1], q[1], 0.3); i ? g.lineTo(x, y) : g.moveTo(x, y); });
        g.stroke();
      }
      function drawRope(layer) {
        if (rope.length < 2) return;
        g.lineCap = 'round'; g.lineJoin = 'round';
        // dessiné par segments pour que les boucles récentes passent par-dessus les anciennes
        for (let i = 1; i < rope.length; i++) {
          const a = rope[i - 1], b = rope[i];
          if ((T.layers[0] ? b.l : 1) !== layer) continue;
          if (Math.hypot(b.x - a.x, b.y - a.y) > 30) continue;
          const w = b.w;
          g.globalAlpha = liq.alpha;
          g.strokeStyle = rgba(drgb, 1); g.lineWidth = w + 1.6;
          g.beginPath(); g.moveTo(a.x, a.y + 0.8); g.lineTo(b.x, b.y + 0.8); g.stroke();
          g.strokeStyle = rgba(lrgb, 1); g.lineWidth = w;
          g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
          g.globalAlpha = 1;
          g.strokeStyle = rgba(hrgb, 0.9); g.lineWidth = w * 0.3;
          g.beginPath(); g.moveTo(a.x - w * 0.15, a.y - w * 0.22); g.lineTo(b.x - w * 0.15, b.y - w * 0.22); g.stroke();
        }
      }

      cv.onResize(layout);
      layout();
      setTarget('tartine');

      let acc = 0, frameN = 0;
      const loop = SG.loop((dt, t) => {
        if (!T) return;
        // Débit et hauteur de la cuillère
        flow = pressing ? Math.min(1, flow + dt * 4) : Math.max(0, flow - dt * 1.4);
        H = lerp(H, pressing ? 150 : 235, 1 - Math.exp(-dt * (pressing ? 5 : 2.5)));
        if (!P) P = { x: VW / 2, y: 380 };
        if (!B) B = { ...P };
        const k = 1 - Math.exp(-dt * 7);
        B.x += (P.x - B.x) * k; B.y += (P.y - B.y) * k;
        const tipX = P.x - 4, tipY = P.y - H + 14;
        const vis = liq.coil;
        if (flow > 0.06) {
          const w = (2.6 + 4.4 * flow) * (1.05 - 0.15 * vis);
          const freq = 3.2 * vis + (H - 140) * 0.01;
          const prev = phase;
          phase += Math.PI * 2 * freq * dt;
          const rc = (3 + 6 * flow) / vis;
          const steps = 3;
          for (let i = 1; i <= steps; i++) {
            const ph = prev + (phase - prev) * (i / steps);
            const rx = B.x + Math.cos(ph) * rc, ry = B.y + Math.sin(ph) * rc * 0.5;
            rope.push({ x: rx, y: ry, w, t: t, l: layerOf(rx, ry) });
          }
          if (Math.floor(phase / (Math.PI * 2)) > revs) {
            revs = Math.floor(phase / (Math.PI * 2));
            A.drip(rand(0.45, 0.6), 0.05 + flow * 0.06);
            if (revs % 3 === 0) A.bubble(rand(0.5, 0.8), 0.05);
          }
          if (sticky) { sticky.set(0.35 + flow * 0.4, 0.25); pour.set(0.25 * flow, 0.15); }
        } else {
          if (sticky) { sticky.set(0); pour.set(0); }
          if (!pressing && sticky && flow <= 0) soundOff();
        }
        // Rupture du filet en relâchant
        if (!pressing && flow > 0 && flow - dt * 1.4 <= 0.06 && flow > 0.06) {
          threads.push({ tx: tipX, ty: tipY, bx: B.x, by: B.y, f: 0 });
          A.drip(0.9, 0.35); timers.push(setTimeout(() => A.drip(0.7, 0.2), 180));
          SG.haptic(6);
        }
        // Le cordon frais s'étale en flaques
        while (rope.length && t - rope[0].t > 0.55) { const r = rope.shift(); deposit(r.x, r.y, r.w); }
        // flaques qui s'étalent : on ajoute au champ seulement l'écart entre l'ancien et le nouveau rayon
        // (une image sur deux par flaque, en alternance, pour alléger)
        frameN++;
        for (let k = blobs.length - 1; k >= 0; k--) {
          const b = blobs[k];
          b.t = Math.min(1, b.t + dt / (2.2 / liq.spread));
          if (b.t < 1 && ((k + frameN) & 1)) continue;
          const e = 1 - Math.pow(1 - b.t, 2.2), r = lerp(b.r0, b.r1, e);
          if (r > b.r + 0.05) { splat(LY(b.l), b.x, b.y, r, 1, b.r); b.r = r; }
          if (b.t >= 1) { cover(b.x, b.y, b.r1); blobs[k] = blobs[blobs.length - 1]; blobs.pop(); }
        }
        // Coulures
        drips.forEach((d) => {
          if (d.len >= d.max) return;
          const dl = d.spd * dt; d.spd *= Math.exp(-dt * 0.35);
          d.len = Math.min(d.max, d.len + dl);
          bake(d.x + Math.sin(d.len * 0.2) * 0.4, d.y + d.len, d.w * (1 + d.len / d.max * 0.5), d.l, clamp(dl * 0.5, 0.15, 0.8));
          if (d.len >= d.max) {
            if (d.detach) { drops.push({ x: d.x, y: d.y + d.len, vy: 20, land: d.y + d.len + rand(50, 80), w: d.w * 1.3 }); A.bubble(0.6, 0.06); }
            else bake(d.x, d.y + d.len + 1, d.w * 1.6, d.l);
          }
        });
        drips = drips.filter((d) => d.len < d.max);
        drops.forEach((d) => { d.vy += 900 * dt; d.y += d.vy * dt; if (d.y >= d.land) { bake(d.x, d.land, d.w * 1.8, layerOf(d.x, d.land)); A.drip(rand(0.9, 1.2), 0.25); d.done = true; } });
        drops = drops.filter((d) => !d.done);
        acc += dt;
        if (acc > 0.25) {
          acc = 0;
          const p = T.covered / T.total;
          prog.set(p / 0.7);
          if (!T.celebrated && p >= 0.7) {
            T.celebrated = true;
            SG.celebrate(stage, 'Miam !');
            timers.push(setTimeout(() => SG.hint(stage, 'Essaie un autre nappage ou une autre assiette ✨'), 2300));
          }
        }

        /* ----- Dessin ----- */
        g.drawImage(bgCv, 0, 0, cv.w, cv.h);
        g.save(); g.translate(ox, oy); g.scale(s, s);
        // Profondeur : assiette/table → flaques de derrière → aliment → nappage posé dessus
        g.drawImage(T.scene, 0, 0, VW, VH);
        T.layers.forEach((L) => L && shadeLayer(L));
        if (T.layers[0]) { drawLayer(T.layers[0], t); drawRope(0); }
        if (T.top) g.drawImage(T.top, 0, 0, VW, VH);
        drawLayer(T.layers[1], t);
        drawRope(1);
        // Gouttes qui tombent
        drops.forEach((d) => {
          g.fillStyle = rgba(lrgb, liq.alpha);
          g.beginPath(); g.ellipse(d.x, d.y, d.w, d.w * 1.4, 0, 0, Math.PI * 2); g.fill();
          g.fillStyle = 'rgba(255,255,255,0.6)'; g.beginPath(); g.arc(d.x - d.w * 0.3, d.y - d.w * 0.4, d.w * 0.3, 0, Math.PI * 2); g.fill();
        });
        // Fils cassés qui retombent
        threads.forEach((th) => {
          th.f += dt * 2.5;
          const ty = lerp(th.ty, th.by, Math.min(1, th.f * th.f));
          if (ty < th.by - 2) drawStream(th.tx, ty, th.bx, th.by, 1.6 * (1 - th.f * 0.5), 1.2);
        });
        threads = threads.filter((th) => th.f < 1);
        // Filet principal
        if (flow > 0.06) {
          const w0 = (4 + 6 * flow) * (1.1 - 0.1 * vis), w1 = (1.6 + 3 * flow) * (1.05 - 0.15 * vis);
          drawStream(tipX, tipY, B.x, B.y, w0, w1);
        } else if (!pressing) {
          // Goutte suspendue sous la cuillère
          const r = 3 + Math.sin(t * 2) * 0.4;
          g.fillStyle = rgba(lrgb, liq.alpha); g.beginPath(); g.ellipse(tipX, tipY + 3, r, r * 1.4, 0, 0, Math.PI * 2); g.fill();
        }
        drawDipper(P.x, P.y - H);
        g.restore();
      });

      return {
        destroy() {
          loop.stop(); ptr.destroy(); cv.destroy(); soundOff();
          timers.forEach(clearTimeout);
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/ice.js */
/* Glace pilée — piler des glaçons translucides au pilon de bois, jouer avec les éclats, verser du sirop */
(function () {
  'use strict';
  const { rand, clamp, randInt } = SG.util;
  const RB = 160;   // rayon du saladier (unités « monde »)
  const FS = 640;   // résolution des calques givre / sirop
  const FK = FS / (2 * RB);

  const SYRUPS = [
    { name: 'Fraise', c: [255, 110, 155] },
    { name: 'Menthe', c: [90, 220, 170] },
    { name: 'Myrtille', c: [130, 150, 255] },
    { name: 'Citron', c: [255, 214, 70] },
    { name: 'Pêche', c: [255, 160, 110] },
    { name: 'Lavande', c: [185, 140, 255] },
  ];
  const ICE_TINTS = [[222, 242, 255], [236, 230, 255], [255, 234, 244], [228, 255, 244], [255, 247, 226], [230, 246, 255]];
  const rgb = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const mix = (c, d, t) => [c[0] + (d[0] - c[0]) * t, c[1] + (d[1] - c[1]) * t, c[2] + (d[2] - c[2]) * t];
  const WHITE = [255, 255, 255];

  /* ---------- Géométrie ---------- */
  function centroid(v) {
    let a = 0, x = 0, y = 0;
    for (let i = 0; i < v.length; i++) {
      const p = v[i], q = v[(i + 1) % v.length];
      const c = p[0] * q[1] - q[0] * p[1];
      a += c; x += (p[0] + q[0]) * c; y += (p[1] + q[1]) * c;
    }
    a /= 2;
    if (Math.abs(a) < 1e-6) return [v[0][0], v[0][1], 0];
    return [x / (6 * a), y / (6 * a), Math.abs(a)];
  }
  // Garde la partie du polygone où (p - o)·n >= 0
  function clipHalf(v, ox, oy, nx, ny) {
    const out = [];
    for (let i = 0; i < v.length; i++) {
      const p = v[i], q = v[(i + 1) % v.length];
      const dp = (p[0] - ox) * nx + (p[1] - oy) * ny, dq = (q[0] - ox) * nx + (q[1] - oy) * ny;
      if (dp >= 0) out.push(p);
      if ((dp >= 0) !== (dq >= 0)) {
        const t = dp / (dp - dq);
        out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
      }
    }
    return out;
  }
  function inside(v, x, y) {
    let c = false;
    for (let i = 0, j = v.length - 1; i < v.length; j = i++) {
      const a = v[i], b = v[j];
      if ((a[1] > y) !== (b[1] > y) && x < ((b[0] - a[0]) * (y - a[1])) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
  function cubeVerts(L) {
    const h = L / 2, c = L * rand(0.12, 0.2), j = () => rand(-1, 1) * L * 0.025;
    return [[-h + c, -h], [h - c, -h], [h, -h + c], [h, h - c], [h - c, h], [-h + c, h], [-h, h - c], [-h, -h + c]]
      .map(([x, y]) => [x + j(), y + j()]);
  }
  function jaggedCrack(x, y, ang, len, out, depth) {
    const pts = [x, y], steps = randInt(4, 6);
    for (let i = 0; i < steps; i++) {
      ang += rand(-0.45, 0.45);
      x += Math.cos(ang) * len / steps; y += Math.sin(ang) * len / steps;
      pts.push(x, y);
      if (depth < 1 && Math.random() < 0.18) jaggedCrack(x, y, ang + rand(-1.1, 1.1), len * 0.45, out, depth + 1);
    }
    out.push({ p: pts, w: depth ? 0.6 : 1 });
  }

  SG.registerGame({
    id: 'ice',
    title: 'Glace pilée',
    emoji: '🧊',
    desc: 'Pile des glaçons au pilon, fais voler les éclats et ajoute du sirop.',
    color: '#bfe6ff',
    bg: 'linear-gradient(180deg,#eef8ff,#e6efff)',
    order: 19,
    create(stage) {
      const A = SG.audio;
      const cv = SG.makeCanvas(stage);
      const g = cv.ctx;
      const small = Math.min(window.innerWidth, window.innerHeight) < 520;
      const MAXP = small ? 170 : 260;
      let cx = 0, cy = 0, S = 1, R = 100;
      const bg = document.createElement('canvas'), fgc = document.createElement('canvas');
      const frost = document.createElement('canvas'); frost.width = frost.height = FS;
      const fx = frost.getContext('2d');
      const pud = document.createElement('canvas'); pud.width = pud.height = FS;
      const px = pud.getContext('2d');
      let pieces = [], chips = [], sparks = [], drops = [];
      let mode = 'pestle', syrup = 0;
      let totalArea = 0, powderArea = 0, celebrated = false, progT = 0;
      let sndBudget = 4, grindLoop = null, pourLoop = null, crunchT = 0;
      const ptrs = new Map();
      let hover = null;
      const prog = SG.progress(stage, 'Pilé');
      SG.hint(stage, 'Tape les glaçons avec le pilon pour les piler 🧊');

      /* ---------- Mise en page + décor pré-rendu ---------- */
      function layout() {
        const w = cv.w, h = cv.h;
        const top = 56, bot = w < 480 ? 130 : 86;
        cx = w / 2; cy = top + (h - top - bot) / 2;
        R = Math.max(80, Math.min(w * 0.45, (h - top - bot) * 0.5));
        S = R / RB;
        buildLayers();
      }

      function buildLayers() {
        const w = cv.w, h = cv.h, d = cv.dpr;
        bg.width = fgc.width = Math.round(w * d); bg.height = fgc.height = Math.round(h * d);
        const b = bg.getContext('2d');
        b.setTransform(d, 0, 0, d, 0, 0);
        // Serviette nid d'abeille
        b.fillStyle = '#cfe4f7'; b.fillRect(0, 0, w, h);
        const cs = 9;
        for (let y = 0; y < h + cs; y += cs) {
          for (let x = 0; x < w + cs; x += cs) {
            b.fillStyle = 'rgba(120,150,190,0.16)'; b.fillRect(x + 1.5, y + 1.5, cs - 2, cs - 2);
            b.fillStyle = 'rgba(255,255,255,0.22)'; b.fillRect(x + 1, y + 1, cs - 3, cs - 3);
          }
        }
        // Bandes tissées de la serviette
        [[0.1, 0.035], [0.86, 0.035], [0.9, 0.012]].forEach(([fy, fh]) => {
          b.fillStyle = 'rgba(255,190,210,0.55)'; b.fillRect(0, h * fy, w, h * fh);
          b.fillStyle = 'rgba(255,255,255,0.18)';
          for (let x = 0; x < w; x += 3) b.fillRect(x, h * fy, 1, h * fh);
        });
        const vig = b.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
        vig.addColorStop(0, 'rgba(255,255,255,0)'); vig.addColorStop(1, 'rgba(90,110,150,0.18)');
        b.fillStyle = vig; b.fillRect(0, 0, w, h);
        // Ombre du saladier (avec caustique lumineuse)
        let gr = b.createRadialGradient(cx + R * 0.1, cy + R * 0.14, R * 0.7, cx + R * 0.1, cy + R * 0.14, R * 1.22);
        gr.addColorStop(0, 'rgba(60,80,120,0.28)'); gr.addColorStop(1, 'rgba(60,80,120,0)');
        b.fillStyle = gr; b.beginPath(); b.arc(cx + R * 0.1, cy + R * 0.14, R * 1.22, 0, Math.PI * 2); b.fill();
        gr = b.createRadialGradient(cx + R * 0.55, cy + R * 0.75, 0, cx + R * 0.55, cy + R * 0.75, R * 0.4);
        gr.addColorStop(0, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        b.fillStyle = gr; b.fillRect(cx, cy + R * 0.3, R, R);
        // Verre du saladier : fond translucide
        gr = b.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R * 1.06);
        gr.addColorStop(0, 'rgba(255,255,255,0.5)'); gr.addColorStop(0.7, 'rgba(225,242,255,0.38)'); gr.addColorStop(1, 'rgba(170,205,240,0.5)');
        b.fillStyle = gr; b.beginPath(); b.arc(cx, cy, R * 1.07, 0, Math.PI * 2); b.fill();
        // Pied du saladier vu à travers le verre
        b.strokeStyle = 'rgba(255,255,255,0.45)'; b.lineWidth = 2;
        b.beginPath(); b.arc(cx, cy, R * 0.58, 0, Math.PI * 2); b.stroke();
        b.strokeStyle = 'rgba(120,160,210,0.18)'; b.lineWidth = 3;
        b.beginPath(); b.arc(cx + 1.5, cy + 2, R * 0.6, 0, Math.PI * 2); b.stroke();

        // Calque avant : paroi et reflets du verre
        const f = fgc.getContext('2d');
        f.setTransform(d, 0, 0, d, 0, 0);
        gr = f.createRadialGradient(cx, cy, R * 0.78, cx, cy, R * 1.02);
        gr.addColorStop(0, 'rgba(210,235,255,0)'); gr.addColorStop(1, 'rgba(200,228,255,0.32)');
        f.fillStyle = gr; f.beginPath(); f.arc(cx, cy, R * 1.02, 0, Math.PI * 2); f.fill();
        // Lèvre épaisse
        gr = f.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
        gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(0.5, 'rgba(220,240,255,0.55)'); gr.addColorStop(1, 'rgba(150,190,230,0.7)');
        f.strokeStyle = gr; f.lineWidth = R * 0.07;
        f.beginPath(); f.arc(cx, cy, R * 1.035, 0, Math.PI * 2); f.stroke();
        f.strokeStyle = 'rgba(255,255,255,0.85)'; f.lineWidth = 1.2;
        f.beginPath(); f.arc(cx, cy, R * 1.07, 0, Math.PI * 2); f.stroke();
        f.strokeStyle = 'rgba(120,160,210,0.45)'; f.lineWidth = 1;
        f.beginPath(); f.arc(cx, cy, R * 1.0, 0, Math.PI * 2); f.stroke();
        // Reflets spéculaires
        f.lineCap = 'round';
        f.strokeStyle = 'rgba(255,255,255,0.85)'; f.lineWidth = Math.max(2, R * 0.022);
        f.beginPath(); f.arc(cx, cy, R * 0.94, Math.PI * 1.12, Math.PI * 1.38); f.stroke();
        f.strokeStyle = 'rgba(255,255,255,0.55)'; f.lineWidth = Math.max(1.5, R * 0.012);
        f.beginPath(); f.arc(cx, cy, R * 0.9, Math.PI * 1.43, Math.PI * 1.5); f.stroke();
        f.strokeStyle = 'rgba(255,255,255,0.5)'; f.lineWidth = Math.max(1.5, R * 0.016);
        f.beginPath(); f.arc(cx, cy, R * 0.95, Math.PI * 0.18, Math.PI * 0.34); f.stroke();
      }

      /* ---------- Morceaux de glace ---------- */
      function makePiece(verts, wx, wy, col, syr, a) {
        const [ccx, ccy, area] = centroid(verts);
        const v = verts.map((p) => [p[0] - ccx, p[1] - ccy]);
        let r = 0;
        v.forEach((p) => { r = Math.max(r, Math.hypot(p[0], p[1])); });
        const ca = Math.cos(a), sa = Math.sin(a);
        return {
          v, area, r, rc: Math.max(1.5, Math.sqrt(area / Math.PI) * 1.02),
          x: wx + ca * ccx - sa * ccy, y: wy + sa * ccx + ca * ccy, z: 0,
          vx: 0, vy: 0, vz: 0, a, va: 0,
          cracks: [], dmg: 0, hp: 1, col: col.slice(), syr: syr || 0, held: false, born: 0,
          cloud: Math.random() < 0.8,
        };
      }
      function addCube(wx, wy, z) {
        const L = rand(40, 50);
        const p = makePiece(cubeVerts(L), wx, wy, ICE_TINTS[randInt(0, ICE_TINTS.length - 1)], 0, rand(0, Math.PI * 2));
        p.hp = randInt(2, 3); p.z = z || 0; p.va = rand(-1, 1);
        // Petites bulles d'air prisonnières
        p.bub = [];
        for (let i = 0; i < randInt(2, 6); i++) p.bub.push([rand(-0.3, 0.3) * L, rand(-0.3, 0.3) * L, rand(0.6, 1.6)]);
        pieces.push(p); totalArea += p.area;
        return p;
      }
      function toLocal(p, wx, wy) {
        const dx = wx - p.x, dy = wy - p.y, ca = Math.cos(p.a), sa = Math.sin(p.a);
        return [ca * dx + sa * dy, -sa * dx + ca * dy];
      }
      function toWorld(p, lx, ly) {
        const ca = Math.cos(p.a), sa = Math.sin(p.a);
        return [p.x + ca * lx - sa * ly, p.y + sa * lx + ca * ly];
      }
      function removePiece(p) {
        const i = pieces.indexOf(p);
        if (i >= 0) pieces.splice(i, 1);
        ptrs.forEach((s) => { if (s.held === p) s.held = null; });
      }

      // Givre : poudre de glace déposée dans le saladier
      const SG_N = 32, snow = new Uint16Array(SG_N * SG_N);
      const snowIdx = (x, y) => clamp(((y + RB) / (2 * RB) * SG_N) | 0, 0, SG_N - 1) * SG_N + clamp(((x + RB) / (2 * RB) * SG_N) | 0, 0, SG_N - 1);
      const snowAt = (x, y) => snow[snowIdx(x, y)];
      function depositPowder(wx, wy, area, col) {
        const n = clamp(area * 0.45, 4, 60) | 0, spread = Math.sqrt(area) * 0.9 + 4;
        const si = snowIdx(wx, wy); snow[si] = Math.min(60000, snow[si] + n);
        const c = mix(col, WHITE, 0.55);
        for (let i = 0; i < n; i++) {
          const an = rand(0, Math.PI * 2), rr = spread * Math.sqrt(Math.random());
          let x = wx + Math.cos(an) * rr, y = wy + Math.sin(an) * rr;
          const d = Math.hypot(x, y);
          if (d > RB - 3) { x *= (RB - 3) / d; y *= (RB - 3) / d; }
          const s = rand(0.5, 1.7) * FK;
          fx.fillStyle = 'rgba(110,140,185,0.18)';
          fx.beginPath(); fx.arc((x + RB) * FK + 1.2, (y + RB) * FK + 1.6, s, 0, Math.PI * 2); fx.fill();
          fx.fillStyle = rgb(c, rand(0.45, 0.95));
          fx.beginPath(); fx.arc((x + RB) * FK, (y + RB) * FK, s, 0, Math.PI * 2); fx.fill();
        }
        const gr = fx.createRadialGradient((wx + RB) * FK, (wy + RB) * FK, 0, (wx + RB) * FK, (wy + RB) * FK, spread * FK * 1.3);
        gr.addColorStop(0, rgb(c, 0.16)); gr.addColorStop(1, rgb(c, 0));
        fx.fillStyle = gr; fx.fillRect((wx + RB - spread * 1.3) * FK, (wy + RB - spread * 1.3) * FK, spread * 2.6 * FK, spread * 2.6 * FK);
      }
      function toPowder(p, quiet) {
        removePiece(p);
        powderArea += p.area;
        depositPowder(p.x, p.y, p.area, p.col);
        for (let i = 0; i < 3; i++) chips.push({ x: p.x, y: p.y, z: p.z + 2, vx: rand(-40, 40), vy: rand(-40, 40), vz: rand(30, 110), life: 1, s: rand(0.6, 1.4), puff: true });
        if (!quiet && Math.random() < 0.3) sparkAt(p.x, p.y, 1);
      }

      function sparkAt(x, y, n) {
        for (let i = 0; i < n; i++) sparks.push({ x: x + rand(-8, 8), y: y + rand(-8, 8), life: 1, s: rand(2.5, 5.5), rot: rand(0, 1) });
      }

      // Brise un morceau en éclats (coins autour du point d'impact)
      function shatter(p, lx, ly, power) {
        if (!inside(p.v, lx, ly)) { lx *= 0.4; ly *= 0.4; if (!inside(p.v, lx, ly)) { lx = 0; ly = 0; } }
        const n = p.rc > 13 ? randInt(3, 5) : p.rc > 6 ? randInt(2, 3) : 2;
        const polys = [];
        if (n === 2) {
          const an = rand(0, Math.PI), nx = Math.cos(an), ny = Math.sin(an);
          polys.push(clipHalf(p.v, lx, ly, nx, ny), clipHalf(p.v, lx, ly, -nx, -ny));
        } else {
          const base = rand(0, Math.PI * 2), step = (Math.PI * 2) / n;
          const angs = [];
          for (let i = 0; i < n; i++) angs.push(base + i * step + rand(-0.2, 0.2) * step);
          for (let i = 0; i < n; i++) {
            const a1 = angs[i], a2 = i === n - 1 ? angs[0] + Math.PI * 2 : angs[i + 1];
            // gauche du rayon a1 et droite du rayon a2
            let poly = clipHalf(p.v, lx, ly, -Math.sin(a1), Math.cos(a1));
            if (poly.length > 2) poly = clipHalf(poly, lx, ly, Math.sin(a2), -Math.cos(a2));
            polys.push(poly);
          }
        }
        removePiece(p);
        const [iwx, iwy] = toWorld(p, lx, ly);
        const kids = [];
        polys.forEach((poly) => {
          if (poly.length < 3) return;
          const k = makePiece(poly, p.x, p.y, p.col, p.syr, p.a);
          if (k.area < 10) { powderArea += k.area; depositPowder(k.x, k.y, k.area, k.col); return; }
          const dx = k.x - iwx, dy = k.y - iwy, d = Math.hypot(dx, dy) || 1;
          const sp = rand(40, 120) * power * (k.rc < 8 ? 1.4 : 1);
          k.vx = p.vx + dx / d * sp; k.vy = p.vy + dy / d * sp;
          k.vz = rand(40, 150) * power * (k.rc < 10 ? 1.3 : 0.7); k.z = p.z + 1;
          k.va = p.va + rand(-6, 6) * power;
          k.hp = k.rc > 12 ? randInt(1, 2) : 1;
          k.cloud = p.cloud && k.rc > 9;
          k.bub = (p.bub || []).filter(() => Math.random() < 0.3).map(() => [rand(-0.3, 0.3) * k.r, rand(-0.3, 0.3) * k.r, rand(0.5, 1.2)]);
          if (k.rc > 8 && Math.random() < 0.55) jaggedCrack(rand(-0.3, 0.3) * k.r, rand(-0.3, 0.3) * k.r, rand(0, 6.3), k.r * rand(0.6, 1.1), k.cracks, 1);
          k.born = 0.08;
          pieces.push(k); kids.push(k);
        });
        // Éclats volants + poussière
        const nc = Math.round(4 + p.rc * 0.35);
        for (let i = 0; i < nc; i++) {
          const an = rand(0, Math.PI * 2), sp = rand(60, 220) * power;
          chips.push({ x: iwx, y: iwy, z: p.z + 3, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, vz: rand(80, 260) * power, life: 1, s: rand(0.8, 2.2), col: p.col });
        }
        powderArea += 0; // (masse conservée par les éclats)
        sparkAt(iwx, iwy, 2 + (p.rc > 12 ? 2 : 0));
        return kids;
      }

      function capPieces() {
        if (pieces.length <= MAXP) return;
        const sorted = pieces.filter((p) => !p.held).sort((a, b) => a.area - b.area);
        for (let i = 0; i < pieces.length - MAXP && i < sorted.length; i++) toPowder(sorted[i], true);
      }

      /* ---------- Sons ---------- */
      function clink(vol, rc) {
        if (sndBudget < 1) return;
        sndBudget -= 1;
        A.tap('glass', clamp(vol, 0.05, 0.55), clamp(2.3 - rc / 22, 0.95, 2.6) * rand(0.95, 1.08));
      }
      function bowlClink(vol) {
        if (sndBudget < 1) return;
        sndBudget -= 1;
        A.tap('glass', clamp(vol, 0.05, 0.45), rand(0.62, 0.7));
      }

      /* ---------- Coup de pilon ---------- */
      function hit(wx, wy) {
        let best = null, bs = -1e9;
        for (const p of pieces) {
          if (p.z > 24 || p.held) continue;
          const dx = wx - p.x, dy = wy - p.y, d2 = dx * dx + dy * dy;
          if (d2 > (p.r + 5) * (p.r + 5)) continue;
          const [lx, ly] = toLocal(p, wx, wy);
          const ok = inside(p.v, lx, ly) || d2 < (p.rc * 0.8 + 4) ** 2;
          if (!ok) continue;
          const sc = p.z * 2 + p.rc - Math.sqrt(d2) * 0.3;
          if (sc > bs) { bs = sc; best = p; }
        }
        const PR = 17;
        // Onde de choc sur les voisins
        for (const p of pieces) {
          if (p === best || p.held) continue;
          const dx = p.x - wx, dy = p.y - wy, d = Math.hypot(dx, dy) || 1;
          if (d < 70) {
            const k = (70 - d) / 70;
            p.vx += dx / d * k * 70; p.vy += dy / d * k * 70;
            if (p.z < 2) p.vz += k * (p.rc < 8 ? 120 : 45);
          }
        }
        let crushed = 0;
        // Les petits morceaux sous le pilon sont écrasés
        const smallOnes = pieces.filter((p) => p !== best && !p.held && p.z < 12 && p.rc < 9 && Math.hypot(p.x - wx, p.y - wy) < PR + p.rc * 0.6);
        smallOnes.forEach((p) => {
          crushed++;
          if (p.rc < 4.2) toPowder(p);
          else { const [lx, ly] = toLocal(p, wx, wy); shatter(p, lx, ly, 0.7); }
        });
        if (best) {
          const [lx, ly] = toLocal(best, wx, wy);
          best.dmg++;
          if (best.rc > 9 && best.dmg < best.hp) {
            const nc = randInt(3, 5);
            for (let i = 0; i < nc && best.cracks.length < 14; i++) jaggedCrack(lx, ly, rand(0, Math.PI * 2), best.r * rand(0.5, 1.25), best.cracks, 0);
            best.vz += 35; best.va += rand(-1.5, 1.5);
            A.crack(0.55, 1.55); A.tap('glass', 0.38, clamp(2.1 - best.rc / 25, 1, 2));
            SG.haptic(10);
            sparkAt(wx, wy, 1);
            for (let i = 0; i < 4; i++) {
              const an = rand(0, 6.3), sp = rand(30, 110);
              chips.push({ x: wx, y: wy, z: best.z + 3, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, vz: rand(60, 180), life: 1, s: rand(0.6, 1.5), col: best.col });
            }
          } else {
            const big = best.rc > 12;
            shatter(best, lx, ly, big ? 1 : 0.85);
            A.crack(big ? 0.85 : 0.6, big ? 1.5 : 1.9);
            A.crunch(big ? 0.85 : 0.6, 1.9);
            A.tap('glass', 0.42, clamp(2.2 - best.rc / 22, 1, 2.4));
            if (big) setTimeout(() => A.crunch(0.4, 2.3), 45);
            if (big && Math.random() < 0.4) A.sparkle(0.07);
            SG.haptic(big ? [14, 20, 8] : 10);
          }
        }
        if (crushed) {
          A.crunch(clamp(0.35 + crushed * 0.1, 0.35, 0.9), 2.1);
          if (!best) SG.haptic(8);
        }
        if (!best && !crushed) {
          A.tap('glass', 0.28, 0.66); A.thud(0.3, 1.4); SG.haptic(6);
        } else A.thud(0.22, 1.6);
        capPieces();
      }

      /* ---------- Sirop ---------- */
      function pourAt(wx, wy, dt) {
        const col = SYRUPS[syrup].c;
        const d = Math.hypot(wx, wy);
        if (d < RB - 4) {
          const rr = rand(14, 26) * FK, fxp = (wx + RB) * FK + rand(-6, 6), fyp = (wy + RB) * FK + rand(-6, 6);
          let gr = px.createRadialGradient(fxp, fyp, 0, fxp, fyp, rr);
          gr.addColorStop(0, rgb(col, 0.09)); gr.addColorStop(1, rgb(col, 0));
          px.fillStyle = gr; px.fillRect(fxp - rr, fyp - rr, rr * 2, rr * 2);
          // la poudre de glace boit le sirop
          fx.save(); fx.globalCompositeOperation = 'source-atop';
          gr = fx.createRadialGradient(fxp, fyp, 0, fxp, fyp, rr * 1.2);
          gr.addColorStop(0, rgb(col, 0.14)); gr.addColorStop(1, rgb(col, 0));
          fx.fillStyle = gr; fx.fillRect(fxp - rr * 1.2, fyp - rr * 1.2, rr * 2.4, rr * 2.4);
          fx.restore();
        }
        for (const p of pieces) {
          const dd = Math.hypot(p.x - wx, p.y - wy);
          if (dd < 26 + p.rc * 0.5) {
            const k = dt * 1.6 * (1 - dd / (26 + p.rc * 0.5));
            p.col = mix(p.col, col, k); p.syr = Math.min(1, p.syr + k * 0.8);
          }
        }
        if (Math.random() < dt * 9) drops.push({ x: wx + rand(-4, 4), y: wy + rand(-4, 4), vx: rand(-60, 60), vy: rand(-60, 60), z: 2, vz: rand(40, 120), life: 1, col });
        if (Math.random() < dt * 5) A.bubble(rand(0.7, 1.2), 0.12);
      }

      /* ---------- Physique ---------- */
      function step(dt) {
        const n = pieces.length;
        for (let i = 0; i < n; i++) {
          const p = pieces[i];
          if (p.held) {
            const s = p.held;
            p.vx = (s.wx + p.ho[0] - p.x) * 18; p.vy = (s.wy + p.ho[1] - p.y) * 18;
            p.z += (14 - p.z) * Math.min(1, dt * 12); p.vz = 0; p.va *= 0.9;
          } else {
            p.vz -= 1100 * dt; p.z += p.vz * dt;
            if (p.z <= 0) {
              p.z = 0;
              if (p.vz < -80) {
                const v = -p.vz;
                p.vz = v * 0.3;
                if (v > 130) clink(v / 900, p.rc);
              } else p.vz = 0;
            }
            if (p.z < 1.5) {
              // fond bombé du saladier : tout glisse doucement vers le centre
              const d = Math.hypot(p.x, p.y) / RB;
              p.vx -= p.x / RB * 130 * d * dt; p.vy -= p.y / RB * 130 * d * dt;
              const fr = Math.exp(-2.6 * dt);
              p.vx *= fr; p.vy *= fr; p.va *= Math.exp(-3.5 * dt);
            }
          }
          p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt;
          if (p.born > 0) p.born -= dt;
          // paroi
          const d = Math.hypot(p.x, p.y), lim = RB - p.rc * 0.85;
          if (d > lim) {
            const nx = p.x / d, ny = p.y / d;
            p.x = nx * lim; p.y = ny * lim;
            const vn = p.vx * nx + p.vy * ny;
            if (vn > 0) {
              p.vx -= 1.4 * vn * nx; p.vy -= 1.4 * vn * ny;
              if (vn > 90) bowlClink(vn / 700);
              p.vz += vn * 0.08;
            }
          }
        }
        // collisions entre morceaux
        for (let i = 0; i < n; i++) {
          const a = pieces[i];
          for (let j = i + 1; j < n; j++) {
            const b = pieces[j];
            const rr = a.rc + b.rc;
            const dx = b.x - a.x; if (dx > rr || dx < -rr) continue;
            const dy = b.y - a.y; if (dy > rr || dy < -rr) continue;
            const d2 = dx * dx + dy * dy;
            if (d2 >= rr * rr) continue;
            if (Math.abs(a.z - b.z) > Math.min(a.rc, b.rc) * 0.9 + 4) continue;
            if (a.born > 0 && b.born > 0) continue;
            const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d;
            const ia = a.held ? 0 : 1 / a.area, ib = b.held ? 0 : 1 / b.area, is = ia + ib;
            if (!is) continue;
            const ov = (rr - d) * 0.8;
            a.x -= nx * ov * ia / is; a.y -= ny * ov * ia / is;
            b.x += nx * ov * ib / is; b.y += ny * ov * ib / is;
            const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
            if (vn < 0) {
              const jn = -(1 + 0.35) * vn / is;
              a.vx -= jn * nx * ia; a.vy -= jn * ny * ia; b.vx += jn * nx * ib; b.vy += jn * ny * ib;
              const vt = (b.vx - a.vx) * -ny + (b.vy - a.vy) * nx;
              a.va += vt * 0.01; b.va -= vt * 0.01;
              if (vn < -55) clink(-vn / 700, Math.min(a.rc, b.rc));
            }
          }
        }
        // Outils qui poussent la glace
        ptrs.forEach((s) => {
          if (!s.pressed || s.held || s.mode === 'syrup') return;
          const K = s.mode === 'pestle' ? 16 : 22;
          for (const p of pieces) {
            if (p.z > 10 || p.held) continue;
            const dx = p.x - s.wx, dy = p.y - s.wy, rr = K + p.rc * 0.8;
            const d2 = dx * dx + dy * dy;
            if (d2 < rr * rr) {
              const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d;
              p.x = s.wx + nx * rr; p.y = s.wy + ny * rr;
              const vn = (p.vx - s.vx) * nx + (p.vy - s.vy) * ny;
              if (vn < 0) { p.vx -= vn * nx * 1.2; p.vy -= vn * ny * 1.2; }
              p.va += (s.vx * -ny + s.vy * nx) * 0.002;
            }
          }
        });
      }

      /* ---------- Rendu ---------- */
      function pathPoly(v, sc = 1, ox = 0, oy = 0) {
        g.beginPath();
        g.moveTo(v[0][0] * sc + ox, v[0][1] * sc + oy);
        for (let i = 1; i < v.length; i++) g.lineTo(v[i][0] * sc + ox, v[i][1] * sc + oy);
        g.closePath();
      }
      function drawShadow(p) {
        g.save();
        g.translate(p.x + 1.8 + p.z * 0.45, p.y + 2.6 + p.z * 0.65);
        g.rotate(p.a);
        pathPoly(p.v);
        g.fillStyle = `rgba(55,85,130,${clamp(0.2 - p.z * 0.002, 0.06, 0.2)})`; g.fill();
        if (p.rc > 7 && p.z < 30) {
          // caustique : la glace concentre la lumière dans son ombre
          pathPoly(p.v, 0.45, -p.r * 0.1, -p.r * 0.1);
          g.fillStyle = rgb(mix(p.col, WHITE, 0.3), 0.32); g.fill();
        }
        g.restore();
      }
      function drawPiece(p) {
        const c = p.col, s1 = p.syr, lw = 1 / S;
        const ca = Math.cos(p.a), sa = Math.sin(p.a);
        g.save();
        g.translate(p.x, p.y - p.z * 0.5);
        const sc = 1 + p.z * 0.004;
        g.rotate(p.a); if (sc !== 1) g.scale(sc, sc);
        const al = 0.42 + s1 * 0.3;
        // direction de la lumière en repère local (vient du haut-gauche)
        const Lx = -(ca + sa) * p.r * 0.75, Ly = (sa - ca) * p.r * 0.75;
        pathPoly(p.v);
        if (p.rc < 4.5) {
          g.fillStyle = rgb(mix(c, WHITE, 0.4), al + 0.25); g.fill();
          g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = lw; g.stroke();
          g.restore();
          return;
        }
        let gr = g.createLinearGradient(Lx, Ly, -Lx, -Ly);
        gr.addColorStop(0, rgb(mix(c, WHITE, 0.55), al * 0.75));
        gr.addColorStop(0.55, rgb(c, al));
        gr.addColorStop(1, rgb(mix(c, [90, 130, 190], 0.25), al + 0.18));
        g.fillStyle = gr; g.fill();
        g.save();
        g.clip();
        // face supérieure (biseau) : réfraction plus claire
        pathPoly(p.v, 0.74, Lx * 0.08, Ly * 0.08);
        g.fillStyle = 'rgba(255,255,255,0.16)'; g.fill();
        // cœur laiteux du glaçon
        if (p.cloud && p.rc > 8) {
          gr = g.createRadialGradient(0, 0, 0, 0, 0, p.r * 0.6);
          gr.addColorStop(0, `rgba(255,255,255,${0.42 * (1 - s1 * 0.6)})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = gr; g.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
        }
        if (p.bub) {
          g.fillStyle = 'rgba(255,255,255,0.75)';
          p.bub.forEach((b) => { g.beginPath(); g.arc(b[0], b[1], b[2], 0, Math.PI * 2); g.fill(); });
        }
        // fissures internes (blanches, avec un léger relief)
        if (p.cracks.length) {
          g.lineJoin = 'round'; g.lineCap = 'round';
          p.cracks.forEach((k) => {
            const q = k.p;
            g.beginPath(); g.moveTo(q[0] + lw, q[1] + lw);
            for (let i = 2; i < q.length; i += 2) g.lineTo(q[i] + lw, q[i + 1] + lw);
            g.strokeStyle = 'rgba(80,120,170,0.25)'; g.lineWidth = 1.6 * lw * k.w; g.stroke();
            g.beginPath(); g.moveTo(q[0], q[1]);
            for (let i = 2; i < q.length; i += 2) g.lineTo(q[i], q[i + 1]);
            g.strokeStyle = 'rgba(255,255,255,0.92)'; g.lineWidth = 1.3 * lw * k.w; g.stroke();
            g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 4 * lw * k.w; g.stroke();
          });
        }
        // reflet spéculaire fixe (lumière du haut-gauche)
        const hx = Lx * 0.55, hy = Ly * 0.55;
        gr = g.createRadialGradient(hx, hy, 0, hx, hy, p.r * 0.45);
        gr.addColorStop(0, 'rgba(255,255,255,0.85)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.25)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr; g.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
        g.restore();
        // arêtes : claires côté lumière, bleutées à l'ombre
        gr = g.createLinearGradient(Lx, Ly, -Lx, -Ly);
        gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(1, 'rgba(110,150,205,0.55)');
        pathPoly(p.v);
        g.strokeStyle = gr; g.lineWidth = 1.3 * lw; g.lineJoin = 'round'; g.stroke();
        g.restore();
      }

      function drawPestle(x, y, lift) {
        const hy = y - lift * 16;
        g.fillStyle = `rgba(60,60,90,${0.2 - lift * 0.08})`;
        g.beginPath(); g.ellipse(x + 5 + lift * 12, y + 6 + lift * 10, 22, 17, 0, 0, Math.PI * 2); g.fill();
        g.save();
        g.translate(x, hy);
        g.rotate(-0.55);
        // manche (vers le bas, en perspective)
        let gr = g.createLinearGradient(-10, 0, 10, 0);
        gr.addColorStop(0, '#b98552'); gr.addColorStop(0.45, '#f3d2a4'); gr.addColorStop(1, '#a8743f');
        g.fillStyle = gr;
        g.beginPath();
        g.moveTo(-13, 6); g.quadraticCurveTo(-6, 60, -9, 112); g.quadraticCurveTo(0, 124, 9, 112);
        g.quadraticCurveTo(6, 60, 13, 6); g.closePath(); g.fill();
        g.strokeStyle = 'rgba(120,70,30,0.25)'; g.lineWidth = 1;
        for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * 4, 20); g.quadraticCurveTo(i * 2.5, 60, i * 3.5, 108); g.stroke(); }
        // tête du pilon (bois de bout)
        gr = g.createRadialGradient(-6, -6, 2, 0, 0, 22);
        gr.addColorStop(0, '#f6dcb4'); gr.addColorStop(0.7, '#d7a874'); gr.addColorStop(1, '#a8743f');
        g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, 21, 19, 0, 0, Math.PI * 2); g.fill();
        g.strokeStyle = 'rgba(130,80,40,0.25)';
        for (let r = 5; r < 19; r += 4.5) { g.beginPath(); g.ellipse(1, 1, r, r * 0.9, 0, 0, Math.PI * 2); g.stroke(); }
        g.strokeStyle = 'rgba(255,240,215,0.7)'; g.lineWidth = 2;
        g.beginPath(); g.arc(0, 0, 18, Math.PI * 1.05, Math.PI * 1.5); g.stroke();
        g.restore();
      }
      function drawBottle(x, y, col, wx, wy) {
        const bx = x - 18, by = y - 150;
        // filet de sirop
        g.lineCap = 'round';
        g.strokeStyle = rgb(col, 0.9); g.lineWidth = 4.5;
        const wob = Math.sin(performance.now() / 70) * 1.5;
        g.beginPath(); g.moveTo(bx + 14, by + 32); g.quadraticCurveTo(x + wob, y - 60, x, y); g.stroke();
        g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 1.4;
        g.beginPath(); g.moveTo(bx + 13, by + 34); g.quadraticCurveTo(x - 1 + wob, y - 60, x - 1, y - 4); g.stroke();
        g.save();
        g.translate(bx, by); g.rotate(0.9);
        g.fillStyle = 'rgba(255,255,255,0.55)';
        g.beginPath(); g.roundRect ? g.roundRect(-16, -58, 32, 64, 9) : g.rect(-16, -58, 32, 64); g.fill();
        g.fillStyle = rgb(col, 0.85);
        g.beginPath(); g.roundRect ? g.roundRect(-14, -40, 28, 44, 7) : g.rect(-14, -40, 28, 44); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.6)'; g.fillRect(-10, -52, 4, 50);
        g.fillStyle = '#f4f0f6'; g.fillRect(-6, 6, 12, 14);
        g.restore();
      }

      function render(dt) {
        const w = cv.w, h = cv.h, d = cv.dpr;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.drawImage(bg, 0, 0);
        // monde
        g.setTransform(d * S, 0, 0, d * S, d * cx, d * cy);
        g.save();
        g.beginPath(); g.arc(0, 0, RB, 0, Math.PI * 2); g.clip();
        g.globalAlpha = 0.75; g.drawImage(pud, -RB, -RB, RB * 2, RB * 2); g.globalAlpha = 1;
        g.drawImage(frost, -RB, -RB, RB * 2, RB * 2);
        g.restore();
        // gouttes de sirop
        drops.forEach((q) => {
          g.fillStyle = rgb(q.col, 0.85 * q.life);
          g.beginPath(); g.arc(q.x, q.y - q.z * 0.5, 1.6, 0, Math.PI * 2); g.fill();
        });
        const order = pieces.slice().sort((a, b) => a.z - b.z || a.y - b.y);
        order.forEach(drawShadow);
        order.forEach(drawPiece);
        // éclats et poudre volante
        chips.forEach((c) => {
          g.fillStyle = c.puff ? `rgba(255,255,255,${0.5 * c.life})` : rgb(mix(c.col || WHITE, WHITE, 0.5), 0.9 * c.life);
          const s = c.s * (c.puff ? 2 + (1 - c.life) * 4 : 1);
          if (c.puff) { g.beginPath(); g.arc(c.x, c.y - c.z * 0.5, s, 0, Math.PI * 2); g.fill(); }
          else g.fillRect(c.x - s / 2, c.y - c.z * 0.5 - s / 2, s, s);
        });
        // scintillements givrés
        g.globalCompositeOperation = 'lighter';
        sparks.forEach((s) => {
          const k = Math.sin(s.life * Math.PI), z = s.s * k;
          g.save(); g.translate(s.x, s.y); g.rotate(s.rot);
          g.fillStyle = `rgba(255,255,255,${0.9 * k})`;
          g.beginPath();
          g.moveTo(0, -z); g.lineTo(z * 0.18, -z * 0.18); g.lineTo(z, 0); g.lineTo(z * 0.18, z * 0.18);
          g.lineTo(0, z); g.lineTo(-z * 0.18, z * 0.18); g.lineTo(-z, 0); g.lineTo(-z * 0.18, -z * 0.18); g.closePath(); g.fill();
          g.restore();
        });
        g.globalCompositeOperation = 'source-over';
        // paroi avant
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.drawImage(fgc, 0, 0);
        // outils
        g.setTransform(d, 0, 0, d, 0, 0);
        let shown = false;
        ptrs.forEach((s) => {
          shown = true;
          if (s.mode === 'pestle') drawPestle(s.sx, s.sy, s.lift);
          else if (s.mode === 'syrup') drawBottle(s.sx, s.sy, SYRUPS[syrup].c);
          else if (s.mode === 'hand') {
            g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 2;
            g.beginPath(); g.arc(s.sx, s.sy, 22 * S, 0, Math.PI * 2); g.stroke();
          }
        });
        if (!shown && hover && mode === 'pestle') drawPestle(hover.x, hover.y, 1);
      }

      /* ---------- Boucle ---------- */
      const loop = SG.loop((dt) => {
        sndBudget = Math.min(5, sndBudget + dt * 32);
        const sub = 2;
        for (let i = 0; i < sub; i++) step(dt / sub);
        // pointeurs : lissage + effets continus
        let grinding = 0, pouring = false;
        ptrs.forEach((s) => {
          s.lift += ((s.pressed ? 0 : 1) - s.lift) * Math.min(1, dt * 14);
          s.spd *= Math.exp(-dt * 8);
          if (s.mode === 'pestle' && s.pressed && s.spd > 30) {
            // broyage : les petits éclats sous le pilon deviennent neige
            const victims = pieces.filter((p) => !p.held && p.z < 8 && p.rc < 8 && Math.hypot(p.x - s.wx, p.y - s.wy) < 20 + p.rc * 0.5);
            const chance = clamp(s.spd / 900, 0, 0.6) * dt * 10;
            victims.forEach((p) => {
              if (Math.random() < chance) {
                grinding += 1;
                if (p.rc < 4.5) toPowder(p, true);
                else { const [lx, ly] = toLocal(p, s.wx, s.wy); shatter(p, lx, ly, 0.35); }
              }
            });
            if (victims.length) grinding += 0.3;
            // la neige craque sous le pilon
            if (Math.hypot(s.wx, s.wy) < RB && snowAt(s.wx, s.wy) > 2) grinding += 0.4;
          }
          if (s.mode === 'syrup' && s.pressed) { pouring = true; pourAt(s.wx, s.wy, dt); }
        });
        if (grinding > 0) {
          if (!grindLoop) grindLoop = A.loop('sand');
          let spd = 0; ptrs.forEach((s) => { spd = Math.max(spd, s.spd); });
          grindLoop.set(clamp(0.25 + spd / 1200 + grinding * 0.1, 0, 1), 0.6);
          crunchT -= dt;
          if (crunchT <= 0 && grinding >= 1) { A.crunch(clamp(0.25 + grinding * 0.08, 0.2, 0.7), 2.2); crunchT = 0.09; }
        } else if (grindLoop) { grindLoop.stop(); grindLoop = null; }
        if (pouring) {
          if (!pourLoop) pourLoop = A.loop('pour');
          pourLoop.set(0.65, 0.4);
        } else if (pourLoop) { pourLoop.stop(); pourLoop = null; }
        if (grinding >= 1) capPieces();

        // particules
        chips.forEach((c) => {
          c.vz -= (c.puff ? 200 : 900) * dt; c.z += c.vz * dt; c.x += c.vx * dt; c.y += c.vy * dt;
          c.life -= dt * (c.puff ? 1.6 : 0.9);
          if (c.z < 0) {
            if (c.puff) c.z = 0;
            else { c.z = 0; c.vz *= -0.3; c.vx *= 0.6; c.vy *= 0.6; if (c.vz < 20) c.life = Math.min(c.life, 0.25); }
          }
        });
        chips = chips.filter((c) => c.life > 0);
        if (chips.length > 400) chips.splice(0, chips.length - 400);
        sparks.forEach((s) => { s.life -= dt * 1.8; });
        sparks = sparks.filter((s) => s.life > 0);
        // scintillement aléatoire sur la glace
        if (pieces.length && Math.random() < dt * 2.5) {
          const p = pieces[randInt(0, pieces.length - 1)];
          if (p.rc > 6) sparkAt(p.x - p.r * 0.3, p.y - p.r * 0.3 - p.z * 0.5, 1);
        }
        drops.forEach((q) => {
          q.vz -= 600 * dt; q.z += q.vz * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.z < 0) q.life = 0;
        });
        drops = drops.filter((q) => q.life > 0);

        progT -= dt;
        if (progT <= 0) {
          progT = 0.25;
          let crushed = powderArea;
          pieces.forEach((p) => { if (p.rc < 6) crushed += p.area; });
          const v = totalArea ? crushed / totalArea : 0;
          prog.set(v / 0.8);
          if (!celebrated && v >= 0.8) {
            celebrated = true;
            SG.celebrate(stage, 'Glace pilée !');
            setTimeout(() => SG.hint(stage, 'Ajoute du sirop 🍓 ou de nouveaux glaçons'), 2300);
          }
        }
        render(dt);
      });

      /* ---------- Entrées ---------- */
      const toW = (x, y) => [(x - cx) / S, (y - cy) / S];
      const ptr = SG.pointer(cv.canvas, {
        hover(p) { if (!p.e || p.e.pointerType === 'mouse') hover = { x: p.x, y: p.y }; },
        down(p) {
          const [wx, wy] = toW(p.x, p.y);
          const s = { sx: p.x, sy: p.y, wx, wy, vx: 0, vy: 0, spd: 0, pressed: true, mode, held: null, lift: 1, t: performance.now() };
          ptrs.set(p.id, s);
          if (mode === 'pestle') { s.lift = 0; hit(wx, wy); }
          else if (mode === 'hand') {
            let best = null, bd = 1e9;
            for (const q of pieces) {
              if (q.held) continue;
              const dd = Math.hypot(q.x - wx, q.y - wy);
              if (dd < q.r + 10 && dd - q.z < bd) { bd = dd - q.z; best = q; }
            }
            if (best) {
              best.held = s; best.ho = [best.x - wx, best.y - wy]; s.held = best;
              A.tap('glass', 0.18, 2.2); A.rustle(0.08, 0.06); SG.haptic(6);
            } else A.whoosh(0.08, 0.2);
          } else {
            A.drip(0.8, 0.4);
          }
        },
        move(p) {
          const s = ptrs.get(p.id);
          if (!s) return;
          const now = performance.now(), dtm = Math.max(8, now - s.t) / 1000;
          const [wx, wy] = toW(p.x, p.y);
          s.vx = SG.util.lerp(s.vx, (wx - s.wx) / dtm, 0.5); s.vy = SG.util.lerp(s.vy, (wy - s.wy) / dtm, 0.5);
          s.spd = Math.max(s.spd * 0.7, Math.hypot(wx - s.wx, wy - s.wy) / dtm);
          s.wx = wx; s.wy = wy; s.sx = p.x; s.sy = p.y; s.t = now;
          if (p.e && p.e.pointerType === 'mouse') hover = { x: p.x, y: p.y };
        },
        up(p) {
          const s = ptrs.get(p.id);
          if (!s) return;
          if (s.held) {
            const q = s.held; q.held = false; s.held = null;
            q.vx = clamp(s.vx, -900, 900); q.vy = clamp(s.vy, -900, 900); q.vz = 40; q.va += rand(-3, 3);
            A.whoosh(clamp(Math.hypot(s.vx, s.vy) / 3000, 0.03, 0.25), 0.25);
          }
          s.pressed = false;
          ptrs.delete(p.id);
          if (p.e && p.e.pointerType === 'mouse') hover = { x: p.x, y: p.y };
        },
      });
      const onLeave = () => { hover = null; };
      cv.canvas.addEventListener('pointerleave', onLeave);

      /* ---------- Barre d'outils ---------- */
      const bar = SG.toolbar(stage, [
        { icon: '🪵', label: 'Pilon', group: 'm', active: true, onClick: () => { mode = 'pestle'; } },
        { icon: '✋', label: 'Main', group: 'm', onClick: () => { mode = 'hand'; } },
        { icon: '🍯', label: 'Sirop', group: 'm', onClick: () => { mode = 'syrup'; SG.hint(stage, `Sirop ${SYRUPS[syrup].name} : maintiens pour verser`, 1800); } },
        { color: rgb(SYRUPS[0].c, 1), title: 'Parfum', onClick: (b) => {
          syrup = (syrup + 1) % SYRUPS.length;
          b.style.setProperty('--swatch', rgb(SYRUPS[syrup].c, 1));
          mode = 'syrup';
          bar.querySelectorAll('[data-group="m"]').forEach((x, i) => x.classList.toggle('active', i === 2));
          SG.hint(stage, `Sirop ${SYRUPS[syrup].name}`, 1200);
          A.drip(1.1, 0.3);
        } },
        { icon: '🧊', label: 'Ajouter', onClick: () => dropCubes(3) },
        { icon: '✨', label: 'Nouveau', onClick: () => { reset(); A.chime(4, 0.25); } },
      ]);

      function dropCubes(n) {
        for (let i = 0; i < n; i++) {
          const an = rand(0, Math.PI * 2), rr = rand(0, RB * 0.55);
          const p = addCube(Math.cos(an) * rr, Math.sin(an) * rr, rand(90, 170));
          p.vx = rand(-30, 30); p.vy = rand(-30, 30); p.va = rand(-3, 3);
        }
        A.whoosh(0.15, 0.3);
        setTimeout(() => SG.haptic(12), 350);
        capPieces();
      }
      function reset() {
        pieces = []; chips = []; sparks = []; drops = [];
        totalArea = 0; powderArea = 0; celebrated = false;
        fx.clearRect(0, 0, FS, FS); px.clearRect(0, 0, FS, FS); snow.fill(0);
        ptrs.forEach((s) => { s.held = null; });
        const n = 7;
        for (let i = 0; i < n; i++) {
          const an = (i / n) * Math.PI * 2 + rand(-0.2, 0.2), rr = i === 0 ? 0 : RB * rand(0.35, 0.55);
          addCube(i === 0 ? 0 : Math.cos(an) * rr, i === 0 ? 0 : Math.sin(an) * rr, 0);
        }
        prog.set(0);
      }

      cv.onResize(layout);
      layout();
      reset();
      if (/[?&]test\b/.test(location.search)) window.__ice = { get pieces() { return pieces; }, get powder() { return powderArea; }, get total() { return totalArea; } };

      return {
        destroy() {
          loop.stop(); ptr.destroy();
          cv.canvas.removeEventListener('pointerleave', onLeave);
          if (grindLoop) grindLoop.stop();
          if (pourLoop) pourLoop.stop();
          cv.destroy();
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/beads.js */
/* Perles — des milliers de perles brillantes à pousser, verser, secouer et ranger par couleur */
(function () {
  'use strict';
  const { rand, clamp, randInt } = SG.util;

  const COLS = [
    { name: 'rose', c: '#ff9ec0', d: '#e86f9b', l: '#ffe3ee' },
    { name: 'pêche', c: '#ffb48c', d: '#ea8a5c', l: '#ffe9dc' },
    { name: 'jaune', c: '#ffe07a', d: '#e8b93c', l: '#fff7d6' },
    { name: 'menthe', c: '#8fe3bd', d: '#55bf91', l: '#e2fbef' },
    { name: 'ciel', c: '#93c6ff', d: '#5e9be6', l: '#e2f0ff' },
    { name: 'lilas', c: '#c3a6ff', d: '#9a76ea', l: '#eee6ff' },
  ];
  const NC = COLS.length;

  SG.registerGame({
    id: 'beads',
    title: 'Perles',
    emoji: '🎀',
    desc: 'Pousse, verse et trie des milliers de perles brillantes.',
    color: '#ffc9e0',
    bg: 'linear-gradient(180deg,#fff2f7,#f6ecff)',
    order: 20,
    create(stage) {
      const A = SG.audio;
      const cv = SG.makeCanvas(stage);
      const g = cv.ctx;
      const small = Math.min(window.innerWidth, window.innerHeight) < 520;
      const r = small ? 4 : 5;
      const D = r * 2, D2 = D * D;
      const MAX = small ? 1000 : 3000;
      const X = new Float32Array(MAX), Y = new Float32Array(MAX), PX = new Float32Array(MAX), PY = new Float32Array(MAX);
      const OX = new Float32Array(MAX), OY = new Float32Array(MAX);
      const C = new Uint8Array(MAX), TP = new Uint8Array(MAX), BIN = new Int8Array(MAX).fill(-1);
      let N = 0;
      // boîte
      let x0 = 0, x1 = 0, y0 = 0, y1 = 0, lipY = 0, cw = 0, op = 0;
      let walls = []; // segments [ax, ay, bx, by]
      let gw = 1, gh = 1, cs = D;
      let cnt = new Int32Array(1), start = new Int32Array(2), items = new Int32Array(MAX), cellOf = new Int32Array(MAX);
      const bgc = document.createElement('canvas'), fgc = document.createElement('canvas');
      let sprites = [], spriteSz = 0;
      let mode = 'push';
      const fingers = new Map();
      let shakeT = 0, shakeAmp = 0, camX = 0, camY = 0;
      let energy = 0, hits = 0, rattle = null, tickBudget = 0, clackBudget = 4;
      let celebrated = false, inited = false, acc = 0, binCounts = new Int32Array(NC), binGood = new Int32Array(NC);
      let sortedFrac = 0, sparks = [];
      const prog = SG.progress(stage, 'Trié');
      SG.hint(stage, 'Range chaque couleur dans sa case 🎀');
      const hint2 = setTimeout(() => SG.hint(stage, 'L’aimant 🧲 attrape une seule couleur', 3500), 3900);

      /* ---------- Sons légers (cliquetis granulaire) ---------- */
      function tick(vol, f) {
        const c = A.ctx();
        if (!c || !SG.settings.sound || c.state !== 'running') return;
        const t = c.currentTime + 0.01 + Math.random() * 0.03;
        const o = c.createOscillator(), o2 = c.createOscillator(), gn = c.createGain(), g2 = c.createGain();
        o.frequency.value = f; o2.frequency.value = f * rand(2.6, 2.9);
        gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + rand(0.012, 0.03));
        g2.gain.setValueAtTime(vol * 0.5, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.01);
        o.connect(gn); o2.connect(g2); gn.connect(A.out()); g2.connect(A.out());
        o.start(t); o2.start(t); o.stop(t + 0.04); o2.stop(t + 0.03);
      }

      /* ---------- Mise en page ---------- */
      function layout() {
        const w = cv.w, h = cv.h;
        const nx0 = 12, nx1 = w - 12, ny0 = 62, ny1 = h - (w < 480 ? 130 : 88);
        const nch = (ny1 - ny0) * (w > h ? 0.4 : 0.42);
        const nlip = ny1 - nch;
        if (inited && N) {
          // garder les perles à leur place (remise à l'échelle par zone)
          for (let i = 0; i < N; i++) {
            const fx = (X[i] - x0) / (x1 - x0);
            const fy = Y[i] < lipY ? (Y[i] - y0) / (lipY - y0) : (Y[i] - lipY) / (y1 - lipY);
            const nxv = nx0 + fx * (nx1 - nx0);
            const nyv = Y[i] < lipY ? ny0 + fy * (nlip - ny0) : nlip + fy * (ny1 - nlip);
            PX[i] += nxv - X[i]; PY[i] += nyv - Y[i]; X[i] = nxv; Y[i] = nyv;
          }
        }
        x0 = nx0; x1 = nx1; y0 = ny0; y1 = ny1; lipY = nlip;
        cw = (x1 - x0) / NC; op = Math.max(D * 3.2, cw * 0.56);
        walls = [];
        for (let i = 1; i < NC; i++) walls.push([x0 + i * cw, lipY, x0 + i * cw, y1]);
        for (let i = 0; i < NC; i++) {
          const a = x0 + i * cw, b = a + cw, m = (cw - op) / 2;
          walls.push([a, lipY, a + m, lipY], [b - m, lipY, b, lipY]);
        }
        cs = D;
        gw = Math.ceil((x1 - x0) / cs) + 2; gh = Math.ceil((y1 - y0) / cs) + 2;
        cnt = new Int32Array(gw * gh); start = new Int32Array(gw * gh + 1);
        buildSprites();
        buildLayers();
        inited = true;
      }

      // Qualité basse : sprites sans ombre portée (plus petits = moins de pixels à mélanger)
      let sprPad = 5;
      function buildSprites() {
        const dpr = cv.dpr;
        const lowQ = SG.quality.level === 0;
        sprPad = lowQ ? 1 : 5;
        spriteSz = Math.ceil((D + sprPad) * dpr);
        sprites = [];
        COLS.forEach((col) => {
          for (let t = 0; t < 2; t++) {
            const s = document.createElement('canvas');
            s.width = s.height = spriteSz;
            const q = s.getContext('2d');
            q.scale(spriteSz / (D + sprPad), spriteSz / (D + sprPad));
            const c = (D + sprPad) / 2;
            let gr;
            if (!lowQ) {
              // ombre portée douce
              gr = q.createRadialGradient(c + 1.3, c + 1.8, r * 0.3, c + 1.3, c + 1.8, r * 1.25);
              gr.addColorStop(0, 'rgba(90,50,90,0.35)'); gr.addColorStop(1, 'rgba(90,50,90,0)');
              q.fillStyle = gr; q.beginPath(); q.arc(c + 1.3, c + 1.8, r * 1.25, 0, Math.PI * 2); q.fill();
            }
            // sphère
            gr = q.createRadialGradient(c - r * 0.4, c - r * 0.45, r * 0.1, c, c, r);
            gr.addColorStop(0, col.l); gr.addColorStop(0.45, col.c); gr.addColorStop(1, col.d);
            q.fillStyle = gr; q.beginPath(); q.arc(c, c, r, 0, Math.PI * 2); q.fill();
            // lumière rebondie en bas à droite
            gr = q.createRadialGradient(c + r * 0.5, c + r * 0.55, 0, c + r * 0.5, c + r * 0.55, r * 0.6);
            gr.addColorStop(0, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
            q.fillStyle = gr; q.beginPath(); q.arc(c, c, r, 0, Math.PI * 2); q.fill();
            if (t === 1) {
              // perle percée : trou central
              gr = q.createRadialGradient(c + 0.3, c + 0.3, 0, c, c, r * 0.36);
              gr.addColorStop(0, 'rgba(70,40,70,0.55)'); gr.addColorStop(0.7, col.d); gr.addColorStop(1, col.c);
              q.fillStyle = gr; q.beginPath(); q.arc(c, c, r * 0.36, 0, Math.PI * 2); q.fill();
            }
            // reflet spéculaire net
            q.fillStyle = 'rgba(255,255,255,0.95)';
            q.beginPath(); q.ellipse(c - r * 0.38, c - r * 0.42, r * 0.28, r * 0.2, -0.6, 0, Math.PI * 2); q.fill();
            q.fillStyle = 'rgba(255,255,255,0.6)';
            q.beginPath(); q.arc(c + r * 0.3, c - r * 0.55, r * 0.08, 0, Math.PI * 2); q.fill();
            sprites.push(s);
          }
        });
      }

      function rr(q, x, y, w, h, rad) {
        q.beginPath();
        if (q.roundRect) q.roundRect(x, y, w, h, rad); else q.rect(x, y, w, h);
      }

      function buildLayers() {
        const w = cv.w, h = cv.h, d = cv.dpr;
        bgc.width = fgc.width = Math.round(w * d); bgc.height = fgc.height = Math.round(h * d);
        const b = bgc.getContext('2d');
        b.setTransform(d, 0, 0, d, 0, 0);
        // table en bois clair
        let gr = b.createLinearGradient(0, 0, w, h);
        gr.addColorStop(0, '#f6e3d6'); gr.addColorStop(1, '#efd5c6');
        b.fillStyle = gr; b.fillRect(0, 0, w, h);
        b.strokeStyle = 'rgba(190,140,120,0.12)'; b.lineWidth = 1;
        for (let y = 4; y < h; y += 7) {
          b.beginPath(); b.moveTo(0, y);
          for (let x = 0; x <= w; x += 40) b.lineTo(x, y + Math.sin(x * 0.01 + y * 0.3) * 2);
          b.stroke();
        }
        // boîte : ombre + cadre plastique
        b.save();
        b.shadowColor = 'rgba(120,70,100,0.3)'; b.shadowBlur = 24; b.shadowOffsetY = 10;
        rr(b, x0 - 9, y0 - 9, x1 - x0 + 18, y1 - y0 + 18, 18);
        b.fillStyle = '#ffd7e6'; b.fill();
        b.restore();
        gr = b.createLinearGradient(0, y0 - 9, 0, y1 + 9);
        gr.addColorStop(0, '#ffe6f0'); gr.addColorStop(1, '#f7c2d6');
        rr(b, x0 - 9, y0 - 9, x1 - x0 + 18, y1 - y0 + 18, 18); b.fillStyle = gr; b.fill();
        // fond feutré du plateau
        rr(b, x0, y0, x1 - x0, y1 - y0, 11);
        b.fillStyle = '#fff6f2'; b.fill();
        b.save(); b.clip();
        for (let i = 0; i < (x1 - x0) * (y1 - y0) / 30; i++) {
          b.fillStyle = Math.random() < 0.5 ? 'rgba(200,160,170,0.06)' : 'rgba(255,255,255,0.4)';
          b.fillRect(rand(x0, x1), rand(y0, y1), 1, 1);
        }
        // cases teintées + étiquettes
        for (let i = 0; i < NC; i++) {
          const a = x0 + i * cw;
          gr = b.createLinearGradient(0, lipY, 0, y1);
          gr.addColorStop(0, COLS[i].l + '00'); gr.addColorStop(1, COLS[i].l);
          b.fillStyle = gr; b.fillRect(a, lipY, cw, y1 - lipY);
          b.fillStyle = COLS[i].c; b.globalAlpha = 0.35;
          b.beginPath(); b.arc(a + cw / 2, y1 - 14, Math.min(9, cw * 0.18), 0, Math.PI * 2); b.fill();
          b.globalAlpha = 1;
        }
        // ombre intérieure
        const ish = 10;
        [[x0, y0, x1 - x0, ish, 0, 1], [x0, y0, ish, y1 - y0, 1, 0]].forEach(([x, y, ww, hh, ax, ay]) => {
          const q = b.createLinearGradient(x, y, x + ax * ish, y + ay * ish);
          q.addColorStop(0, 'rgba(150,90,120,0.22)'); q.addColorStop(1, 'rgba(150,90,120,0)');
          b.fillStyle = q; b.fillRect(x, y, ww, hh);
        });
        b.restore();

        // calque avant : cloisons transparentes
        const f = fgc.getContext('2d');
        f.setTransform(d, 0, 0, d, 0, 0);
        f.lineCap = 'round';
        walls.forEach(([ax, ay, bx, by]) => {
          f.strokeStyle = 'rgba(160,110,140,0.25)'; f.lineWidth = 5;
          f.beginPath(); f.moveTo(ax + 1.5, ay + 2); f.lineTo(bx + 1.5, by + 2); f.stroke();
          f.strokeStyle = 'rgba(255,236,244,0.85)'; f.lineWidth = 4;
          f.beginPath(); f.moveTo(ax, ay); f.lineTo(bx, by); f.stroke();
          f.strokeStyle = 'rgba(255,255,255,0.95)'; f.lineWidth = 1.2;
          f.beginPath(); f.moveTo(ax - 0.8, ay - 0.8); f.lineTo(bx - 0.8, by - 0.8); f.stroke();
        });
        // reflet sur le bord du cadre
        f.strokeStyle = 'rgba(255,255,255,0.7)'; f.lineWidth = 2;
        rr(f, x0 - 6, y0 - 6, x1 - x0 + 12, y1 - y0 + 12, 15); f.stroke();
      }

      /* ---------- Perles ---------- */
      function addBead(x, y, c, vx = 0, vy = 0) {
        if (N >= MAX) return false;
        X[N] = x; Y[N] = y; PX[N] = x - vx; PY[N] = y - vy;
        C[N] = c; TP[N] = Math.random() < 0.3 ? 1 : 0; BIN[N] = -1;
        N++;
        return true;
      }
      function capacity() {
        return Math.floor(NC * cw * (y1 - lipY) * 0.62 / (Math.PI * r * r));
      }
      function fillTray() {
        N = 0;
        const n = Math.min(MAX - 150, Math.floor(capacity() * 0.85));
        for (let i = 0; i < n; i++) addBead(rand(x0 + r, x1 - r), rand(y0 + r, lipY - r * 2), i % NC);
        // mélange les couleurs (indices aléatoires)
        for (let i = N - 1; i > 0; i--) { const j = randInt(0, i); const t = C[i]; C[i] = C[j]; C[j] = t; }
        celebrated = false;
      }
      function scatter() {
        for (let i = 0; i < N; i++) {
          const x = rand(x0 + r, x1 - r), y = rand(y0 + r, lipY - r * 2);
          X[i] = x; Y[i] = y; PX[i] = x + rand(-1, 1); PY[i] = y + rand(-1, 1); BIN[i] = -1;
        }
        celebrated = false;
      }

      /* ---------- Physique (Verlet + grille spatiale) ---------- */
      function buildGrid() {
        cnt.fill(0);
        for (let i = 0; i < N; i++) {
          const cx = clamp(((X[i] - x0) / cs + 1) | 0, 0, gw - 1), cy = clamp(((Y[i] - y0) / cs + 1) | 0, 0, gh - 1);
          const k = cy * gw + cx; cellOf[i] = k; cnt[k]++;
        }
        start[0] = 0;
        for (let k = 0; k < gw * gh; k++) start[k + 1] = start[k] + cnt[k];
        for (let k = 0; k < gw * gh; k++) cnt[k] = start[k];
        for (let i = 0; i < N; i++) items[cnt[cellOf[i]]++] = i;
      }
      function pair(i, j) {
        let dx = X[j] - X[i], dy = Y[j] - Y[i];
        const d2 = dx * dx + dy * dy;
        if (d2 >= D2) return;
        if (d2 < 1e-6) { dx = rand(-0.1, 0.1); dy = 0.1; }
        const d = Math.sqrt(dx * dx + dy * dy), nx = dx / d, ny = dy / d;
        const vn = (X[j] - PX[j] - X[i] + PX[i]) * nx + (Y[j] - PY[j] - Y[i] + PY[i]) * ny;
        if (vn < -0.12) { energy -= vn; if (vn < -0.5) hits++; }
        const ov = (D - d) * 0.5;
        X[i] -= nx * ov; Y[i] -= ny * ov; X[j] += nx * ov; Y[j] += ny * ov;
      }
      function collideAll() {
        for (let cy = 0; cy < gh; cy++) {
          for (let cx = 0; cx < gw; cx++) {
            const k = cy * gw + cx, s0 = start[k], s1 = start[k + 1];
            if (s0 === s1) continue;
            for (let a = s0; a < s1; a++) {
              const i = items[a];
              for (let b = a + 1; b < s1; b++) pair(i, items[b]);
              // voisins : droite, bas-gauche, bas, bas-droite
              if (cx + 1 < gw) { const k2 = k + 1; for (let b = start[k2]; b < start[k2 + 1]; b++) pair(i, items[b]); }
              if (cy + 1 < gh) {
                for (let ox = -1; ox <= 1; ox++) {
                  const nx = cx + ox; if (nx < 0 || nx >= gw) continue;
                  const k2 = k + gw + ox;
                  for (let b = start[k2]; b < start[k2 + 1]; b++) pair(i, items[b]);
                }
              }
            }
          }
        }
      }
      function wallsFor(i) {
        const lim = r + 2;
        for (let s = 0; s < walls.length; s++) {
          const wl = walls[s];
          const ax = wl[0], ay = wl[1], bx = wl[2], by = wl[3];
          // boîte englobante rapide
          if (X[i] < Math.min(ax, bx) - lim || X[i] > Math.max(ax, bx) + lim || Y[i] < Math.min(ay, by) - lim || Y[i] > Math.max(ay, by) + lim) continue;
          const ex = bx - ax, ey = by - ay, L2 = ex * ex + ey * ey, L = Math.sqrt(L2);
          const t = clamp(((X[i] - ax) * ex + (Y[i] - ay) * ey) / L2, 0, 1);
          const qx = ax + ex * t, qy = ay + ey * t;
          // côté de la cloison où était la perle au début du pas (anti-traversée)
          const lnx = -ey / L, lny = ex / L;
          const so = (OX[i] - ax) * lnx + (OY[i] - ay) * lny, sx = (X[i] - ax) * lnx + (Y[i] - ay) * lny;
          let nx, ny;
          if (t > 0 && t < 1 && so * sx < 0) {
            const sg = so >= 0 ? 1 : -1;
            nx = lnx * sg; ny = lny * sg;
          } else {
            let dx = X[i] - qx, dy = Y[i] - qy;
            const d = Math.hypot(dx, dy);
            if (d >= lim) continue;
            if (d < 1e-4) { dx = OX[i] - qx; dy = OY[i] - qy; }
            const dd = Math.hypot(dx, dy) || 1;
            nx = dx / dd; ny = dy / dd;
          }
          X[i] = qx + nx * lim; Y[i] = qy + ny * lim;
          const vn = (X[i] - PX[i]) * nx + (Y[i] - PY[i]) * ny;
          if (vn < 0) { PX[i] += vn * nx * 1.5; PY[i] += vn * ny * 1.5; energy -= vn * 0.5; }
        }
      }
      function substep() {
        const damp = 0.975, vmax = r * 0.9;
        const shaking = shakeT > 0;
        for (let i = 0; i < N; i++) {
          let vx = (X[i] - PX[i]) * damp, vy = (Y[i] - PY[i]) * damp;
          if (shaking) { vx += rand(-1, 1) * shakeAmp; vy += rand(-1, 1) * shakeAmp; }
          const sp = vx * vx + vy * vy;
          if (sp > vmax * vmax) { const k = vmax / Math.sqrt(sp); vx *= k; vy *= k; }
          PX[i] = X[i]; PY[i] = Y[i]; OX[i] = X[i]; OY[i] = Y[i];
          X[i] += vx; Y[i] += vy;
        }
        fingerForces();
        buildGrid();
        collideAll();
        for (let i = 0; i < N; i++) {
          if (X[i] < x0 + r) { X[i] = x0 + r; if (PX[i] < X[i]) PX[i] = X[i]; }
          else if (X[i] > x1 - r) { X[i] = x1 - r; if (PX[i] > X[i]) PX[i] = X[i]; }
          if (Y[i] < y0 + r) { Y[i] = y0 + r; if (PY[i] < Y[i]) PY[i] = Y[i]; }
          else if (Y[i] > y1 - r) { Y[i] = y1 - r; if (PY[i] > Y[i]) PY[i] = Y[i]; }
          if (Y[i] > lipY - r - 3) wallsFor(i);
        }
      }

      function fingerForces() {
        fingers.forEach((f) => {
          if (!f.pressed) return;
          // position interpolée pendant le sous-pas
          f.ix += (f.x - f.ix) * 0.5; f.iy += (f.y - f.iy) * 0.5;
          const fx = f.ix, fy = f.iy;
          if (f.mode === 'push') {
            const R = f.R, lim = R + r, lim2 = lim * lim;
            for (let i = 0; i < N; i++) {
              const dx = X[i] - fx; if (dx > lim || dx < -lim) continue;
              const dy = Y[i] - fy; if (dy > lim || dy < -lim) continue;
              const d2 = dx * dx + dy * dy;
              if (d2 < lim2) {
                const d = Math.sqrt(d2) || 0.01;
                X[i] = fx + dx / d * lim; Y[i] = fy + dy / d * lim;
              }
            }
          } else if (f.mode === 'magnet' && f.color >= 0) {
            const M = f.R, M2 = M * M;
            let n = 0;
            for (let i = 0; i < N; i++) {
              if (C[i] !== f.color) continue;
              const dx = fx - X[i], dy = fy - Y[i];
              const d2 = dx * dx + dy * dy;
              if (d2 < M2) {
                const d = Math.sqrt(d2) || 0.01;
                const m = Math.min(1.6, d * (0.05 * Math.sqrt(1 - d / M) + 0.01));
                if (d > r) { X[i] += dx / d * m; Y[i] += dy / d * m; }
                PX[i] += (X[i] - PX[i]) * 0.25; PY[i] += (Y[i] - PY[i]) * 0.25;
                n++;
              }
            }
            f.held = n;
          }
        });
      }

      // en qualité réduite, le bocal s'arrête plus tôt (les perles déjà là restent)
      const capNow = () => Math.floor(MAX * [0.7, 0.85, 1][SG.quality.level]);

      /* ---------- Versement depuis le bocal ---------- */
      function pour(f, dt) {
        f.pourAcc += dt * (small ? 70 : 140);
        while (f.pourAcc >= 1) {
          f.pourAcc -= 1;
          if (N >= capNow()) { if (!f.full) { f.full = true; SG.hint(stage, 'Le plateau est plein !', 1500); } break; }
          const a = rand(0, Math.PI * 2), s = rand(0.3, 1.6);
          addBead(clamp(f.x + rand(-4, 4), x0 + r, x1 - r), clamp(f.y + rand(-4, 4), y0 + r, y1 - r), f.pourColor >= 0 ? f.pourColor : randInt(0, NC - 1), Math.cos(a) * s, Math.sin(a) * s);
          if (Math.random() < 0.5) tick(0.03, rand(2500, 5000));
        }
      }

      /* ---------- Tri ---------- */
      function updateBins() {
        binCounts.fill(0); binGood.fill(0);
        let good = 0;
        for (let i = 0; i < N; i++) {
          let b = -1;
          if (Y[i] > lipY + r * 0.5) b = clamp(((X[i] - x0) / cw) | 0, 0, NC - 1);
          if (b !== BIN[i]) {
            if (b >= 0 && BIN[i] === -1) {
              if (b === C[i] && clackBudget >= 1) {
                clackBudget -= 1;
                A.tap('plastic', 0.28, rand(1.3, 1.6));
                tick(0.08, rand(3000, 4200));
                if (Math.random() < 0.25) sparks.push({ x: X[i], y: Y[i], life: 1, c: COLS[b].l });
              } else if (b !== C[i] && clackBudget >= 1) { clackBudget -= 0.5; A.tap('plastic', 0.14, 0.9); }
            }
            BIN[i] = b;
          }
          if (b >= 0) { binCounts[b]++; if (b === C[i]) { binGood[b]++; good++; } }
        }
        const v = N ? good / N : 0;
        // note qui monte quand une case se complète
        const target = N / NC;
        for (let b = 0; b < NC; b++) {
          const full = binGood[b] >= target * 0.92 && binCounts[b] === binGood[b];
          if (full && !doneBins[b]) { doneBins[b] = true; A.chime(b + 3, 0.22); SG.haptic(15); for (let k = 0; k < 8; k++) sparks.push({ x: x0 + (b + 0.5) * cw + rand(-cw / 3, cw / 3), y: rand(lipY, y1), life: 1, c: '#fff' }); }
          else if (!full && binGood[b] < target * 0.8) doneBins[b] = false;

          const z = 5 * Math.sin(s.life * Math.PI);
          g.fillStyle = `rgba(255,255,255,${0.8 * s.life})`;
          g.beginPath(); g.moveTo(s.x, s.y - z); g.lineTo(s.x + z * 0.2, s.y); g.lineTo(s.x, s.y + z); g.lineTo(s.x - z * 0.2, s.y); g.closePath(); g.fill();
          g.beginPath(); g.moveTo(s.x - z, s.y); g.lineTo(s.x, s.y + z * 0.2); g.lineTo(s.x + z, s.y); g.lineTo(s.x, s.y - z * 0.2); g.closePath(); g.fill();

      const SUB = 1 / 120;
      const loop = SG.loop((dt) => {

      const ptr = SG.pointer(cv.canvas, {
        down(p) {
          const x = p.x - camX, y = p.y - camY;

            for (let i = 0; i < N; i++) {

        move(p) {

          f.x = p.x - camX; f.y = p.y - camY;
        },
        up(p) {
          const f = fingers.get(p.id);

          fingers.delete(p.id);
        },
      });

      let pourColor = -1;
      const bar = SG.toolbar(stage, [
        { icon: '👆', label: 'Pousser', group: 'm', active: true, onClick: () => { mode = 'push'; } },
        { icon: '🧲', label: 'Aimant', group: 'm', onClick: () => { mode = 'magnet'; SG.hint(stage, 'Pose l’aimant sur une couleur et glisse vers sa case', 2500); } },
        { icon: '🫙', label: 'Verser', group: 'm', onClick: (b) => {
          if (mode === 'pour') {
            pourColor = pourColor >= NC - 1 ? -1 : pourColor + 1;
            SG.hint(stage, pourColor < 0 ? 'Bocal : toutes les couleurs' : `Bocal : perles ${COLS[pourColor].name}`, 1400);
          } else SG.hint(stage, 'Maintiens pour verser · retouche 🫙 pour changer de couleur', 2400);
          mode = 'pour';
        } },
        { icon: '〰️', label: 'Secouer', onClick: () => {
          shakeT = 0.8; shakeAmp = r * 0.12;
          A.sand(0.4, 0.6); A.rustle(0.25, 0.5); SG.haptic([30, 30, 30, 30, 30]);
        } },
        { icon: '🔀', label: 'Mélanger', onClick: () => {
          scatter(); for (let b = 0; b < NC; b++) doneBins[b] = false;
          A.sand(0.5, 0.5); A.whoosh(0.2, 0.4); SG.haptic(20);
        } },
      ]);
      void bar;

      cv.onResize(layout);
      layout();
      fillTray();
      if (/[?&]test\b/.test(location.search)) {
        window.__beads = { get N() { return N; }, get sorted() { return sortedFrac; }, find(c) { for (let i = 0; i < N; i++) if (C[i] === c && BIN[i] < 0) return [X[i], Y[i]]; return null; }, box: () => ({ x0, x1, y0, y1, lipY, cw }) };
      }

      return {
        destroy() {
          loop.stop(); ptr.destroy(); clearTimeout(hint2);
          if (rattle) rattle.stop();
          cv.destroy();
        },
      };
    },
  });
})();

    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }

  SG.registerGame({
    id: 'dominos',
    title: 'Dominos',
    emoji: '🧱',
    desc: 'Trace un chemin de dominos, pousse le premier et regarde la vague tomber.',
    color: '#ffd6c2',
    bg: 'linear-gradient(180deg,#fff4ec,#fbe9f2)',
    order: 21,
    create(stage) {
