          const nv = Math.max(0, v - str * 1.1);
          removed += v - nv; S.grid[i] = nv;
        }
        return removed;
      }
      function wetStamp(x, y) {
        const w = S.wg;
        if (nozzle === 'fin') w.drawImage(wetSpr, x - 20, y - 20, 40, 40);
        else w.drawImage(wetSpr, x - 48, y - 14, 96, 28);
      }

      function spray(dt) {
        if (!aim) return;
        const { x, y } = aim;
        const from = lastAim || aim;
        const d = Math.hypot(x - from.x, y - from.y);
        const step = nozzle === 'fin' ? 2.5 : 2;
        const n = Math.max(1, Math.ceil(d / step));
        let removed = 0;
        const before = gridHit(x, y);
        for (let i = 1; i <= n; i++) {
          const px = from.x + ((x - from.x) * i) / n, py = from.y + ((y - from.y) * i) / n;
          removed += stamp(px, py, d < 1 ? dt * 30 : 1);
          if (i % 3 === 0 || i === n) wetStamp(px, py);
        }
        if (S.maskCv) {
          S.wg.globalCompositeOperation = 'destination-in';
          S.wg.drawImage(S.maskCv, 0, 0, S.sw, S.sh);
          S.wg.globalCompositeOperation = 'source-over';
        }
        lastAim = { x, y };
        dirtHit = lerp(dirtHit, clamp(before * 1.3 + removed * 0.2, 0, 1), 0.3);
        // Particules : gouttelettes, boue, brume
        const onObj = maskAt(x, y) > 0.3;
        const nDrop = nozzle === 'fin' ? 5 : 8;
        for (let i = 0; i < nDrop; i++) {
          const a = -Math.PI / 2 + rand(-1.4, 1.4) + (nozzle === 'fin' ? 0 : rand(-0.3, 0.3));
          const sp = rand(120, 380);
          parts.push({ x: x + (nozzle === 'fin' ? rand(-4, 4) : rand(-30, 30)), y: y + rand(-3, 3), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.8, life: rand(0.25, 0.6), r: rand(0.8, 2.2), mud: false });
        }
        if (before > 0.05) {
          const c = S.spec.c1;
          for (let i = 0; i < 2 + before * 5; i++) {
            const a = -Math.PI / 2 + rand(-1.3, 1.3), sp = rand(80, 260);
            parts.push({ x: x + rand(-6, 6), y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.8, life: rand(0.3, 0.7), r: rand(1, 2.6), mud: true, col: `rgba(${c[0] + rand(-15, 25)},${c[1] + rand(-15, 25)},${c[2] + rand(-10, 20)},` });
          }
        }
        if (Math.random() < dt * 22) mist.push({ x: x + rand(-15, 15), y: y + rand(-10, 5), r: rand(10, 22), vr: rand(25, 50), vx: rand(-20, 20), vy: rand(-40, -10), life: 1 });
        if (S.spec.vertical && onObj && Math.random() < dt * 7) drips.push({ x: x + rand(-8, 8), y: y + rand(0, 6), vy: rand(14, 34), life: rand(1.6, 3.6), w: rand(1.4, 2.8), ph: rand(0, 6) });
        if (!S.spec.vertical && Math.random() < dt * 3) drips.push({ x: x + rand(-25, 25), y: y + rand(-25, 25), vy: 0, life: rand(0.4, 0.9), w: rand(3, 6), ph: 0, puddle: true });
        if (parts.length > 500) parts.splice(0, parts.length - 500);
        if (mist.length > 60) mist.splice(0, mist.length - 60);
        if (drips.length > 80) drips.splice(0, drips.length - 80);
      }

      function updateProgress() {
        let s = 0;
        for (let i = 0; i < S.grid.length; i++) s += S.grid[i];
        S.cleanP = S.total ? 1 - s / S.total : 1;
        prog.set(S.cleanP / 0.95);
        if (!celebrated && S.cleanP >= 0.95) {
          celebrated = true;
          SG.celebrate(stage, 'Comme neuf !');
          A.sparkle(0.35);
          for (let i = 0; i < 40; i++) addGlint();
          timers.push(setTimeout(() => SG.hint(stage, 'Choisis une autre surface en bas ✨'), 2300));
        }
      }
      function addGlint() {
        for (let k = 0; k < 8; k++) {
          const x = rand(0, S.sw), y = rand(0, S.sh);
          if (maskAt(x, y) > 0.5 && gridHit(x, y) < 0.15) { glints.push({ x, y, life: 1, s: rand(4, 10), t: rand(0.6, 1.2) }); return; }
        }
      }

      /* ---------- Sons ---------- */
      function soundOn() {
        if (!loops) loops = { hiss: A.loop('sand'), body: A.loop('pour'), grit: A.loop('scrape'), motor: A.loop('hum') };
        A.whoosh(0.35, 0.22, true);
      }
      function soundUpdate() {
        if (!loops) return;
        if (spraying) {
          const fine = nozzle === 'fin';
          loops.hiss.set(1, fine ? 0.95 : 0.55);
          loops.body.set(fine ? 0.5 : 0.75, fine ? 0.6 : 0.3);
          loops.grit.set(clamp(dirtHit * 1.1, 0, 1), fine ? 0.75 : 0.45);
          loops.motor.set(0.55, 0.15);
        } else {
          loops.hiss.set(0); loops.body.set(0); loops.grit.set(0); loops.motor.set(0);
        }
      }
      function soundStop() { if (loops) { Object.values(loops).forEach((l) => l.stop()); loops = null; } }

      /* ---------- Pointeur ---------- */
      const aims = new Map();
      function toSurf(p) {
        const v = view();
        const off = p.e && p.e.pointerType === 'touch' ? 55 : 0;
        return { x: (p.x - v.ox) / v.s, y: (p.y - off - v.oy) / v.s };
      }
      const ptr = SG.pointer(cv.canvas, {
        hover(p) { aim = toSurf(p); tipVis = 1; },
        down(p) {
          aims.set(p.id, 1);
          aim = toSurf(p); lastAim = null; tipVis = 1;
          if (!spraying) soundOn();
          spraying = aims.size;
          SG.haptic(12);
        },
        move(p) {
          if (!aims.has(p.id)) return;
          aim = toSurf(p);
        },
        up(p) {
          aims.delete(p.id);
          spraying = aims.size;
          if (!spraying) {
            lastAim = null;
            A.drip(1.6, 0.15); timers.push(setTimeout(() => A.drip(1.9, 0.08), 120));
          }
        },
      });

      SG.toolbar(stage, [
        { icon: '🎯', label: 'Jet fin', group: 'n', active: true, onClick: () => { nozzle = 'fin'; } },
        { icon: '🌬️', label: 'Éventail', group: 'n', onClick: () => { nozzle = 'fan'; } },
        { icon: '🧱', label: 'Dalles', group: 's', active: true, onClick: () => select('dalles') },
        { icon: '🪵', label: 'Terrasse', group: 's', onClick: () => select('terrasse') },
        { icon: '🚗', label: 'Voiture', group: 's', onClick: () => select('voiture') },
        { icon: '🍄', label: 'Nain', group: 's', onClick: () => select('nain') },
      ]);

      /* ---------- Dessin ---------- */
      function drawWand(v, sx, sy) {
        // Lance : vient du bas, légèrement inclinée
        const tipX = sx + 14 * v.s, tipY = sy + 80;
        const dx = 0.18, dy = 1, L = 600;
        g.save();
        g.globalAlpha = spraying ? 1 : 0.85 * tipVis;
        // Tube
        const tg = g.createLinearGradient(tipX - 5, 0, tipX + 5, 0);
        tg.addColorStop(0, '#8e96a3'); tg.addColorStop(0.45, '#f4f6f9'); tg.addColorStop(1, '#7c8491');
        g.strokeStyle = tg; g.lineWidth = 7; g.lineCap = 'round';
        g.beginPath(); g.moveTo(tipX, tipY + 10); g.lineTo(tipX + dx * L, tipY + dy * L); g.stroke();
        // Pistolet
        const gx = tipX + dx * 150, gy = tipY + 150;
        g.save(); g.translate(gx, gy); g.rotate(Math.atan2(dx, dy) * -1);
        g.shadowColor = 'rgba(60,60,80,0.3)'; g.shadowBlur = 12; g.shadowOffsetY = 6;
        const bg = g.createLinearGradient(-16, 0, 16, 0);
        bg.addColorStop(0, '#ffe58a'); bg.addColorStop(0.5, '#fff5c4'); bg.addColorStop(1, '#f0c94e');
        g.fillStyle = bg; rr(g, -16, -30, 32, 70, 12); g.fill();
        g.shadowColor = 'transparent';
        g.fillStyle = '#5b4a5e'; rr(g, -6, 6, 12, 26, 5); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.5)'; rr(g, -11, -24, 6, 50, 3); g.fill();
        g.restore();
        // Buse (rouge = jet fin 0°, vert = éventail 25°)
        g.fillStyle = nozzle === 'fin' ? '#ff8fa3' : '#8fdcb0';
        rr(g, tipX - 6, tipY - 2, 12, 16, 3); g.fill();
        g.fillStyle = '#5b5560'; g.fillRect(tipX - 2.5, tipY - 4, 5, 3);
        g.restore();
        // Jet d'eau
        if (spraying) {
          const t = performance.now() / 1000;
          g.save();
          g.globalCompositeOperation = 'source-over';
          if (nozzle === 'fin') {
            for (let k = 0; k < 3; k++) {
              g.strokeStyle = k === 0 ? 'rgba(190,225,255,0.35)' : k === 1 ? 'rgba(235,248,255,0.8)' : 'rgba(255,255,255,0.95)';
              g.lineWidth = [8, 4, 1.5][k];
              g.beginPath(); g.moveTo(tipX, tipY - 3);
              g.lineTo(sx + Math.sin(t * 60) * 0.8, sy); g.stroke();
            }
          } else {
            const hw = 34 * v.s;
            const gr = g.createLinearGradient(0, tipY, 0, sy);
            gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(1, 'rgba(210,235,255,0.35)');
            g.fillStyle = gr;
            g.beginPath(); g.moveTo(tipX - 2, tipY - 3); g.lineTo(tipX + 2, tipY - 3); g.lineTo(sx + hw, sy); g.lineTo(sx - hw, sy); g.closePath(); g.fill();
            g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1;
            for (let k = -3; k <= 3; k++) { g.beginPath(); g.moveTo(tipX, tipY - 3); g.lineTo(sx + (k / 3) * hw + Math.sin(t * 50 + k) * 1.5, sy); g.stroke(); }
          }
          // Impact
          const ig = g.createRadialGradient(sx, sy, 0, sx, sy, nozzle === 'fin' ? 16 : 40);
          ig.addColorStop(0, 'rgba(255,255,255,0.85)'); ig.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = ig;
          g.beginPath(); g.ellipse(sx, sy, nozzle === 'fin' ? 16 : 44, nozzle === 'fin' ? 12 : 12, 0, 0, Math.PI * 2); g.fill();
          g.restore();
        }
      }

      cv.onResize(() => { if (!S) return; });
      select('dalles');

      let acc = 0;
      const loop = SG.loop((dt, t) => {
        if (!S) return;
        if (spraying) spray(dt);
        soundUpdate();
        acc += dt;
        if (acc > 0.2) { acc = 0; updateProgress(); }
        // Séchage
        const wg = S.wg;
        wg.globalCompositeOperation = 'destination-out';
        wg.fillStyle = `rgba(0,0,0,${Math.min(1, dt * 0.18)})`; wg.fillRect(0, 0, S.sw, S.sh);
        wg.globalCompositeOperation = 'source-over';

        const v = view();
        g.fillStyle = '#eef4fa'; g.fillRect(0, 0, cv.w, cv.h);
        g.save();
        g.translate(v.ox, v.oy); g.scale(v.s, v.s);
        g.drawImage(S.clean, 0, 0, S.sw, S.sh);
        g.drawImage(S.dirt, 0, 0, S.sw, S.sh);
        g.globalAlpha = 0.4; g.drawImage(S.wet, 0, 0, S.sw, S.sh); g.globalAlpha = 1;

        // Coulures d'eau
        drips.forEach((d) => {
          d.life -= dt;
          if (d.puddle) {
            g.fillStyle = `rgba(255,255,255,${0.35 * clamp(d.life * 2, 0, 1)})`;
            g.beginPath(); g.arc(d.x, d.y, d.w * (1.4 - d.life), 0, Math.PI * 2); g.fill();
            return;
          }
          const ny = d.y + d.vy * dt, nx = d.x + Math.sin(t * 3 + d.ph) * 0.2;
          S.wg.strokeStyle = 'rgba(25,40,60,0.55)'; S.wg.lineWidth = d.w; S.wg.lineCap = 'round';
          S.wg.beginPath(); S.wg.moveTo(d.x, d.y); S.wg.lineTo(nx, ny); S.wg.stroke();
          // l'eau qui coule rince un peu la saleté
          const dg = S.dg; dg.setTransform(S.dr, 0, 0, S.dr, 0, 0);
          dg.globalCompositeOperation = 'destination-out'; dg.strokeStyle = 'rgba(0,0,0,0.06)'; dg.lineWidth = d.w * 1.3; dg.lineCap = 'round';
          dg.beginPath(); dg.moveTo(d.x, d.y); dg.lineTo(nx, ny); dg.stroke(); dg.globalCompositeOperation = 'source-over';
          d.x = nx; d.y = ny; d.vy = Math.min(70, d.vy + dt * 10);
          if (maskAt(d.x, d.y + 4) < 0.3) d.life = Math.min(d.life, 0.05);
          g.fillStyle = 'rgba(230,245,255,0.85)';
          g.beginPath(); g.ellipse(d.x, d.y, d.w * 0.9, d.w * 1.3, 0, 0, Math.PI * 2); g.fill();
          g.fillStyle = 'rgba(255,255,255,1)'; g.beginPath(); g.arc(d.x - d.w * 0.3, d.y - d.w * 0.4, d.w * 0.35, 0, Math.PI * 2); g.fill();
        });
        drips = drips.filter((d) => d.life > 0);
        if (drips.length && Math.random() < dt * 2) A.drip(rand(1.5, 2.2), 0.05);

        // Brume
        mist.forEach((m) => {
          m.life -= dt * 1.4; m.r += m.vr * dt; m.x += m.vx * dt; m.y += m.vy * dt;
          const gr = g.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
          gr.addColorStop(0, `rgba(255,255,255,${0.22 * m.life})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = gr; g.beginPath(); g.arc(m.x, m.y, m.r, 0, Math.PI * 2); g.fill();
        });
        mist = mist.filter((m) => m.life > 0);
        // Gouttelettes et boue
        parts.forEach((p) => {
          p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
          const a = clamp(p.life * 3, 0, 1);
          g.fillStyle = p.mud ? p.col + a + ')' : `rgba(235,247,255,${0.9 * a})`;
          g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
          if (!p.mud) { g.fillStyle = `rgba(120,170,220,${0.35 * a})`; g.beginPath(); g.arc(p.x + p.r * 0.3, p.y + p.r * 0.3, p.r * 0.5, 0, Math.PI * 2); g.fill(); }
        });
        parts = parts.filter((p) => p.life > 0);
        // Étincelles de propreté
        if (celebrated && Math.random() < dt * 3) addGlint();
        glints.forEach((s) => {
          s.life -= dt / s.t;
          const k = Math.sin(clamp(s.life, 0, 1) * Math.PI), r = s.s * k;
          g.save(); g.translate(s.x, s.y); g.rotate(s.life * 2);
          g.fillStyle = `rgba(255,255,255,${0.95 * k})`;
          g.beginPath();
          for (let i = 0; i < 8; i++) { const rr2 = i % 2 ? r * 0.18 : r; const a = (i / 8) * Math.PI * 2; g.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); }
          g.closePath(); g.fill();
          g.restore();
        });
        glints = glints.filter((s) => s.life > 0);
        g.restore();

        // Lance
        if (aim) {
          const sx = v.ox + aim.x * v.s, sy = v.oy + aim.y * v.s;
          if (!spraying) tipVis = Math.max(0.35, tipVis - dt * 0.5);
          drawWand(v, sx, sy);
        }
      });

      return {
        destroy() {
          loop.stop(); ptr.destroy(); cv.destroy(); soundStop();
          timers.forEach(clearTimeout);
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/tufting.js */
/* Tufting — dessiner au pistolet à tufter, tondre les boucles, retourner et décoller le dos du tapis */
(function () {
  'use strict';
  const { rand, clamp, pick } = SG.util;
  const A = SG.audio;
  const CELL = 4; // taille d'une case de boucle (unités de toile)

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const shade = (rgb, k, a = 1) => {
    const c = rgb.map((v) => Math.round(clamp(k >= 0 ? v + (255 - v) * k : v * (1 + k), 0, 255)));
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  };
  function rr(g, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    g.beginPath(); g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  const YARNS = ['#ffb5c8', '#ffc8a8', '#fff0a0', '#b9f0d4', '#b8dcff', '#d6c4ff', '#fffaf2', '#8e7a96'];

  SG.registerGame({
    id: 'tufting',
    title: 'Tufting',
    emoji: '🧶',
    desc: 'Tufte des boucles de laine, tonds-les, puis révèle ton tapis tout doux.',
    color: '#d6c4ff',
    bg: 'linear-gradient(180deg,#f6f0ff,#efe6f7)',
    order: 17,
    create(stage) {
      const cv = SG.makeCanvas(stage);
      const g = cv.ctx;
      // Dimensions de la toile fixées à la création (l'état survit aux redimensionnements)
      const CW = Math.max(240, Math.min(560, cv.w - 40));
      const CH = Math.max(300, Math.min(760, cv.h - 200));
      const GW = Math.ceil(CW / CELL), GH = Math.ceil(CH / CELL);
      const K = Math.min(cv.dpr, 2, Math.sqrt(2.2e6 / (CW * CH)));
      const col = new Uint8Array(GW * GH);   // couleur + 1 (0 = vide)
      const st = new Uint8Array(GW * GH);    // 1 = boucle, 2 = tondu
      const cloth = mk(CW * K, CH * K);
      const yarn = mk(CW * K, CH * K), yg = yarn.getContext('2d');
      let backing = null, bkg = null, rugShadow = null, floor = null;
      let mode = 'tuft', view = 'cloth', color = 0, thick = true;
      let flip = null; // { t, to }
      let cursor = null, gunOn = 0, moving = 0, lastMove = 0;
      let fluff = [], bits = [];
      const peelGrid = new Uint8Array(16 * 24);
      let peelDone = false, backAlpha = 1;
      let tickIv = null, motor = null, shearLoop = null, brushLoop = null, peelLoop = null;
      const timers = [];
      const prog = SG.progress(stage, 'Décollé');
      prog.el.style.display = 'none';
      SG.hint(stage, 'Maintiens et dessine pour tufter 🧶');

      /* ---------- Sprites de laine ---------- */
      const sprites = YARNS.map((hex) => {
        const rgb = hex2rgb(hex), S = Math.ceil(10 * K) + 2;
        const loops = [], plush = [];
        for (let v = 0; v < 3; v++) {
          // Boucle : anneau de fil torsadé
          const c = mk(S, S), x = c.getContext('2d'), m = S / 2, r = 3.3 * K;
          x.fillStyle = shade(rgb, -0.42); x.beginPath(); x.arc(m + 0.4 * K, m + 0.6 * K, r, 0, Math.PI * 2); x.fill();
          const gr = x.createRadialGradient(m - r * 0.4, m - r * 0.4, r * 0.1, m, m, r);
          gr.addColorStop(0, shade(rgb, 0.35)); gr.addColorStop(0.6, shade(rgb, 0.02 * v - 0.02)); gr.addColorStop(1, shade(rgb, -0.25));
          x.fillStyle = gr; x.beginPath(); x.arc(m, m, r * 0.95, 0, Math.PI * 2); x.fill();
          x.fillStyle = shade(rgb, -0.5, 0.75); x.beginPath(); x.ellipse(m + 0.3 * K, m + 0.2 * K, r * 0.32, r * 0.42, 0.4, 0, Math.PI * 2); x.fill();
          x.strokeStyle = shade(rgb, -0.3, 0.6); x.lineWidth = 0.5 * K;
          for (let k = 0; k < 3; k++) { const a = rand(0, 6.28); x.beginPath(); x.arc(m, m, r * 0.72, a, a + 0.7); x.stroke(); }
          x.strokeStyle = 'rgba(255,255,255,0.55)'; x.lineWidth = 0.7 * K;
          x.beginPath(); x.arc(m, m, r * 0.7, 3.6, 4.6); x.stroke();
          loops.push(c);
          // Velours tondu : touffe douce aux fibres visibles
          const p = mk(S, S), y = p.getContext('2d'), rp = 4.6 * K;
          const lk = (v - 1) * 0.05;
          const pg = y.createRadialGradient(m - rp * 0.2, m - rp * 0.2, 0, m, m, rp);
          pg.addColorStop(0, shade(rgb, 0.12 + lk)); pg.addColorStop(0.55, shade(rgb, 0.02 + lk, 0.95)); pg.addColorStop(1, shade(rgb, -0.05 + lk, 0));
          y.fillStyle = pg; y.fillRect(0, 0, S, S);
          for (let k = 0; k < 14; k++) {
            const a = rand(0, 6.28), d = rand(0, rp * 0.7);
            y.fillStyle = Math.random() < 0.5 ? shade(rgb, 0.4, 0.5) : shade(rgb, -0.2, 0.4);
            y.fillRect(m + Math.cos(a) * d, m + Math.sin(a) * d, 0.6 * K, 0.6 * K);
          }
          plush.push(p);
        }
        return { rgb, loops, plush, S };
      });

      /* ---------- Toile (monk's cloth) ---------- */
      (function paintCloth() {
        const x = cloth.getContext('2d');
        x.setTransform(K, 0, 0, K, 0, 0);
        x.fillStyle = '#efe5d2'; x.fillRect(0, 0, CW, CH);
        for (let i = 0; i < CW; i += 2.5) { x.fillStyle = i % 5 < 2.5 ? 'rgba(160,130,90,0.13)' : 'rgba(255,255,255,0.22)'; x.fillRect(i, 0, 1.1, CH); }
        for (let j = 0; j < CH; j += 2.5) { x.fillStyle = j % 5 < 2.5 ? 'rgba(160,130,90,0.11)' : 'rgba(255,255,255,0.2)'; x.fillRect(0, j, CW, 1.1); }
        for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(120,95,60,${Math.random() * 0.12})`; x.fillRect(Math.random() * CW, Math.random() * CH, 1.5, 0.6); }
        // Croquis au crayon (guide facultatif)
        x.strokeStyle = 'rgba(110,90,120,0.28)'; x.lineWidth = 1.3; x.setLineDash([5, 4]);
        const cx = CW / 2, cy = CH / 2, s = Math.min(CW, CH) * 0.34;
        x.beginPath();
        x.moveTo(cx, cy + s * 0.8);
        x.bezierCurveTo(cx - s * 1.4, cy - s * 0.05, cx - s * 0.7, cy - s * 1.15, cx, cy - s * 0.45);
        x.bezierCurveTo(cx + s * 0.7, cy - s * 1.15, cx + s * 1.4, cy - s * 0.05, cx, cy + s * 0.8);
        x.stroke(); x.setLineDash([]);
      })();

      /* ---------- Mise en page ---------- */
      let s = 1, ox = 0, oy = 0;
      function layout() {
        const top = 24, bottom = cv.w < 480 ? 150 : 96;
        s = Math.min((cv.w - 36) / CW, (cv.h - top - bottom) / CH);
        ox = (cv.w - CW * s) / 2; oy = top + (cv.h - top - bottom - CH * s) / 2;
        floor = mk(cv.w * cv.dpr, cv.h * cv.dpr);
        const f = floor.getContext('2d');
        f.setTransform(cv.dpr, 0, 0, cv.dpr, 0, 0);
        const fg = f.createLinearGradient(0, 0, 0, cv.h);
        fg.addColorStop(0, '#f3e2cf'); fg.addColorStop(1, '#e8cfb6');
        f.fillStyle = fg; f.fillRect(0, 0, cv.w, cv.h);
        for (let y = 0, k = 0; y < cv.h; y += 46, k++) {
          f.fillStyle = 'rgba(150,100,70,0.18)'; f.fillRect(0, y, cv.w, 1.5);
          for (let x = (k % 3) * 70; x < cv.w; x += 210) f.fillRect(x, y, 1.5, 46);
          for (let l = 0; l < 6; l++) { f.fillStyle = `rgba(170,120,80,${Math.random() * 0.08})`; f.fillRect(0, y + Math.random() * 46, cv.w, 1); }
        }
      }
      cv.onResize(layout);
      layout();
      const toCloth = (p) => {
        const off = p.e && p.e.pointerType === 'touch' ? 36 : 0;
        return { x: (p.x - ox) / s, y: (p.y - off - oy) / s };
      };

      /* ---------- Tufter / tondre ---------- */
      function stampLoop(i, j, ci) {
        const sp = sprites[ci], S = sp.S;
        const x = ((i + 0.5) * CELL + rand(-0.8, 0.8)) * K, y = ((j + 0.5) * CELL + rand(-0.8, 0.8)) * K;
        yg.drawImage(pick(sp.loops), x - S / 2, y - S / 2);
      }
      function stampPlush(i, j, ci) {
        const sp = sprites[ci], S = sp.S;
        const x = ((i + 0.5) * CELL + rand(-0.6, 0.6)) * K, y = ((j + 0.5) * CELL + rand(-0.6, 0.6)) * K;
        yg.drawImage(pick(sp.plush), x - S / 2, y - S / 2);
      }
      function tuftAt(x, y) {
        const R = thick ? 2.6 : 1.2;
        const ci0 = Math.floor(x / CELL), cj0 = Math.floor(y / CELL);
        const list = [];
        for (let j = cj0 - 3; j <= cj0 + 3; j++) for (let i = ci0 - 3; i <= ci0 + 3; i++) {
          if (i < 0 || j < 0 || i >= GW || j >= GH) continue;
          const dx = (i + 0.5) * CELL - x, dy = (j + 0.5) * CELL - y;
          if (dx * dx + dy * dy > (R * CELL) * (R * CELL)) continue;
          const k = j * GW + i;
          if (col[k] === color + 1 && st[k] === 1) continue;
          col[k] = color + 1; st[k] = 1; list.push([i, j]);
        }
        list.sort(() => Math.random() - 0.5).forEach(([i, j]) => stampLoop(i, j, color));
        return list.length;
      }
      function shearAt(x, y) {
        const R = 4.6;
        const ci0 = Math.floor(x / CELL), cj0 = Math.floor(y / CELL);
        let n = 0;
        for (let j = cj0 - 5; j <= cj0 + 5; j++) for (let i = ci0 - 5; i <= ci0 + 5; i++) {
          if (i < 0 || j < 0 || i >= GW || j >= GH) continue;
          const dx = (i + 0.5) * CELL - x, dy = (j + 0.5) * CELL - y;
          if (dx * dx + dy * dy > (R * CELL) * (R * CELL)) continue;
          const k = j * GW + i;
          if (st[k] !== 1) continue;
          st[k] = 2; stampPlush(i, j, col[k] - 1); n++;
          if (Math.random() < 0.25) {
            fluff.push({ x: (i + 0.5) * CELL, y: (j + 0.5) * CELL, vx: rand(-60, 60), vy: rand(-90, -20), z: 0, life: rand(1, 2.2), r: rand(1.5, 3.5), c: YARNS[col[k] - 1], a: rand(0, 6), va: rand(-4, 4) });
          }
        }
        if (fluff.length > 400) fluff.splice(0, fluff.length - 400);
        return n;
      }

      /* ---------- Retourner et décoller le dos ---------- */
      function buildRug() {
        backing = mk(CW * K, CH * K); bkg = backing.getContext('2d');
        bkg.drawImage(cloth, 0, 0);
        bkg.globalAlpha = 0.35; bkg.drawImage(yarn, 0, 0); bkg.globalAlpha = 1;
        // Colle au latex : voile blanc brillant sur les zones tuftées
        const glue = mk(CW * K, CH * K), gl = glue.getContext('2d');
        gl.drawImage(yarn, 0, 0);
        gl.globalCompositeOperation = 'source-in';
        const gg = gl.createLinearGradient(0, 0, CW * K, CH * K);
        gg.addColorStop(0, 'rgba(255,255,255,0.55)'); gg.addColorStop(0.5, 'rgba(255,255,255,0.3)'); gg.addColorStop(1, 'rgba(255,255,255,0.5)');
        gl.fillStyle = gg; gl.fillRect(0, 0, CW * K, CH * K);
        bkg.drawImage(glue, 0, 0);
        bkg.strokeStyle = 'rgba(120,90,60,0.35)'; bkg.lineWidth = 3 * K; bkg.strokeRect(0, 0, CW * K, CH * K);
        // Ombre du tapis sur le parquet
        rugShadow = mk(CW * K + 60 * K, CH * K + 60 * K);
        const rs = rugShadow.getContext('2d');
        rs.shadowColor = 'rgba(90,50,40,0.45)'; rs.shadowBlur = 14 * K; rs.shadowOffsetX = 10000;
        rs.drawImage(yarn, 30 * K - 10000, 34 * K);
        peelGrid.fill(0); peelDone = false; backAlpha = 1;
        prog.set(0);
      }
      function peelAt(x0, y0, x1, y1) {
        const d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(d / 5));
        bkg.save(); bkg.setTransform(K, 0, 0, K, 0, 0);
        for (let i = 1; i <= n; i++) {
          const x = x0 + ((x1 - x0) * i) / n, y = y0 + ((y1 - y0) * i) / n;
          if (x < -20 || y < -20 || x > CW + 20 || y > CH + 20) continue;
          const r = 17;
          bkg.globalCompositeOperation = 'destination-out';
          bkg.beginPath();
          for (let k = 0; k < 14; k++) { const a = (k / 14) * Math.PI * 2, rr2 = r * rand(0.75, 1.1); bkg.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
          bkg.closePath(); bkg.fill();
          bkg.globalCompositeOperation = 'source-atop';
          bkg.strokeStyle = 'rgba(255,255,255,0.7)'; bkg.lineWidth = 2.2;
          bkg.beginPath(); bkg.arc(x, y, r * 1.02, 0, Math.PI * 2); bkg.stroke();
          for (let gy = 0; gy < 24; gy++) for (let gx = 0; gx < 16; gx++) {
            const cx = ((gx + 0.5) / 16) * CW, cy = ((gy + 0.5) / 24) * CH;
            if (Math.hypot(cx - x, cy - y) < r * 1.1) peelGrid[gy * 16 + gx] = 1;
          }
          if (Math.random() < 0.5) bits.push({ x, y, vx: rand(-50, 50), vy: rand(-80, -10), life: rand(0.8, 1.6), r: rand(3, 7), a: rand(0, 6), va: rand(-6, 6) });
        }
        bkg.restore();
        let c = 0; peelGrid.forEach((v) => (c += v));
        const p = c / peelGrid.length;
        prog.set(p / 0.9);
        if (!peelDone && p >= 0.9) {
          peelDone = true;
          SG.celebrate(stage, 'Joli tapis !');
          timers.push(setTimeout(() => SG.hint(stage, '🔄 Retourner pour continuer à tufter'), 2300));
        }
      }
      function startFlip() {
        if (flip) return;
        const to = view === 'cloth' ? 'rug' : 'cloth';
        if (to === 'rug' && !col.some((v) => v)) { SG.hint(stage, 'Tufte d’abord quelques boucles 🧶', 2200); return; }
        flip = { t: 0, to, switched: false };
        A.whoosh(0.35, 0.5); A.rustle(0.25, 0.4); SG.haptic(10);
      }

      /* ---------- Sons ---------- */
      function gunStart() {
        if (!motor) motor = A.loop('hum');
        motor.set(0.5, 0.55);
        if (!tickIv) {
          let n = 0;
          tickIv = setInterval(() => {
            if (!gunOn) return;
            n++;
            A.tap('plastic', 0.14 + (moving ? 0.08 : 0), rand(0.5, 0.62));
            if (n % 2 === 0) A.thud(0.07, 2.4);
            if (moving && n % 3 === 0) A.crunch(0.06, 1.8);
          }, 40);
        }
      }
      function gunStop() {
        if (motor) { motor.stop(); motor = null; }
        if (tickIv) { clearInterval(tickIv); tickIv = null; }
      }

      /* ---------- Pointeur ---------- */
      const acts = new Map();
      const ptr = SG.pointer(cv.canvas, {
        hover(p) { cursor = toCloth(p); },
        down(p) {
          if (flip) return;
          const c = toCloth(p); cursor = c;
          acts.set(p.id, { last: c });
          if (view === 'rug') {
            if (!peelLoop) peelLoop = A.loop('peel');
            peelLoop.set(0.5, 0.6); A.rustle(0.25, 0.15);
            peelAt(c.x, c.y, c.x, c.y);
            return;
          }
          if (mode === 'tuft') {
            gunOn++; gunStart(); tuftAt(c.x, c.y); SG.haptic(6);
          } else {
            if (!shearLoop) { shearLoop = A.loop('hum'); brushLoop = A.loop('brush'); }
            shearLoop.set(0.45, 0.95); brushLoop.set(0.3, 0.6);
            shearAt(c.x, c.y);
          }
        },
        move(p) {
          const a = acts.get(p.id);
          const c = toCloth(p); cursor = c;
          if (!a || flip) return;
          const d = Math.hypot(c.x - a.last.x, c.y - a.last.y);
          if (view === 'rug') {
            peelAt(a.last.x, a.last.y, c.x, c.y);
            if (peelLoop) peelLoop.set(clamp(0.3 + p.speed, 0, 1), 0.6);
            if (Math.random() < 0.15) A.rustle(0.15, 0.1);
            a.last = c; return;
          }
          const n = Math.max(1, Math.ceil(d / 1.6));
          let made = 0;
          for (let i = 1; i <= n; i++) {
            const x = a.last.x + ((c.x - a.last.x) * i) / n, y = a.last.y + ((c.y - a.last.y) * i) / n;
            made += mode === 'tuft' ? tuftAt(x, y) : shearAt(x, y);
          }
          if (mode === 'shear' && brushLoop) {
            brushLoop.set(clamp(0.2 + made * 0.04, 0, 1), 0.7);
            if (made > 6 && Math.random() < 0.3) A.rustle(0.1, 0.08);
            if (made) SG.haptic(2);
          }
          moving = d > 0.5 ? 1 : 0; lastMove = performance.now();
          a.last = c;
        },
        up(p) {
          acts.delete(p.id);
          if (gunOn) { gunOn = Math.max(0, gunOn - 1); if (!gunOn) gunStop(); }
          if (!acts.size) {
            if (shearLoop) { shearLoop.stop(); brushLoop.stop(); shearLoop = brushLoop = null; }
            if (peelLoop) { peelLoop.stop(); peelLoop = null; }
          }
        },
      });

      const bar = SG.toolbar(stage, [
        { icon: '🔫', label: 'Tufter', group: 'm', active: true, onClick: () => { mode = 'tuft'; if (view === 'rug') startFlip(); } },
        { icon: '✂️', label: 'Tondre', group: 'm', onClick: () => { mode = 'shear'; if (view === 'rug') startFlip(); else SG.hint(stage, 'Passe sur les boucles pour les tondre', 2200); } },
        { icon: '🔄', label: 'Retourner', onClick: startFlip },
        { icon: '📏', label: 'Épais', onClick: (b) => { thick = !thick; b.querySelector('.lb').textContent = thick ? 'Épais' : 'Fin'; } },
        ...YARNS.map((c, i) => ({ color: c, title: 'Laine', group: 'c', active: i === 0, onClick: () => { color = i; if (mode !== 'tuft') { mode = 'tuft'; bar.querySelectorAll('[data-group="m"]').forEach((b, k) => b.classList.toggle('active', k === 0)); } } })),
      ]);

      /* ---------- Dessin ---------- */
      function drawFrame() {
        const fw = 14;
        g.save();
        g.shadowColor = 'rgba(90,60,80,0.3)'; g.shadowBlur = 20; g.shadowOffsetY = 10;
        g.fillStyle = '#d9b48a';
        g.fillRect(ox - fw, oy - fw, CW * s + fw * 2, CH * s + fw * 2);
        g.restore();
        const wg = g.createLinearGradient(ox - fw, oy - fw, ox + CW * s, oy + CH * s);
        wg.addColorStop(0, '#f0d2a8'); wg.addColorStop(1, '#d4a878');
        g.fillStyle = wg; g.fillRect(ox - fw, oy - fw, CW * s + fw * 2, CH * s + fw * 2);
        g.strokeStyle = 'rgba(140,95,60,0.35)'; g.lineWidth = 1;
        for (let i = 0; i < 4; i++) { g.strokeRect(ox - fw + 2 + i * 3, oy - fw + 2 + i * 3, CW * s + fw * 2 - 4 - i * 6, CH * s + fw * 2 - 4 - i * 6); }
        // Agrafes
        g.fillStyle = '#b9c0c9';
        for (let x = ox + 10; x < ox + CW * s; x += 34) { g.fillRect(x, oy - 8, 8, 2); g.fillRect(x, oy + CH * s + 6, 8, 2); }
        for (let y = oy + 10; y < oy + CH * s; y += 34) { g.fillRect(ox - 8, y, 2, 8); g.fillRect(ox + CW * s + 6, y, 2, 8); }
      }
      function drawGun(x, y, on) {
        const t = performance.now() / 1000;
        const jig = on ? Math.sin(t * 160) * 1.2 : 0;
        g.save();
        g.translate(x + jig * 0.3, y + jig);
        g.rotate(-0.35);
        g.shadowColor = 'rgba(70,50,90,0.3)'; g.shadowBlur = 12; g.shadowOffsetY = 8;
        // Aiguille
        g.fillStyle = '#c9ced6'; g.fillRect(-1.5, -16, 3, 16);
        // Corps
        const bg = g.createLinearGradient(-16, 0, 16, 0);
        bg.addColorStop(0, '#e8dcff'); bg.addColorStop(0.5, '#fbf7ff'); bg.addColorStop(1, '#bba6e8');
        g.fillStyle = bg; rr(g, -14, -60, 28, 46, 9); g.fill();
        g.shadowColor = 'transparent';
        g.fillStyle = '#9b86c8'; rr(g, -10, -96, 20, 40, 7); g.fill();
        g.fillStyle = '#5b4a5e'; rr(g, 8, -52, 14, 6, 3); g.fill();
        g.fillStyle = YARNS[color]; g.beginPath(); g.arc(0, -40, 6, 0, Math.PI * 2); g.fill();
        g.strokeStyle = shade(hex2rgb(YARNS[color]), -0.3); g.lineWidth = 1; g.stroke();
        g.restore();
        // Fil qui part vers le haut
        g.strokeStyle = YARNS[color]; g.lineWidth = 2;
        g.beginPath(); g.moveTo(x, y - 40); g.quadraticCurveTo(x + 30, y - 120, x + 10, y - 220); g.stroke();
      }
      function drawShears(x, y) {
        g.save(); g.translate(x, y); g.rotate(-0.3);
        g.shadowColor = 'rgba(70,50,90,0.3)'; g.shadowBlur = 10; g.shadowOffsetY = 6;
        g.fillStyle = '#ffc8a8'; rr(g, -16, -78, 32, 56, 12); g.fill();
        g.shadowColor = 'transparent';
        g.fillStyle = '#d7dce3'; rr(g, -14, -24, 28, 12, 3); g.fill();
        g.fillStyle = '#9aa2ad';
        for (let i = -12; i < 12; i += 4) g.fillRect(i, -12, 2, 6);
        g.fillStyle = 'rgba(255,255,255,0.5)'; rr(g, -10, -72, 6, 42, 3); g.fill();
        g.restore();
      }

      const loop = SG.loop((dt) => {
        if (gunOn && performance.now() - lastMove > 90) moving = 0;
        g.drawImage(floor, 0, 0, cv.w, cv.h);
        let sx = 1;
        if (flip) {
          flip.t += dt / 0.7;
          if (!flip.switched && flip.t >= 0.5) {
            flip.switched = true; view = flip.to;
            if (view === 'rug') { buildRug(); prog.el.style.display = ''; SG.hint(stage, 'Décolle le dos du tapis du bout du doigt ✨'); }
            else prog.el.style.display = 'none';
            A.thud(0.3, 0.9);
          }
          sx = Math.max(0.02, Math.abs(Math.cos(Math.PI * Math.min(1, flip.t))));
          if (flip.t >= 1) flip = null;
        }
        g.save();
        g.translate(cv.w / 2, 0); g.scale(sx, 1); g.translate(-cv.w / 2, 0);
        if (view === 'cloth') {
          drawFrame();
          g.drawImage(cloth, ox, oy, CW * s, CH * s);
          g.drawImage(yarn, ox, oy, CW * s, CH * s);
        } else {
          g.drawImage(rugShadow, ox - 30 * s, oy - 30 * s, (CW + 60) * s, (CH + 60) * s);
          g.drawImage(yarn, ox, oy, CW * s, CH * s);
          if (peelDone) backAlpha = Math.max(0, backAlpha - dt * 1.5);
          if (backAlpha > 0) { g.globalAlpha = backAlpha; g.drawImage(backing, ox, oy, CW * s, CH * s); g.globalAlpha = 1; }
        }
        g.restore();
        // Peluches qui volent
        fluff.forEach((f) => {
          f.vy += 60 * dt; f.vx *= 0.97; f.x += f.vx * dt; f.y += f.vy * dt; f.a += f.va * dt; f.life -= dt;
          const x = ox + f.x * s, y = oy + f.y * s;
          g.save(); g.translate(x, y); g.rotate(f.a); g.globalAlpha = clamp(f.life, 0, 1);
          g.fillStyle = f.c;
          for (let k = 0; k < 3; k++) { g.beginPath(); g.ellipse(Math.cos(k * 2.1) * f.r * 0.5, Math.sin(k * 2.1) * f.r * 0.5, f.r, f.r * 0.45, k, 0, Math.PI * 2); g.fill(); }
          g.restore();
        });
        g.globalAlpha = 1;
        fluff = fluff.filter((f) => f.life > 0);
        bits.forEach((b) => {
          b.vy += 200 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.va * dt; b.life -= dt;
          g.save(); g.translate(ox + b.x * s, oy + b.y * s); g.rotate(b.a); g.globalAlpha = clamp(b.life, 0, 1);
          g.fillStyle = '#efe5d2'; g.fillRect(-b.r, -b.r * 0.6, b.r * 2, b.r * 1.2);
          g.strokeStyle = 'rgba(160,130,90,0.4)'; g.strokeRect(-b.r, -b.r * 0.6, b.r * 2, b.r * 1.2);
          g.restore();
        });
        g.globalAlpha = 1;
        bits = bits.filter((b) => b.life > 0);
        // Outil
        if (cursor && view === 'cloth' && !flip) {
          const x = ox + cursor.x * s, y = oy + cursor.y * s;
          if (mode === 'tuft') drawGun(x, y, gunOn > 0); else drawShears(x, y);
        }
      });

      return {
        destroy() {
          loop.stop(); ptr.destroy(); cv.destroy(); gunStop();
          [shearLoop, brushLoop, peelLoop].forEach((l) => l && l.stop());
          timers.forEach(clearTimeout);
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/honey.js */
/* Miel — un filet de miel visqueux qui s'enroule sur lui-même, nappe et coule doucement */
(function () {
  'use strict';
  const { rand, clamp, lerp } = SG.util;
  const A = SG.audio;
  const VW = 400, VH = 640, K = 1.75; // scène virtuelle et résolution des calques

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  function rr(g, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    g.beginPath(); g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  const LIQUIDS = {
    miel: { name: 'Miel', body: '#f0ad32', light: '#ffe49a', dark: '#b06a10', alpha: 0.9, spread: 1, coil: 1, swatch: '#f4b63f' },
    caramel: { name: 'Caramel', body: '#d48535', light: '#f8c886', dark: '#874414', alpha: 0.95, spread: 0.8, coil: 0.9, swatch: '#d9893a' },
    erable: { name: 'Sirop d’érable', body: '#b9611f', light: '#f2a65c', dark: '#6e300c', alpha: 0.82, spread: 1.45, coil: 1.25, swatch: '#bd6a2a' },
    chocolat: { name: 'Chocolat', body: '#5c301f', light: '#a5735c', dark: '#2b130a', alpha: 1, spread: 0.9, coil: 0.95, swatch: '#5c301f' },
  };

  /* ---------- Aliments ---------- */
  const TOAST = { cx: 200, cy: 392, sy: 0.6, th: 13 };
  function toastPath(g) {
    const { cx, cy, sy } = TOAST;
    g.save(); g.translate(cx, cy); g.scale(1, sy);
    g.beginPath();
