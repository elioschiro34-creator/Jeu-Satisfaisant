        // Ombre légère
        if (!cut) {
          c.fillStyle = 'rgba(90,60,70,0.1)';
          c.beginPath(); c.ellipse(kx + SX * 0.6 + 10, Math.min(8, ky + 70), 40, 7, -0.5, 0, Math.PI * 2); c.fill();
        }
        c.translate(fx, fy);
        c.transform(1, 0, slope, 1, 0, 0);
        c.translate(-fx, -fy);
        // Manche (vers nous)
        const hx0 = fx + 2, hy0 = fy - 24;
        const dl = Math.hypot(SX, DV), ux = -SX / dl, uy = DV / dl;
        c.lineCap = 'round';
        c.strokeStyle = '#b6a5e6'; c.lineWidth = 15;
        c.beginPath(); c.moveTo(hx0 + ux * 8, hy0 + uy * 8); c.lineTo(hx0 + ux * 64, hy0 + uy * 64); c.stroke();
        c.strokeStyle = '#d6c4ff'; c.lineWidth = 11;
        c.beginPath(); c.moveTo(hx0 + ux * 8 - 1, hy0 + uy * 8 - 2); c.lineTo(hx0 + ux * 64 - 1, hy0 + uy * 64 - 2); c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.65)'; c.lineWidth = 2.5;
        c.beginPath(); c.moveTo(hx0 + ux * 14 - 3, hy0 + uy * 14 - 5); c.lineTo(hx0 + ux * 58 - 3, hy0 + uy * 58 - 5); c.stroke();
        // Lame
        const tipX = kx + SX * 1.4, tipY = ky - DV * 1.4 - 14;
        c.beginPath();
        c.moveTo(fx, fy);
        c.quadraticCurveTo(kx + SX * 1.15, ky - DV * 1.15, tipX, tipY);
        c.lineTo(kx + SX * 1.2, ky - DV * 1.2 - 42);
        c.lineTo(fx, fy - 44);
        c.closePath();
        const g = c.createLinearGradient(fx, fy - 44, fx + 12, fy);
        g.addColorStop(0, '#f8fafd'); g.addColorStop(0.6, '#dbe1ea'); g.addColorStop(1, '#aeb8c7');
        c.fillStyle = g; c.fill();
        c.strokeStyle = 'rgba(110,120,140,0.5)'; c.lineWidth = 0.8; c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 1.3;
        c.beginPath(); c.moveTo(fx + 1, fy - 2); c.quadraticCurveTo(kx + SX * 1.15, ky - DV * 1.15 - 2, tipX - 2, tipY - 1); c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 4;
        c.beginPath(); c.moveTo(fx + 3, fy - 36); c.lineTo(kx + SX * 1.1, ky - DV * 1.1 - 36); c.stroke();
        // Beurre collé sur la lame
        if (cut && cut.vis > 0.15) {
          c.fillStyle = 'rgba(255,236,160,0.55)';
          c.beginPath(); c.ellipse(fx + SX * 0.5, fy - DV * 0.5 - 6, 10, 3, -0.9, 0, Math.PI * 2); c.fill();
        }
        c.fillStyle = '#c4ccd8';
        c.beginPath(); c.arc(hx0 + ux * 6, hy0 + uy * 6, 8, 0, Math.PI * 2); c.fill();
        c.restore();
      }

      function drawCurler(c, x, y, d) {
        c.fillStyle = 'rgba(90,60,70,0.12)';
        c.beginPath(); c.ellipse(x + SX * 0.5 + 6, y - DV * 0.5 + 6, 24, 6, -0.9, 0, Math.PI * 2); c.fill();
        c.beginPath();
        c.moveTo(x - 3, y + 1); c.lineTo(x + SX + 4, y - DV - 3); c.lineTo(x + SX + 4, y - DV - 12); c.lineTo(x - 3, y - 8);
        c.closePath();
        const g = c.createLinearGradient(x, y - 10, x + 6, y + 2);
        g.addColorStop(0, '#f6f8fc'); g.addColorStop(1, '#a9b3c3');
        c.fillStyle = g; c.fill();
        c.strokeStyle = 'rgba(110,120,140,0.6)'; c.lineWidth = 0.8; c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 1;
        c.beginPath(); c.moveTo(x - 2, y - 6); c.lineTo(x + SX + 3, y - DV - 10); c.stroke();
        const mx = x + SX * 0.5, my = y - DV * 0.5 - 9;
        const jx = mx - d * 12, jy = my - 26, hx = mx - d * 34, hy = my - 84;
        c.lineCap = 'round';
        c.strokeStyle = '#b9c2cf'; c.lineWidth = 4;
        c.beginPath(); c.moveTo(mx, my); c.lineTo(jx, jy); c.stroke();
        c.strokeStyle = '#8fd8b4'; c.lineWidth = 16;
        c.beginPath(); c.moveTo(jx, jy); c.lineTo(hx, hy); c.stroke();
        c.strokeStyle = '#b9f0d4'; c.lineWidth = 12;
        c.beginPath(); c.moveTo(jx - 1, jy - 1); c.lineTo(hx - 1, hy - 1); c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 3;
        c.beginPath(); c.moveTo(jx - d * 2 - 3, jy - 8); c.lineTo(hx - 3, hy + 6); c.stroke();
      }

      // Copeau : cylindre roulé sur la profondeur (x,y = centre de la face avant, écran local)
      function drawCurl(c, x, y, Rr, rot, len, depth) {
        const ex = SX * depth, ey = DV * depth;
        c.fillStyle = COL.side;
        for (let k = 8; k >= 1; k--) {
          c.beginPath(); c.arc(x + ex * k / 8, y - ey * k / 8, Rr, 0, Math.PI * 2); c.fill();
        }
        c.strokeStyle = 'rgba(255,250,225,0.65)'; c.lineWidth = Math.max(1, Rr * 0.18);
        c.beginPath(); c.moveTo(x - Rr * 0.5, y - Rr * 0.85); c.lineTo(x - Rr * 0.5 + ex, y - Rr * 0.85 - ey); c.stroke();
        c.strokeStyle = 'rgba(200,150,60,0.3)'; c.lineWidth = Math.max(0.8, Rr * 0.12);
        c.beginPath(); c.moveTo(x + Rr * 0.6, y + Rr * 0.7); c.lineTo(x + Rr * 0.6 + ex, y + Rr * 0.7 - ey); c.stroke();
        const g = c.createRadialGradient(x - Rr * 0.3, y - Rr * 0.3, Rr * 0.1, x, y, Rr);
        g.addColorStop(0, '#fff7d6'); g.addColorStop(1, '#f1cb6c');
        c.fillStyle = g;
        c.beginPath(); c.arc(x, y, Rr, 0, Math.PI * 2); c.fill();
        const turns = 1.2 + Math.min(2.5, len / 70);
        c.strokeStyle = 'rgba(190,130,35,0.6)'; c.lineWidth = Math.max(0.7, Rr * 0.08);
        c.beginPath();
        for (let i = 0; i <= 48; i++) {
          const f = i / 48, th = rot + f * turns * Math.PI * 2, r = Rr * (0.12 + 0.88 * f);
          if (i === 0) c.moveTo(x + Math.cos(th) * r, y + Math.sin(th) * r);
          else c.lineTo(x + Math.cos(th) * r, y + Math.sin(th) * r);
        }
        c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = Math.max(0.8, Rr * 0.1);
        c.beginPath(); c.arc(x, y, Rr * 0.85, Math.PI * 1.1, Math.PI * 1.45); c.stroke();
      }

      // Prisme : profil (points écran) extrudé en profondeur, faces latérales éclairées selon leur normale
      let gPiece = null;
      function drawPrism(c, sp) {
        let A = 0;
        for (let i = 0; i < sp.length; i++) { const p = sp[i], o = sp[(i + 1) % sp.length]; A += p[0] * o[1] - o[0] * p[1]; }
        const sg = A > 0 ? 1 : -1;
        const faces = [];
        for (let i = 0; i < sp.length; i++) {
          const p0 = sp[i], p1 = sp[(i + 1) % sp.length];
          const ex = p1[0] - p0[0], ey = p1[1] - p0[1], l = Math.hypot(ex, ey);
          if (l < 0.05) continue;
          const nx = sg * ey / l, ny = -sg * ex / l;
          if (nx * SX - ny * DV <= 0.01) continue;
          faces.push({ p0, p1, nx, ny, k: (p0[1] + p1[1]) * 0.5 - (p0[0] + p1[0]) * 0.1 });
        }
        faces.sort((a, b) => b.k - a.k);
        for (const f of faces) {
          c.beginPath();
          c.moveTo(f.p0[0], f.p0[1]); c.lineTo(f.p1[0], f.p1[1]);
          c.lineTo(f.p1[0] + SX, f.p1[1] - DV); c.lineTo(f.p0[0] + SX, f.p0[1] - DV);
          c.closePath();
          const up = U.clamp(-f.ny, 0, 1), rt = U.clamp(f.nx, 0, 1);
          c.fillStyle = up > 0.5 ? mixRgb(RGB.side, RGB.top, up) : mixRgb(RGB.side, RGB.dark, rt * 0.6);
          c.fill();
          c.strokeStyle = 'rgba(255,250,230,0.35)'; c.lineWidth = 0.5; c.stroke();
        }
        polyPath(c, sp);
        c.fillStyle = gPiece; c.fill();
        if (noisePat) { c.fillStyle = noisePat; c.fill(); }
        c.strokeStyle = 'rgba(255,255,255,0.65)'; c.lineWidth = 0.9; c.stroke();
      }

      function screenPts(b) {
        if (b.state === 'tip') return rotPts(b.tpts, b.theta).map(([x, y]) => [b.pvx + x + b.z * KX, y - b.base - b.z * KY]);
        return b.pts.map(([x, y]) => [b.x + x + b.z * KX, y - b.base - b.z * KY]);
      }

      // Ordre de dessin : fond → avant, gauche → droite, dessous → dessus
      const blockBody = { kind: 'block', id: 0 };
      function drawOrder() {
        const list = bodies.filter((b) => b.alpha > 0);
        const items = list.map((b) => ({ b, f: fp(b) }));
        if (n > 0) items.push({ b: blockBody, f: { x0: blockOx, x1: blockOx + n * CW, z0: 0, z1: D, h: H0 } });
        const before = (a, b) => {
          const A = a.f, B = b.f;
          const ox2 = A.x0 < B.x1 - 0.5 && B.x0 < A.x1 - 0.5, oz = A.z0 < B.z1 - 0.5 && B.z0 < A.z1 - 0.5;
          if (ox2 && oz) {
            const ba = a.b.kind === 'block' ? 0 : a.b.base, bb = b.b.kind === 'block' ? 0 : b.b.base;
            return ba < bb;
          }
          if (A.z0 >= B.z1 - 0.5) return true;
          if (B.z0 >= A.z1 - 0.5) return false;
          return A.x1 <= B.x0 + 0.5;
        };
        const out = [], rem = items.slice();
        while (rem.length) {
          let pick = 0;
          for (let i = 0; i < rem.length; i++) {
            let ok = true;
            for (let j = 0; j < rem.length; j++) {
              if (i !== j && before(rem[j], rem[i]) && !before(rem[i], rem[j])) { ok = false; break; }
            }
            if (ok) { pick = i; break; }
          }
          out.push(rem[pick].b);
          rem.splice(pick, 1);
        }
        return out;
      }

      function drawShadow(c, b) {
        const f = fp(b);
        const lift = b.kind === 'block' ? 0 : b.base;
        const a = Math.max(0.03, 0.16 - lift * 0.004) * (b.alpha === undefined ? 1 : b.alpha);
        const off = 3 + lift * 0.25;
        const p0 = P(f.x0 + off, 0, f.z0 - 1), p1 = P(f.x1 + off + 4, 0, f.z0 - 1), p2 = P(f.x1 + off + 4, 0, f.z1), p3 = P(f.x0 + off, 0, f.z1);
        c.fillStyle = `rgba(120,80,40,${a})`;
        polyPath(c, [p0, p1, p2, p3]); c.fill();
      }

      function drawBody(c, b) {
        if (b.kind === 'block') {
          c.drawImage(blockCv, blockOx + BB.x, BB.y, BB.w, BB.h);
          if (cut) {
            const xt = blockOx + cut.col * CW, h = H[cut.col], sl = cut.slope;
            c.strokeStyle = 'rgba(170,115,30,0.7)'; c.lineWidth = 1.2;
            c.beginPath(); c.moveTo(xt, -h); c.lineTo(xt + SX, -h - DV);
            c.moveTo(xt, -h); c.lineTo(xt + sl * h * cut.vis, -h + cut.vis * h); c.stroke();
          }
          return;
        }
        c.globalAlpha = Math.max(0, Math.min(1, b.alpha));
        if (b.kind === 'curl') {
          const p = P(b.x, b.base + b.R, b.z);
          drawCurl(c, p[0], p[1], b.R, b.rot, b.len, 0.85);
        } else {
          drawPrism(c, screenPts(b));
        }
        c.globalAlpha = 1;
      }

      // --- Boucle ---
      layout(); buildBg(); updateProgress();
      gPiece = ctx.createLinearGradient(0, -H0, 0, 0);
      gPiece.addColorStop(0, '#fff6cf'); gPiece.addColorStop(1, '#f6d77e');
      noisePat = ctx.createPattern(noiseCv, 'repeat');
      cv.onResize(() => { layout(); buildBg(); });
      SG.audio.sand(0.2, 0.4);

      const loop = SG.loop((dt) => {
        if (grab) grab.dt = dt;
        // Arrivée / départ du bloc
        if (phase === 'in') {
          blockOx *= Math.exp(-dt * 7);
          if (Math.abs(blockOx) < 0.5) { blockOx = 0; phase = 'live'; SG.audio.thud(0.4, 1.1); SG.audio.tap('wood', 0.2, 1); SG.haptic(8); }
        } else if (phase === 'out') {
          blockOx -= dt * 1500;
          if (blockOx < -560) {
            resetBlock(); blockOx = -520; phase = 'in';
            bodies.length = 0;
            updateProgress();
            SG.audio.sand(0.2, 0.4);
          }
        }

        // Lame qui s'enfonce (le beurre froid résiste)
        if (cut) {
          const before = cut.vis;
          cut.vis += (cut.target - cut.vis) * (1 - Math.exp(-dt * 5));
          cut.slope += (cut.tslope - cut.slope) * (1 - Math.exp(-dt * 10));
          const rate = (cut.vis - before) / Math.max(dt, 0.001);
          sndLv = Math.max(sndLv, U.clamp(rate * 0.8, 0, 0.6)); sndTone = 0.2;
          if (cut.vis - cut.lastTick > 0.06) {
            cut.lastTick = cut.vis;
            SG.audio.crunch(U.clamp(0.25 + rate * 0.15, 0.25, 0.7), U.rand(0.85, 1.1));
            if (Math.random() < 0.3) SG.audio.crack(0.12, U.rand(1.2, 1.5));
            SG.haptic(3);
            const xc = blockOx + cut.col * CW, h = H[cut.col];
            burst(xc + U.rand(0, SX), -h - U.rand(0, DV), 1, 0.4);
            if (Math.random() < 0.5) burst(xc + cut.slope * h * cut.vis, -h + cut.vis * h, 1, 0.5);
          }
          if (cut.vis >= 0.8) snap();
        }

        // Corps : bascule, chute, appui, frottement
        for (let i = bodies.length - 1; i >= 0; i--) {
          const b = bodies[i];
          if (b.state === 'tip') {
            b.omega += (3 + 16 * Math.sin(b.theta)) * dt;
            b.theta += b.omega * dt;
            // un morceau déjà posé à droite bloque la bascule plus tôt → on le pousse
            if (b.theta >= Math.PI / 2) {
              b.theta = Math.PI / 2;
              if (!b.landed) {
                b.landed = true;
                impact(0.5, 0.95, 'piece');
                SG.audio.crunch(0.5, 0.75);
                const f = fp(b);
                burst((f.x0 + f.x1) / 2, -2, 6, 0.6);
                b.omega = -b.omega * 0.18;
              } else if (b.omega > 0.8) {
                b.omega = -b.omega * 0.2;
                SG.audio.thud(0.12, 1.4);
              } else { landPiece(b); }
            }
            continue;
          }
          if (b.state === 'drag') {
            const f = fp(b);
            const sup = supportOf(b, f, true);
            b.base += (sup + 12 - b.base) * (1 - Math.exp(-dt * 14));
            continue;
          }
          // Déplacement horizontal (glisse / roule) avec marche maximale
          if (Math.abs(b.vx) > 0.5 || Math.abs(b.vz) > 0.5) {
            const px = b.x, pz = b.z;
            b.x += b.vx * dt; b.z += b.vz * dt;
            clampBody(b);
            const f = fp(b);
            const sup = supportOf(b, f, true);
            if (sup > b.base + 6) { b.x = px; b.z = pz; b.vx = -b.vx * 0.35; b.vz = -b.vz * 0.35; if (b.kind === 'curl') SG.audio.tap('plastic', 0.05, 1.8); }
          }
          const f = fp(b);
          const floor = supportOf(b, f, false);
          if (b.base > floor + 0.2 || b.vy > 0) {
            b.vy -= 900 * dt; b.base += b.vy * dt;
            if (b.base <= floor) {
              b.base = floor;
              if (b.vy < -110) impact(U.clamp(-b.vy / 1400, 0.06, 0.4), b.kind === 'curl' ? 1.8 : 1.1, b.kind);
              b.vy = b.vy < -150 ? -b.vy * 0.25 : 0;
              b.state = 'rest';
            } else b.state = 'fall';
          } else if (b.base < floor) b.base = floor;
          if (b.base <= floor + 0.2) {
            const fr = b.kind === 'curl' ? 1.4 : 6;
            b.vx *= Math.exp(-dt * fr); b.vz *= Math.exp(-dt * fr * 2);
          }
          if (b.kind === 'curl') b.rot += b.vx / b.R * dt;
          if (b.fade) b.alpha -= dt * 1.6;
          if (b.alpha <= 0) bodies.splice(i, 1);
        }
        // Poussée : deux corps au même niveau ne se chevauchent pas
        for (let it = 0; it < 2; it++) {
          for (let i = 0; i < bodies.length; i++) {
            const a = bodies[i];
            if (a.state === 'tip' || a.state === 'drag' || a.fade) continue;
            const fa = fp(a);
            // contre le bloc
            if (n > 0 && phase === 'live' && a.base < H0 - 2) {
              const fb = { x0: blockOx, x1: blockOx + n * CW, z0: 0, z1: D };
              if (overl(fa, fb) && a.base < blockTop(fa) - 1) {
                const px = fb.x1 - fa.x0, pz = fb.z0 - fa.z0 + (fa.z1 - fa.z0);
                if (narrow ? pz < px * 1.5 : pz < px * 0.6) a.z -= Math.min(pz, 4) ; else a.x += Math.min(px, 4);
                clampBody(a);
              }
            }
            for (let j = i + 1; j < bodies.length; j++) {
              const b = bodies[j];
              if (b.state === 'tip' || b.state === 'drag' || b.fade) continue;
              const fb = fp(b);
              if (!overl(fa, fb, 1)) continue;
              // même niveau seulement (sinon c'est un empilement)
              if (Math.abs(a.base - b.base) > Math.min(fa.h, fb.h) * 0.5) continue;
              const mv = a.id < b.id ? a : b, st = mv === a ? b : a;
              const fm = mv === a ? fa : fb, fs = mv === a ? fb : fa;
              const px = Math.min(fm.x1 - fs.x0, fs.x1 - fm.x0), pz = Math.min(fm.z1 - fs.z0, fs.z1 - fm.z0);
              const sx2 = (fm.x0 + fm.x1) < (fs.x0 + fs.x1) ? -1 : 1, sz = (fm.z0 + fm.z1) < (fs.z0 + fs.z1) ? -1 : 1;
              const useZ = narrow ? pz < px * 1.6 : pz < px * 0.6;
              const before = mv.x + mv.z * 1000;
              if (useZ) mv.z += sz * Math.min(pz * 0.35 + 0.2, 5); else mv.x += sx2 * Math.min(px * 0.35 + 0.2, 5);
              clampBody(mv);
              if (Math.abs(mv.x + mv.z * 1000 - before) < 0.05) {
                // coincé : l'autre glisse dans l'autre sens
                if (useZ) st.z -= sz * Math.min(pz * 0.35 + 0.2, 5); else st.x -= sx2 * Math.min(px * 0.35 + 0.2, 5);
                clampBody(st);
              }
            }
          }
        }

        // Éclats
        for (let i = flakes.length - 1; i >= 0; i--) {
          const f = flakes[i];
          f.vy += 800 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt; f.life -= dt;
          let floor = f.fl;
          const col = colAt(f.x);
          if (phase === 'live' && col >= 0 && col < n && f.y < -H[col] + 2) floor = -H[col] - f.fd;
          if (f.y > floor && f.vy > 0) { f.y = floor; f.vy *= -0.3; f.vx *= 0.5; f.vr *= 0.5; }
          if (f.life <= 0) flakes.splice(i, 1);
        }

        sndLv *= Math.exp(-dt * 8); brushLv *= Math.exp(-dt * 7);
        if (snd) { snd.set(pressed ? sndLv : 0, sndTone); sndB.set(pressed ? brushLv : 0, 0.35); }
        if (blockDirty) renderBlock();

        // --- Rendu ---
        const W = cv.w, Hh = cv.h;
        ctx.clearRect(0, 0, W, Hh);
        ctx.drawImage(bgCv, 0, 0, W, Hh);
        ctx.save();
        ctx.translate(ox, oy); ctx.scale(s, s);
        const order = drawOrder();
        if (n > 0) {
          const l = n * CW, bx = blockOx;
          ctx.fillStyle = 'rgba(120,80,40,0.14)';
          polyPath(ctx, [[bx + 4, 4], [bx + l + 14, 4], [bx + l + SX + 18, -DV + 2], [bx + SX + 4, -DV + 2]]); ctx.fill();
          ctx.fillStyle = 'rgba(120,80,40,0.12)';
          polyPath(ctx, [[bx + 2, 2], [bx + l + 6, 2], [bx + l + SX + 8, -DV], [bx + SX + 2, -DV]]); ctx.fill();
        }
        for (const b of order) if (b.kind !== 'block') drawShadow(ctx, b);
        for (const b of order) drawBody(ctx, b);
        if (curl && curl.len >= 4) drawCurl(ctx, curl.x, curl.y, 3.5 + Math.sqrt(curl.len) * 1.15, curl.rot, curl.len, 1);
        for (const f of flakes) {
          ctx.globalAlpha = U.clamp(f.life * 2, 0, 1);
          ctx.fillStyle = f.col;
          ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
          ctx.beginPath(); ctx.moveTo(-f.s, -f.s * 0.4); ctx.lineTo(f.s * 0.8, -f.s * 0.6); ctx.lineTo(f.s * 0.2, f.s * 0.7); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        // Outil
        const t = topAt(q.x);
        if (mode === 'slice') {
          let kx = q.x, ky = q.y;
          if (cut) { const h = H[cut.col]; kx = blockOx + cut.col * CW + cut.slope * h * cut.vis; ky = -h + cut.vis * h; } else if (t !== null && !pressed) ky = Math.min(ky, t - 6);
          drawKnife(ctx, kx, ky);
        } else if (mode === 'curl') {
          let ty = q.y;
          if (t !== null && pressed && q.y > t - DV - 22 && q.y < t + 16) ty = t;
          drawCurler(ctx, q.x, ty, dir);
        } else if (pressed && !grab) {
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.beginPath(); ctx.arc(q.x, q.y, 10, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      });

      return {
        destroy() {
          loop.stop();
          ptr.destroy();
          timers.forEach(clearTimeout);
          if (snd) snd.stop();
          if (sndB) sndB.stop();
          cv.destroy();
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/soap.js */
/* Savon à découper — trancher un pain de savon translucide, l'émietter en cubes, écraser les cubes.
   Les cubes tombent sur une carte de hauteurs (sol, savon, tranches, autres cubes) : ils s'empilent
   et ne traversent plus rien ; tout est dessiné dans l'ordre de profondeur. */
(function () {
  'use strict';
  const U = SG.util;

  // Repère local : x le long du tapis, y vers le haut (écran : -y), z en profondeur
  const CS = 12, COLS = 15, ROWS = 4, DEP = 3;
  const D = DEP * CS, KX = 0.75, KY = 0.92;
  const SXD = D * KX, DVD = D * KY;
  const HS = ROWS * CS;
  const TOTAL = COLS * ROWS * DEP;
  const HC = 6;                         // maille de la carte de hauteurs
  const NB = [[1, 0], [-1, 0], [0, 1], [0, -1], [1, -1], [-1, -1]];
  const PALS = {
    rose: { name: 'Rose', sw: '#ffb5c8', layers: ['#ff9fbc', '#ffb5c8', '#ffcadb', '#fff1f4'] },
    lilas: { name: 'Lilas', sw: '#d6c4ff', layers: ['#bda8f5', '#d6c4ff', '#e6dbff', '#fbf8ff'] },
    menthe: { name: 'Menthe', sw: '#b9f0d4', layers: ['#8fdcb8', '#b9f0d4', '#d3f7e5', '#f4fff9'] },
    ciel: { name: 'Ciel', sw: '#b8dcff', layers: ['#93c6f5', '#b8dcff', '#d4eaff', '#f5fbff'] },
    raye: { name: 'Rayé', sw: 'linear-gradient(180deg,#b8dcff 0 25%,#b9f0d4 25% 50%,#fff3a6 50% 75%,#ffb5c8 75%)',
      layers: ['#ffb5c8', '#fff3a6', '#b9f0d4', '#b8dcff'] },
  };

  const P = (x, y, z) => [x + z * KX, -y - z * KY];
  function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mix(c, t, f) { return `rgb(${Math.round(c[0] + (t[0] - c[0]) * f)},${Math.round(c[1] + (t[1] - c[1]) * f)},${Math.round(c[2] + (t[2] - c[2]) * f)})`; }
  function mixA(c, t, f, a) { return `rgba(${Math.round(c[0] + (t[0] - c[0]) * f)},${Math.round(c[1] + (t[1] - c[1]) * f)},${Math.round(c[2] + (t[2] - c[2]) * f)},${a})`; }
  let palUid = 0;
  function shades(layers) {
    return layers.map((h) => {
      const c = hexRgb(h);
      return { id: ++palUid, rgb: c, f: h, t: mix(c, [255, 255, 255], 0.38), s: mix(c, [120, 80, 115], 0.2), d: mix(c, [255, 255, 255], 0.6),
        glow: mixA(c, [255, 255, 255], 0.75, 0.55), deep: mix(c, [140, 90, 130], 0.12) };
    });
  }
  function quad(c, a, b, d, e) {
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(d[0], d[1]); c.lineTo(e[0], e[1]); c.closePath();
  }
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  // Cube en mouvement (éventuellement en rotation) : face avant + côtés visibles
  function drawCube(c, cb) {
    const h = cb.size, r = h / Math.SQRT2;
    const fx = cb.x + (cb.z - h / 2) * KX, fy = -(cb.y + h / 2) - (cb.z - h / 2) * KY;
    const vx = h * KX, vy = -h * KY;
    const pts = [];
    for (let k = 0; k < 4; k++) {
      const a = cb.rot + Math.PI / 4 + k * Math.PI / 2;
      pts.push([fx + Math.cos(a) * r, fy + Math.sin(a) * r]);
    }
    for (let k = 0; k < 4; k++) {
      const a = cb.rot + Math.PI / 2 + k * Math.PI / 2;
      const nx = Math.cos(a), ny = Math.sin(a);
      if (nx * vx + ny * vy <= 0) continue;
      const p0 = pts[k], p1 = pts[(k + 1) % 4];
      quad(c, p0, p1, [p1[0] + vx, p1[1] + vy], [p0[0] + vx, p0[1] + vy]);
      c.fillStyle = -ny > nx ? cb.col.t : cb.col.s;
      c.fill();
    }
    quad(c, pts[0], pts[1], pts[2], pts[3]);
    c.fillStyle = cb.col.f; c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 0.7; c.stroke();
  }

  SG.registerGame({
    id: 'soap',
    title: 'Savon à découper',
    emoji: '🧼',
    desc: 'Tranche un savon pastel et émiette-le en petits cubes croustillants.',
    color: '#d6c4ff',
    bg: 'linear-gradient(180deg,#fff0f5 0%,#f0f4ff 100%)',
    order: 3,
    create(stage) {
      const cv = SG.makeCanvas(stage);
      const ctx = cv.ctx;
      const narrow = stage.getBoundingClientRect().width < 500;
      const view = narrow ? { x0: -22, x1: 262 } : { x0: -70, x1: 420 };
      const bgCv = mk(1, 1);
      let Zf = 80;

      let palKey = 'rose', pal = shades(PALS.rose.layers), pendingKey = 'rose';
      let ncols = COLS, barOx = -520, phase = 'in', broken = 0, done = false, fadeA = 1;
      const slabs = [], cubes = [], settled = [], dust = [], trail = [], specks = [];
      const timers = [];
      let pressed = false, act = null, crumbling = false, armX = null, speed = 0;
      const q = { x: 120, y: -120 }, lastQ = { x: 120, y: -120 };
      let hoverOn = false;
      let snd = null, sndS = null, sndLv = 0, scrLv = 0, lastTick = 0, hintedRub = false, hintedCrush = false;

      // Mise en page : savon grand et centré, tapis profond devant pour les cubes
      let s = 1, ox = 0, oy = 0;
      function layout() {
        const W = cv.w, H = cv.h;
        const top = 58, bot = 86;
        const aw = W - 12, ah = Math.max(160, H - top - bot);
        const vw = view.x1 - view.x0, above = narrow ? 150 : 140;
        s = Math.min(aw / vw, ah / (above + 80), 2.3);
        Zf = U.clamp(ah / s - above - 24, 60, 200);
        const used = above + Zf + 24;
        ox = W / 2 - (view.x0 + vw / 2) * s;
        oy = top + (ah - used * s) / 2 + above * s;
        sprites.clear();
        hmInit();
      }

      /* ---------- Carte de hauteurs (x,z) ---------- */
      let hm = null, hmX0 = 0, hmZ0 = 0, hmW = 1, hmH = 1;
      function hmInit() {
        hmX0 = view.x0 - 20; hmZ0 = -Zf - 12;
        hmW = Math.ceil((view.x1 + Zf * KX + 40 - hmX0) / HC); hmH = Math.ceil((D + 50 - hmZ0) / HC);
        hm = new Float32Array(hmW * hmH);
        recompute();
      }
      function hmRange(x0, x1, z0, z1) {
        return [Math.max(0, Math.floor((x0 + 1.5 - hmX0) / HC)), Math.min(hmW - 1, Math.floor((x1 - 1.5 - hmX0) / HC)),
          Math.max(0, Math.floor((z0 + 1.5 - hmZ0) / HC)), Math.min(hmH - 1, Math.floor((z1 - 1.5 - hmZ0) / HC))];
      }
      function heightAt(x0, x1, z0, z1) {
        const [i0, i1, j0, j1] = hmRange(x0, x1, z0, z1);
        let m = 0;
        for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { const v = hm[j * hmW + i]; if (v > m) m = v; }
        return m;
      }
      function stamp(x0, x1, z0, z1, h) {
        const [i0, i1, j0, j1] = hmRange(x0, x1, z0, z1);
        for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { const k = j * hmW + i; if (hm[k] < h) hm[k] = h; }
      }
      // Reconstruit tout ; un cube posé qui n'a plus d'appui se remet à tomber
      function recompute() {
        if (!hm) return;
        hm.fill(0);
        if (ncols > 0 && phase !== 'out') stamp(barOx, barOx + ncols * CS, 0, D, HS);
        for (const sl of slabs) {
          if (sl.state !== 'rest') continue;
          for (let iz = 0; iz < DEP; iz++) {
            for (let ix = 0; ix < ROWS; ix++) {
              let top = 0;
              for (let iy = sl.m - 1; iy >= 0; iy--) if (cellAt(sl, ix, iz, iy)) { top = (iy + 1) * CS; break; }
              if (top > 0) stamp(sl.x + ix * CS, sl.x + ix * CS + CS, sl.z + iz * CS, sl.z + iz * CS + CS, top);
            }
          }
        }
        settled.sort((a, b) => a.y - b.y);
        for (let i = 0; i < settled.length; i++) {
          const cb = settled[i], hh = cb.size / 2;
          const sup = heightAt(cb.x - hh, cb.x + hh, cb.z - hh, cb.z + hh);
          if (sup < cb.y - 0.5) {
            settled.splice(i, 1); i--;
            cb.vx = U.rand(-8, 8); cb.vz = U.rand(-8, 8); cb.vy = 0; cb.vr = 0; cb.sleep = 0;
            cubes.push(cb);
            continue;
          }
          stamp(cb.x - hh, cb.x + hh, cb.z - hh, cb.z + hh, cb.y + cb.size);
        }
      }

      /* ---------- Sprites de cubes (savon translucide, reflet cireux) ---------- */
      const sprites = new Map();
      function sprite(col, size) {
        const key = col.id + '|' + size;
        let sp = sprites.get(key);
        if (sp) return sp;
        const k = s * cv.dpr, pad = 2;
        const w = size + size * KX + pad * 2, h = size + size * KY + pad * 2;
        const c = mk(Math.max(1, Math.ceil(w * k)), Math.max(1, Math.ceil(h * k)));
        const g = c.getContext('2d');
        g.scale(k, k);
        g.translate(pad, pad + size * KY + size); // coin avant-bas-gauche
        const vx = size * KX, vy = -size * KY;
        // côté droit
        quad(g, [size, 0], [size, -size], [size + vx, -size + vy], [size + vx, vy]);
        let gr = g.createLinearGradient(size, 0, size + vx, vy);
        gr.addColorStop(0, col.s); gr.addColorStop(1, col.deep);
        g.fillStyle = gr; g.fill();
        // dessus
        quad(g, [0, -size], [size, -size], [size + vx, -size + vy], [vx, -size + vy]);
        g.fillStyle = col.t; g.fill();
        gr = g.createLinearGradient(0, -size + vy, size, -size);
        gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(0.45, 'rgba(255,255,255,0.08)'); gr.addColorStop(1, 'rgba(255,255,255,0.3)');
        g.fillStyle = gr; g.fill();
        // face avant : lumière qui traverse (bords plus clairs, cœur plus dense)
        g.fillStyle = col.f; g.fillRect(0, -size, size, size);
        gr = g.createRadialGradient(size * 0.45, -size * 0.55, size * 0.1, size * 0.5, -size * 0.5, size * 0.75);
        gr.addColorStop(0, 'rgba(255,255,255,0.0)'); gr.addColorStop(1, col.glow);
        g.fillStyle = gr; g.fillRect(0, -size, size, size);
        gr = g.createLinearGradient(0, -size, size, 0);
        gr.addColorStop(0, 'rgba(255,255,255,0.28)'); gr.addColorStop(0.35, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(90,50,90,0.08)');
        g.fillStyle = gr; g.fillRect(0, -size, size, size);
        // poudre fine
        for (let i = 0; i < size * 0.8; i++) {
          g.fillStyle = `rgba(255,255,255,${U.rand(0.25, 0.6)})`;
          g.fillRect(Math.random() * size, -Math.random() * size, 0.45, 0.45);
        }
        // arêtes lumineuses
        g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 0.6;
        g.beginPath(); g.moveTo(0, -size); g.lineTo(size, -size); g.lineTo(size + vx, -size + vy); g.moveTo(size, -size); g.lineTo(size, 0); g.stroke();
        g.strokeStyle = 'rgba(120,80,110,0.12)'; g.lineWidth = 0.5;
        g.strokeRect(0, -size, size, size);
        sp = { c, w, h, ax: pad, ay: pad + size * KY + size };
        sprites.set(key, sp);
        return sp;
      }
      // Cube aligné (x,z = centre, y = bas)
      function blitCube(c, col, size, x, y, z) {
        const sp = sprite(col, size);
        const p = P(x - size / 2, y, z - size / 2);
        c.drawImage(sp.c, p[0] - sp.ax, p[1] - sp.ay, sp.w, sp.h);
      }

      function buildBg() {
        const W = cv.w, H = cv.h, dpr = cv.dpr;
        bgCv.width = Math.max(1, Math.round(W * dpr)); bgCv.height = Math.max(1, Math.round(H * dpr));
        const b = bgCv.getContext('2d');
        b.setTransform(dpr, 0, 0, dpr, 0, 0);
        let g = b.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#fff0f5'); g.addColorStop(1, '#eef2ff');
        b.fillStyle = g; b.fillRect(0, 0, W, H);
        b.fillStyle = 'rgba(255,255,255,0.7)';
        for (let y = 10, row = 0; y < H; y += 34, row++) {
          for (let x = (row % 2) * 17; x < W; x += 34) { b.beginPath(); b.arc(x, y, 3.5, 0, Math.PI * 2); b.fill(); }
        }
        b.save(); b.translate(ox, oy); b.scale(s, s);
        const k = s * dpr;
        // Tapis de découpe (bords latéraux hors champ)
        const x0 = view.x0 - 700, x1 = view.x1 + 700, z0 = -Zf - 6, z1 = D + 28;
        const fl = P(x0, 0, z0), fr = P(x1, 0, z0), br = P(x1, 0, z1), bl = P(x0, 0, z1);
        b.shadowColor = 'rgba(110,90,140,0.3)'; b.shadowBlur = 20 * k; b.shadowOffsetY = 9 * k;
        quad(b, [fl[0], fl[1] + 6], [fr[0], fr[1] + 6], [br[0], br[1] + 6], [bl[0], bl[1] + 6]);
        b.fillStyle = '#93cfb3'; b.fill();
        b.shadowColor = 'transparent';
        quad(b, fl, fr, br, bl);
        g = b.createLinearGradient(0, bl[1], 0, fl[1]);
        g.addColorStop(0, '#d2f3e2'); g.addColorStop(1, '#b3e4cc');
        b.fillStyle = g; b.fill();
        b.save(); b.clip();
        const gx0 = Math.floor((view.x0 - Zf) / CS) * CS;
        for (let x = gx0; x <= view.x1 + Zf + 40; x += CS) {
          const major = Math.round(x / CS) % 5 === 0;
          b.strokeStyle = major ? 'rgba(255,255,255,0.75)' : 'rgba(255,255,255,0.4)'; b.lineWidth = major ? 1.1 : 0.6;
          const a = P(x, 0, z0), c = P(x, 0, z1);
          b.beginPath(); b.moveTo(a[0], a[1]); b.lineTo(c[0], c[1]); b.stroke();
        }
        for (let z = Math.ceil(z0 / CS) * CS; z <= z1; z += CS) {
          const major = Math.round(z / CS) % 5 === 0;
          b.strokeStyle = major ? 'rgba(255,255,255,0.75)' : 'rgba(255,255,255,0.4)'; b.lineWidth = major ? 1.1 : 0.6;
          const a = P(x0, 0, z), c = P(x1, 0, z);
          b.beginPath(); b.moveTo(a[0], a[1]); b.lineTo(c[0], c[1]); b.stroke();
        }
        b.strokeStyle = 'rgba(255,255,255,0.35)'; b.lineWidth = 0.8;
        for (let i = -4; i < 10; i++) {
          const a = P(view.x0 + i * 70, 0, z0), c = P(view.x0 + 100 + i * 70, 0, z1);
          b.beginPath(); b.moveTo(a[0], a[1]); b.lineTo(c[0], c[1]); b.stroke();
        }
        b.restore();
        b.fillStyle = 'rgba(70,130,105,0.55)';
        b.font = '500 6px Fredoka, system-ui, sans-serif';
        b.textAlign = 'center';
        for (let i = 1; i < 7; i++) {
          const p = P(i * CS * 5 - 60, 0, z1 - 6);
          b.fillText(String(i * 5), p[0], p[1]);
        }
        b.restore();
      }

      // Interface
      const prog = SG.progress(stage, 'Cubes');
      const items = Object.keys(PALS).map((key) => ({
        color: PALS[key].sw, title: PALS[key].name, group: 'pal', active: key === palKey, onClick: () => newBar(key),
      }));
      items.push({ icon: '🧼', label: stage.getBoundingClientRect().width < 470 ? '' : 'Nouveau', title: 'Nouveau savon', onClick: () => newBar(pendingKey) });
      SG.toolbar(stage, items);
      SG.hint(stage, 'Glisse la lame de haut en bas pour trancher le savon');

      function newBar(key) {
        pendingKey = key;
        if (phase === 'in') { palKey = key; pal = shades(PALS[key].layers); return; }
        if (phase !== 'live') return;
        phase = 'out';
        armX = null;
        SG.audio.whoosh(0.25, 0.4);
        SG.audio.sand(0.2, 0.4);
      }
      function resetBar() {
        palKey = pendingKey; pal = shades(PALS[palKey].layers);
        ncols = COLS; broken = 0; done = false;
        slabs.length = 0; cubes.length = 0; settled.length = 0; dust.length = 0; specks.length = 0;
        sprites.clear();
        prog.set(0);
      }

      const toLocal = (p) => ({ x: (p.x - ox) / s, y: (p.y - oy) / s });

      function puff(x, y, col, k, spd = 1) {
        for (let i = 0; i < k; i++) {
          if (dust.length > 140) dust.shift();
          dust.push({ x: x + U.rand(-4, 4), y: y + U.rand(-4, 4), vx: U.rand(-40, 40) * spd, vy: U.rand(-60, -10) * spd, r: U.rand(2, 5), life: U.rand(0.6, 1.2), max: 1.2, col });
        }
      }
      // Poussière fine qui retombe et reste sur le tapis
      function powder(x, y, z, col, k) {
        for (let i = 0; i < k; i++) {
          if (specks.length > 400) specks.shift();
          const p = P(x + U.rand(-8, 8), 0, z + U.rand(-6, 6));
          specks.push({ x: p[0], y: p[1], col, r: U.rand(0.5, 1.3), a: U.rand(0.4, 0.8), y0: y });
        }
      }

      // --- Trancher ---
      function cutAt(x) {
        if (phase !== 'live' || ncols <= 0) return;
        let k = Math.round((x - barOx) / CS);
        k = ncols === 1 ? 0 : U.clamp(k, 1, ncols - 1);
        const m = ncols - k;
        const pv = barOx + ncols * CS;
        slabs.push({ state: 'tip', pv, m, w: m * CS, theta: 0, omega: 0.5, pal, x: pv, z: 0, cells: null, landed: false, alpha: 1 });
        ncols = k;
        SG.audio.crack(0.45, 1.5);
        SG.audio.crunch(0.75, 1.35);
        SG.audio.sand(0.25, 0.3);
        SG.haptic([10, 20, 10]);
        const xc = barOx + k * CS;
        for (let i = 0; i < 10; i++) {
          const f = Math.random();
          puff(xc + f * SXD, -U.rand(0, HS) - f * DVD, pal[U.randInt(0, ROWS - 1)].d, 1, 0.8);
        }
        powder(xc, 0, U.rand(0, D), pal[0].d, 8);
        recompute();
      }

      // --- Émietter ---
      const idx = (sl, ix, iz, iy) => (iy * DEP + iz) * ROWS + ix;
      function cellAt(sl, ix, iz, iy) { return ix >= 0 && ix < ROWS && iz >= 0 && iz < DEP && iy >= 0 && iy < sl.m && sl.cells[idx(sl, ix, iz, iy)] === 1; }

      function findCells(px, py, rad, max) {
        const found = [];
        for (const sl of slabs) {
          if (sl.state !== 'rest') continue;
          for (let iy = 0; iy < sl.m; iy++) {
            for (let iz = 0; iz < DEP; iz++) {
              for (let ix = 0; ix < ROWS; ix++) {
                if (!cellAt(sl, ix, iz, iy) || cellAt(sl, ix, iz, iy + 1)) continue;
                const X = sl.x + ix * CS + CS / 2;
                const t = P(X, iy * CS + CS, sl.z + iz * CS + CS / 2);
                let d = U.dist(px, py, t[0], t[1]);
                if (!cellAt(sl, ix, iz - 1, iy)) {
                  const f = P(X, iy * CS + CS / 2, sl.z + iz * CS);
                  d = Math.min(d, U.dist(px, py, f[0], f[1]));
                }
                if (d < rad) found.push({ sl, ix, iz, iy, d });
              }
            }
          }
        }
        found.sort((a, b) => a.d - b.d);
        return found.slice(0, max);
      }

      function breakCell(sl, ix, iz, iy, push) {
        sl.cells[idx(sl, ix, iz, iy)] = 0;
        sl.count--;
        broken++;
        const X = sl.x + ix * CS + CS / 2;
        const col = sl.pal[ix];
        cubes.push({
          x: X, z: sl.z + iz * CS + CS / 2, y: iy * CS,
          vx: U.rand(-70, 70) + push, vz: U.rand(-90, 25), vy: U.rand(120, 270),
          rot: 0, vr: U.rand(-14, 14), size: CS, col, sleep: 0,
        });
        const p = P(X, iy * CS + CS, sl.z + iz * CS + CS / 2);
        puff(p[0], p[1], col.d, 2);
      }

      function crumbleAt(px, py) {
        const list = findCells(px, py, 15, 3);
        if (!list.length) return false;
        list.forEach((c) => breakCell(c.sl, c.ix, c.iz, c.iy, 0));
        const it = U.clamp(0.25 + list.length * 0.12 + speed * 0.1, 0.25, 0.8);
        SG.audio.crunch(it, U.rand(1.4, 1.75));
        if (Math.random() < 0.35) SG.audio.crack(it * 0.3, U.rand(1.6, 2.1));
        SG.haptic(4);
        sndLv = Math.max(sndLv, 0.5);
        cleanSlabs();
        recompute();
        checkDone();
        if (!hintedCrush && broken > 20) { hintedCrush = true; SG.hint(stage, 'Appuie sur les cubes pour les écraser', 2600); }
        return true;
      }

      // Écraser les cubes posés (ou en vol) sous le doigt
      function crushAt(px, py) {
        let hit = null, hd = 1e9, list = null, hi = -1;
        const test = (arr) => {
          for (let i = 0; i < arr.length; i++) {
            const cb = arr[i];
            const c = P(cb.x, cb.y + cb.size * 0.6, cb.z);
            const d = U.dist(px, py, c[0] + cb.size * 0.2, c[1] - cb.size * 0.2);
            if (d < cb.size * 0.85 + 5 && d - cb.y * 0.01 < hd) { hd = d - cb.y * 0.01; hit = cb; list = arr; hi = i; }
          }
        };
        test(settled); test(cubes);
        if (!hit) return false;
        list.splice(hi, 1);
        const p = P(hit.x, hit.y + hit.size * 0.5, hit.z);
        if (hit.size >= CS - 0.5) {
          const n = U.randInt(4, 6);
          for (let i = 0; i < n; i++) {
            cubes.push({ x: hit.x + U.rand(-3, 3), z: hit.z + U.rand(-3, 3), y: hit.y + U.rand(0, 4), vx: U.rand(-60, 60), vz: U.rand(-60, 30), vy: U.rand(60, 160),
              rot: Math.random() * 3, vr: U.rand(-16, 16), size: CS * 0.5, col: hit.col, sleep: 0 });
          }
          SG.audio.crunch(0.7, U.rand(1.6, 1.9));
          SG.audio.crack(0.3, U.rand(1.8, 2.2));
          SG.audio.sand(0.2, 0.22);
          SG.haptic([6, 10, 6]);
        } else {
          SG.audio.crunch(0.45, U.rand(2, 2.4));
          SG.audio.sand(0.28, 0.3);
          SG.haptic(5);
        }
        puff(p[0], p[1], hit.col.d, hit.size >= CS - 0.5 ? 6 : 4, 0.8);
        powder(hit.x, hit.y, hit.z, hit.col.d, hit.size >= CS - 0.5 ? 10 : 14);
        sndLv = Math.max(sndLv, 0.6); scrLv = Math.max(scrLv, 0.5);
        recompute();
        return true;
      }

      function crumbleAll(sl, push) {
        for (let iy = sl.m - 1; iy >= 0; iy--) {
          for (let iz = 0; iz < DEP; iz++) {
            for (let ix = 0; ix < ROWS; ix++) if (cellAt(sl, ix, iz, iy)) breakCell(sl, ix, iz, iy, push);
          }
        }
        SG.audio.crunch(0.9, 1.5);
        SG.audio.crack(0.35, 1.7);
        SG.audio.sand(0.35, 0.4);
        SG.haptic([10, 15, 10]);
      }
      // Lame à travers une tranche posée : la rangée sous la lame s'effondre
      function sliceSlabAt(x, yTop) {
        for (const sl of slabs) {
          if (sl.state !== 'rest') continue;
          const ix = Math.floor((x - sl.x - sl.z * 0 - (D * 0.5) * KX) / CS);
          void yTop;
          if (ix < 0 || ix >= ROWS) continue;
          let any = false;
          for (let iy = sl.m - 1; iy >= 0; iy--) for (let iz = 0; iz < DEP; iz++) if (cellAt(sl, ix, iz, iy)) { breakCell(sl, ix, iz, iy, U.rand(-20, 20)); any = true; }
          if (any) {
            SG.audio.crack(0.5, 1.4); SG.audio.crunch(0.8, 1.45); SG.audio.sand(0.25, 0.3);
            SG.haptic([8, 14, 8]);
            cleanSlabs(); recompute(); checkDone();
            return true;
          }
        }
        return false;
      }

      function cleanSlabs() {
        for (let i = slabs.length - 1; i >= 0; i--) if (slabs[i].state === 'rest' && slabs[i].count <= 0) slabs.splice(i, 1);
      }

      function checkDone() {
        prog.set(broken / TOTAL);
        if (!done && broken >= TOTAL) {
          done = true;
          SG.celebrate(stage, 'Tout en cubes !');
          timers.push(setTimeout(() => SG.hint(stage, 'Écrase les cubes… ou prends un nouveau savon 🧼', 3000), 2400));
        }
      }

      // --- Entrées ---
      function onMove() {
        trail.push({ x: q.x, y: q.y, life: 0.25 });
        if (trail.length > 24) trail.shift();
        if (crumbling) {
          if (!crumbleAt(q.x, q.y)) crushAt(q.x, q.y);
          sndLv = Math.max(sndLv, U.clamp(speed * 0.7, 0, 0.8));
          scrLv = Math.max(scrLv, U.clamp(speed * 0.4, 0, 0.5));
          return;
        }
        // lame qui traverse une tranche couchée
        for (const sl of slabs) {
          if (sl.state !== 'rest') continue;
          const yT = -sl.m * CS - (sl.z + D * 0.5) * KY;
          const xl = sl.x + (sl.z + D * 0.5) * KX;
          if (lastQ.y < yT && q.y >= yT && q.x > xl && q.x < xl + ROWS * CS) { sliceSlabAt(q.x - (sl.z) * KX, yT); break; }
        }
        if (phase !== 'live' || ncols <= 0) return;
        const yTop = -HS, yMid = -HS * 0.35;
        const L = ncols * CS;
        if (lastQ.y < yTop && q.y >= yTop) {
          const t = (yTop - lastQ.y) / (q.y - lastQ.y);
          const x = U.lerp(lastQ.x, q.x, t);
          if (x > barOx - 4 && x < barOx + L + 4) { armX = x; SG.audio.crunch(0.15, 1.6); SG.audio.tap('plastic', 0.08, 2.4); }
        }
        if (armX !== null && lastQ.y < yMid && q.y >= yMid) {
          cutAt(armX);
          armX = null;
        }
        if (q.y < yTop - 10) armX = null;
      }

      const ptr = SG.pointer(cv.canvas, {
        down(p) {
          if (act !== null) return;
          act = p.id; pressed = true;
          if (!snd && SG.audio.ctx()) { snd = SG.audio.loop('sand'); sndS = SG.audio.loop('scrape'); }
          const l = toLocal(p);
          q.x = lastQ.x = l.x; q.y = lastQ.y = l.y;
          speed = 0; armX = null; trail.length = 0;
          crumbling = crumbleAt(q.x, q.y) || crushAt(q.x, q.y);
          if (!crumbling) SG.haptic(3);
        },
        move(p) {
          if (p.id !== act) return;
          const l = toLocal(p);
          lastQ.x = q.x; lastQ.y = q.y;
          q.x = l.x; q.y = l.y;
          speed = p.speed;
          onMove();
        },
        hover(p) {
          if (act !== null) return;
          const l = toLocal(p);
          q.x = l.x; q.y = l.y; hoverOn = true;
        },
        up(p) {
          if (p.id !== act) return;
          act = null; pressed = false; crumbling = false; armX = null;
        },
      });

      // --- Dessin ---
      function drawBar(c) {
        const L = ncols * CS, bx = barOx;
        // Ombre douce
        c.fillStyle = 'rgba(70,110,90,0.16)';
        quad(c, [bx + 3, 3], [bx + L + 10, 3], [bx + L + SXD + 12, -DVD + 2], [bx + SXD + 3, -DVD + 2]); c.fill();
        c.fillStyle = 'rgba(70,110,90,0.1)';
        quad(c, [bx + 1, 6], [bx + L + 16, 6], [bx + L + SXD + 18, -DVD + 4], [bx + SXD + 1, -DVD + 4]); c.fill();
        // Face avant par couches, translucide (cœur plus dense, bords clairs)
        for (let r = 0; r < ROWS; r++) { c.fillStyle = pal[r].f; c.fillRect(bx, -(r + 1) * CS, L, CS + 0.4); }
        let g = c.createLinearGradient(bx, 0, bx + L, 0);
        g.addColorStop(0, 'rgba(255,255,255,0.32)'); g.addColorStop(0.08, 'rgba(255,255,255,0.05)'); g.addColorStop(0.9, 'rgba(255,255,255,0.03)'); g.addColorStop(1, 'rgba(255,255,255,0.25)');
        c.fillStyle = g; c.fillRect(bx, -HS, L, HS);
        g = c.createLinearGradient(0, -HS, 0, 0);
        g.addColorStop(0, 'rgba(255,255,255,0.35)'); g.addColorStop(0.15, 'rgba(255,255,255,0)'); g.addColorStop(0.85, 'rgba(120,70,110,0)'); g.addColorStop(1, 'rgba(120,70,110,0.08)');
        c.fillStyle = g; c.fillRect(bx, -HS, L, HS);
        // reflet cireux diagonal
        g = c.createLinearGradient(bx, -HS, bx + Math.min(L, 120), 0);
        g.addColorStop(0.25, 'rgba(255,255,255,0)'); g.addColorStop(0.4, 'rgba(255,255,255,0.22)'); g.addColorStop(0.55, 'rgba(255,255,255,0)');
        c.fillStyle = g; c.fillRect(bx, -HS, L, HS);
        c.strokeStyle = 'rgba(255,255,255,0.22)'; c.lineWidth = 0.6;
        c.beginPath();
        for (let i = 1; i < ncols; i++) { c.moveTo(bx + i * CS, -HS); c.lineTo(bx + i * CS, 0); }
        c.stroke();
        // Dessus
        const a = [bx, -HS], b = [bx + L, -HS], d = [bx + L + SXD, -HS - DVD], e = [bx + SXD, -HS - DVD];
        quad(c, a, b, d, e); c.fillStyle = pal[ROWS - 1].t; c.fill();
        g = c.createLinearGradient(bx, -HS - DVD, bx + L * 0.6, -HS);
        g.addColorStop(0, 'rgba(255,255,255,0.5)'); g.addColorStop(0.5, 'rgba(255,255,255,0.05)'); g.addColorStop(1, 'rgba(255,255,255,0.22)');
        c.fillStyle = g; c.fill();
        c.strokeStyle = 'rgba(255,255,255,0.4)'; c.lineWidth = 0.7;
        c.beginPath();
        for (let i = 1; i < ncols; i++) { c.moveTo(bx + i * CS, -HS); c.lineTo(bx + i * CS + SXD, -HS - DVD); }
        for (let j = 1; j < DEP; j++) { const f = j / DEP; c.moveTo(bx + f * SXD, -HS - f * DVD); c.lineTo(bx + L + f * SXD, -HS - f * DVD); }
        c.stroke();
        // Face coupée (bout droit), lisse et un peu plus sombre
        for (let r = 0; r < ROWS; r++) {
          quad(c, [bx + L, -r * CS], [bx + L, -(r + 1) * CS], [bx + L + SXD, -(r + 1) * CS - DVD], [bx + L + SXD, -r * CS - DVD]);
          c.fillStyle = pal[r].s; c.fill();
        }
        g = c.createLinearGradient(bx + L, 0, bx + L + SXD, -DVD);
        g.addColorStop(0, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        quad(c, [bx + L, 0], [bx + L, -HS], [bx + L + SXD, -HS - DVD], [bx + L + SXD, -DVD]); c.fillStyle = g; c.fill();
        c.strokeStyle = 'rgba(255,255,255,0.3)'; c.lineWidth = 0.6;
        c.beginPath();
        for (let r = 1; r < ROWS; r++) { c.moveTo(bx + L, -r * CS); c.lineTo(bx + L + SXD, -r * CS - DVD); }
        c.stroke();
        // Arêtes lumineuses
        c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 1.2; c.lineCap = 'round';
        c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(d[0], d[1]); c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 0.8;
        c.beginPath(); c.moveTo(b[0], b[1]); c.lineTo(b[0], 0); c.stroke();
      }

      // Tranche qui bascule
      function drawTipping(c, sl) {
        const bx = sl.pv;
        for (let k = 6; k >= 0; k--) {
          const f = k / 6;
          c.save();
          c.translate(bx + SXD * f, -DVD * f); c.rotate(sl.theta);
          for (let r = 0; r < ROWS; r++) {
            c.fillStyle = k === 0 ? sl.pal[r].f : (k === 6 ? sl.pal[r].t : sl.pal[r].s);
            c.fillRect(-sl.w, -(r + 1) * CS, sl.w, CS + 0.4);
          }
          if (k === 0) {
            const g = c.createLinearGradient(-sl.w, -HS, 0, 0);
            g.addColorStop(0, 'rgba(255,255,255,0.25)'); g.addColorStop(0.5, 'rgba(255,255,255,0)');
            c.fillStyle = g; c.fillRect(-sl.w, -HS, sl.w, HS);
            c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 1; c.strokeRect(-sl.w, -HS, sl.w, HS);
          }
          c.restore();
        }
      }

      function drawBlade(c, x, y, alpha) {
        c.globalAlpha = alpha;
        const ex0 = x - SXD * 0.2, ey0 = y + DVD * 0.2, ex1 = x + SXD * 1.2, ey1 = y - DVD * 1.2;
        const bh = 30;
        c.fillStyle = 'rgba(80,60,90,0.1)';
        c.beginPath(); c.ellipse(x + SXD * 0.5 + 10, Math.min(10, y + 50), 30, 6, -0.6, 0, Math.PI * 2); c.fill();
        quad(c, [ex0, ey0], [ex1, ey1], [ex1, ey1 - bh], [ex0, ey0 - bh]);
        const g = c.createLinearGradient(ex0, ey0 - bh, ex0 + 8, ey0);
        g.addColorStop(0, '#f8fafd'); g.addColorStop(0.6, '#dce2eb'); g.addColorStop(1, '#adb7c6');
        c.fillStyle = g; c.fill();
        c.strokeStyle = 'rgba(110,120,140,0.5)'; c.lineWidth = 0.8; c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 1.2;
        c.beginPath(); c.moveTo(ex0 + 1, ey0 - 1.5); c.lineTo(ex1 - 1, ey1 - 1.5); c.stroke();
        c.lineCap = 'round';
        c.strokeStyle = '#ff9fbc'; c.lineWidth = 11;
        c.beginPath(); c.moveTo(ex0 + 4, ey0 - bh - 4); c.lineTo(ex1 - 4, ey1 - bh - 4); c.stroke();
        c.strokeStyle = '#ffc4d4'; c.lineWidth = 7;
        c.beginPath(); c.moveTo(ex0 + 4, ey0 - bh - 5.5); c.lineTo(ex1 - 4, ey1 - bh - 5.5); c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 2.2;
        c.beginPath(); c.moveTo(ex0 + 7, ey0 - bh - 8); c.lineTo(ex1 - 10, ey1 - bh - 8); c.stroke();
        c.globalAlpha = 1;
      }

      // Garde les cubes sur la partie visible du tapis
      function clampCube(cb) {
        const h = cb.size / 2;
        const zmin = -Zf + h, zmax = D + 24 - h;
        if (cb.z < zmin) { cb.z = zmin; cb.vz = Math.abs(cb.vz) * 0.4; }
        if (cb.z > zmax) { cb.z = zmax; cb.vz = -Math.abs(cb.vz) * 0.4; }
        const sl = cb.x - h + (cb.z - h) * KX, sr = cb.x + h + (cb.z + h) * KX;
        if (sl < view.x0 + 2) { cb.x += view.x0 + 2 - sl; cb.vx = Math.abs(cb.vx) * 0.4; }
        if (sr > view.x1 - 2) { cb.x -= sr - (view.x1 - 2); cb.vx = -Math.abs(cb.vx) * 0.4; }
      }

      // --- Boucle ---
      layout(); buildBg(); prog.set(0);
      cv.onResize(() => { layout(); buildBg(); });

      const loop = SG.loop((dt) => {
        // Arrivée / départ du savon
        if (phase === 'in') {
          barOx *= Math.exp(-dt * 7);
          if (Math.abs(barOx) < 0.5) { barOx = 0; phase = 'live'; SG.audio.thud(0.35, 1.3); SG.audio.tap('plastic', 0.2, 1.1); SG.haptic(8); recompute(); }
        } else if (phase === 'out') {
          barOx -= dt * 1500;
          fadeA = Math.max(0, fadeA - dt * 1.8);
          if (barOx < -560 && fadeA <= 0) { resetBar(); barOx = -520; phase = 'in'; fadeA = 1; recompute(); SG.audio.sand(0.2, 0.4); }
        }

        // Tranches : bascule, place libre, émiettement si plus de place
        let changed = false;
        for (let i = slabs.length - 1; i >= 0; i--) {
          const sl = slabs[i];
          if (sl.state === 'tip') {
            sl.omega += (3 + 16 * Math.sin(sl.theta)) * dt;
            sl.theta += sl.omega * dt;
            if (sl.theta >= Math.PI / 2) {
              sl.theta = Math.PI / 2;
              if (!sl.landed) {
                sl.landed = true;
                sl.omega = -sl.omega * 0.18;
                SG.audio.thud(0.4, 1.25);
                SG.audio.tap('plastic', 0.18, 0.9);
                SG.audio.crunch(0.35, 1.2);
                SG.haptic(10);
                for (let r = 0; r < ROWS; r++) puff(sl.pv + r * CS + 6, -2, sl.pal[r].d, 2, 0.7);
              } else if (sl.omega > 0.8) {
                sl.omega = -sl.omega * 0.2;
              } else {
                sl.state = 'rest'; sl.x = sl.pv; sl.z = 0; sl.tz = 0;
                sl.cells = new Uint8Array(ROWS * DEP * sl.m).fill(1);
                sl.count = ROWS * DEP * sl.m;
                // place libre : les anciennes tranches glissent vers l'avant (ou s'émiettent)
                makeRoom(sl);
                changed = true;
                if (!hintedRub) { hintedRub = true; SG.hint(stage, 'Frotte la tranche pour l\'émietter en cubes', 3000); }
              }
            }
          } else if (sl.tz !== undefined && Math.abs(sl.z - sl.tz) > 0.05) {
            sl.z += (sl.tz - sl.z) * (1 - Math.exp(-dt * 8));
            if (Math.abs(sl.z - sl.tz) < 0.3) sl.z = sl.tz;
            changed = true;
          }
        }
        if (changed) recompute();

        // Cubes : physique sur la carte de hauteurs
        let ticks = 0;
        const now = performance.now();
        for (let i = cubes.length - 1; i >= 0; i--) {
          const cb = cubes[i];
          const hh = cb.size / 2;
          cb.vy -= 1100 * dt;
          const px = cb.x, pz = cb.z;
          cb.x += cb.vx * dt; cb.z += cb.vz * dt; cb.rot += cb.vr * dt;
          clampCube(cb);
          let floor = heightAt(cb.x - hh, cb.x + hh, cb.z - hh, cb.z + hh);
          if (floor > cb.y + 3) {
            // mur : on ne traverse pas, on rebondit sur le côté
            cb.x = px; cb.z = pz; cb.vx *= -0.35; cb.vz *= -0.35;
            floor = heightAt(cb.x - hh, cb.x + hh, cb.z - hh, cb.z + hh);
          }
          cb.y += cb.vy * dt;
          if (cb.y <= floor) {
            cb.y = floor;
            if (cb.vy < -90 && ticks < 3 && now - lastTick > 28) {
              ticks++; lastTick = now;
              const v = U.clamp(-cb.vy / 1800, 0.05, 0.24) * (cb.size < CS ? 0.7 : 1);
              SG.audio.crunch(v, U.rand(1.7, 2.2));
              if (Math.random() < 0.5) SG.audio.tap('plastic', v * 0.6, U.rand(1.6, 2.2));
            }
            cb.vy = cb.vy < -60 ? -cb.vy * 0.3 : 0;
            cb.vx *= 0.6; cb.vz *= 0.6; cb.vr *= 0.5;
          }
          if (cb.y <= floor + 0.01 && cb.vy === 0) {
            const k = Math.exp(-dt * 6);
            cb.vx *= k; cb.vz *= k; cb.vr *= Math.exp(-dt * 8);
            const tgt = Math.round(cb.rot / (Math.PI / 2)) * (Math.PI / 2);
            cb.rot += (tgt - cb.rot) * (1 - Math.exp(-dt * 12));
            if (Math.abs(cb.vx) + Math.abs(cb.vz) < 6 && Math.abs(tgt - cb.rot) < 0.03) cb.sleep += dt; else cb.sleep = 0;
          }
          if (cb.sleep > 0.12 && phase !== 'out') {
            // Angle de talus : un cube perché trop haut ou mal appuyé glisse vers le côté le plus bas
            const hC = heightAt(cb.x - 2, cb.x + 2, cb.z - 2, cb.z + 2);
            let best = null, bh = 1e9;
            for (const [dx, dz] of NB) {
              const nx = cb.x + dx * cb.size, nz = cb.z + dz * cb.size;
              if (nz - hh < -Zf || nz + hh > D + 24) continue;
              const sl = nx - hh + (nz - hh) * KX, sr = nx + hh + (nz + hh) * KX;
              if (sl < view.x0 + 2 || sr > view.x1 - 2) continue;
              const h2 = heightAt(nx - hh, nx + hh, nz - hh, nz + hh);
              if (h2 < bh) { bh = h2; best = [dx, dz]; }
            }
            if (best && (hC < cb.y - 1 ? bh < cb.y - 1 : bh < cb.y - cb.size * 1.15)) {
              cb.vx = best[0] * U.rand(40, 60); cb.vz = best[1] * U.rand(40, 60); cb.vy = 25; cb.y += 0.5;
              cb.vr = best[0] * U.rand(4, 8); cb.sleep = 0;
              continue;
            }
          }
          if (phase !== 'out' && (cb.sleep > 0.2 || (cubes.length > 90 && i === 0 && cb.y === floor))) {
            cb.rot = 0;
            cubes.splice(i, 1);
            settled.push(cb);
            stamp(cb.x - hh, cb.x + hh, cb.z - hh, cb.z + hh, cb.y + cb.size);
          }
        }
        // Poussière
        for (let i = dust.length - 1; i >= 0; i--) {
          const d = dust[i];
          d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 30 * dt; d.vx *= Math.exp(-dt * 2); d.r += dt * 9; d.life -= dt;
          if (d.life <= 0) dust.splice(i, 1);
        }
        for (let i = trail.length - 1; i >= 0; i--) { trail[i].life -= dt; if (trail[i].life <= 0) trail.splice(i, 1); }

        sndLv *= Math.exp(-dt * 8); scrLv *= Math.exp(-dt * 9);
        if (snd) { snd.set(pressed && crumbling ? sndLv : 0, 0.5); sndS.set(pressed && crumbling ? scrLv : 0, 0.75); }

        // --- Rendu ---
        const W = cv.w, H = cv.h;
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(bgCv, 0, 0, W, H);
        ctx.save();
        ctx.translate(ox, oy); ctx.scale(s, s);
        ctx.globalAlpha = fadeA;
        // poudre posée sur le tapis
        for (const sp of specks) { ctx.fillStyle = sp.col; ctx.globalAlpha = sp.a * fadeA; ctx.fillRect(sp.x, sp.y, sp.r, sp.r); }
        ctx.globalAlpha = fadeA;
        // Liste de tout ce qui est « cube » : cellules des tranches + cubes posés + cubes en vol
        const list = [];
        for (const sl of slabs) {
          if (sl.state !== 'rest') continue;
          for (let iy = 0; iy < sl.m; iy++) for (let iz = 0; iz < DEP; iz++) for (let ix = 0; ix < ROWS; ix++) {
            if (!cellAt(sl, ix, iz, iy)) continue;
            if (cellAt(sl, ix, iz, iy + 1) && cellAt(sl, ix + 1, iz, iy) && cellAt(sl, ix, iz - 1, iy)) continue; // cachée
            list.push({ x: sl.x + ix * CS + CS / 2, y: iy * CS, z: sl.z + iz * CS + CS / 2, size: CS, col: sl.pal[ix], st: true });
          }
        }
        for (const cb of settled) list.push(cb);
        for (const cb of cubes) list.push(cb);

  SG.registerGame({

            const gyv = GY[i00] * w00 + GY[i10] * w10 + GY[i01] * w01 + GY[i11] * w11;
            const wk = h < 0.08 ? (1 - h * 12.5) * 0.22 : 0;
            let nx = -gxv * S - wk * wcx[px] * (0.5 + 0.35 * sy), ny = -gyv * S - wk * cy * (0.5 + 0.35 * wsx[px]);
            const inv = 1 / Math.sqrt(nx * nx + ny * ny + 1);
            nx *= inv; ny *= inv;

            let df = nx * LX + ny * LY + nz * LZ; if (df < 0) df = 0;

            // reflet net d'une fenêtre (boîte à lumière) dans la peinture humide
            const rx = 2 * nz * nx + 0.4, ry = 2 * nz * ny + 0.5;

            const win = wx > 0 && wy > 0 ? (wx > 0.03 ? 1 : wx * 33) * (wy > 0.03 ? 1 : wy * 33) : 0;
            const gl = h > 0.12 ? 1 : h * 8.3;
            const shade = (0.7 + 0.42 * df) * (1 - shd * 0.32);
            const add = (sp + win * 0.5) * gl;
            const ih = shade / (h + 0.002);
            let r = (DR[i00] * m00 + DR[i10] * m10 + DR[i01] * m01 + DR[i11] * m11) * ih + add;
            let g = (DG[i00] * m00 + DG[i10] * m10 + DG[i01] * m01 + DG[i11] * m11) * ih + add;
            let b = (DB[i00] * m00 + DB[i10] * m10 + DB[i01] * m01 + DB[i11] * m11) * ih + add * 0.97;
            if (al < 1) {

            }
            d[o] = r > 1 ? 255 : r * 255;

      }

      function flush() {
        if (dX1 < 0) return;
        const m = 10;
        const x0 = Math.max(0, dX0 - m), y0 = Math.max(0, dY0 - m), x1 = Math.min(gw - 1, dX1 + m), y1 = Math.min(gh - 1, dY1 + m);
        dX0 = dY0 = 1e9; dX1 = dY1 = -1;
        prepCells(x0, y0, x1, y1);
        renderRect(x0, y0, x1, y1);
      }

      /* ---------- Échantillonnage pondéré par la quantité de peinture ---------- */
      let sH = 0, sR = 0, sG = 0, sB = 0;
      function samp(x, y) {
        if (x < 0) x = 0; else if (x > gw - 1.001) x = gw - 1.001;
        if (y < 0) y = 0; else if (y > gh - 1.001) y = gh - 1.001;
        const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
        const i0 = y0 * gw + x0, i1 = i0 + 1, i2 = i0 + gw, i3 = i2 + 1;
        const h0 = tH[i0] * (1 - fx) * (1 - fy), h1 = tH[i1] * fx * (1 - fy);
        const h2 = tH[i2] * (1 - fx) * fy, h3 = tH[i3] * fx * fy;
        sH = h0 + h1 + h2 + h3;
        if (sH > 1e-6) {
          const k = 1 / sH;
          sR = (tR[i0] * h0 + tR[i1] * h1 + tR[i2] * h2 + tR[i3] * h3) * k;
          sG = (tG[i0] * h0 + tG[i1] * h1 + tG[i2] * h2 + tG[i3] * h3) * k;
          sB = (tB[i0] * h0 + tB[i1] * h1 + tB[i2] * h2 + tB[i3] * h3) * k;
        } else { sR = sG = sB = 0; }
      }
      function blendCell(i, k) {
        const a = HF[i] * (1 - k), b = sH * k, s = a + b;
        if (s > 1e-6) {
          KR[i] = (KR[i] * a + sR * b) / s;
          KG[i] = (KG[i] * a + sG * b) / s;
          KB[i] = (KB[i] * a + sB * b) / s;
        }
        HF[i] = s;
      }
      function copyTmp(x0, y0, x1, y1) {
        for (let y = y0; y <= y1; y++) {
          const a = y * gw + x0, b = y * gw + x1 + 1;
          tH.set(HF.subarray(a, b), a); tR.set(KR.subarray(a, b), a);
          tG.set(KG.subarray(a, b), a); tB.set(KB.subarray(a, b), a);
        }
      }
      // Ajoute de la peinture (la couche du dessus domine : dom > 1)
      function addPaint(i, add, k, dom = 3) {
        const h0 = HF[i];
        if (add > 0) {
          const b = add * dom, s = h0 + b;
          KR[i] = (KR[i] * h0 + k[0] * b) / s;
          KG[i] = (KG[i] * h0 + k[1] * b) / s;
          KB[i] = (KB[i] * h0 + k[2] * b) / s;
        }
        HF[i] = Math.min(4, Math.max(0, h0 + add));
      }
      const bounds = (cx, cy, r) => [Math.max(0, Math.floor(cx - r)), Math.max(0, Math.floor(cy - r)), Math.min(gw - 1, Math.ceil(cx + r)), Math.min(gh - 1, Math.ceil(cy + r))];
      const toGX = (x) => (x - tx) / cell - 0.5, toGY = (y) => (y - ty) / cell - 0.5;

      /* ---------- Couteau : entraîne la pâte, l'aplatit en stries et la repousse en crêtes ---------- */
      function knifeStep(s, cx, cy, dx, dy) {
        const R = knifeR / cell, Bl = R * 0.5;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len, px = -uy, py = ux;
        const [x0, y0, x1, y1] = bounds(cx, cy, R * 1.3 + 2);
        if (x0 > x1 || y0 > y1) return;
        copyTmp(x0, y0, x1, y1);

            const a = rx * ux + ry * uy, b = rx * px + ry * py;

            s.lk[0] = (s.lk[0] * s.load + kr * toLoad) / t; s.lk[1] = (s.lk[1] * s.load + kg * toLoad) / t; s.lk[2] = (s.lk[2] * s.load + kb * toLoad) / t;
            s.load = t;
          }
          const rem = exc - toLoad, col = [kr, kg, kb];
          let sum = 0;
          for (let pass = 0; pass < 2; pass++) {
            for (let y = y0; y <= y1; y++) {
              for (let x = x0; x <= x1; x++) {
                const rx = x - cx, ry = y - cy;
                const a = (rx * ux + ry * uy) / (Bl * 1.5), t = Math.abs(rx * px + ry * py) / R;
                if (t < 0.9 || t > 1.16 || a * a >= 1) continue;
                let rw = 1 - Math.abs(t - 1.02) / 0.14; rw = rw * rw * (1 - a * a);
                if (rw <= 0) continue;
                if (pass === 0) sum += rw;
                else addPaint(y * gw + x, (rem * rw) / sum, col, 1);
              }
            }
            if (sum <= 0) break;
          }
        }
        markDirty(x0, y0, x1, y1);
      }

      /* ---------- Pinceau : dépose sa couleur en traces de poils, se vide, se salit ---------- */
      function brushStep(s, cx, cy, dx, dy) {
        const R = brushR / cell;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len, px = -uy, py = ux;
        const [x0, y0, x1, y1] = bounds(cx, cy, R + 2);
        if (x0 > x1 || y0 > y1) return;
        copyTmp(x0, y0, x1, y1);
        const Ra = Math.max(1.5, R * 0.32);
        const ld = Math.sqrt(Math.max(0, s.load));
        let dep = 0;
        for (let y = y0; y <= y1; y++) {
          for (let x = x0; x <= x1; x++) {
            const rx = x - cx, ry = y - cy;
            const a = rx * ux + ry * uy, b = rx * px + ry * py;
            // pinceau plat : empreinte rectangulaire aux bords à peine adoucis
            const ea = Ra - Math.abs(a), eb = R - Math.abs(b);

            let w = (ea > 1.2 ? 1 : ea / 1.2) * (eb > 1.5 ? 1 : eb / 1.5) * (0.85 + 0.15 * nAt(NS, b * 3 + s.seed));
            const i = y * gw + x;

            }
          }
        }

        markDirty(x0, y0, x1, y1);
      }

      /* ---------- Rouleau : nivelle, laisse un grain de mousse, reporte sa peinture ---------- */
      function rollerStep(s, cx, cy, dx, dy) {
        const L = rollL / cell, Wd = Math.max(1, rollW / cell);
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len, px = -uy, py = ux;
        const [x0, y0, x1, y1] = bounds(cx, cy, L + 3);
        if (x0 > x1 || y0 > y1) return;
        copyTmp(x0, y0, x1, y1);
        let n = 0, sh = 0, sr = 0, sg = 0, sb = 0;
        for (let y = y0; y <= y1; y++) {
          for (let x = x0; x <= x1; x++) {
            const rx = x - cx, ry = y - cy;
            if (Math.abs(rx * ux + ry * uy) > Wd || Math.abs(rx * px + ry * py) > L) continue;
            const i = y * gw + x, h = HF[i];

          }

          s.load -= give;

          mh += give;

          for (let x = x0; x <= x1; x++) {

            blendCell(i, 0.45 * e);
            const foam = (NZ[i] - 0.5) * 0.09 * Math.min(1, mh * 4);
            HF[i] = Math.max(0, U.lerp(HF[i], mh, 0.35 * e) + foam * e);
            const k = 0.22 * e;
            KR[i] += (mr - KR[i]) * k; KG[i] += (mg - KG[i]) * k; KB[i] += (mb - KB[i]) * k;
          }
        }
        // crêtes fines aux deux bouts du rouleau
        markDirty(x0, y0, x1, y1);
      }

      function strokeTo(s, x, y) {
        const gx = toGX(x), gy = toGY(y);
        const dx = gx - s.gx, dy = gy - s.gy;
        const dist = Math.hypot(dx, dy);
        if (dist < 0.01) return;
        const steps = Math.min(120, Math.ceil(dist / 0.7));
        const sx = dx / steps, sy = dy / steps;
        const fn = s.tool === 'knife' ? knifeStep : s.tool === 'brush' ? brushStep : rollerStep;
        for (let k = 1; k <= steps; k++) fn(s, s.gx + sx * k, s.gy + sy * k, sx, sy);
        s.gx = gx; s.gy = gy;
        const ix = U.clamp(Math.round(gx), 0, gw - 1), iy = U.clamp(Math.round(gy), 0, gh - 1);
        s.under = U.lerp(s.under, Math.min(1.5, HF[iy * gw + ix]), 0.3);
      }

      /* ---------- Noix de peinture, tube, éclaboussures ---------- */
      function dropBlob(x, y, col, scale = 1) {
        const r = (blobR * scale * U.rand(0.85, 1.15)) / cell;
        const gx = toGX(x), gy = toGY(y);
        const p1 = Math.random() * TAU, p2 = Math.random() * TAU, p3 = Math.random() * TAU;
        const idx = [], val = [];
        const Rb = r * 1.3;
        for (let yy = Math.max(0, Math.floor(gy - Rb)); yy <= Math.min(gh - 1, Math.ceil(gy + Rb)); yy++) {
          for (let xx = Math.max(0, Math.floor(gx - Rb)); xx <= Math.min(gw - 1, Math.ceil(gx + Rb)); xx++) {
            const dx = xx - gx, dy = yy - gy;
            const a = Math.atan2(dy, dx);
            const rr = Math.hypot(dx, dy) / (r * (1 + 0.12 * Math.sin(3 * a + p1) + 0.07 * Math.sin(5 * a + p2)));
            if (rr >= 1) continue;

            const curl = 0.22 * Math.max(0, Math.sin(a + rr * 10 + p3)) * (1 - rr) * rr * 2;
            idx.push(yy * gw + xx);

          }
        }
        drops.push({ idx, val, col: col.slice(), t: 0, applied: 0, bx: Math.floor(gx - Rb), by: Math.floor(gy - Rb), bx1: Math.ceil(gx + Rb), by1: Math.ceil(gy + Rb) });
        SG.audio.squish(U.rand(0.75, 1.1) / Math.sqrt(scale), 0.65);

        }
      }
      function dab(x, y, rpx, col, amt = 0.5) {
        const gx = toGX(x), gy = toGY(y), r = Math.max(1, rpx / cell);
        const [x0, y0, x1, y1] = bounds(gx, gy, r);
        for (let yy = y0; yy <= y1; yy++) {
          for (let xx = x0; xx <= x1; xx++) {
            const d = Math.hypot(xx - gx, yy - gy) / r;
            if (d < 1) addPaint(yy * gw + xx, amt * (1 - d * d) * (1 - d * d), col);
          }

      }
      // Tube pressé sur place : la pâte s'enroule en tas, ou trace un boudin si on bouge
      function squeezeStep(s, dt) {

        const gx = toGX(x), gy = toGY(y), r = (blobR * 0.26) / cell;

          for (let xx = x0; xx <= x1; xx++) {
            const d2 = ((xx - gx) * (xx - gx) + (yy - gy) * (yy - gy)) / (r * r);
            if (d2 < 1) { const i = yy * gw + xx; addPaint(i, amt * Math.pow(1 - d2, 1.6) * Math.max(0.02, 1 - HF[i] / (1.1 + s.sq * 0.5)), s.col, 4); }
          }
        }

        s.sqT += dt;
        if (s.sqT > 0.16) {
          s.sqT = 0;
          SG.audio.squish(U.rand(1.1, 1.5), 0.3);
          if (Math.random() < 0.5) SG.audio.bubble(U.rand(0.8, 1.3), 0.12);
          SG.haptic(4);
        }
      }
      const inToile = (x, y) => x > tx && x < tx + tw && y > ty && y < ty + th;

      function seedBlobs(delay) {
        const spots = [[0.3, 0.3], [0.68, 0.26], [0.5, 0.52], [0.26, 0.74], [0.72, 0.72]];
        const cols = PALETTE.slice(0, 6).sort(() => Math.random() - 0.5);
        spots.forEach((p, i) => queue.push({ at: delay + i * 0.22, fx: p[0] + U.rand(-0.06, 0.06), fy: p[1] + U.rand(-0.06, 0.06), col: toKS(cols[i]) }));
      }

      /* ---------- Dessin des outils ---------- */
      function line(x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
      function bladePath() {
        ctx.beginPath();
        ctx.moveTo(-32, 0);
        ctx.quadraticCurveTo(-6, -13, 14, -11);
        ctx.quadraticCurveTo(22, -8, 22, 0);
        ctx.quadraticCurveTo(22, 8, 14, 11);
        ctx.quadraticCurveTo(-6, 13, -32, 0);
        ctx.closePath();
      }
      function drawKnife(x, y, ang, pressed, alpha, s) {
        const lift = pressed ? 3 : 10, sc = knifeR / 24;
        ctx.save();

        ctx.lineCap = 'round';

        ctx.strokeStyle = '#c98fb0'; ctx.lineWidth = 12; line(36, 14, 70, 42);
        ctx.strokeStyle = '#f5b9d2'; ctx.lineWidth = 9; line(36, 14, 70, 42);
        ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 2.5; line(38, 12, 66, 36);
        ctx.strokeStyle = '#d9b46a'; ctx.lineWidth = 10; line(30, 8, 37, 14);
        ctx.strokeStyle = '#f7e0a6'; ctx.lineWidth = 3.5; line(30, 6, 36, 11);
        ctx.strokeStyle = '#98a1af'; ctx.lineWidth = 3.4; line(19, 0, 31, 9);

        g.addColorStop(0, '#c4ccd8'); g.addColorStop(0.38, '#f8fafd'); g.addColorStop(1, '#a9b2c0');
