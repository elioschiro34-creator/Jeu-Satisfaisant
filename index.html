          const line = sh.grid[rr];
          if (!line) continue;
          for (let cc = b.col - 1; cc <= b.col + 1; cc++) {
            const o = line[cc];
            if (o && o !== b) fn(o);
          }
        }
      }

      function burst(b, sh, power) {
        const n = b.sup ? 18 : Math.round(6 + power * 6);
        const k = sh.r / 17;
        for (let i = 0; i < n; i++) {
          const a = U.rand(0, TAU), sp = U.rand(40, b.sup ? 230 : 110 + power * 90) * Math.sqrt(k);
          parts.push({
            x: b.x + Math.cos(a) * sh.r * 0.6, y: b.y + Math.sin(a) * sh.r * 0.6,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
            life: 0, max: U.rand(0.25, 0.5) * (b.sup ? 1.8 : 1),
            s: U.rand(1.2, 2.6) * k * (b.sup ? 1.6 : 1),
            c: b.sup ? U.pick(SG.palette.list) : (Math.random() < 0.6 ? '#ffffff' : U.hsl(sh.hue, 70, 82)),
            star: b.sup && Math.random() < 0.6,
          });
        }
        // petit souffle d'air visible : anneau qui s'élargit
        parts.push({ ring: true, x: b.x, y: b.y, r: sh.r, life: 0, max: 0.35 + power * 0.15, power });
        if (parts.length > 500) parts.splice(0, parts.length - 500);
      }

      // power : 0 = tap / glissé, 1 = bulle pressée jusqu'à l'éclatement
      function pop(b, power = 0, quiet = false) {
        const sh = cur;
        if (!sh || b.popped) return;
        b.popped = true; b.popT = 0; b.held = null;
        b.popPower = power;
        sh.left--;
        neighbors(sh, b, (o) => { if (!o.popped) o.wob = Math.max(o.wob, 0.06 + power * 0.06); });
        burst(b, sh, power);
        addWrinkles(b, power > 0.5 ? 3 : U.randInt(1, 2), 0.8 + power * 0.4);
        if (sndQ.length < 8) sndQ.push({ sup: b.sup, power, pitch: b.pitch, quiet });
        const now = performance.now();
        if (b.sup || power > 0.5) { SG.haptic([10, 30, 15]); lastHaptic = now; }
        else if (now - lastHaptic > 35) { SG.haptic(8); lastHaptic = now; }
        updateProg();
        if (sh.left <= 0) {
          SG.celebrate(stage, U.pick(['Tout éclaté !', 'Bravo !', 'Trop satisfaisant !']));
          nextSheetIn = 1.8;
        }
      }

      function playPop(s) {
        const sizeK = 17 / (cur ? cur.r : 17);
        const p = s.pitch * Math.pow(sizeK, 0.45);
        if (s.power > 0.5) {
          // bulle pressée : claquement fort et sec
          A.pop(p * 0.92, U.rand(0.85, 1));
          A.crack(0.22, 1.5 * p);
          A.thud(0.18, 1.4);
        } else {
          A.pop(p * U.rand(0.95, 1.05), (s.quiet ? 0.35 : 1) * U.rand(0.45, 0.75));
        }
        // le film qui se dégonfle et se froisse juste après
        const dl = U.randInt(25, 55);
        later(() => A.crunch(U.rand(0.07, 0.13) * (s.quiet ? 0.6 : 1), U.rand(1.3, 1.7)), dl);
        if (s.sup) {
          A.chime(U.randInt(4, 8), 0.3);
          A.chime(U.randInt(9, 12), 0.18);
        }
      }

      const ready = () => cur && !trans && cur.left > 0;

      // Glissé : on éclate tout ce que le doigt touche
      function sweep(x0, y0, x1, y1) {
        const sh = cur;
        if (!ready()) return 0;
        const len = Math.hypot(x1 - x0, y1 - y0);
        const steps = Math.max(1, Math.ceil(len / (sh.r * 0.5)));
        let n = 0;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const b = hit(sh, U.lerp(x0, x1, t), U.lerp(y0, y1, t));
          if (b && !b.popped && b.held == null) { pop(b, 0); n++; }
        }
        return n;
      }

      // Froisser : toutes les bulles d'une zone éclatent en cascade (du centre vers l'extérieur)
      function crumple(x, y, rad) {
        const sh = cur;
        if (!ready()) return;
        const list = [];
        for (const b of sh.list) {
          if (b.popped || b.queued) continue;
          const d = Math.hypot(b.x - x, b.y - y);
          if (d < rad) list.push([d, b]);
        }
        list.sort((a, b) => a[0] - b[0]);
        const t0 = performance.now();
        list.forEach(([d, b], i) => {
          b.queued = true;
          cascade.push({ b, at: t0 + i * U.rand(18, 34) + d * 0.6 });
        });
        // la feuille se plisse fortement (seulement quand de nouvelles bulles cèdent)
        if (list.length) {
          const near = hit(sh, x, y, 3);
          if (near) addWrinkles(near, Math.min(3, list.length), 1.2);
        }
      }

      function pinchCheck() {
        if (fingers.size < 2 || !ready()) return;
        const [a, b] = [...fingers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (a.pinch0 == null) { a.pinch0 = d; b.pinch0 = d; return; }
        // les deux doigts se rapprochent (ou tordent) : la feuille se froisse entre eux
        const ang = Math.atan2(b.y - a.y, b.x - a.x);
        if (a.ang0 == null) a.ang0 = ang;
        let twist = Math.abs(ang - a.ang0); if (twist > Math.PI) twist = TAU - twist;
        if (a.pinch0 - d > 25 || twist > 0.35) {
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          crumple(mx, my, Math.max(cur.r * 3, d * 0.6 + cur.r * 2));
          a.pinch0 = d; b.pinch0 = d; a.ang0 = ang;
          A.rustle(0.35, 0.35);
          crinkleLv = 1;
        }
      }

      const ptr = SG.pointer(cv.canvas, {
        down(p) {
          if (!crinkleL) crinkleL = A.loop('peel');
          const f = { id: p.id, x: p.x, y: p.y, x0: p.x, y0: p.y, t0: performance.now(), b: null, moved: 0, crum: crumpleMode ? 0 : -1 };
          fingers.set(p.id, f);
          // reset du suivi de pincement
          fingers.forEach((o) => { o.pinch0 = null; o.ang0 = null; });
          if (!ready()) return;
          if (crumpleMode) { A.rustle(0.25, 0.25); return; }
          const b = hit(cur, p.x, p.y);
          if (b && !b.popped && b.held == null) {
            // le doigt se pose : la bulle commence à s'écraser
            b.held = p.id; f.b = b;
            A.rustle(0.05, 0.06);
          } else if (b && b.popped) {
            // tapoter du film déjà éclaté : petit froissement
            A.crunch(U.rand(0.12, 0.18), U.rand(1.2, 1.5));
            A.rustle(0.08, 0.12);
            addWrinkles(b, 1, 0.6);
          }
        },
        move(p) {
          const f = fingers.get(p.id);
          if (!f) return;
          const px0 = f.x, py0 = f.y;
          f.x = p.x; f.y = p.y;
          f.moved = Math.max(f.moved, Math.hypot(p.x - f.x0, p.y - f.y0));
          if (!ready()) return;
          if (f.crum >= 0) return; // froissage : géré dans la boucle
          if (fingers.size >= 2) { pinchCheck(); return; }
          // on glisse : la bulle tenue éclate, puis tout le chemin
          if (f.b && !f.b.popped && (f.moved > 7 || Math.hypot(p.x - f.b.x, p.y - f.b.y) > cur.r)) {
            const b = f.b; f.b = null; b.held = null;
            pop(b, Math.min(0.4, b.sq));
          }
          sweep(px0, py0, p.x, p.y);
          // manipuler le film déjà éclaté : il crisse
          const hb = hit(cur, p.x, p.y);
          if (hb && hb.popped) crinkleLv = Math.max(crinkleLv, U.clamp(p.speed * 0.6, 0, 0.7));
        },
        up(p) {
          const f = fingers.get(p.id);
          if (!f) return;
          fingers.delete(p.id);
          if (f.b && !f.b.popped) {
            const b = f.b; b.held = null;
            // tap : la bulle éclate (plus fort si elle était déjà bien écrasée)
            if (ready()) pop(b, b.sq > 0.6 ? 0.6 : 0);
          }
        },
        hover(p) {
          if (!ready()) return;
          const b = hit(cur, p.x, p.y);
          if (b && !b.popped) b.wob = Math.max(b.wob, 0.03);
        },
      });

      /* ---------- Rendu ---------- */
      function drawSheet(sh, dt, t, live) {
        ctx.drawImage(sh.bg, 0, 0, cv.w, cv.h);
        const list = sh.list;
        // plis vivants autour d'une bulle qu'on presse (le film est tiré)
        const top = [];
        // ombres d'abord (toutes sous les bulles : pas de chevauchement disgracieux)
        for (let i = 0; i < list.length; i++) {
          const b = list[i];
          if (b.popped) continue;
          const spr = sh.sprSh, hh = spr.half * (1 + b.sq * 0.25);
          ctx.globalAlpha = 1 - b.sq * 0.3;
          ctx.drawImage(spr, b.x + b.ox - hh + b.sq * 2, b.y + b.oy - hh + b.sq * 3, hh * 2, hh * 2);
        }
        ctx.globalAlpha = 1;
        for (let i = 0; i < list.length; i++) {
          const b = list[i];
          if (!b.popped) {
            b.wob *= Math.exp(-dt * 5);
            if (b.sq > 0.02 || b.held != null) { top.push(b); continue; }
            const s = 1 + 0.014 * Math.sin(t * 1.7 + b.ph) + b.wob * Math.sin(t * 34 + b.ph);
            const spr = b.sup ? sh.sprSup : sh.spr;
            const hh = spr.half * s;
            ctx.drawImage(spr, b.x + b.ox - hh, b.y + b.oy - hh, hh * 2, hh * 2);
            if (b.sup) {
              ctx.fillStyle = '#ffffff';
              star(ctx, b.x + sh.r * 0.42, b.y - sh.r * 0.45, sh.r * 0.3 * (0.6 + 0.4 * Math.sin(t * 4 + b.ph)), 0.9);
            }
          } else {
            b.popT += dt;
            const spr = sh.sprPop[b.v];
            const hh = spr.half;
            ctx.drawImage(spr, b.x - hh, b.y - hh, hh * 2, hh * 2);
            const pw = b.popPower || 0;
            if (b.popT < 0.16) {
              // la bulle se dégonfle : elle s'aplatit, se ride, puis disparaît
              const k = b.popT / 0.16;
              const ip = b.sup ? sh.sprSup : sh.spr;
              const sx = ip.half * (1.08 + 0.15 * k + pw * 0.15), sy = ip.half * (1 - 0.7 * k);
              ctx.globalAlpha = 1 - k;
              ctx.save();
              ctx.translate(b.x, b.y);
              ctx.rotate(Math.sin(b.ph * 3) * 0.4);
              ctx.drawImage(ip, -sx, -sy, sx * 2, sy * 2);
              ctx.restore();
              ctx.globalAlpha = 1;
            }
          }
        }
        // bulles pressées : dessinées au-dessus des voisines
        for (const b of top) {
          const q = b.sq;
          const spr = b.sup ? sh.sprSup : sh.spr;
          // la bulle s'écrase et gonfle sur les côtés ; elle tremble juste avant de céder
          const tremble = q > 0.75 ? Math.sin(t * 90 + b.ph) * (q - 0.75) * 0.08 : 0;
          const sx = spr.half * (1 + q * 0.32 + tremble), sy = spr.half * (1 + q * 0.32 - tremble);
          ctx.drawImage(spr, b.x + b.ox - sx, b.y + b.oy - sy, sx * 2, sy * 2);
          // le plastique tendu devient plus brillant
          if (q > 0.05) {
            ctx.strokeStyle = `rgba(255,255,255,${(0.6 * q).toFixed(3)})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(b.x + b.ox, b.y + b.oy, sh.r * (0.92 + q * 0.28), 0, TAU); ctx.stroke();
            // creux du doigt au centre
            const gr = ctx.createRadialGradient(b.x + b.ox, b.y + b.oy, 0, b.x + b.ox, b.y + b.oy, sh.r * 0.7);
            gr.addColorStop(0, U.hsl(sh.hue, 40, 60, 0.22 * q));
            gr.addColorStop(1, U.hsl(sh.hue, 40, 60, 0));
            ctx.fillStyle = gr;
            ctx.beginPath(); ctx.arc(b.x + b.ox, b.y + b.oy, sh.r * 0.7, 0, TAU); ctx.fill();
            // plis du film tiré tout autour
            ctx.strokeStyle = `rgba(255,255,255,${(0.45 * q).toFixed(3)})`;
            ctx.lineWidth = 1;
            for (let k = 0; k < 6; k++) {
              const a = b.ph + (k * TAU) / 6;
              const r0 = sh.r * (1.15 + q * 0.3), r1 = r0 + sh.r * (0.5 + 0.6 * q);
              ctx.beginPath();
              ctx.moveTo(b.x + Math.cos(a) * r0, b.y + Math.sin(a) * r0);
              ctx.lineTo(b.x + Math.cos(a + 0.15) * r1, b.y + Math.sin(a + 0.15) * r1);
              ctx.stroke();
            }
          }
        }
      }

      function drawRoll(x, rem, hue, h) {
        if (rem <= 0.01) return;
        const D = 14 + 30 * rem, y0 = 6, y1 = h - 6;
        const x0 = x - D * 0.5;
        let lg = ctx.createLinearGradient(x + D * 0.4, 0, x + D * 0.4 + 24, 0);
        lg.addColorStop(0, 'rgba(90,60,110,0.2)');
        lg.addColorStop(1, 'rgba(90,60,110,0)');
        ctx.fillStyle = lg;
        ctx.fillRect(x + D * 0.4, y0 + 8, 24, y1 - y0 - 8);
        lg = ctx.createLinearGradient(x0, 0, x0 + D, 0);
        lg.addColorStop(0, U.hsl(hue, 40, 76));
        lg.addColorStop(0.3, U.hsl(hue, 70, 93));
        lg.addColorStop(0.42, '#ffffff');
        lg.addColorStop(0.7, U.hsl(hue, 55, 86));
        lg.addColorStop(1, U.hsl(hue, 40, 70));
        ctx.fillStyle = lg;
        rrect(ctx, x0, y0, D, y1 - y0, D / 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        for (let y = y0 + D * 0.5; y < y1 - D * 0.5; y += 16) {
          ctx.beginPath(); ctx.ellipse(x - D * 0.1, y, D * 0.13, 5, 0, 0, TAU); ctx.fill();
        }
        ctx.strokeStyle = U.hsl(hue, 40, 65, 0.4);
        ctx.lineWidth = 1;
        rrect(ctx, x0, y0, D, y1 - y0, D / 2);
        ctx.stroke();
      }

      const loop = SG.loop((dt, t) => {
        const w = cv.w, h = cv.h;
        const now = performance.now();
        ctx.clearRect(0, 0, w, h);

        // bulles pressées : la pression monte jusqu'à l'éclatement
        let creak = 0;
        if (cur && ready()) {
          for (const f of fingers.values()) {
            const b = f.b;
            if (f.crum >= 0) {
              // outil Froisser : la zone froissée grandit tant qu'on appuie
              f.crum = Math.min(1, f.crum + dt / 1.3);
              const rad = cur.r * (1.5 + f.crum * 6);
              crumple(f.x, f.y, rad);
              creak = Math.max(creak, 0.4 + f.crum * 0.5);
              continue;
            }
            if (!b || b.popped) continue;
            const holdT = (now - f.t0) / 1000;
            b.sq = Math.min(1, Math.max(0, holdT - 0.06) / b.tough);
            creak = Math.max(creak, b.sq * 0.55);
            // les voisines sont un peu tirées vers le doigt
            neighbors(cur, b, (o) => {
              if (o.popped) return;
              const dx = b.x - o.x, dy = b.y - o.y, dl = Math.hypot(dx, dy) || 1;
              o.ox = (dx / dl) * b.sq * cur.r * 0.08; o.oy = (dy / dl) * b.sq * cur.r * 0.08;
            });
            if (b.sq >= 1) {
              f.b = null;
              neighbors(cur, b, (o) => { o.wob = Math.max(o.wob, 0.15); });
              pop(b, 1);
            }
          }
        }
        if (cur) {
          for (const b of cur.list) {
            if (b.held == null && b.sq > 0) b.sq = Math.max(0, b.sq - dt * 5);
            if (b.held == null || b.popped) { b.ox *= Math.exp(-dt * 12); b.oy *= Math.exp(-dt * 12); }
          }
        }
        // cascade de froissage
        for (let i = cascade.length - 1; i >= 0; i--) {
          const c = cascade[i];
          if (now >= c.at) {
            cascade.splice(i, 1);
            c.b.queued = false;
            if (cur && cur.list.includes(c.b) && !c.b.popped && ready()) pop(c.b, 0.2, true);
          }
        }
        crinkleLv = Math.max(crinkleLv * Math.exp(-dt * 6), creak, cascade.length ? 0.6 : 0);
        if (crinkleL) crinkleL.set(crinkleLv, 0.35 + creak * 0.4);

        // Sons étalés dans le temps pour les grands glissés
        let ns = sndQ.length > 3 ? 2 : 1;
        while (ns-- > 0 && sndQ.length) playPop(sndQ.shift());

        if (trans) {
          trans.t = Math.min(1, trans.t + dt / 1.15);
          const e = easeInOut(trans.t);
          const rx = w * (1 - e);
          if (trans.old) {
            ctx.save(); ctx.translate(rx - w, 0); drawSheet(trans.old, dt, t); ctx.restore();
          }
          ctx.save();
          ctx.beginPath(); ctx.rect(rx, 0, w - rx + 2, h); ctx.clip();
          drawSheet(cur, dt, t);
          ctx.restore();
          drawRoll(rx, 1 - e, cur.hue, h);
          const sp = Math.sin(Math.PI * trans.t);
          if (rollSnd) rollSnd.set(sp * 0.8, 0.3 + sp * 0.4);
          if (trans.t >= 1) {
            trans = null;
            if (rollSnd) { rollSnd.stop(); rollSnd = null; }
            A.thud(0.25, 1.4);
            A.rustle(0.15, 0.2);
            SG.haptic(10);
          }
        } else if (cur) {
          drawSheet(cur, dt, t);
        }

        // Particules (au-dessus de tout)
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i];
          p.life += dt;
          if (p.life >= p.max) { parts.splice(i, 1); continue; }
          const a = 1 - p.life / p.max;
          if (p.ring) {
            const k = p.life / p.max;
            ctx.strokeStyle = `rgba(255,255,255,${(0.75 * (1 - k)).toFixed(3)})`;
            ctx.lineWidth = (2.5 + p.power * 2) * (1 - k) + 0.5;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.9 + k * (0.7 + p.power * 0.9)), 0, TAU); ctx.stroke();
            continue;
          }
          const damp = Math.exp(-dt * 6);
          p.vx *= damp; p.vy = p.vy * damp + 60 * dt;
          p.x += p.vx * dt; p.y += p.vy * dt;
          ctx.fillStyle = p.c;
          if (p.star) star(ctx, p.x, p.y, p.s * 2, a);
          else {
            ctx.globalAlpha = a;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (0.5 + a * 0.5), 0, TAU); ctx.fill();
            ctx.globalAlpha = 1;
          }
        }

        if (nextSheetIn > 0) {
          nextSheetIn -= dt;
          if (nextSheetIn <= 0) newSheet();
        }
      });

      cv.onResize(() => {
        if (cur) layoutSheet(cur, false);
        if (trans && trans.old) layoutSheet(trans.old, false);
        updateProg();
      });

      const setSize = (s) => { if (size !== s) { size = s; newSheet(); } };
      SG.toolbar(stage, [
        { icon: '🔄', label: 'Nouvelle', onClick: () => newSheet() },
        { label: 'Petites', group: 'size', active: true, onClick: () => setSize('s') },
        { label: 'Moyennes', group: 'size', onClick: () => setSize('m') },
        { label: 'Grosses', group: 'size', onClick: () => setSize('l') },
        { icon: '✊', label: 'Froisser', onClick: (b) => { crumpleMode = !crumpleMode; b.classList.toggle('active', crumpleMode); A.rustle(0.2, 0.25); } },
      ]);
      SG.hint(stage, 'Touche, presse longtemps, glisse… ou froisse à deux doigts');

      newSheet();
      // la barre d'outils réduit la place : on recale la feuille une fois affichée
      timers.push(setTimeout(() => { if (cur) { layoutSheet(cur, false); updateProg(); } }, 60));

      return {
        destroy() {
          loop.stop();
          ptr.destroy();
          timers.forEach(clearTimeout);
          if (rollSnd) rollSnd.stop();
          if (crinkleL) crinkleL.stop();
          cv.destroy();
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/popit.js */
/* Pop-it — enfonce les dômes de silicone (appui lent : ils s'écrasent puis basculent d'un coup),
   retourne-le d'une pichenette pour recommencer de l'autre côté. Formes et couleurs au choix. */
(function () {
  'use strict';
  const U = SG.util;
  const TAU = Math.PI * 2;
  const LEVELS = 12; // états intermédiaires du dôme (de creux à bombé)

  // Palettes (teintes du haut vers le bas) + saturation / luminosité de base
  const PALETTES = [
    { name: 'Arc-en-ciel', hues: [-10, 18, 45, 95, 160, 200, 235, 275, 310], s: 78, l: 74 },
    { name: 'Bonbon', hues: [335, 315, 290, 265, 230, 200], s: 80, l: 79 },
    { name: 'Menthe', hues: [190, 170, 150, 120, 85, 55], s: 66, l: 74 },
    { name: 'Coucher', hues: [275, 320, 345, 10, 25, 40], s: 85, l: 74 },
    { name: 'Lavande', hues: [262, 270, 262], s: 70, l: 77 },
    { name: 'Pêche', hues: [18, 22, 28, 22], s: 92, l: 77 },
  ];
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOutBack = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  function sprite(half, dpr, draw) {
    const c = document.createElement('canvas');
    c.width = c.height = Math.max(2, Math.ceil(half * 2 * dpr));
    const g = c.getContext('2d');
    g.scale(c.width / (half * 2), c.height / (half * 2));
    g.translate(half, half);
    draw(g);
    c.half = half;
    return c;
  }

  // Contour brut d'une forme
  function shapePoly(kind) {
    if (kind === 'star') {
      // étoile à 5 branches aux pointes arrondies (lissage de Chaikin)
      let p = [];
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 5, r = i % 2 ? 0.5 : 1.08;
        p.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      for (let it = 0; it < 3; it++) {
        const q = [];
        for (let i = 0; i < p.length; i++) {
          const a = p[i], b = p[(i + 1) % p.length];
          q.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
        }
        p = q;
      }
      return p;
    }
    const pts = [], n = 160;
    for (let i = 0; i < n; i++) {
      const t = (i / n) * TAU;
      if (kind === 'heart') {
        const s = Math.sin(t);
        pts.push([16 * s * s * s, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]);
      } else {
        const e = kind === 'square' ? 2 / 6 : 1;
        const c = Math.cos(t), s = Math.sin(t);
        pts.push([Math.sign(c) * Math.pow(Math.abs(c), e), Math.sign(s) * Math.pow(Math.abs(s), e)]);
      }
    }
    return pts;
  }

  function inPoly(poly, x, y) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a[1] > y) !== (b[1] > y) && x < ((b[0] - a[0]) * (y - a[1])) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }

  /* Dôme de silicone. d = +1 bombé, 0 aplati, -1 creux (retourné). Lumière en haut à gauche. */
  function drawDome(g, R, pal, hue, d) {
    const S = pal.s, L = pal.l;
    const h = Math.abs(d);
    // Gorge souple autour du dôme (le pli de la membrane)
    let gr = g.createRadialGradient(0, 0, R * 0.88, 0, 0, R * 1.22);
    gr.addColorStop(0, U.hsl(hue, S - 10, L - 20, 0.45));
    gr.addColorStop(0.45, U.hsl(hue, S - 10, L - 12, 0.18));
    gr.addColorStop(1, U.hsl(hue, S, L, 0));
    g.fillStyle = gr;
    g.beginPath(); g.arc(0, 0, R * 1.22, 0, TAU); g.fill();
    // fine lèvre éclairée côté lumière, ombrée côté opposé
    g.lineWidth = R * 0.07;
    g.strokeStyle = U.hsl(hue, S, Math.min(97, L + 18), 0.75);
    g.beginPath(); g.arc(0, 0, R * 1.06, 0.95 * Math.PI, 1.75 * Math.PI); g.stroke();
    g.strokeStyle = U.hsl(hue, S - 15, L - 22, 0.35);
    g.beginPath(); g.arc(0, 0, R * 1.06, -0.1 * Math.PI, 0.7 * Math.PI); g.stroke();

    if (d >= 0) {
      // ---- bombé ----
      // ombre portée douce, d'autant plus longue que le dôme est haut
      gr = g.createRadialGradient(R * 0.16 * h, R * 0.24 * h, R * 0.55, R * 0.16 * h, R * 0.24 * h, R * (1.0 + 0.2 * h));
      gr.addColorStop(0, `rgba(80,30,80,${(0.3 * h).toFixed(3)})`);
      gr.addColorStop(1, 'rgba(80,30,80,0)');
      g.fillStyle = gr;
      g.beginPath(); g.arc(R * 0.16 * h, R * 0.24 * h, R * 1.2, 0, TAU); g.fill();
      // corps
      gr = g.createRadialGradient(-R * 0.38 * h, -R * 0.42 * h, R * 0.05, -R * 0.08 * h, -R * 0.1 * h, R * 1.1);
      gr.addColorStop(0, U.hsl(hue, S + 10, Math.min(96, L + 18 * h + 4)));
      gr.addColorStop(0.5, U.hsl(hue, S + 5, L + 4 * h));
      gr.addColorStop(1, U.hsl(hue, S - 5, L - 14 * h - 2));
      g.fillStyle = gr;
      g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
      // lumière qui traverse le silicone (diffusion interne) côté ombre
      gr = g.createRadialGradient(R * 0.42, R * 0.5, 0, R * 0.42, R * 0.5, R * 0.75);
      gr.addColorStop(0, U.hsl(hue, 100, Math.min(92, L + 12), 0.55 * h));
      gr.addColorStop(1, U.hsl(hue, 100, L + 10, 0));
      g.fillStyle = gr;
      g.beginPath(); g.arc(0, 0, R * 0.98, 0, TAU); g.fill();
      // reflet satiné
      if (h > 0.05) {
        g.save();
        g.translate(-R * 0.34 * h, -R * 0.4 * h);
        g.rotate(-0.65);
        g.scale(1, 0.62);
        const hr = R * (0.28 + 0.2 * h);
        gr = g.createRadialGradient(0, 0, 0, 0, 0, hr);
        gr.addColorStop(0, `rgba(255,255,255,${(0.85 * h).toFixed(3)})`);
        gr.addColorStop(0.5, `rgba(255,255,255,${(0.35 * h).toFixed(3)})`);
        gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr;
        g.beginPath(); g.arc(0, 0, hr, 0, TAU); g.fill();
        g.restore();
        // contre-reflet discret
        g.lineCap = 'round';
        g.lineWidth = R * 0.08;
        g.strokeStyle = `rgba(255,255,255,${(0.28 * h).toFixed(3)})`;
        g.beginPath(); g.arc(0, 0, R * 0.78, 0.15 * Math.PI, 0.45 * Math.PI); g.stroke();
      }
    } else {
      // ---- creux ----
      // fond de la cuvette : la paroi du haut est dans l'ombre, celle du bas prend la lumière
      const lg = g.createLinearGradient(-R * 0.75, -R * 0.85, R * 0.75, R * 0.85);
      lg.addColorStop(0, U.hsl(hue, S - 8, L - 26 * h));
      lg.addColorStop(0.45, U.hsl(hue, S, L - 9 * h));
      lg.addColorStop(1, U.hsl(hue, S + 10, Math.min(95, L + 13 * h)));
      g.fillStyle = lg;
      g.beginPath(); g.arc(0, 0, R * 0.98, 0, TAU); g.fill();
      // fond de cuvette plus profond au centre
      gr = g.createRadialGradient(R * 0.06, R * 0.08, 0, R * 0.06, R * 0.08, R * 0.6);
      gr.addColorStop(0, U.hsl(hue, S, L - 14 * h, 0.55));
      gr.addColorStop(1, U.hsl(hue, S, L - 14 * h, 0));
      g.fillStyle = gr;
      g.beginPath(); g.arc(0, 0, R * 0.9, 0, TAU); g.fill();
      // ombre de la lèvre projetée dans le creux (en haut à gauche)
      g.save();
      g.beginPath(); g.arc(0, 0, R * 0.98, 0, TAU); g.clip();
      gr = g.createRadialGradient(R * 0.22 * h, R * 0.28 * h, R * 0.7, R * 0.22 * h, R * 0.28 * h, R * 1.25);
      gr.addColorStop(0, 'rgba(60,20,60,0)');
      gr.addColorStop(1, `rgba(60,20,60,${(0.42 * h).toFixed(3)})`);
      g.fillStyle = gr;
      g.fillRect(-R * 1.3, -R * 1.3, R * 2.6, R * 2.6);
      // la membrane fine au fond laisse passer la lumière
      gr = g.createRadialGradient(R * 0.2, R * 0.25, 0, R * 0.2, R * 0.25, R * 0.55);
      gr.addColorStop(0, U.hsl(hue, 100, Math.min(93, L + 14), 0.4 * h));
      gr.addColorStop(1, U.hsl(hue, 100, L + 10, 0));
      g.fillStyle = gr;
      g.fillRect(-R, -R, R * 2, R * 2);
      g.restore();
      // reflet sur la paroi éclairée (en bas à droite), en croissant
      g.lineCap = 'round';
      g.lineWidth = R * 0.11;
      g.strokeStyle = `rgba(255,255,255,${(0.55 * h).toFixed(3)})`;
      g.beginPath(); g.arc(0, 0, R * 0.74, 0.1 * Math.PI, 0.42 * Math.PI); g.stroke();
      g.lineWidth = R * 0.05;
      g.strokeStyle = `rgba(255,255,255,${(0.8 * h).toFixed(3)})`;
      g.beginPath(); g.arc(0, 0, R * 0.74, 0.2 * Math.PI, 0.32 * Math.PI); g.stroke();
      // arête nette du bord, côté opposé à la lumière
      g.lineWidth = R * 0.05;
      g.strokeStyle = U.hsl(hue, S + 5, Math.min(96, L + 16), 0.9 * h);
      g.beginPath(); g.arc(0, 0, R * 0.97, 1.05 * Math.PI, 1.65 * Math.PI); g.stroke();
    }
  }

  SG.registerGame({
    id: 'popit',
    title: 'Pop-it',
    emoji: '🟣',
    desc: 'Enfonce les bulles de silicone, retourne-le d’une pichenette.',
    color: '#d6c4ff',
    bg: 'linear-gradient(165deg, #fff3f8 0%, #f1ecff 100%)',
    order: 8,
    create(stage) {
      const cv = SG.makeCanvas(stage);
      const ctx = cv.ctx;
      const A = SG.audio;
      let shape = 'heart', palIdx = 0;
      let poly = [], domes = [], spr = [];
      let cx = 0, cy = 0, S = 100, domeR = 10, nRows = 1;
      let flip = null, pendingFlip = 0, appT = 1, side = 0;
      const slab = document.createElement('canvas');
      const ripples = [];
      const fingers = new Map();
      let rubL = null, rubLv = 0;
      const timers = [];

      const pal = () => PALETTES[palIdx];
      const hueAt = (t) => {
        const H = pal().hues;
        t = U.clamp(t, 0, 1) * (H.length - 1);
        const i = Math.min(H.length - 2, Math.floor(t));
        return (U.lerp(H[i], H[i + 1], t - i) + 360) % 360;
      };

      const prog = SG.progress(stage, 'Pop');
      const progLabel = prog.el.querySelector('.pl');
      const updateProg = () => {
        const n = domes.filter((d) => d.down).length;
        prog.set(domes.length ? n / domes.length : 0);
        progLabel.textContent = n + ' / ' + domes.length;
      };

      function fits(x, y, rr) {
        if (!inPoly(poly, x, y)) return false;
        for (let k = 0; k < 12; k++) {
          const a = (k / 12) * TAU;
          if (!inPoly(poly, x + Math.cos(a) * rr, y + Math.sin(a) * rr)) return false;
        }
        return true;
      }

      /* ---------- Mise en place ---------- */
      function layout(keep) {
        const { w, h } = cv;
        const bar = stage.querySelector('.sg-toolbar');
        let bot = h - 84;
        if (bar) {
          const br = bar.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          if (br.height) bot = Math.min(bot, br.top - sr.top - 14);
        }
        const top = 62;
        S = Math.max(120, Math.min(w - 28, bot - top - 16, 560));
        cx = w / 2; cy = (top + bot) / 2;
        const raw = shapePoly(shape);
        let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
        raw.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
        const k = S / Math.max(x1 - x0, y1 - y0);
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
        poly = raw.map(([x, y]) => [cx + (x - mx) * k, cy + (y - my) * k]);
        const cell = S / (shape === 'heart' || shape === 'star' ? 7.4 : 7);
        domeR = cell * 0.4;
        let best = [];
        [0, 0.5].forEach((ox) => {
          [0, 0.25, 0.5, 0.75].forEach((oy) => {
            const list = [];
            for (let j = -7; j <= 7; j++) {
              for (let i = -7; i <= 7; i++) {
                const x = cx + (i + ox) * cell, y = cy + (j + oy) * cell;
                if (fits(x, y, domeR * 1.35)) list.push({ x, y, j, i });
              }
            }
            if (list.length > best.length) best = list;
          });
        });
        const rowsY = [...new Set(best.map((d) => d.j))].sort((a, b) => a - b);
        nRows = Math.max(1, rowsY.length);
        const old = domes;
        const same = keep && old.length === best.length;
        domes = best.map((d, i) => {
          const row = rowsY.indexOf(d.j);
          const o = same ? old[i] : null;
          return {
            x: d.x, y: d.y, row,
            down: o ? o.down : false,
            v: o ? o.v : 1,       // forme affichée (-1 creux … +1 bombé)
            vel: 0,
            press: 0,              // force du doigt (0..1)
            held: null,            // id du doigt qui appuie
            wob: 0, ph: U.rand(0, TAU),
          };
        });
        buildSprites();
        buildSlab();
        updateProg();
      }

      function buildSprites() {
        spr = [];
        const p = pal();
        for (let r = 0; r < nRows; r++) {
          const hue = hueAt(nRows > 1 ? r / (nRows - 1) : 0.5);
          const lv = [];
          for (let k = 0; k <= LEVELS; k++) {
            const d = -1 + (2 * k) / LEVELS;
            lv.push(sprite(domeR * 1.3, cv.dpr, (g) => drawDome(g, domeR, p, hue, d)));
          }
          spr.push(lv);
        }
      }

      function tracePoly(g, ox, oy) {
        g.beginPath();
        poly.forEach(([x, y], i) => (i ? g.lineTo(x + ox, y + oy) : g.moveTo(x + ox, y + oy)));
        g.closePath();
      }

      // Plaque de silicone (mise en cache) : épaisseur, matière mate, lumière diffuse dans la masse
      function buildSlab() {
        const { w, h, dpr } = cv;
        const p = pal();
        slab.width = Math.round(w * dpr); slab.height = Math.round(h * dpr);
        const g = slab.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, w, h);
        let ty0 = Infinity, ty1 = -Infinity;
        poly.forEach(([, y]) => { ty0 = Math.min(ty0, y); ty1 = Math.max(ty1, y); });
        const grad = (dl, ds, a = 1) => {
          const lg = g.createLinearGradient(0, ty0, 0, ty1);
          const n = Math.max(2, nRows);
          for (let r = 0; r < n; r++) {
            const t = r / (n - 1);
            lg.addColorStop(t, U.hsl(hueAt(t), p.s + ds, p.l + dl, a));
          }
          return lg;
        };
        const th = Math.max(5, S * 0.022);
        // Ombre portée large et douce + ombre de contact
        g.save();
        g.shadowColor = 'rgba(120,70,130,0.28)';
        g.shadowBlur = 30 * dpr; g.shadowOffsetY = 16 * dpr;
        tracePoly(g, 0, th);
        g.fillStyle = grad(-16, -15);
        g.fill();
        g.restore();
        g.save();
        g.shadowColor = 'rgba(90,40,100,0.35)';
        g.shadowBlur = 6 * dpr; g.shadowOffsetY = 3 * dpr;
        tracePoly(g, 0, th);
        g.fillStyle = grad(-16, -15);
        g.fill();
        g.restore();
        // Tranche (épaisseur) translucide : plus saturée
        tracePoly(g, 0, th * 0.5);
        g.fillStyle = grad(-8, 10);
        g.fill();
        // Face
        tracePoly(g, 0, 0);
        g.fillStyle = grad(2, 0);
        g.fill();
        g.save();
        tracePoly(g, 0, 0);
        g.clip();
        // bords : bourrelet arrondi (lumière en haut-gauche, ombre en bas-droite)
        tracePoly(g, 3, 4);
        g.lineWidth = 12; g.strokeStyle = 'rgba(255,255,255,0.45)'; g.stroke();
        tracePoly(g, -3, -4);
        g.lineWidth = 12; g.strokeStyle = 'rgba(90,40,90,0.13)'; g.stroke();
        // lumière diffusée dans le silicone près des bords (sous-surface)
        g.save();
        g.shadowColor = U.hsl(hueAt(0.5), 100, 85, 0.9);
        g.shadowBlur = 18 * dpr;
        tracePoly(g, 0, 0);
        g.lineWidth = 6; g.strokeStyle = grad(10, 25, 0.6); g.stroke();
        g.restore();
        // satiné général
        const rg = g.createRadialGradient(cx - S * 0.3, cy - S * 0.35, 0, cx - S * 0.3, cy - S * 0.35, S * 0.95);
        rg.addColorStop(0, 'rgba(255,255,255,0.3)');
        rg.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = rg;
        g.fillRect(0, 0, w, h);
        // grain mat du silicone
        const R = (() => { let s = 12345; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); })();
        const area = S * S;
        for (let i = 0; i < area / 22; i++) {
          const x = cx - S / 2 + R() * S, y = cy - S / 2 + R() * S;
          g.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.10)' : 'rgba(90,40,90,0.05)';
          g.fillRect(x, y, 1, 1);
        }
        g.restore();
        // liseré fin
        tracePoly(g, 0, 0);
        g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,0.75)'; g.stroke();
      }

      /* ---------- Sons ---------- */
      function snapSound(d, reverse) {
        const sizeK = U.clamp(14 / domeR, 0.6, 1.6);
        const rowK = 1 + ((nRows - 1 - d.row) / Math.max(1, nRows - 1)) * 0.12;
        const p = sizeK * rowK * U.rand(0.92, 1.08) * (side ? 0.94 : 1) * (reverse ? 0.82 : 1);
        A.plop(p, U.rand(0.55, 0.72));
        // le silicone qui claque contre l'air + petit choc mat du doigt
        A.pop(0.42 * p, U.rand(0.18, 0.28));
        A.thud(U.rand(0.12, 0.2), 1.3 * p);
        if (Math.random() < 0.35) A.squish(U.rand(1.5, 1.9), 0.07);
      }

      /* ---------- Actions ---------- */
      function snap(d, reverse) {
        d.down = !d.down;
        d.press = 0;
        // basculement : vitesse initiale forte, léger dépassement
        d.vel = (d.down ? -1 : 1) * 14;
        snapSound(d, reverse);
        SG.haptic(reverse ? 8 : 12);
        ripples.push({ x: d.x, y: d.y, t: 0 });
        if (ripples.length > 30) ripples.shift();
        // les voisins frémissent
        for (const o of domes) {
          if (o === d) continue;
          const dd = Math.hypot(o.x - d.x, o.y - d.y);
          if (dd < domeR * 3.2) o.wob = Math.max(o.wob, 0.12 * (1 - dd / (domeR * 3.2)));
        }
        updateProg();
        if (domes.every((x) => x.down) && !flip && !pendingFlip) {
          SG.celebrate(stage, U.pick(['Bravo !', 'Tout poppé !', 'Plop plop !']));
          pendingFlip = 1.2;
        }
      }

      function domeAt(x, y, k = 1.1) {
        const r2 = (domeR * k) * (domeR * k);
        let best = null, bd = r2;
        for (let i = 0; i < domes.length; i++) {
          const d = domes[i];
          const dx = x - d.x, dy = y - d.y, dd = dx * dx + dy * dy;
          if (dd < bd) { bd = dd; best = d; }
        }
        return best;
      }

      const busy = () => !!flip || appT < 0.5;

      // glissé rapide : on écrase tout sur le passage
      function sweep(f, x0, y0, x1, y1) {
        if (busy()) return;
        const len = Math.hypot(x1 - x0, y1 - y0);
        const steps = Math.max(1, Math.ceil(len / (domeR * 0.5)));
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const d = domeAt(U.lerp(x0, x1, t), U.lerp(y0, y1, t), 0.95);
          if (!d || d === f.dome) continue;
          // on quitte le dôme précédent
          if (f.dome && f.dome.held === f.id) { f.dome.held = null; }
          f.dome = d;
          if (!d.down) {
            d.held = f.id; f.t0 = performance.now();
            if (f.speed > 0.15) { snap(d); d.held = null; } // passage : clac immédiat
          }
        }
      }

      function startFlip(axis = 'x', dir = 1) {
        if (flip) return;
        pendingFlip = 0;
        domes.forEach((d) => { d.held = null; d.press = 0; });
        flip = { t: 0, toggled: false, axis, dir };
        A.whoosh(0.35, 0.45, true);
        A.rustle(0.12, 0.2);
        SG.haptic(15);
      }

      function setShape(s) {
        if (s === shape) return;
        shape = s;
        flip = null; pendingFlip = 0; side = 0;
        layout(false);
        appT = 0;
        A.thud(0.4, 1.2);
        A.plop(0.7, 0.4);
        A.whoosh(0.2, 0.3);
      }

      function setPalette() {
        palIdx = (palIdx + 1) % PALETTES.length;
        buildSprites();
        buildSlab();
        A.plop(U.rand(1.1, 1.3), 0.35);
        A.sparkle(0.12);
        return PALETTES[palIdx].name;
      }

      const ptr = SG.pointer(cv.canvas, {
        down(p) {
          if (!rubL) rubL = A.loop('brush');
          const f = { id: p.id, x: p.x, y: p.y, x0: p.x, y0: p.y, t0: performance.now(), tStart: performance.now(), dome: null, speed: 0, path: 0 };
          fingers.set(p.id, f);
          f.startedOnDome = !!domeAt(p.x, p.y, 1.5);
          if (busy()) return;
          const d = domeAt(p.x, p.y);
          f.dome = d;
          if (d) {
            d.held = p.id;
            // petit crissement du silicone sous le doigt
            A.squish(U.rand(1.6, 2.0), 0.07);
            SG.haptic(4);
          }
        },
        move(p) {
          const f = fingers.get(p.id);
          if (!f) return;
          f.speed = p.speed;
          f.path += Math.hypot(p.dx, p.dy);
          // début de pichenette (hors des bulles, rapide) : on n'écrase rien
          if (!f.startedOnDome && performance.now() - f.tStart < 240 && (p.speed > 0.5 || f.path < 12)) {
            f.x = p.x; f.y = p.y; return;
          }
          sweep(f, f.x, f.y, p.x, p.y);
          f.x = p.x; f.y = p.y;
          // frottement sur la plaque
          if (inPoly(poly, p.x, p.y) && !busy()) rubLv = Math.max(rubLv, U.clamp(p.speed * 0.5, 0, 0.6));
        },
        up(p) {
          const f = fingers.get(p.id);
          if (!f) return;
          fingers.delete(p.id);
          const dt = performance.now() - f.tStart;
          const dx = p.x - f.x0, dy = p.y - f.y0, dist = Math.hypot(dx, dy);
          // pichenette : geste rapide qui commence hors des bulles → on retourne le pop-it
          if (!f.startedOnDome && dist > 60 && dt < 260 && !busy()) {
            if (Math.abs(dx) > Math.abs(dy)) startFlip('x', Math.sign(dx));
            else startFlip('y', Math.sign(dy));
            return;
          }
          const d = f.dome;
          if (d && d.held === p.id) {
            d.held = null;
            // un simple tap suffit à faire « plop »
            if (!d.down && !busy()) snap(d);
          }
        },
      });

      /* ---------- Rendu ---------- */
      const loop = SG.loop((dt, t) => {
        const { w, h } = cv;
        ctx.clearRect(0, 0, w, h);
        if (pendingFlip > 0) {
          pendingFlip -= dt;
          if (pendingFlip <= 0) { pendingFlip = 0; startFlip('x', 1); }
        }
        let sx = 1, sy = 1, lift = 0;
        if (flip) {
          flip.t = Math.min(1, flip.t + dt / 0.9);
          const e = easeInOut(flip.t);
          const cs = Math.cos(e * Math.PI);
          if (flip.axis === 'x') sx = cs; else sy = cs;
          lift = Math.sin(e * Math.PI);
          if (!flip.toggled && e >= 0.5) {
            flip.toggled = true;
            side = 1 - side;
            domes.forEach((d) => { d.down = !d.down; d.v = d.down ? -1 : 1; d.vel = 0; });
            updateProg();
          }
          if (flip.t >= 1) {
            flip = null;
            // retombe à plat : claque souple du silicone
            A.thud(0.55, 0.9);
            A.tap('plastic', 0.25, 0.7);
            A.plop(0.45, 0.35);
            SG.haptic([10, 20, 10]);
            if (domes.length && domes.every((d) => d.down)) pendingFlip = 0.5;
          }
        }
        appT = Math.min(1, appT + dt / 0.5);
        const app = Math.max(0.001, easeOutBack(appT));
        const now = performance.now();

        // Physique des dômes : appui progressif puis basculement
        for (const d of domes) {
          if (d.held != null && !d.down && !busy()) {
            const f = fingers.get(d.held);
            const holdT = f ? (now - f.t0) / 1000 : 0;
            // plus on appuie longtemps, plus le dôme s'écrase… jusqu'au « clac »
            d.press = Math.min(1, holdT / 0.32);
            if (d.press >= 1) { snap(d); d.held = null; }
          } else if (d.held != null && d.down && !busy()) {
            // appui long sur un creux : on le pince par-dessous, il ressort
            const f = fingers.get(d.held);
            const holdT = f ? (now - f.t0) / 1000 : 0;
            d.press = Math.max(0, d.press - dt * 6);
            if (f && Math.hypot(f.x - d.x, f.y - d.y) < domeR && holdT > 0.5) { snap(d, true); d.held = null; }
          } else d.press = Math.max(0, d.press - dt * 6);
          const rest = d.down ? -1 : 1;
          const target = d.down ? rest : rest - 1.25 * d.press * d.press; // s'aplatit sous le doigt
          // ressort amorti (petit rebond)
          d.vel += (target - d.v) * 260 * dt;
          d.vel *= Math.exp(-dt * 16);
          d.v += d.vel * dt;
          d.v = U.clamp(d.v, -1.15, 1.1);
          d.wob *= Math.exp(-dt * 6);
        }

        // Son de frottement
        rubLv *= Math.exp(-dt * 8);
        if (rubL) rubL.set(rubLv, 0.3);

        // Ombre au sol pendant le saut
        if (lift > 0.01) {
          ctx.fillStyle = `rgba(110,70,120,${(0.16 * lift).toFixed(3)})`;
          ctx.beginPath();
          ctx.ellipse(cx, cy + S * 0.5 + 10, S * 0.45 * (1 - lift * 0.3), 14, 0, 0, TAU);
          ctx.fill();
        }

        ctx.save();
        ctx.translate(cx, cy - 46 * lift);
        ctx.scale(Math.max(0.03, Math.abs(sx)) * app * (1 + 0.05 * lift), Math.max(0.03, Math.abs(sy)) * app * (1 + 0.05 * lift));
        ctx.translate(-cx, -cy);
        ctx.drawImage(slab, 0, 0, w, h);
        for (let i = 0; i < domes.length; i++) {
          const d = domes[i];
          const lvls = spr[d.row];
          if (!lvls) continue;
          const v = U.clamp(d.v, -1, 1);
          const k = Math.round(((v + 1) / 2) * LEVELS);
          const im = lvls[k];
          // un dôme écrasé s'étale un peu ; le creux qui vient de basculer vibre
          const over = Math.max(0, Math.abs(d.v) - 1);
          let s = 1 + 0.06 * (1 - Math.abs(v)) + over * 0.4 + d.wob * Math.sin(t * 40 + d.ph);
          const hh = im.half * s;
          ctx.drawImage(im, d.x - hh, d.y - hh, hh * 2, hh * 2);
        }
        // Petites ondes douces dans le silicone
        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          r.t += dt;
          const k = r.t / 0.4;
          if (k >= 1) { ripples.splice(i, 1); continue; }
          ctx.strokeStyle = `rgba(255,255,255,${(0.35 * (1 - k)).toFixed(3)})`;
          ctx.lineWidth = 2.5 * (1 - k) + 0.5;

        if (lift > 0.01) {
          ctx.save();
          ctx.beginPath();
          poly.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
          ctx.closePath();
          ctx.clip();
          const pos = (flip ? (flip.t - 0.5) * (flip.dir || 1) : 0) * S * 2;
          const vert = flip && flip.axis === 'y';
          const lg = vert
            ? ctx.createLinearGradient(0, cy + pos - S * 0.25, 0, cy + pos + S * 0.25)
            : ctx.createLinearGradient(cx + pos - S * 0.25, 0, cx + pos + S * 0.25, 0);
          lg.addColorStop(0, 'rgba(255,255,255,0)');
          lg.addColorStop(0.5, `rgba(255,255,255,${(0.45 * lift).toFixed(3)})`);
          lg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = lg;
          ctx.fillRect(cx - S, cy - S, S * 2, S * 2);
          ctx.restore();
        }
        ctx.restore();
      });

      cv.onResize(() => layout(true));

      const bar = SG.toolbar(stage, [
        { icon: '💗', label: 'Cœur', group: 'shape', active: true, onClick: () => setShape('heart') },
        { icon: '⭐', label: 'Étoile', group: 'shape', onClick: () => setShape('star') },
        { icon: '🟪', label: 'Carré', group: 'shape', onClick: () => setShape('square') },
        { icon: '🟣', label: 'Rond', group: 'shape', onClick: () => setShape('circle') },
        { icon: '🎨', label: 'Couleurs', onClick: (b) => { const n = setPalette(); const lb = b.querySelector('.lb'); if (lb) lb.textContent = n; } },
        { icon: '🔄', label: 'Retourner', onClick: () => startFlip('x', 1) },
      ]);
      SG.hint(stage, 'Appuie sur les bulles · pichenette pour retourner');

      layout(false);
      appT = 0;      // la barre d'outils peut changer la place disponible
      timers.push(setTimeout(() => layout(true), 50));

      return {
        destroy() {
          loop.stop();
          ptr.destroy();
          timers.forEach(clearTimeout);
          if (rubL) rubL.stop();
          cv.destroy();
          bar.remove();
        },
      };
    },
  });
})();

  <script>/* js/games/slime.js */
/* Slime — une vraie pâte visqueuse : simulée par particules (fluide visco-élastique, ressorts plastiques)
   et rendue comme un champ de hauteur éclairé (gel translucide, reflets qui suivent la surface).

(function () {

  const MAXS = NMAX * 9;       // ressorts max

  // Réglages du fluide (par pas de simulation)

  const KS = 0.03, YIELD = 0.05, PLAST = 9, MEM = 0.0009; // ressorts plastiques

  const SAG = 1100;           // gravité des filaments soulevés (px/s²)

  const COLORS = [
    { name: 'Rose', h: 335, s: 85, l: 76, css: '#ffadd0' },
    { name: 'Lilas', h: 262, s: 78, l: 78, css: '#c9b3ff' },
    { name: 'Menthe', h: 158, s: 62, l: 70, css: '#9ff0cf' },
    { name: 'Ciel', h: 205, s: 85, l: 74, css: '#9fd3ff' },
    { name: 'Pêche', h: 22, s: 90, l: 76, css: '#ffbfa0' },
    { name: 'Citron', h: 48, s: 92, l: 68, css: '#ffe08a' },
  ];
  const GLITTER = [[255, 246, 200], [255, 255, 255], [255, 214, 236], [216, 241, 255], [255, 224, 138], [220, 200, 255]];
  const GLITTER_CSS = GLITTER.map((c) => `rgb(${c[0]},${c[1]},${c[2]})`);
  const BEADS = ['#ffffff', '#ffd1e0', '#cfe6ff', '#fff1b8', '#d9ccff', '#c9f5e1'];

  SG.registerGame({
    id: 'slime',
    title: 'Slime',
    emoji: '🫠',
    desc: 'Étire, plie, enfonce et claque une slime toute douce et brillante.',
    color: '#ffadd0',
    bg: '#fff6f0',
    order: 9,
    create(stage) {
      const cv = SG.makeCanvas(stage);
      const ctx = cv.ctx;
      const A = SG.audio;
      const timers = [];
      const later = (fn, ms) => timers.push(setTimeout(fn, ms));

      /* ---------- Particules ---------- */
      const F32 = () => new Float32Array(NMAX);
      const px = F32(), py = F32(), vx = F32(), vy = F32(), qx = F32(), qy = F32();
      const z = F32(), vz = F32(), rho = F32(), rhoN = F32(), sup = F32();
      const cr = F32(), cg = F32(), cb = F32(), tr = F32(), tg = F32(), tb = F32();

      let N = 0;

      const pQ = new Float32Array(MAXP), pX = new Float32Array(MAXP), pY = new Float32Array(MAXP);
      let np = 0;
      const sA = new Int32Array(MAXS), sB = new Int32Array(MAXS), sL = new Float32Array(MAXS), sR = new Float32Array(MAXS);
      const sFlag = new Uint8Array(NMAX * NMAX);
      let ns = 0;
      // Grille de voisinage
      let hcW = 1, hcH = 1, head = new Int32Array(1);
      const nxt = new Int32Array(NMAX);

      let beadSpr = [];
      let tintT = 0;
      let curColor = COLORS[0];

      /* ---------- Sons ---------- */
      let stickyL = null, smearL = null, sndSticky = 0, sndSmear = 0, lastSnap = 0, lastLand = 0, lastBub = 0;
      let accRate = 0, accBroke = 0, accLand = 0, accLandV = 0;

      /* ---------- Rendu ---------- */
      let c = 2, gw = 1, gh = 1, Fd = null, Fb = null, Hh = null, CR = null, CG = null, CB = null, CW = null;
      let cs = 6, sw = 1, sh = 1, SF = null, DM = null, MX = null, MY = null, LS = null, LU = null;
      const bodyC = document.createElement('canvas'), specC = document.createElement('canvas'), shC = document.createElement('canvas');
      const bodyX = bodyC.getContext('2d'), specX = specC.getContext('2d'), shX = shC.getContext('2d');
      const lsC = document.createElement('canvas'), lsX = lsC.getContext('2d');
      let bodyImg = null, specImg = null, shImg = null, lsImg = null, nLift = 0;
      let box = [0, 0, 0, 0], sbox = [0, 0, 0, 0];
      const bgCache = document.createElement('canvas');
      // lumière (haut-gauche) et demi-vecteur
      const LX = -0.42, LY = -0.62, LZ = 0.66;

      const hl = Math.hypot(lx, ly, lz + 1), hx = lx / hl, hy = ly / hl, hz = (lz + 1) / hl;

      /* ---------- Mise en place ---------- */
      function buildBg() {
        const { w, h, dpr } = cv;
        bgCache.width = Math.round(w * dpr); bgCache.height = Math.round(h * dpr);
        const g = bgCache.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.fillStyle = '#fff6f0';
        g.fillRect(0, 0, w, h);

        g.fillStyle = 'rgba(255,160,195,0.12)';

        for (let y = 0; y < h; y += s * 2) g.fillRect(0, y, w, s);

      }

      function buildSprites() {
        beadSpr = BEADS.map((col) => sprite(8, cv.dpr, (g) => {
          let gr = g.createRadialGradient(0.8, 1.6, 2, 0.8, 1.6, 7.5);

      function measureFloor() {

      function allocGrid() {

        bodyC.width = specC.width = gw; bodyC.height = specC.height = gh;
        bodyImg = bodyX.createImageData(gw, gh); specImg = specX.createImageData(gw, gh);
        cs = c * 3;
        sw = Math.ceil(W / cs) + 3; sh = Math.ceil(Hs / cs) + 3;
        SF = new Float32Array(sw * sh);
        DM = new Float32Array(sw * sh); MX = new Float32Array(sw * sh); MY = new Float32Array(sw * sh);
        LS = new Float32Array(sw * sh); LU = new Float32Array(sw * sh);
        CR = new Float32Array(sw * sh); CG = new Float32Array(sw * sh); CB = new Float32Array(sw * sh); CW = new Float32Array(sw * sh);
        buildStamps();
        shC.width = sw; shC.height = sh; lsC.width = sw; lsC.height = sh;
        shImg = shX.createImageData(sw, sh); lsImg = lsX.createImageData(sw, sh);
        box = [0, 0, 0, 0]; sbox = [0, 0, 0, 0];
        hcW = Math.ceil(W / HR) + 1; hcH = Math.ceil(Hs / HR) + 1;

      function setScale() {

        d0 = R0 * 0.1004;
        HR = d0 * 2.1; HR2 = HR * HR;
        rk = d0 * 2.3;
        // masse : champ ≈ 1 au cœur de la pâte (empilement hexagonal)
        mass = 1 / ((Math.PI * rk * rk / 3) / (0.866 * d0 * d0));

      }

      function setColorAll(col, k) {
        const [r, g, b] = hslRgb(col.h, col.s, col.l);
        for (let i = 0; i < N; i++) {
          if (k) { cr[i] = r; cg[i] = g; cb[i] = b; }
          tr[i] = r; tg[i] = g; tb[i] = b; tint[i] = 1;
        }
        tintT = 1.3;
      }

      function init() {
        // Une boule posée au centre, un peu écrasée : elle s'étale toute seule
        const cx = W / 2, cy = (topY + floorY) / 2;
        N = 0; ns = 0; sFlag.fill(0);
        const rowH = d0 * 0.866;
        for (let j = -40; j <= 40 && N < NMAX; j++) {
          for (let i = -40; i <= 40 && N < NMAX; i++) {
            const x = (i + (j & 1) * 0.5) * d0, y = j * rowH;
            if (x * x / (R0 * R0 * 0.8) + y * y / (R0 * R0 * 1.15) > 1) continue;
            px[N] = cx + x + U.rand(-0.22, 0.22) * d0; py[N] = cy + y + U.rand(-0.22, 0.22) * d0;
            vx[N] = vy[N] = z[N] = vz[N] = 0; layer[N] = 0; cap[N] = -1;

        const arr = Array.from(rho.subarray(0, N)).sort((a, b) => b - a);
        rho0 = arr[Math.floor(N * 0.25)] * 0.93;

        glitter.length = beads.length = foam.length = airs.length = 0;
        const att = () => ({ p: U.randInt(0, N - 1), ox: U.rand(-0.45, 0.45) * d0, oy: U.rand(-0.45, 0.45) * d0 });

        for (let k = 0; k < 55; k++) beads.push(Object.assign(att(), { r: U.rand(3.2, 5.2), c: U.randInt(0, BEADS.length - 1) }));
        for (let k = 0; k < 170; k++) foam.push(Object.assign(att(), { r: U.rand(0.7, 2.1), a: U.rand(0.35, 0.8) }));

        if (sFlag[key]) return;
        sFlag[key] = 1; sA[ns] = a; sB[ns] = b; sL[ns] = r; sR[ns] = r; ns++;
      }
      function delSpring(s) {
        sFlag[sA[s] * NMAX + sB[s]] = 0;

              for (let j = head[yy * hcW + xx]; j !== -1; j = nxt[j]) {

                if (r2 >= HR2) continue;

      // déplacement symétrique d'une paire (les particules tenues par un doigt ne bougent pas)
      function shove(i, j, dx, dy) {
        const ci = cap[i] >= 0, cj = cap[j] >= 0;
        if (ci && cj) return;
        if (ci) { px[j] += dx * 2; py[j] += dy * 2; return; }
        if (cj) { px[i] -= dx * 2; py[i] -= dy * 2; return; }
        px[i] -= dx; py[i] -= dy; px[j] += dx; py[j] += dy;
      }

      function springs() {

          if (r > HR * 0.85) accRate += Math.abs(r - sR[s]);
          sR[s] = r;

          const tol = YIELD * L;
          if (r > L + tol) L += PLAST * DT * (r - L - tol);
          else if (r < L - tol) L -= PLAST * DT * (L - tol - r);
          L += (d0 - L) * MEM; // mémoire : les filaments se rétractent doucement
          sL[s] = L;
          let D = KS * (L - r);
          if (D > maxD) D = maxD; else if (D < -maxD) D = -maxD;
          dx /= r; dy /= r;
          shove(a, b, dx * D * 0.5, dy * D * 0.5);

      function relax() {
        const lim = HR * 0.07;
        for (let p = 0; p < np; p++) {
