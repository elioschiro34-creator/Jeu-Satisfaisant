      }

      function fireRelay(rl) {
        const { src, dx, dy } = rl;
        const minA = rl.min != null ? rl.min : T * 0.8, maxA = rl.max != null ? rl.max : SP * 2.5;
        let best = null, ba = Infinity;
        for (const j of doms) {
          if (j === src || j.st !== 0) continue;
          const rx = j.x - src.x, ry = j.y - src.y;
          const al = rx * dx + ry * dy;
          if (al < minA || al > maxA || al >= ba) continue;
          const lat = Math.abs(rx * -dy + ry * dx);
          if (lat > W * 0.85) continue;
          best = j; ba = al;
        }
        for (const b of bells) {
          const rx = b.x - src.x, ry = b.y - src.y, al = rx * dx + ry * dy;
          if (al > 0 && al < maxA + 8 && al < ba && Math.abs(rx * -dy + ry * dx) < W * 0.8 + 6) { ringBell(b); impact(rl.om, 1.6); return; }
        }
        if (!best) return;
        const al = best.fx * dx + best.fy * dy;
        best.sg = al >= 0 ? 1 : -1;
        best.st = 1; best.th = 0.03; best.om = Math.max(2, rl.om * 0.75); best.cand = null;
        impact(rl.om * 0.8, 1 + ((best.ci % 6) - 3) * 0.02);
        quietT = 0;
        if (Math.abs(al) < 0.75) relays.push({ src: best, dx, dy, t: 0.1, om: rl.om });
      }

      function update(dt) {
        let active = false, fallen = 0;
        for (const i of doms) {
          if (i.pop < 1) { i.pop = Math.min(1, i.pop + dt * 7); active = true; }
          if (i.st === 3) { // relevage
            active = true;
            if (i.delay > 0) { i.delay -= dt; continue; }
            i.th *= Math.exp(-dt * 14);
            if (i.th < 0.01) {
              i.th = 0; i.st = 0; i.om = 0; i.landed = false; i.linksFired = false;
              if (sndBudget >= 1 && Math.random() < 0.6) { sndBudget -= 1; A.tap('wood', 0.1, rand(1.6, 1.9)); }
            }
            continue;
          }
          if (i.st !== 0) fallen++;
          if (i.st !== 1) continue;
          active = true;
          if (!i.cand) computeCand(i);
          if (i.links && i.th > 0.22 && !i.linksFired) {
            i.linksFired = true;
            for (const b of i.links) {
              if (b.st !== 0 || doms.indexOf(b) < 0) continue;
              const rx = b.x - i.x, ry = b.y - i.y;
              b.sg = (b.fx * rx + b.fy * ry) >= 0 ? 1 : -1;
              b.st = 1; b.th = 0.03; b.om = Math.max(2, i.om * 0.75); b.cand = null;
              impact(i.om * 0.8, 1.02);
            }
          }
          i.om += GK * Math.sin(i.th + 0.02) * dt;
          let th = i.th + i.om * dt;
          let leanOn = null;
          for (const c of i.cand) {
            const reach = H * Math.sin(Math.min(th, Math.PI / 2));
            if (!c.touched && reach >= c.gap) {
              c.touched = true;
              if (c.bell) { ringBell(c.bell); impact(i.om, 1.6); }
              else if (c.j.st === 0) {
                const j = c.j;
                const [dx, dy] = dir(i);
                const al = j.fx * dx + j.fy * dy;
                j.sg = al >= 0 ? 1 : -1;
                j.st = 1; j.th = 0.03; j.om = Math.max(2, i.om * 0.82); j.cand = null;
                impact(i.om, 1 + ((j.ci % 6) - 3) * 0.02);
                // croisement : j est de travers, il tombe selon son axe mais l'onde continue dans le sens de i
                if (Math.abs(al) < 0.75) relays.push({ src: j, dx, dy, t: 0.1, om: i.om });
                i.om *= 0.55;
              } else {
                impact(i.om * 0.5, 0.9);
                // domino déjà tombé (vague d'une autre ligne) au croisement : l'onde passe quand même
                const [dx, dy] = dir(i);
                if (Math.abs(c.j.fx * dx + c.j.fy * dy) < 0.75) relays.push({ src: c.j, dx, dy, t: 0.08, om: i.om });
              }
            }
            if (c.touched && !leanOn) leanOn = c;
          }
          if (leanOn) {
            const lim = leanOn.bell ? Math.asin(clamp(leanOn.gap / H, 0, 1)) : leanLimit(leanOn.gap, leanOn.j.th);
            if (th > lim) {
              th = lim; i.om = Math.min(i.om, 0) + Math.max(0, i.om) * 0.15;
              const restOk = leanOn.bell || leanOn.j.st === 2;
              if (restOk && Math.abs(i.om) < 0.6) { i.st = 2; i.om = 0; }
            }
          } else if (th >= Math.PI / 2) {
            th = Math.PI / 2;
            if (!i.landed) {
              // tombé à plat sans rien toucher : sa tête peut encore heurter un domino un peu trop loin
              i.landed = true;
              const [dx, dy] = dir(i);
              relays.push({ src: i, dx, dy, t: 0, om: i.om, min: H * 0.85, max: H + T + SP * 0.9 });
            }
            if (i.om > 3) {
              impact(i.om * 0.6, 0.7);
              if (Math.random() < 0.5) A.thud(0.18, 1.6);
              i.om = -i.om * 0.16;
            } else { i.om = 0; i.st = 2; }
          }
          i.th = Math.max(0, th);
        }
        // relais spatiaux (croisements, branches, petits trous) : on cherche par la géométrie,
        // pas par l'ordre du tracé, le premier domino debout devant
        for (let k = relays.length - 1; k >= 0; k--) {
          const rl = relays[k];
          active = true;
          rl.t -= dt;
          if (rl.t > 0) continue;
          relays.splice(k, 1);
          fireRelay(rl);
        }
        bells.forEach((b) => { if (b.ring > 0) { b.ring = Math.max(0, b.ring - dt * 0.7); active = true; } });
        if (poofs.length) active = true;
        // fin de la vague
        if (fallen && !doms.some((d) => d.st === 1)) {
          quietT += dt;
          if (!celebrated && quietT > 0.5 && doms.length >= 20 && fallen === doms.length) {
            celebrated = true;
            SG.celebrate(stage, 'Tout est tombé !');
            setTimeout(() => SG.hint(stage, 'Relève-les ↩️ ou trace un nouveau chemin'), 2300);
          }
        } else quietT = 0;
        prog.set(doms.length ? fallen / doms.length : 0);
        return active;
      }

      /* ---------- Rendu ---------- */
      const P = new Array(8), G = new Array(8);
      for (let k = 0; k < 8; k++) { P[k] = [0, 0]; G[k] = [0, 0]; }
      function geom(dm) {
        const ct = Math.cos(dm.th), st = Math.sin(dm.th);
        const [dx, dy] = dir(dm), sx = -dy, sy = dx;
        const pp = dm.pop < 1 ? 1 - Math.pow(1 - dm.pop, 3) : 1;
        const hh = H * pp, ww = W * (0.6 + 0.4 * pp);
        for (let k = 0; k < 8; k++) {
          const ia = k >> 2, ib = (k >> 1) & 1, ic = k & 1;
          const a = ia ? T / 2 : -T / 2, b = ib ? ww / 2 : -ww / 2, c = ic ? hh : 0;
          const a2 = T / 2 + (a - T / 2) * ct + c * st;
          const c2 = -(a - T / 2) * st + c * ct;
          const X = dm.x + dx * a2 + sx * b, Y = dm.y + dy * a2 + sy * b;
          P[k][0] = X; P[k][1] = Y - c2 * K;
          G[k][0] = X + c2 * SHX; G[k][1] = Y + c2 * SHY;
        }
        return { ct, st, dx, dy, sx, sy };
      }
      function drawShadow(dm) {
        geom(dm);
        const h = hull(G.map((p) => [p[0], p[1]]));
        g.beginPath(); g.moveTo(h[0][0], h[0][1]);
        for (let k = 1; k < h.length; k++) g.lineTo(h[k][0], h[k][1]);
        g.closePath(); g.fill();
      }
      const FACES = [
        // [indices], type
        [[4, 6, 7, 5], 'front'], [[0, 2, 3, 1], 'back'], [[1, 3, 7, 5], 'top'],
        [[0, 1, 5, 4], 'left'], [[2, 3, 7, 6], 'right'],
      ];
      function shade(col, br, a = 1) {
        const f = (v) => clamp(Math.round(v * br + (br > 1 ? (255 - v) * (br - 1) * 2 : 0)), 0, 255);
        return `rgba(${f(col[0])},${f(col[1])},${f(col[2])},${a})`;
      }
      function drawDomino(dm) {
        const o = geom(dm);
        const col = themeCols[dm.ci % themeCols.length];
        const pip = THEMES[theme].pip;
        for (const [idx, type] of FACES) {
          let nx, ny, nz;
          if (type === 'front') { nx = o.dx * o.ct; ny = o.dy * o.ct; nz = -o.st; }
          else if (type === 'back') { nx = -o.dx * o.ct; ny = -o.dy * o.ct; nz = o.st; }
          else if (type === 'top') { nx = o.dx * o.st; ny = o.dy * o.st; nz = o.ct; }
          else if (type === 'left') { nx = -o.sx; ny = -o.sy; nz = 0; }
          else { nx = o.sx; ny = o.sy; nz = 0; }
          if (ny * VY + nz * VZ <= 0.02) continue;
          const lum = nx * L[0] + ny * L[1] + nz * L[2];
          const br = 0.72 + 0.38 * Math.max(0, lum) + (type === 'top' ? 0.06 : 0);
          g.beginPath();
          g.moveTo(P[idx[0]][0], P[idx[0]][1]);
          for (let k = 1; k < 4; k++) g.lineTo(P[idx[k]][0], P[idx[k]][1]);
          g.closePath();
          g.fillStyle = shade(col, br); g.fill();
          g.strokeStyle = shade(col, 0.72, 0.9); g.lineWidth = 0.7; g.stroke();
          if ((type === 'front' || type === 'back') && dm.pop > 0.8) drawPips(idx, dm, pip, br);
        }
        // arête supérieure lumineuse
        g.strokeStyle = 'rgba(255,255,255,0.65)'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(P[1][0], P[1][1]); g.lineTo(P[3][0], P[3][1]); g.stroke();
      }
      // pips : (b0,c0),(b1,c0),(b1,c1),(b0,c1) = idx[0], idx[1], idx[2], idx[3]
      function bil(idx, u, v) {
        const p0 = P[idx[0]], p1 = P[idx[1]], p2 = P[idx[2]], p3 = P[idx[3]];
        const uu = (u + 1) / 2;
        const bx = p0[0] + (p1[0] - p0[0]) * uu, by = p0[1] + (p1[1] - p0[1]) * uu;
        const tx = p3[0] + (p2[0] - p3[0]) * uu, ty = p3[1] + (p2[1] - p3[1]) * uu;
        return [bx + (tx - bx) * v, by + (ty - by) * v];
      }
      function drawPips(idx, dm, pip, br) {
        // trait central
        const a = bil(idx, -0.75, 0.5), b = bil(idx, 0.75, 0.5);
        g.strokeStyle = pip; g.globalAlpha = 0.55; g.lineWidth = 0.9;
        g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
        // taille apparente de la face (raccourci) pour les points
        const top = bil(idx, 0, 1), bot = bil(idx, 0, 0);
        const fh = Math.hypot(top[0] - bot[0], top[1] - bot[1]);
        const pr = clamp(fh * 0.045, 0.6, 1.8);
        g.fillStyle = pip; g.globalAlpha = 0.75 * clamp(br, 0.6, 1);
        [[dm.pa, 0.75], [dm.pb, 0.25]].forEach(([n, vc]) => {
          for (const [pu, pv] of PIPS[n]) {
            const q = bil(idx, pu * 0.45, vc + pv * 0.13);
            g.beginPath(); g.arc(q[0], q[1], pr, 0, Math.PI * 2); g.fill();
          }
        });
        g.globalAlpha = 1;
      }
      function drawBell(b) {
        const sw = Math.sin(performance.now() / 60) * b.ring * 0.5;
        // ombre
        g.fillStyle = 'rgba(90,60,80,0.18)';
        g.beginPath(); g.ellipse(b.x + 12, b.y + 6, 16, 7, 0.3, 0, Math.PI * 2); g.fill();
        // potence
        g.strokeStyle = '#c9a27a'; g.lineWidth = 3; g.lineCap = 'round';
        g.beginPath(); g.moveTo(b.x - 11, b.y); g.lineTo(b.x - 11, b.y - 44); g.lineTo(b.x + 11, b.y - 44); g.lineTo(b.x + 11, b.y); g.stroke();
        g.fillStyle = '#e8cfb2';
        g.beginPath(); g.ellipse(b.x, b.y, 15, 5, 0, 0, Math.PI * 2); g.fill();
        // cloche
        g.save(); g.translate(b.x, b.y - 44); g.rotate(sw);
        const gr = g.createLinearGradient(-10, 0, 10, 0);
        gr.addColorStop(0, '#e9b949'); gr.addColorStop(0.4, '#fff0b0'); gr.addColorStop(1, '#c98f22');
        g.fillStyle = gr;
        g.beginPath(); g.moveTo(-3, 2); g.quadraticCurveTo(-9, 6, -9, 16); g.quadraticCurveTo(-11, 22, -12, 24);
        g.lineTo(12, 24); g.quadraticCurveTo(11, 22, 9, 16); g.quadraticCurveTo(9, 6, 3, 2); g.closePath(); g.fill();
        g.fillStyle = '#b07a1c'; g.beginPath(); g.arc(0, 25, 2.6, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.7)'; g.fillRect(-5, 8, 2, 11);
        g.restore();
      }
      function render() {
        const d = cv.dpr;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.drawImage(bgc, 0, 0);
        const sx = shake > 0.05 ? rand(-1, 1) * shake : 0, sy = shake > 0.05 ? rand(-1, 1) * shake : 0;
        g.setTransform(d, 0, 0, d, d * sx, d * sy);
        // tracé en cours
        ptrs.forEach((s) => {
          if (s.mode === 'draw' && s.drawing) {
            g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = 3; g.setLineDash([3, 6]); g.lineCap = 'round';
            g.beginPath(); g.moveTo(s.lx, s.ly); g.lineTo(s.x, s.y); g.stroke(); g.setLineDash([]);
          }
        });
        g.fillStyle = 'rgba(90,55,80,0.17)';
        for (const dm of doms) drawShadow(dm);
        const items = doms.map((dm) => ({ y: dm.y + Math.sin(dm.th) * H * 0.5 * dm.fy * dm.sg, dm }));
        bells.forEach((b) => items.push({ y: b.y, b }));
        items.sort((a, b) => a.y - b.y);
        for (const it of items) { if (it.dm) drawDomino(it.dm); else drawBell(it.b); }
        // poussière et étoiles
        poofs.forEach((p) => {
          if (p.star) {
            g.fillStyle = `rgba(255,236,150,${p.life})`;
            const z = 4 * p.life;
            g.beginPath(); g.moveTo(p.x, p.y - z); g.lineTo(p.x + z * 0.3, p.y); g.lineTo(p.x, p.y + z); g.lineTo(p.x - z * 0.3, p.y); g.closePath(); g.fill();
          } else {
            g.fillStyle = `rgba(255,255,255,${0.5 * p.life})`;
            g.beginPath(); g.arc(p.x, p.y, 3 + (1 - p.life) * 6, 0, Math.PI * 2); g.fill();
          }
        });
        // gomme
        ptrs.forEach((s) => {
          if (s.mode === 'erase') {
            g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 2;
            g.beginPath(); g.arc(s.x, s.y, 18, 0, Math.PI * 2); g.stroke();
          }
        });
      }

      /* ---------- Boucle ---------- */
      const loop = SG.loop((dt) => {
        sndBudget = Math.min(6, sndBudget + dt * 45);
        hapT -= dt;
        anyActive = update(dt);
        poofs.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt * 1.6; });
        poofs = poofs.filter((p) => p.life > 0);
        if (shake > 0) shake = Math.max(0, shake - dt * 8);
        if (anyActive || dirty || shake > 0 || ptrs.size) { render(); dirty = false; }
      });

      /* ---------- Entrées ---------- */
      function domAt(x, y, rad = W * 0.9) {
        let best = null, bd = rad * rad;
        for (const d of doms) {
          const cx = d.x, cy = d.y - H * K * 0.5 * Math.cos(d.th);
          const q1 = (d.x - x) ** 2 + (d.y - y) ** 2, q2 = (cx - x) ** 2 + (cy - y) ** 2;
          const q = Math.min(q1, q2);
          if (q < bd) { bd = q; best = d; }
        }
        return best;
      }
      function pushFromTouch(dm, x, y) {
        const along = (dm.x - x) * dm.fx + (dm.y - y) * dm.fy;
        return push(dm, along >= -1 ? 1 : -1);
      }
      function eraseAt(x, y) {
        const before = doms.length;
        doms = doms.filter((d) => {
          const hit = (d.x - x) ** 2 + (d.y - y) ** 2 < 18 * 18;
          if (hit) poofs.push({ x: d.x, y: d.y - 8, vx: rand(-20, 20), vy: rand(-30, 0), life: 1 });
          return !hit;
        });
        const nb = bells.length;
        bells = bells.filter((b) => (b.x - x) ** 2 + (b.y - y) ** 2 > 20 * 20);
        if (doms.length !== before || bells.length !== nb) {
          doms.forEach((d) => { d.cand = null; });
          if (sndBudget >= 1) { sndBudget -= 1; A.rustle(0.12, 0.08); A.tap('wood', 0.1, 0.8); }
          dirty = true;
        }
      }
      const ptr = SG.pointer(cv.canvas, {
        down(p) {
          const s = { x: p.x, y: p.y, sx: p.x, sy: p.y, lx: p.x, ly: p.y, mode, drawing: false, first: false, dir: null, moved: 0 };
          ptrs.set(p.id, s);
          if (mode === 'erase') eraseAt(p.x, p.y);
          else if (mode === 'push') {
            const dm = domAt(p.x, p.y);
            if (dm) pushFromTouch(dm, p.x, p.y);
          } else if (mode === 'bell') {
            if (!tooClose(p.x, p.y, 14)) {
              bells.push({ x: p.x, y: p.y, ring: 0, step: randInt(3, 8) });
              doms.forEach((d) => { if (d.st === 1) d.cand = null; });
              A.tap('metal', 0.2, 2.4); A.chime(5, 0.12); dirty = true;
            }
          }
        },
        move(p) {
          const s = ptrs.get(p.id);
          if (!s) return;
          s.moved += Math.hypot(p.x - s.x, p.y - s.y);
          const vx = p.x - s.x, vy = p.y - s.y;
          s.x = p.x; s.y = p.y;
          if (s.mode === 'draw' && s.moved > 10) {
            if (!s.drawing) {
              s.drawing = true;
              // commencer depuis un domino existant permet de faire des branches
              const near = nearest(s.sx, s.sy, SP * 1.2);
              if (near) { s.lx = near.x; s.ly = near.y; s.first = true; s.branch = near; }
            }
            strokeTo(s, p.x, p.y);
          } else if (s.mode === 'push') {
            // balayage : pousse dans le sens du geste
            const dm = domAt(p.x, p.y, W);
            if (dm && dm.st === 0 && Math.hypot(vx, vy) > 0.5) push(dm, (vx * dm.fx + vy * dm.fy) >= 0 ? 1 : -1, 1.3);
          } else if (s.mode === 'erase') eraseAt(p.x, p.y);
          dirty = true;
        },
        up(p) {
          const s = ptrs.get(p.id);
          ptrs.delete(p.id);
          if (!s) return;
          if (s.mode === 'draw' && !s.drawing) {
            const dm = domAt(s.sx, s.sy);
            if (dm) pushFromTouch(dm, s.sx, s.sy);
            else if (!tooClose(s.sx, s.sy, SP * 0.8)) {
              // domino seul, tourné vers le domino le plus proche
              const nb = nearest(s.sx, s.sy, SP * 3);
              const fx = nb ? s.sx - nb.x : 0, fy = nb ? s.sy - nb.y : -1;
              addDomino(s.sx, s.sy, fx || 0.001, fy);
              A.tap('wood', 0.2, 1.5); SG.haptic(5);
            }
          }
          dirty = true;
        },
      });

      /* ---------- Outils ---------- */
      function relever() {
        let order = doms.filter((d) => d.st !== 0);
        order.sort((a, b) => a.ci - b.ci);
        order.forEach((d, k) => { d.st = 3; d.delay = Math.min(1.5, k * 0.012); d.om = 0; d.cand = null; });
        bells.forEach((b) => { b.ring = 0; });
        relays = [];
        celebrated = false; quietT = 0;
        if (order.length) { A.whoosh(0.2, 0.6, true); A.rustle(0.1, 0.4); }
      }
      SG.toolbar(stage, [
        { icon: '✏️', label: 'Tracer', group: 'm', active: true, onClick: () => { mode = 'draw'; } },
        { icon: '👉', label: 'Pousser', group: 'm', onClick: () => { mode = 'push'; SG.hint(stage, 'Touche ou balaie un domino pour le pousser', 2000); } },
        { icon: '🔔', label: 'Cloche', group: 'm', onClick: () => { mode = 'bell'; SG.hint(stage, 'Pose une clochette au bout du chemin', 2000); } },
        { icon: '🧽', label: 'Gomme', group: 'm', onClick: () => { mode = 'erase'; } },
        { icon: '↩️', label: 'Relever', onClick: relever },
        { icon: '🎨', label: 'Thème', onClick: () => { setTheme((theme + 1) % THEMES.length); SG.hint(stage, `Thème ${THEMES[theme].name}`, 1200); A.chime(theme + 2, 0.15); } },
        { icon: '🗑️', label: 'Effacer', onClick: () => {
          doms = []; bells = []; relays = []; celebrated = false; placeCount = 0; dirty = true;
          A.whoosh(0.25, 0.4); A.rustle(0.15, 0.3);
        } },
      ]);

      /* ---------- Démo de départ : un serpentin jusqu'à une cloche ---------- */
      function demo() {
        const w = cv.w, h = cv.h;
        const top = 80, bot = h - (w < 480 ? 150 : 110);
        const pts = [];
        const n = 140;
        for (let k = 0; k <= n; k++) {
          const t = k / n;
          const y = top + (bot - top) * (0.08 + t * 0.84);
          const x = w / 2 + Math.sin(t * Math.PI * 2.2) * Math.min(w * 0.3, 260);
          pts.push([x, y]);
        }
        const s = { lx: pts[0][0], ly: pts[0][1], first: false, dir: null };
        const sb = sndBudget; sndBudget = -1e9;
        pts.forEach(([x, y]) => strokeTo(s, x, y));
        sndBudget = sb;
        const last = doms[doms.length - 1];
        if (last) bells.push({ x: last.x + last.fx * SP * 1.3, y: last.y + last.fy * SP * 1.3, ring: 0, step: 5 });
        doms.forEach((d) => { d.pop = 1; });
      }

      cv.onResize(() => {
        // garder le dessin centré quand l'écran change
        if (lastW) {
          const dx = (cv.w - lastW) / 2, dy = (cv.h - lastH) / 2;
          doms.forEach((d) => { d.x += dx; d.y += dy; d.cand = null; });
          bells.forEach((b) => { b.x += dx; b.y += dy; });
        }
        lastW = cv.w; lastH = cv.h;
        buildBg(); dirty = true;
      });
      lastW = cv.w; lastH = cv.h;
      buildBg();
      demo();
      void ox; void oy;

      if (/[?&]test\b/.test(location.search)) window.__dom = { get doms() { return doms; }, get bells() { return bells; } };

      return {
        destroy() { loop.stop(); ptr.destroy(); cv.destroy(); },
      };
    },
  });
})();

  <script>/* js/main.js */
/* Douceurs — menu et navigation entre mini-jeux */
(function () {
  'use strict';
  const SG = window.SG;
  const $ = (s) => document.querySelector(s);

  const menu = $('#menu');
  const grid = $('#grid');
  const view = $('#game');
  const stage = $('#stage');
  const titleEl = $('#game-title');
  let current = null;

  const favs = () => (Array.isArray(SG.settings.favs) ? SG.settings.favs : []);
  function buildMenu(animate = true) {
    grid.innerHTML = '';
    const f = favs();
    SG.games
      .slice()
      .sort((a, b) => {
        // les favoris d'abord, puis l'ordre normal
        const fa = f.includes(a.id) ? 0 : 1, fb = f.includes(b.id) ? 0 : 1;
        return fa - fb || (a.order || 99) - (b.order || 99);
      })
      .forEach((g, i) => {
        const card = document.createElement('button');
        const isFav = f.includes(g.id);
        card.className = 'card' + (isFav ? ' is-fav' : '');
        card.style.setProperty('--card', g.color || SG.palette.list[i % SG.palette.list.length]);
        if (animate) card.style.animationDelay = i * 40 + 'ms';
        else card.style.animation = 'none';
        card.innerHTML = `<span class="shine"></span><span class="fav" role="button" aria-label="Favori" title="Favori">${isFav ? '★' : '☆'}</span>` +
          `<span class="emoji">${g.emoji || '✨'}</span><span class="name">${g.title}</span><span class="desc">${g.desc || ''}</span>`;
        card.addEventListener('click', (e) => {
          if (e.target.closest('.fav')) { toggleFav(g.id); return; }
          open(g.id);
        });
        // l'animation d'entrée bloquerait les transformations au survol
        card.addEventListener('animationend', () => { card.style.animation = 'none'; }, { once: true });
        tilt(card, i);
        grid.appendChild(card);
      });
  }
  function toggleFav(id) {
    SG.audio.init();
    const f = favs().slice();
    const k = f.indexOf(id);
    if (k >= 0) { f.splice(k, 1); SG.audio.tap('wood', 0.3, 0.9); }
    else { f.push(id); SG.audio.chime(9, 0.2); SG.audio.sparkle(0.12); }
    SG.settings.favs = f; SG.saveSettings();
    SG.haptic(10);
    buildMenu(false);
  }

  // Carte qui s'incline en 3D sous la souris, avec un reflet qui suit
  function tilt(card, i) {
    let lastTick = 0;
    card.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      card.style.setProperty('--rx', (-y * 14).toFixed(2) + 'deg');
      card.style.setProperty('--ry', (x * 16).toFixed(2) + 'deg');
      card.style.setProperty('--mx', ((x + 0.5) * 100).toFixed(1) + '%');
      card.style.setProperty('--my', ((y + 0.5) * 100).toFixed(1) + '%');
    });
    card.addEventListener('pointerenter', (e) => {
      if (e.pointerType !== 'mouse') return;
      card.classList.add('tilt');
      const t = performance.now();
      if (SG.audio.ctx() && t - lastTick > 120) { lastTick = t; SG.audio.tap('glass', 0.06, 1 + (i % 5) * 0.12); }
    });
    card.addEventListener('pointerleave', () => {
      card.classList.remove('tilt');
      card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg');
    });
  }

  // Bouton « au hasard » : fait défiler les cartes puis ouvre un jeu
  let spinning = false;
  $('#random').addEventListener('click', () => {
    SG.audio.init();
    const cards = [...grid.children];
    if (!cards.length || spinning) return;
    spinning = true;
    setTimeout(() => { spinning = false; }, 4000);
    const pick = Math.floor(Math.random() * cards.length);
    const steps = 12 + Math.floor(Math.random() * 6);
    let k = 0, idx = Math.floor(Math.random() * cards.length);
    const spin = () => {
      cards.forEach((c) => c.classList.remove('lit'));
      idx = k === steps ? pick : (idx + 1 + Math.floor(Math.random() * 3)) % cards.length;
      const c = cards[idx];
      c.classList.add('lit');
      c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      SG.audio.tap('wood', 0.25, 1.4 + (k / steps) * 0.6);
      if (k++ < steps) setTimeout(spin, 60 + k * k * 1.6);
      else setTimeout(() => { c.classList.remove('lit'); SG.audio.chime(7, 0.25); c.click(); }, 420);
    };
    spin();
  });

  function open(id, push = true) {
    const g = SG.games.find((x) => x.id === id);
    if (!g) return;
    SG.audio.init(); SG.audio.click(); SG.haptic(8);
    close(false);
    menu.hidden = true; view.hidden = false;
    titleEl.textContent = `${g.emoji || ''} ${g.title}`;
    stage.innerHTML = '';
    stage.style.background = g.bg || '';
    SG.quality.reset();
    try {
      current = g.create(stage) || {};
    } catch (err) {
      console.error(err);
      stage.innerHTML = `<p class="err">Oups, ce jeu a eu un souci.</p>`;
      current = {};
    }
    showHand(id);
    if (push) history.pushState({ game: id }, '', '#' + id);
  }

  /* ---------- Petite main qui montre le geste ---------- */
  const GESTURES = {
    'butter-spread': 'drag', 'butter-cut': 'down', soap: 'down', paint: 'drag', cake: 'hold', pour: 'hold',
    bubble: 'tap', popit: 'tap', slime: 'drag', 'kinetic-sand': 'drag', 'sand-art': 'hold', peel: 'diag',
    'creme-brulee': 'tap', zen: 'drag', chocolate: 'drag', 'pressure-wash': 'drag', tufting: 'drag',
    honey: 'drag', ice: 'tap', beads: 'drag', dominos: 'drag',
  };
  function showHand(id) {
    const g = GESTURES[id] || 'tap';
    const hand = document.createElement('div');
    hand.className = 'sg-hand g-' + g;
    hand.innerHTML = '<span class="ring"></span><span class="fing">👆</span>';
    stage.appendChild(hand);
    const bye = () => { hand.classList.add('bye'); setTimeout(() => hand.remove(), 400); stage.removeEventListener('pointerdown', bye); };
    stage.addEventListener('pointerdown', bye);
    setTimeout(bye, 3600);
  }

  /* ---------- 📸 Photo de sa création ---------- */
  $('#snap').addEventListener('click', async () => {
    const cvs = [...stage.querySelectorAll('canvas')];
    if (!cvs.length) return;
    SG.audio.init();
    // déclic d'appareil photo
    SG.audio.tap('plastic', 0.5, 1.6); setTimeout(() => SG.audio.tap('plastic', 0.4, 1.2), 70);
    SG.haptic([8, 40, 8]);
    const fl = $('#flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
    const r = stage.getBoundingClientRect();
    const k = Math.min(2, window.devicePixelRatio || 1);
    const out = document.createElement('canvas');
    out.width = Math.round(r.width * k); out.height = Math.round(r.height * k);
    const o = out.getContext('2d');
    // fond de la scène (couleur unie claire si dégradé CSS)
    o.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg') || '#fff4ec';
    o.fillRect(0, 0, out.width, out.height);
    cvs.forEach((c) => {
      const cr = c.getBoundingClientRect();
      if (!cr.width || getComputedStyle(c).display === 'none') return;
      try { o.drawImage(c, (cr.left - r.left) * k, (cr.top - r.top) * k, cr.width * k, cr.height * k); } catch (e) { /* ignore */ }
    });
    // petite signature
    o.font = `600 ${14 * k}px Fredoka, sans-serif`; o.fillStyle = 'rgba(255,255,255,0.85)';
    o.textAlign = 'right'; o.fillText('Douceurs ✨', out.width - 12 * k, out.height - 12 * k);
    const id = (location.hash || '#jeu').slice(1);
    const name = `douceurs-${id}-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.png`;
    out.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], name, { type: 'image/png' });
      // Sur téléphone : feuille de partage (Enregistrer l'image, envoyer…). Sinon : téléchargement.
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia('(pointer:coarse)').matches) {
          await navigator.share({ files: [file], title: 'Ma création Douceurs' });
          return;
        }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      SG.hint(stage, 'Photo enregistrée 📸', 1800);
    }, 'image/png');
  });

  function close(push = true) {
    if (current && current.destroy) {
      try { current.destroy(); } catch (e) { console.error(e); }
    }
    current = null;
    stage.innerHTML = '';
    if (push) {
      view.hidden = true; menu.hidden = false;
    }
  }

  $('#back').addEventListener('click', () => {
    SG.audio.click();
    if (history.state && history.state.game) history.back();
    else { close(); history.replaceState(null, '', location.pathname + location.search); }
  });
  $('#reset').addEventListener('click', () => {
    const id = (location.hash || '').slice(1);
    if (id) open(id, false);
  });

  window.addEventListener('popstate', () => {
    const id = (location.hash || '').slice(1);
    if (id && SG.games.some((g) => g.id === id)) open(id, false);
    else close();
  });

  // Bouton son rapide
  const soundBtn = $('#toggle-sound');
  const refreshToggles = () => {
    soundBtn.classList.toggle('off', !SG.settings.sound);
    soundBtn.textContent = SG.settings.sound ? '🔊' : '🔇';
  };
  soundBtn.addEventListener('click', () => { SG.audio.init(); SG.audio.setEnabled(!SG.settings.sound); refreshToggles(); SG.audio.click(); });
  refreshToggles();

  /* ---------- Réglages : volume, musique, vibrations, mode nuit ---------- */
  const sheet = $('#settings');
  const vol = $('#set-volume'), mus = $('#set-music'), hap = $('#set-haptics'), night = $('#set-night');
  const applyNight = () => { document.documentElement.dataset.theme = SG.settings.night ? 'night' : ''; };
  applyNight();
  if (!('vibrate' in navigator)) $('#row-haptics').hidden = true;
  $('#open-settings').addEventListener('click', () => {
    SG.audio.init(); SG.audio.click();
    vol.value = SG.settings.volume ?? 0.8; mus.checked = !!SG.settings.music;
    hap.checked = !!SG.settings.haptics; night.checked = !!SG.settings.night;
    sheet.hidden = false;
  });
  const closeSheet = () => { sheet.hidden = true; SG.audio.click(); };
  $('#close-settings').addEventListener('click', closeSheet);
  sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
  let volTick = 0;
  vol.addEventListener('input', () => {
    SG.audio.setVolume(+vol.value);
    if (!SG.settings.sound) { SG.audio.setEnabled(true); refreshToggles(); }
    const t = performance.now();
    if (t - volTick > 90) { volTick = t; SG.audio.pop(0.8 + +vol.value, 0.5); }
  });
  mus.addEventListener('change', () => { SG.audio.init(); SG.audio.music(mus.checked); });
  hap.addEventListener('change', () => { SG.settings.haptics = hap.checked; SG.saveSettings(); SG.haptic(15); });
  night.addEventListener('change', () => { SG.settings.night = night.checked; SG.saveSettings(); applyNight(); SG.audio.chime(night.checked ? 0 : 4, 0.2); });

  // Débloque l'audio au premier geste (exigence des navigateurs)
  window.addEventListener('pointerdown', () => SG.audio.init(), { once: true });

  // Logo : lettres qui arrivent en rebondissant, et qu'on peut faire sauter
  const logo = $('#logo');
  const word = 'Douceurs';
  // dégradé rose → pêche → lilas, lettre par lettre
  const ramp = ['#ff8fb1', '#ff96a8', '#ff9f9a', '#ffa98c', '#f5a3a6', '#e3a2c4', '#d1a4e2', '#c3a6ff', '#ffb08a'];
  logo.innerHTML = [...word].map((ch, i) => `<span class="ltr" style="--i:${i};color:${ramp[i]}">${ch}</span>`).join('') +
    `<span class="ltr" style="--i:8;color:${ramp[8]}">.</span>`;
  logo.querySelectorAll('.ltr').forEach((s, i) => {
    s.addEventListener('pointerdown', () => {
      SG.audio.init();
      s.classList.remove('jump'); void s.offsetWidth; s.classList.add('jump');
      SG.audio.plop(0.8 + i * 0.08, 0.5); SG.haptic(8);
    });
  });

  // Fond vivant : grosses bulles pastel floues qui dérivent + petites bulles qui montent
  const bg = $('#bg'), bctx = bg.getContext('2d');
  let bw = 0, bh = 0, blobs = [], bubbles = [], pointer = { x: -999, y: -999 };
  const resizeBg = () => {
    const d = Math.min(window.devicePixelRatio || 1, 1.5);
    bw = innerWidth; bh = innerHeight;
    bg.width = bw * d; bg.height = bh * d;
    bctx.setTransform(d, 0, 0, d, 0, 0);
  };
  resizeBg();
  window.addEventListener('resize', resizeBg);
  window.addEventListener('pointermove', (e) => { pointer = { x: e.clientX, y: e.clientY }; });
  const cols = ['255,181,200', '255,200,168', '214,196,255', '184,220,255', '185,240,212', '255,227,154'];
  for (let i = 0; i < 6; i++) {
    blobs.push({ x: Math.random(), y: Math.random(), r: 0.25 + Math.random() * 0.25, c: cols[i], ph: Math.random() * 6, sp: 0.04 + Math.random() * 0.05 });
  }
  SG.loop((dt, t) => {
    if (menu.hidden) return;
    bctx.clearRect(0, 0, bw, bh);
    const m = Math.max(bw, bh);
    blobs.forEach((b) => {
      const x = (b.x + Math.sin(t * b.sp + b.ph) * 0.12) * bw, y = (b.y + Math.cos(t * b.sp * 0.8 + b.ph) * 0.1) * bh;
      const g = bctx.createRadialGradient(x, y, 0, x, y, b.r * m);
      g.addColorStop(0, `rgba(${b.c},0.42)`); g.addColorStop(1, `rgba(${b.c},0)`);
      bctx.fillStyle = g; bctx.fillRect(x - b.r * m, y - b.r * m, b.r * m * 2, b.r * m * 2);
    });
    if (bubbles.length < 18 && Math.random() < dt * 2) {
      bubbles.push({ x: Math.random() * bw, y: bh + 20, r: 4 + Math.random() * 12, vy: 18 + Math.random() * 30, ph: Math.random() * 6 });
    }
    bubbles.forEach((p) => {
      p.y -= p.vy * dt; p.x += Math.sin(t * 1.3 + p.ph) * 0.3;
      // les bulles s'écartent doucement du pointeur
      const dx = p.x - pointer.x, dy = p.y - pointer.y, d2 = dx * dx + dy * dy;
      if (d2 < 6400) { p.x += dx * 0.04; p.y += dy * 0.04; }
      bctx.strokeStyle = 'rgba(255,255,255,0.75)'; bctx.lineWidth = 1.2;
      bctx.fillStyle = 'rgba(255,255,255,0.12)';
      bctx.beginPath(); bctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); bctx.fill(); bctx.stroke();
      bctx.fillStyle = 'rgba(255,255,255,0.8)';
      bctx.beginPath(); bctx.arc(p.x - p.r * 0.35, p.y - p.r * 0.35, p.r * 0.22, 0, Math.PI * 2); bctx.fill();
    });
    bubbles = bubbles.filter((p) => p.y > -30);
  });
  // Toucher une bulle du fond la fait éclater
  menu.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    const hit = bubbles.find((p) => Math.hypot(p.x - e.clientX, p.y - e.clientY) < p.r + 10);
    if (hit) { SG.audio.init(); SG.audio.pop(1.2 + 8 / hit.r, 0.4); SG.haptic(6); hit.y = -100; }
  });

  buildMenu();
  const start = (location.hash || '').slice(1);
  if (start && SG.games.some((g) => g.id === start)) {
    history.replaceState(null, '', location.pathname + location.search);
    history.pushState({ game: start }, '', '#' + start);
    open(start, false);
  }
})();
