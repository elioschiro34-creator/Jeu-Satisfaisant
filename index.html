  <script>/* js/games/chocolate.js */
/* Chocolat — déballer une tablette, la casser carré par carré, déplacer et croquer les morceaux */
(function () {
  'use strict';
  const { rand, clamp, pick } = SG.util;
  const A = SG.audio;
  const COLS = 4, ROWS = 6;
  const FM = 0.14; // marge de l'aluminium autour de la tablette (en carrés)

  /* ---------- Petits outils ---------- */
  const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  // k > 0 : éclaircit vers le blanc ; k < 0 : assombrit
  const shade = (rgb, k, a = 1) => {
    const c = rgb.map((v) => Math.round(k >= 0 ? v + (255 - v) * k : v * (1 + k)));
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  };
  function srand(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rr(g, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function poly(g, pts, fill) {
    g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath();
    g.fillStyle = fill; g.fill();
  }
  function heart(g, cx, cy, s) {
    g.beginPath();
    g.moveTo(cx, cy + s * 0.62);
    g.bezierCurveTo(cx - s * 1.25, cy - s * 0.1, cx - s * 0.6, cy - s * 1.0, cx, cy - s * 0.38);
    g.bezierCurveTo(cx + s * 0.6, cy - s * 1.0, cx + s * 1.25, cy - s * 0.1, cx, cy + s * 0.62);
    g.closePath();
  }

  const FLAVORS = [
    { id: 'lait', name: 'Lait', base: '#7b4a2e', foil: ['#f2f4f8', '#aab2bf'], sleeve: ['#ffc8a8', '#fff3e6'], ink: '#7b4a2e', label: 'au lait', tone: 1 },
    { id: 'noir', name: 'Noir', base: '#45261a', foil: ['#f8e9bd', '#c4a259'], sleeve: ['#d6c4ff', '#f7f2ff'], ink: '#45261a', label: 'noir 70 %', tone: 1.2 },
    { id: 'blanc', name: 'Blanc', base: '#efdcbc', foil: ['#eef5ff', '#a5bad6'], sleeve: ['#b8dcff', '#f3f9ff'], ink: '#8a6a45', label: 'blanc vanille', tone: 0.85 },
    { id: 'fraise', name: 'Fraise', base: '#ee9cb3', foil: ['#fff0f5', '#dba2b4'], sleeve: ['#ffb5c8', '#fff1f5'], ink: '#b8566f', label: 'à la fraise', tone: 0.95 },
  ];

  SG.registerGame({
    id: 'chocolate',
    title: 'Chocolat',
    emoji: '🍫',
    desc: 'Déballe la tablette et casse-la carré par carré. Crac !',
    color: '#e8c3a8',
    bg: 'linear-gradient(180deg,#fdeef0,#f6dcd6)',
    order: 15,
    create(stage) {
      const cv = SG.makeCanvas(stage);
      const g = cv.ctx;
      let W = 0, H = 0, dpr = 1, sq = 60, cx = 0, cy = 0;
      let fl = FLAVORS[0], rgb = hex2rgb(fl.base);
      let mode = 'sleeve'; // 'sleeve' → 'foil' → 'free'
      let tool = 'break';
      let seedN = 1;
      const bg = document.createElement('canvas');
      const shadowSpr = document.createElement('canvas');
      const foilCv = document.createElement('canvas');
      const foilSide = document.createElement('canvas');
      const sleeveCv = document.createElement('canvas');
      const FGX = 10, FGY = 14;
      let cells = [], pieces = [];
      let foilHoles = [], foilGrid = new Uint8Array(FGX * FGY), foilAlpha = 1, foilFading = false;
      let sleeve = null;
      let shards = [], dust = [], flakes = [];
      let celebrated = false;
      let lastTick = 0, peelLoop = null;
      const timers = [];
      const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };

      const prog = SG.progress(stage, 'Carrés');
      prog.el.style.display = 'none';
      SG.hint(stage, 'Fais glisser l’étui en papier pour l’enlever ✋');

      /* ---------- Mise en page ---------- */
      function layout() {
        W = cv.w; H = cv.h; dpr = cv.dpr;
        const top = 58, bottom = 92;
        const avail = Math.max(200, H - top - bottom);
        sq = Math.max(24, Math.min((W * 0.8) / COLS, avail / (ROWS + 1.9)));
        cx = W / 2;
        cy = top + (avail - (ROWS + 1.6) * sq) / 2 + (1.0 + ROWS / 2) * sq;
        renderBg(); renderShadow(); renderAll();
      }
      const SX = (u) => cx + u * sq, SY = (v) => cy + v * sq;

      function renderBg() {
        bg.width = Math.round(W * dpr); bg.height = Math.round(H * dpr);
        const b = bg.getContext('2d');
        b.setTransform(dpr, 0, 0, dpr, 0, 0);
        const gr = b.createLinearGradient(0, 0, 0, H);
        gr.addColorStop(0, '#fdeef0'); gr.addColorStop(1, '#f4d9d3');
        b.fillStyle = gr; b.fillRect(0, 0, W, H);
        // Lin de la nappe
        const R = srand(11);
        for (let i = 0; i < (W * H) / 260; i++) {
          b.fillStyle = `rgba(255,255,255,${0.05 + R() * 0.12})`;
          b.fillRect(R() * W, R() * H, 4 + R() * 12, 1);
          b.fillStyle = `rgba(190,120,120,${0.02 + R() * 0.04})`;
          b.fillRect(R() * W, R() * H, 1, 3 + R() * 8);
        }
        // Planche en bois
        const bx = cx - (COLS / 2 + 0.65) * sq, by = cy - (ROWS / 2 + 1.0) * sq;
        const bw = (COLS + 1.3) * sq, bh = (ROWS + 1.6) * sq, rad = sq * 0.35;
        b.save();
        b.shadowColor = 'rgba(120,70,60,0.35)'; b.shadowBlur = 28; b.shadowOffsetY = 14;
        b.fillStyle = '#c99a6b'; rr(b, bx, by + 5, bw, bh, rad); b.fill();
        b.restore();
        b.fillStyle = '#b98a5c'; rr(b, bx, by + 5, bw, bh, rad); b.fill();
        b.save();
        rr(b, bx, by, bw, bh, rad); b.clip();
        const wg = b.createLinearGradient(bx, 0, bx + bw, 0);
        wg.addColorStop(0, '#e8c095'); wg.addColorStop(0.5, '#f1cfa6'); wg.addColorStop(1, '#e3b98b');
        b.fillStyle = wg; b.fillRect(bx, by, bw, bh);
        // Veines du bois
        for (let i = 0; i < 46; i++) {
          const x0 = bx + R() * bw, amp = 2 + R() * 6, f = 0.01 + R() * 0.02, ph = R() * 6;
          b.strokeStyle = `rgba(${150 + R() * 40},${95 + R() * 30},${55 + R() * 20},${0.08 + R() * 0.16})`;
          b.lineWidth = 0.6 + R() * 1.6;
          b.beginPath();
          for (let y = by; y <= by + bh; y += 6) {
            const x = x0 + Math.sin(y * f + ph) * amp + Math.sin(y * f * 3.1) * amp * 0.3;
            y === by ? b.moveTo(x, y) : b.lineTo(x, y);
          }
          b.stroke();
        }
        // Nœud du bois
        const kx = bx + bw * (0.2 + R() * 0.6), ky = by + bh * (0.7 + R() * 0.2);
        for (let i = 5; i > 0; i--) {
          b.strokeStyle = `rgba(140,85,45,${0.08 + i * 0.03})`; b.lineWidth = 1;
          b.beginPath(); b.ellipse(kx, ky, i * 4, i * 2.2, 0.2, 0, Math.PI * 2); b.stroke();
        }
        // Rayures de couteau
        for (let i = 0; i < 18; i++) {
          const x = bx + R() * bw, y = by + R() * bh, a = R() * Math.PI, l = 10 + R() * 30;
          b.strokeStyle = 'rgba(255,240,220,0.25)'; b.lineWidth = 0.7;
          b.beginPath(); b.moveTo(x, y); b.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); b.stroke();
        }
        // Lustre
        const sh = b.createLinearGradient(bx, by, bx + bw, by + bh);
        sh.addColorStop(0, 'rgba(255,255,255,0.18)'); sh.addColorStop(0.5, 'rgba(255,255,255,0)');
        b.fillStyle = sh; b.fillRect(bx, by, bw, bh);
        b.restore();
        // Trou de la poignée
        const hx = cx, hy = by + sq * 0.5;
        b.save();
        rr(b, hx - sq * 0.5, hy - sq * 0.14, sq, sq * 0.28, sq * 0.14);
        b.fillStyle = '#eac8c0'; b.fill(); b.clip();
        b.fillStyle = 'rgba(120,70,40,0.35)'; rr(b, hx - sq * 0.5, hy - sq * 0.14, sq, sq * 0.1, sq * 0.05); b.fill();
        b.restore();
        b.strokeStyle = 'rgba(255,240,220,0.6)'; b.lineWidth = 1;
        rr(b, hx - sq * 0.5, hy - sq * 0.14 + 1, sq, sq * 0.28, sq * 0.14); b.stroke();
      }

      function renderShadow() {
        const s = Math.max(8, Math.round(sq * dpr * 1.6));
        shadowSpr.width = shadowSpr.height = s;
        const x = shadowSpr.getContext('2d');
        x.shadowColor = 'rgba(70,35,20,0.5)';
        x.shadowBlur = sq * dpr * 0.14;
        x.shadowOffsetX = s * 4;
        x.fillStyle = '#000';
        x.fillRect(-s * 4 + s * 0.19, s * 0.19, s * 0.62, s * 0.62);
      }

      /* ---------- Rendu d'un carré de chocolat (avec cassures et morsures) ---------- */
      function renderCell(cl) {
        const S = Math.max(8, Math.round(sq * dpr));
        if (!cl.cv) { cl.cv = document.createElement('canvas'); cl.sd = document.createElement('canvas'); }
        cl.cv.width = cl.cv.height = cl.sd.width = cl.sd.height = S;
        const x = cl.cv.getContext('2d');
        const b = S * 0.15;
        x.fillStyle = shade(rgb, 0); x.fillRect(0, 0, S, S);
        // Biseaux éclairés en haut à gauche
        poly(x, [[0, 0], [S, 0], [S - b, b], [b, b]], shade(rgb, 0.3));
        poly(x, [[0, 0], [b, b], [b, S - b], [0, S]], shade(rgb, 0.14));
        poly(x, [[S, 0], [S, S], [S - b, S - b], [S - b, b]], shade(rgb, -0.25));
        poly(x, [[0, S], [b, S - b], [S - b, S - b], [S, S]], shade(rgb, -0.38));
        // Plateau
        const pg = x.createLinearGradient(b, b, S - b, S - b);
        pg.addColorStop(0, shade(rgb, 0.08)); pg.addColorStop(1, shade(rgb, -0.06));
        x.fillStyle = pg; x.fillRect(b, b, S - 2 * b, S - 2 * b);
        // Cœur en relief
        const o = Math.max(1, S * 0.016), hs = S * 0.2;
        heart(x, S / 2 + o, S / 2 + o, hs); x.fillStyle = shade(rgb, -0.3); x.fill();
        heart(x, S / 2 - o, S / 2 - o, hs); x.fillStyle = shade(rgb, 0.3); x.fill();
        heart(x, S / 2, S / 2, hs * 0.96); x.fillStyle = shade(rgb, 0.02); x.fill();
        // Sillon entre les carrés
        x.strokeStyle = shade(rgb, -0.5, 0.35); x.lineWidth = Math.max(1, S * 0.025);
        x.strokeRect(0, 0, S, S);
        // Micro-texture
        const R = srand(cl.c * 31 + cl.r * 7 + 3);
        for (let i = 0; i < 40; i++) {
          x.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
          x.fillRect(R() * S, R() * S, 1 + R() * 2, 1 + R() * 2);
        }
        // Brillance du chocolat tempéré : un reflet continu sur toute la tablette
        x.save();
        x.translate(-cl.c * S, -cl.r * S);
        const gl = x.createLinearGradient(0, 0, COLS * S, ROWS * S * 0.8);
        gl.addColorStop(0, 'rgba(255,255,255,0.10)');
        gl.addColorStop(0.28, 'rgba(255,255,255,0.0)');
        gl.addColorStop(0.36, 'rgba(255,255,255,0.20)');
        gl.addColorStop(0.42, 'rgba(255,255,255,0.03)');
        gl.addColorStop(0.62, 'rgba(255,255,255,0.0)');
        gl.addColorStop(0.7, 'rgba(255,255,255,0.10)');
        gl.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = gl; x.fillRect(cl.c * S, cl.r * S, S, S);
        x.restore();
        // Cassures nettes : bord irrégulier + tranche mate granuleuse
        const ANG = { b: 0, l: Math.PI / 2, t: Math.PI, r: -Math.PI / 2 };
        for (const k in cl.br) {
          const Rb = srand(cl.br[k]);
          x.save();
          x.translate(S / 2, S / 2); x.rotate(ANG[k]); x.translate(-S / 2, -S / 2);
          const pts = [];
          const n = 9;
          for (let i = 0; i <= n; i++) pts.push([(i / n) * S, S - S * (0.015 + Rb() * 0.05)]);
          x.globalCompositeOperation = 'destination-out';
          x.beginPath(); x.moveTo(-2, S + 2); pts.forEach((p) => x.lineTo(p[0], p[1])); x.lineTo(S + 2, S + 2); x.closePath(); x.fill();
          x.globalCompositeOperation = 'source-atop';
          const fw = S * 0.075;
          x.beginPath(); pts.forEach((p, i) => (i ? x.lineTo(p[0], p[1] - fw * (0.7 + Rb() * 0.5)) : x.moveTo(p[0], p[1] - fw)));
          for (let i = pts.length - 1; i >= 0; i--) x.lineTo(pts[i][0], pts[i][1] + 1);
          x.closePath();
          x.fillStyle = shade(rgb, 0.12); x.fill();
          for (let i = 0; i < 26; i++) {
            x.fillStyle = Rb() < 0.5 ? shade(rgb, 0.3, 0.5) : shade(rgb, -0.25, 0.5);
            x.fillRect(Rb() * S, S - Rb() * fw * 1.1, 1 + Rb() * 1.5, 1 + Rb() * 1.5);
          }
          x.restore();
        }
        // Morsures : arc festonné de marques de dents
        cl.bites.forEach((bt) => {
          const Rb = srand(bt.s);
          const bx = bt.u * S, by = bt.v * S, r = bt.r * S;
          x.save();
          x.globalCompositeOperation = 'destination-out';
          x.beginPath(); x.arc(bx, by, r, 0, Math.PI * 2); x.fill();
          for (let a = 0; a < Math.PI * 2; a += 0.42) {
            x.beginPath(); x.arc(bx + Math.cos(a) * r, by + Math.sin(a) * r, r * (0.12 + Rb() * 0.06), 0, Math.PI * 2); x.fill();
          }
          x.globalCompositeOperation = 'source-atop';
          x.strokeStyle = shade(rgb, 0.1, 0.7); x.lineWidth = r * 0.14;
          x.beginPath(); x.arc(bx, by, r * 1.02, 0, Math.PI * 2); x.stroke();
          for (let i = 0; i < 30; i++) {
            const a = Rb() * Math.PI * 2, d = r * (1.0 + Rb() * 0.12);
            x.fillStyle = Rb() < 0.5 ? shade(rgb, 0.3, 0.6) : shade(rgb, -0.25, 0.5);
            x.fillRect(bx + Math.cos(a) * d, by + Math.sin(a) * d, 1 + Rb() * 1.5, 1 + Rb() * 1.5);
          }
          x.restore();
        });
        // Tranche (épaisseur) : même silhouette, couleur plus sombre
        const s = cl.sd.getContext('2d');
        s.drawImage(cl.cv, 0, 0);
        s.globalCompositeOperation = 'source-in';
        const sg = s.createLinearGradient(0, 0, 0, S);
        sg.addColorStop(0, shade(rgb, -0.35)); sg.addColorStop(1, shade(rgb, -0.5));
        s.fillStyle = sg; s.fillRect(0, 0, S, S);
        s.globalCompositeOperation = 'source-over';
      }

      /* ---------- Aluminium ---------- */
      function renderFoil() {
        const k = sq * dpr;
        foilCv.width = foilSide.width = Math.round((COLS + 2 * FM) * k);
        foilCv.height = foilSide.height = Math.round((ROWS + 2 * FM) * k);
        const f = foilCv.getContext('2d');
        const Wf = foilCv.width, Hf = foilCv.height;
        const [c1, c2] = fl.foil;
        const gr = f.createLinearGradient(0, 0, Wf, Hf);
        gr.addColorStop(0, c1); gr.addColorStop(0.35, c2); gr.addColorStop(0.55, c1); gr.addColorStop(0.8, c2); gr.addColorStop(1, c1);
        f.fillStyle = gr; f.fillRect(0, 0, Wf, Hf);
        // Facettes froissées
        const R = srand(77);
        for (let i = 0; i < 140; i++) {
          const x0 = R() * Wf, y0 = R() * Hf, s = k * (0.15 + R() * 0.5);
          f.fillStyle = R() < 0.55 ? `rgba(255,255,255,${0.05 + R() * 0.25})` : `rgba(40,40,60,${0.03 + R() * 0.1})`;
          f.beginPath(); f.moveTo(x0, y0); f.lineTo(x0 + (R() - 0.5) * s, y0 + (R() - 0.5) * s); f.lineTo(x0 + (R() - 0.5) * s, y0 + (R() - 0.5) * s); f.closePath(); f.fill();
        }
        // Plis lumineux
        for (let i = 0; i < 24; i++) {
          const x0 = R() * Wf, y0 = R() * Hf, a = R() * Math.PI, l = k * (0.3 + R() * 0.8);
          f.strokeStyle = `rgba(255,255,255,${0.2 + R() * 0.4})`; f.lineWidth = 0.6 * dpr;
          f.beginPath(); f.moveTo(x0, y0); f.lineTo(x0 + Math.cos(a) * l, y0 + Math.sin(a) * l); f.stroke();
        }
        // Les carrés se devinent sous l'aluminium
        const m = FM * k;
        for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
          const x0 = m + c * k, y0 = m + r * k, b = k * 0.15;
          f.strokeStyle = 'rgba(255,255,255,0.45)'; f.lineWidth = 1.2 * dpr;
          f.strokeRect(x0 + b - dpr, y0 + b - dpr, k - 2 * b, k - 2 * b);
          f.strokeStyle = 'rgba(30,30,50,0.12)';
          f.strokeRect(x0 + b + dpr, y0 + b + dpr, k - 2 * b, k - 2 * b);
          f.strokeStyle = 'rgba(30,30,50,0.18)'; f.lineWidth = 1.5 * dpr;
          f.strokeRect(x0, y0, k, k);
        }
        // Bord serti
        f.strokeStyle = 'rgba(40,40,60,0.18)'; f.lineWidth = m * 0.9;
        f.setLineDash([2 * dpr, 2 * dpr]); f.strokeRect(m * 0.45, m * 0.45, Wf - m * 0.9, Hf - m * 0.9); f.setLineDash([]);
        foilHoles.forEach((h) => punchFoil(f, h));
        updateFoilSide();
      }
      function punchFoil(f, h) {
        const k = sq * dpr, R = srand(h.s);
        const px = (h.x + COLS / 2 + FM) * k, py = (h.y + ROWS / 2 + FM) * k;
        const pts = [];
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2, d = h.r * k * (0.7 + R() * 0.45);
          pts.push([px + Math.cos(a) * d, py + Math.sin(a) * d]);
        }
        f.save();
        f.globalCompositeOperation = 'destination-out';
        poly(f, pts, '#000');
        f.globalCompositeOperation = 'source-atop';
        f.beginPath(); pts.forEach((p, i) => (i ? f.lineTo(p[0], p[1]) : f.moveTo(p[0], p[1]))); f.closePath();
        f.strokeStyle = 'rgba(40,40,60,0.35)'; f.lineWidth = 3 * dpr; f.stroke();
        f.strokeStyle = 'rgba(255,255,255,0.8)'; f.lineWidth = 1 * dpr;
        f.translate(-1.5 * dpr, -1.5 * dpr); f.stroke();
        f.restore();
      }
      function updateFoilSide() {
        const s = foilSide.getContext('2d');
        s.clearRect(0, 0, foilSide.width, foilSide.height);
        s.drawImage(foilCv, 0, 0);
        s.globalCompositeOperation = 'source-in';
        s.fillStyle = shade(hex2rgb(fl.foil[1]), -0.3); s.fillRect(0, 0, foilSide.width, foilSide.height);
        s.globalCompositeOperation = 'source-over';
      }

      /* ---------- Étui en papier ---------- */
      const SLW = COLS + 0.34, SLH = 3.7;
      function renderSleeve() {
        const k = sq * dpr;
        const Wp = sleeveCv.width = Math.round(SLW * k), Hp = sleeveCv.height = Math.round(SLH * k);
        const s = sleeveCv.getContext('2d');
        s.fillStyle = fl.sleeve[0]; s.fillRect(0, 0, Wp, Hp);
        // Bandes crème festonnées
        s.fillStyle = fl.sleeve[1];
        s.fillRect(0, 0, Wp, Hp * 0.12); s.fillRect(0, Hp * 0.88, Wp, Hp * 0.12);
        const sc = Wp / 14;
        for (let i = 0; i < 15; i++) {
          s.beginPath(); s.arc(i * sc, Hp * 0.12, sc * 0.5, 0, Math.PI); s.fill();
          s.beginPath(); s.arc(i * sc + sc / 2, Hp * 0.88, sc * 0.5, Math.PI, Math.PI * 2); s.fill();
        }
        // Pois
        const R = srand(5);
        s.fillStyle = 'rgba(255,255,255,0.35)';
        for (let i = 0; i < 40; i++) { s.beginPath(); s.arc(R() * Wp, Hp * (0.18 + R() * 0.64), k * 0.04, 0, Math.PI * 2); s.fill(); }
        // Étiquette
        s.fillStyle = fl.sleeve[1];
        s.beginPath(); s.ellipse(Wp / 2, Hp / 2, Wp * 0.36, Hp * 0.22, 0, 0, Math.PI * 2); s.fill();
        s.strokeStyle = fl.ink; s.globalAlpha = 0.4; s.lineWidth = k * 0.025;
        s.beginPath(); s.ellipse(Wp / 2, Hp / 2, Wp * 0.33, Hp * 0.19, 0, 0, Math.PI * 2); s.stroke();
        s.globalAlpha = 1;
        s.fillStyle = fl.ink; s.textAlign = 'center'; s.textBaseline = 'middle';
        s.font = `700 ${Math.round(k * 0.42)}px Fredoka, system-ui, sans-serif`;
        s.fillText('Douceurs', Wp / 2, Hp / 2 - k * 0.1);
        s.font = `500 ${Math.round(k * 0.2)}px Fredoka, system-ui, sans-serif`;
        s.fillText('chocolat ' + fl.label, Wp / 2, Hp / 2 + k * 0.28);
        // Fibres du papier
        for (let i = 0; i < 300; i++) {
          s.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.12)' : 'rgba(120,80,60,0.05)';
          s.fillRect(R() * Wp, R() * Hp, 1 + R() * 4 * dpr, dpr);
        }
        // Volume : le papier s'enroule autour de la tablette
        const vg = s.createLinearGradient(0, 0, Wp, 0);
        vg.addColorStop(0, 'rgba(90,40,40,0.28)'); vg.addColorStop(0.08, 'rgba(90,40,40,0)');
        vg.addColorStop(0.22, 'rgba(255,255,255,0.25)'); vg.addColorStop(0.32, 'rgba(255,255,255,0)');
        vg.addColorStop(0.9, 'rgba(90,40,40,0)'); vg.addColorStop(1, 'rgba(90,40,40,0.3)');
        s.fillStyle = vg; s.fillRect(0, 0, Wp, Hp);
      }

      function renderAll() {
        cells.forEach(renderCell);
        renderFoil(); renderSleeve();
      }

      /* ---------- Morceaux ---------- */
      function bbox(cs) {
        let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
        cs.forEach((q) => { a = Math.min(a, q.c); b = Math.min(b, q.r); c = Math.max(c, q.c + 1); d = Math.max(d, q.r + 1); });
        return { minC: a, minR: b, maxC: c - 1, maxR: d - 1, cx: (a + c) / 2, cy: (b + d) / 2 };
      }
      function toWorld(p, lx, ly) {
        const dx = lx - p.px, dy = ly - p.py, c = Math.cos(p.rot), s = Math.sin(p.rot);
        return [p.x + dx * c - dy * s, p.y + dx * s + dy * c];
      }
      function toLocal(p, wx, wy) {
        const dx = wx - p.x, dy = wy - p.y, c = Math.cos(-p.rot), s = Math.sin(-p.rot);
        return [p.px + dx * c - dy * s, p.py + dx * s + dy * c];
      }
      function makePiece(cs, from) {
        const bb = bbox(cs);
        const p = { cells: cs, px: bb.cx, py: bb.cy, x: 0, y: 0, rot: 0, lift: 0, liftT: 0, held: null, bend: null, dropping: false };
        if (from) { const w = toWorld(from, bb.cx, bb.cy); p.x = w[0]; p.y = w[1]; p.rot = from.rot; p.lift = from.lift; }
        else { p.x = bb.cx - COLS / 2; p.y = bb.cy - ROWS / 2; }
        return p;
      }
      function repivot(p) {
        const bb = bbox(p.cells), w = toWorld(p, bb.cx, bb.cy);
        p.px = bb.cx; p.py = bb.cy; p.x = w[0]; p.y = w[1];
      }
      function hitPiece(wx, wy) {
        for (let i = pieces.length - 1; i >= 0; i--) {
          const p = pieces[i];
          const [lx, ly] = toLocal(p, wx, wy + p.lift * 0.18);
          const cl = p.cells.find((q) => lx >= q.c - 0.04 && lx < q.c + 1.04 && ly >= q.r - 0.04 && ly < q.r + 1.04);
          if (cl) return { p, cl, i };
        }
        return null;
      }
      function computeCut(p, cl, axis, ldx, ldy) {
        const cs = p.cells, bb = bbox(cs);
        if (bb.minR === bb.maxR && bb.minC === bb.maxC) return null;
        if (axis === 'h' && bb.minR === bb.maxR) axis = 'v';
        if (axis === 'v' && bb.minC === bb.maxC) axis = 'h';
        let set, pos, nx = 0, ny = 0;
        if (axis === 'h') {
          const mid = (bb.minR + bb.maxR) / 2, top = cl.r < mid || (cl.r === mid && ldy < 0);
          set = new Set(cs.filter((q) => (top ? q.r <= cl.r : q.r >= cl.r)));
          pos = top ? cl.r + 1 : cl.r; ny = top ? -1 : 1;
        } else {
          const mid = (bb.minC + bb.maxC) / 2, left = cl.c < mid || (cl.c === mid && ldx < 0);
          set = new Set(cs.filter((q) => (left ? q.c <= cl.c : q.c >= cl.c)));
          pos = left ? cl.c + 1 : cl.c; nx = left ? -1 : 1;
        }
        if (set.size === cs.length || set.size === 0) return null;
        return { axis, pos, set, nx, ny, bb };
      }

      /* ---------- Particules ---------- */
      function spawnShards(wx, wy, n, spread) {
        for (let i = 0; i < n; i++) {
          shards.push({
            x: wx + rand(-spread, spread), y: wy + rand(-spread, spread), z: rand(0.05, 0.2),
            vx: rand(-1.6, 1.6), vy: rand(-1.6, 1.6), vz: rand(1.5, 4.5),
            rot: rand(0, 6.28), vr: rand(-12, 12), s: rand(0.03, 0.09), k: rand(-0.2, 0.25), life: rand(8, 14),
          });
        }
        if (shards.length > 260) shards.splice(0, shards.length - 260);
      }
      function spawnDust(wx, wy, n, spread) {
        for (let i = 0; i < n; i++) {
          dust.push({ x: wx + rand(-spread, spread), y: wy + rand(-spread, spread), vx: rand(-0.6, 0.6), vy: rand(-0.9, 0.1), r: rand(0.04, 0.14), life: 1, k: rand(0, 0.3) });
        }
      }

      /* ---------- Actions ---------- */
      function snap(a, wx, wy) {
        const p = a.p, cut = a.cut;
        const restCells = p.cells.filter((q) => !cut.set.has(q));
        const B = makePiece([...cut.set], p);
        const Ap = makePiece(restCells, p);
        Object.assign(p, { cells: Ap.cells, px: Ap.px, py: Ap.py, x: Ap.x, y: Ap.y, bend: null });
        // Bords cassés de part et d'autre
        const touched = new Set();
        cut.set.forEach((cb) => {
          restCells.forEach((ca) => {
            if (cut.axis === 'h' && ca.c === cb.c && Math.abs(ca.r - cb.r) === 1) {
              cb.br[cb.r < ca.r ? 'b' : 't'] = seedN++; ca.br[ca.r < cb.r ? 'b' : 't'] = seedN++;
              touched.add(ca); touched.add(cb);
            } else if (cut.axis === 'v' && ca.r === cb.r && Math.abs(ca.c - cb.c) === 1) {
              cb.br[cb.c < ca.c ? 'r' : 'l'] = seedN++; ca.br[ca.c < cb.c ? 'r' : 'l'] = seedN++;
              touched.add(ca); touched.add(cb);
            }
          });
        });
        touched.forEach(renderCell);
        pieces.push(B);
        a.type = 'hold'; a.p = B; B.held = a; B.liftT = 1;
        a.gx = a.x0 - B.x; a.gy = a.y0 - B.y;
        a.tx = wx - a.gx; a.ty = wy - a.gy;
        // Éclats et poussière de cacao le long de la cassure
        const bb = cut.bb;
        const L = cut.axis === 'h' ? bb.maxC + 1 - bb.minC : bb.maxR + 1 - bb.minR;
        for (let i = 0; i < L * 6; i++) {
          const t = Math.random();
          const lx = cut.axis === 'h' ? bb.minC + t * L : cut.pos;
          const ly = cut.axis === 'h' ? cut.pos : bb.minR + t * L;
          const w = toWorld(p, lx, ly);
          spawnShards(w[0], w[1], 1, 0.04);
          if (i % 2 === 0) spawnDust(w[0], w[1], 1, 0.05);
        }
        A.crack(0.95, fl.tone);
        later(() => A.crunch(0.4, 1.5 * fl.tone), 25);
        later(() => A.tap('wood', 0.08, 2.4), 60);
        SG.haptic([14, 8, 6]);
        updateProgress();
      }

      function bite(p, wx, wy) {
        const [lx, ly] = toLocal(p, wx, wy + p.lift * 0.18);
        // petites bouchées : on grignote le carré petit à petit
        const R = 0.3, hit = [];
        p.cells.forEach((cl) => {
          const nx = clamp(lx, cl.c, cl.c + 1), ny = clamp(ly, cl.r, cl.r + 1);
          if (Math.hypot(nx - lx, ny - ly) < R * 0.95) { cl.bites.push({ u: lx - cl.c, v: ly - cl.r, r: R, s: seedN++ }); hit.push(cl); }
        });
        if (!hit.length) return;
        hit.forEach((cl) => {
          let n = 0;
          for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
            const u = (i + 0.5) / 8, v = (j + 0.5) / 8;
            if (cl.bites.some((b) => Math.hypot(u - b.u, v - b.v) < b.r * 1.02)) n++;
          }
          // le carré ne disparaît que lorsqu'il n'en reste presque plus rien
          if (n / 64 > 0.97) cl.gone = true; else renderCell(cl);
        });
        p.cells = p.cells.filter((c) => !c.gone);
        if (!p.cells.length) pieces.splice(pieces.indexOf(p), 1);
        else repivot(p);
        spawnShards(wx, wy, 10, 0.2); spawnDust(wx, wy, 8, 0.2);
        A.crunch(0.95, 0.9 * fl.tone); A.crack(0.35, 1.3 * fl.tone);
        later(() => A.crunch(0.45, 1.1 * fl.tone), 110);
        later(() => A.crunch(0.25, 0.9 * fl.tone), 260);
        SG.haptic([10, 25, 10]);
        updateProgress();
      }

      function pickUp(a) {
        if (a.type === 'hold') return;
        clearTimeout(a.timer);
        a.type = 'hold';
        const p = a.p; p.bend = null; p.held = a; p.liftT = 1; p.dropping = false;
        a.gx = a.x0 - p.x; a.gy = a.y0 - p.y; a.tx = p.x; a.ty = p.y;
        SG.haptic(6);
      }

      function tearFoil(x0, y0, x1, y1) {
        const d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(d / 0.14));
        const f = foilCv.getContext('2d');
        let did = 0;
        for (let i = 1; i <= n; i++) {
          const x = x0 + ((x1 - x0) * i) / n, y = y0 + ((y1 - y0) * i) / n;
          if (Math.abs(x) > COLS / 2 + FM + 0.3 || Math.abs(y) > ROWS / 2 + FM + 0.3) continue;
          const h = { x, y, r: rand(0.3, 0.42), s: seedN++ };
          foilHoles.push(h); punchFoil(f, h); did++;
          for (let gy = 0; gy < FGY; gy++) for (let gx = 0; gx < FGX; gx++) {
            const ux = -COLS / 2 - FM + ((gx + 0.5) / FGX) * (COLS + 2 * FM), uy = -ROWS / 2 - FM + ((gy + 0.5) / FGY) * (ROWS + 2 * FM);
            if (Math.hypot(ux - x, uy - y) < h.r * 0.95) foilGrid[gy * FGX + gx] = 1;
          }
          if (Math.random() < 0.8) {
            flakes.push({ x, y, z: 0.15, vx: rand(-2, 2), vy: rand(-2, 1), vz: rand(2, 5), rot: rand(0, 6), vr: rand(-10, 10), s: rand(0.08, 0.2), life: rand(1.6, 2.6), c: pick(fl.foil) });
          }
        }
        if (!did) return;
        updateFoilSide();
        const now = performance.now();
        if (now - lastTick > 70) { lastTick = now; A.rustle(0.22, 0.09); SG.haptic(3); }
        let s = 0; foilGrid.forEach((v) => (s += v));
        if (!foilFading && s / foilGrid.length > 0.8) {
          foilFading = true; mode = 'free';
          A.rustle(0.4, 0.5); A.whoosh(0.25, 0.5);
          for (let i = 0; i < 26; i++) flakes.push({ x: rand(-2, 2), y: rand(-3, 3), z: 0.2, vx: rand(-3, 3), vy: rand(-3, 3), vz: rand(3, 6), rot: rand(0, 6), vr: rand(-10, 10), s: rand(0.1, 0.24), life: rand(1.5, 2.5), c: pick(fl.foil) });
          prog.el.style.display = '';
          later(() => SG.hint(stage, 'Tire un carré pour le casser · appui long pour déplacer', 4500), 500);
        }
      }

      function updateProgress() {
        let n = 0;
        cells.forEach((c) => { if (c.gone) n++; });
        pieces.forEach((p) => { if (p.cells.length === 1) n++; });
        prog.set(n / cells.length);
        if (!celebrated && n >= cells.length) {
          celebrated = true;
          SG.celebrate(stage, 'Tout en carrés !');
          later(() => SG.hint(stage, 'Croque-les 😋 ou prends une nouvelle tablette'), 2300);
        }
      }

      function newBar() {
        cells = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) cells.push({ c, r, br: {}, bites: [], gone: false, cv: null, sd: null });
        pieces = [makePiece(cells.slice())];
        mode = 'sleeve';
        sleeve = { off: 0, vel: 0, drag: false, flying: false, rot: 0, alpha: 1 };
        foilHoles = []; foilGrid.fill(0); foilAlpha = 1; foilFading = false;
        shards = []; dust = []; flakes = []; celebrated = false;
        prog.el.style.display = 'none'; prog.set(0);
        acts.forEach((a) => clearTimeout(a.timer)); acts.clear();
        renderAll();
      }

      /* ---------- Pointeur ---------- */
      const acts = new Map();
      const toW = (p) => [(p.x - cx) / sq, (p.y - cy) / sq];
      const ptr = SG.pointer(cv.canvas, {
        down(p) {
          const [wx, wy] = toW(p);
          if (mode === 'sleeve') {
            if (!sleeve.flying && Math.abs(wx) < SLW / 2 + 0.2 && Math.abs(wy - sleeve.off) < SLH / 2 + 0.2) {
              acts.set(p.id, { type: 'sleeve', y0: wy, off0: sleeve.off, last: wy });
              sleeve.drag = true; A.rustle(0.18, 0.12); SG.haptic(4);
            } else if (Math.abs(wx) < COLS / 2 + FM && Math.abs(wy) < ROWS / 2 + FM) {
              A.rustle(0.15, 0.08); A.tap('plastic', 0.1, 1.8);
            }
            return;
          }
          if (mode === 'foil') {
            acts.set(p.id, { type: 'foil', lx: wx, ly: wy });
            if (!peelLoop) peelLoop = A.loop('peel');
            tearFoil(wx, wy, wx, wy);
            return;
          }
          const hit = hitPiece(wx, wy);
          if (!hit) { A.tap('wood', 0.25, 1.1); SG.haptic(3); return; }
          if (tool === 'bite') { bite(hit.p, wx, wy); return; }
          if (hit.p.held) return;
          pieces.splice(hit.i, 1); pieces.push(hit.p);
          const a = { type: 'press', p: hit.p, cl: hit.cl, x0: wx, y0: wy, cut: null, stress: 0 };
          a.timer = later(() => { if (acts.get(p.id) === a && a.type === 'press' && !a.cut) pickUp(a); }, 330);
          acts.set(p.id, a);
        },
        move(p) {
          const a = acts.get(p.id);
          if (!a) return;
          const [wx, wy] = toW(p);
          if (a.type === 'sleeve') {
            sleeve.off = a.off0 + (wy - a.y0);
            if (Math.abs(wy - a.last) > 0.18) { A.rustle(0.12 + Math.min(0.25, p.speed * 0.15), 0.1); a.last = wy; }
          } else if (a.type === 'foil') {
            tearFoil(a.lx, a.ly, wx, wy);
            a.lx = wx; a.ly = wy;
            if (peelLoop) peelLoop.set(Math.min(1, 0.3 + p.speed * 0.6), 0.6);
          } else if (a.type === 'press') {
            const dx = wx - a.x0, dy = wy - a.y0, d = Math.hypot(dx, dy);
            if (!a.cut && d > 0.1) {
              clearTimeout(a.timer);
              const c = Math.cos(-a.p.rot), s = Math.sin(-a.p.rot);
              const ldx = dx * c - dy * s, ldy = dx * s + dy * c;
              a.cut = computeCut(a.p, a.cl, Math.abs(ldx) > Math.abs(ldy) ? 'v' : 'h', ldx, ldy);
              if (!a.cut) { pickUp(a); a.tx = wx - a.gx; a.ty = wy - a.gy; return; }
              a.p.bend = { cut: a.cut, amt: 0 };
            }
            if (a.cut) {
              const amt = clamp((d - 0.06) / 0.42, 0, 1);
              a.p.bend.amt = amt;
              const st = Math.floor(amt * 3);
              if (st > a.stress && amt < 1) { a.stress = st; A.crunch(0.08 + st * 0.05, 2.1 * fl.tone); SG.haptic(3); }
              if (amt >= 1) snap(a, wx, wy);
            }
          } else if (a.type === 'hold') {
            a.tx = wx - a.gx; a.ty = wy - a.gy;
          }
        },
        up(p) {
          const a = acts.get(p.id);
          if (!a) return;
          acts.delete(p.id);
          clearTimeout(a.timer);
          if (a.type === 'sleeve') {
            sleeve.drag = false;
            if (Math.abs(sleeve.off) > 1.3) {
              sleeve.flying = true; sleeve.vel = Math.sign(sleeve.off) * 7;
              A.whoosh(0.3, 0.45); A.rustle(0.3, 0.35); SG.haptic(8);
            } else A.rustle(0.1, 0.15);
          } else if (a.type === 'foil') {
            if (peelLoop && ![...acts.values()].some((q) => q.type === 'foil')) { peelLoop.stop(); peelLoop = null; }
          } else if (a.type === 'press') {
            if (a.p.bend) a.p.bend = null;
          } else if (a.type === 'hold') {
            const q = a.p; q.held = null; q.liftT = 0; q.dropping = true;
            q.rot += rand(-0.06, 0.06);
          }
        },
      });

      /* ---------- Barre d'outils ---------- */
      SG.toolbar(stage, [
        { icon: '✋', label: 'Casser', group: 't', active: true, onClick: () => { tool = 'break'; } },
        { icon: '😋', label: 'Croquer', group: 't', onClick: () => { tool = 'bite'; SG.hint(stage, 'Touche un morceau pour le croquer', 2200); } },
        ...FLAVORS.map((f, i) => ({
          color: f.base, title: f.name, group: 'f', active: i === 0,
          onClick: () => { fl = f; rgb = hex2rgb(f.base); renderAll(); A.rustle(0.15, 0.15); SG.hint(stage, 'Chocolat ' + f.label, 1500); },
        })),
        { icon: '🎁', label: 'Nouvelle', onClick: () => { newBar(); A.whoosh(0.25, 0.4, true); SG.hint(stage, 'Fais glisser l’étui en papier ✋'); } },
      ]);

      /* ---------- Dessin ---------- */
      function drawPiece(p) {
        const X = SX(p.x), Y = SY(p.y);
        const th = sq * 0.17, up = p.lift * sq * 0.2, sc = 1 + p.lift * 0.05;
        const bend = p.bend;
        const off = (cl) => (bend && bend.cut.set.has(cl) ? [bend.cut.nx * bend.amt * sq * 0.1, bend.cut.ny * bend.amt * sq * 0.1] : [0, 0]);
        const layer = (ox, oy, fn) => {
          g.save(); g.translate(X + ox, Y + oy); g.rotate(p.rot + (p.tilt || 0)); g.scale(sc, sc);
          p.cells.forEach((cl) => { const o = off(cl); fn(cl, (cl.c - p.px) * sq + o[0], (cl.r - p.py) * sq + o[1]); });
          g.restore();
        };
        // Ombre portée
        g.globalAlpha = 0.6 - p.lift * 0.25;
        layer(th * 0.4 + p.lift * sq * 0.3, th * 0.8 + p.lift * sq * 0.35, (cl, x, y) => g.drawImage(shadowSpr, x - sq * 0.3, y - sq * 0.3, sq * 1.6, sq * 1.6));
        g.globalAlpha = 1;
        // Épaisseur
        for (const k of [1, 0.66, 0.33]) layer(0, th * k - up, (cl, x, y) => g.drawImage(cl.sd, x, y, sq, sq));
        // Dessus
        layer(0, -up, (cl, x, y) => g.drawImage(cl.cv, x, y, sq, sq));
        // Pliage avant la cassure
        if (bend && bend.amt > 0) {
          g.save(); g.translate(X, Y - up); g.rotate(p.rot); g.scale(sc, sc);
          const c = bend.cut, bb = c.bb, a = bend.amt;
          g.fillStyle = `rgba(30,10,0,${0.12 * a})`;
          c.set.forEach((cl) => { const o = off(cl); g.fillRect((cl.c - p.px) * sq + o[0], (cl.r - p.py) * sq + o[1], sq, sq); });
          g.strokeStyle = `rgba(20,5,0,${0.6 * a})`; g.lineWidth = 1 + a * 2;
          g.beginPath();
          if (c.axis === 'h') {
            for (let x = bb.minC; x <= bb.maxC + 1.001; x += 0.25) g.lineTo((x - p.px) * sq, (c.pos - p.py) * sq + Math.sin(x * 17) * a * 1.5);
          } else {
            for (let y = bb.minR; y <= bb.maxR + 1.001; y += 0.25) g.lineTo((c.pos - p.px) * sq + Math.sin(y * 17) * a * 1.5, (y - p.py) * sq);
          }
          g.stroke();
          g.restore();
        }
      }

      function drawFoil() {
        const fx = SX(-COLS / 2 - FM), fy = SY(-ROWS / 2 - FM);
        const fw = (COLS + 2 * FM) * sq, fh = (ROWS + 2 * FM) * sq, th = sq * 0.17;
        g.globalAlpha = foilAlpha;
        g.drawImage(foilSide, fx, fy + th, fw, fh);
        g.drawImage(foilSide, fx, fy + th * 0.5, fw, fh);
        g.drawImage(foilCv, fx, fy, fw, fh);
        g.globalAlpha = 1;
      }

      function drawSleeve() {
        const w = SLW * sq, h = SLH * sq, th = sq * 0.19;
        g.save();
        g.globalAlpha = sleeve.alpha;
        g.translate(cx, SY(sleeve.off)); g.rotate(sleeve.rot);
        g.save();
        g.shadowColor = 'rgba(90,40,40,0.3)'; g.shadowBlur = 16; g.shadowOffsetY = 8;
        g.fillStyle = shade(hex2rgb(fl.sleeve[0]), -0.25);
        g.fillRect(-w / 2, -h / 2 + th, w, h);
        g.restore();
        g.drawImage(sleeveCv, -w / 2, -h / 2, w, h);
        g.restore();
      }

      function drawParticles(dt) {
        // Poussière de cacao
        dust.forEach((d) => {
          d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= 0.96; d.vy = d.vy * 0.96 + 0.3 * dt; d.life -= dt * 0.7;
          g.fillStyle = shade(rgb, d.k, Math.max(0, d.life) * 0.35);
          g.beginPath(); g.arc(SX(d.x), SY(d.y), d.r * sq * (1.6 - d.life * 0.6), 0, Math.PI * 2); g.fill();
        });
        dust = dust.filter((d) => d.life > 0);
        // Éclats de chocolat qui rebondissent et restent sur la planche
        let tick = false;
        shards.forEach((s) => {
          if (s.z > 0 || s.vz > 0) {
            s.vz -= 28 * dt; s.z += s.vz * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
            if (s.z <= 0) {
              s.z = 0;
              if (s.vz < -2.5) { s.vz *= -0.3; s.vx *= 0.5; s.vy *= 0.5; s.vr *= 0.5; tick = true; } else { s.vz = 0; s.vx = 0; s.vy = 0; s.vr = 0; }
            }
          }
          s.life -= dt;
          const x = SX(s.x), y = SY(s.y), r = s.s * sq, al = clamp(s.life, 0, 1);
          g.fillStyle = `rgba(60,30,20,${0.25 * al})`;
          g.beginPath(); g.ellipse(x + 1, y + 1.5, r * 0.9, r * 0.5, 0, 0, Math.PI * 2); g.fill();
          g.save(); g.translate(x, y - s.z * sq); g.rotate(s.rot);
          g.globalAlpha = al;
          poly(g, [[-r, -r * 0.4], [r * 0.8, -r * 0.7], [r * 0.3, r * 0.8]], shade(rgb, s.k));
          poly(g, [[-r, -r * 0.4], [r * 0.8, -r * 0.7], [0, -r * 0.2]], shade(rgb, s.k + 0.25));
          g.restore();
        });
        g.globalAlpha = 1;
        shards = shards.filter((s) => s.life > 0);
        // (les éclats rebondissent en silence : les petits « tocs » faisaient une mélodie)
        if (tick && performance.now() - lastTick > 45) { lastTick = performance.now(); }
        // Paillettes d'aluminium
        flakes.forEach((f) => {
          f.vz -= 20 * dt; f.z += f.vz * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt; f.life -= dt;
          if (f.z < 0) { f.z = 0; f.vz = 0; f.vx *= 0.8; f.vy *= 0.8; f.vr *= 0.8; }
          const r = f.s * sq;
          g.save(); g.translate(SX(f.x), SY(f.y) - f.z * sq); g.rotate(f.rot);
          g.globalAlpha = clamp(f.life, 0, 1);
          g.scale(1, 0.3 + Math.abs(Math.cos(f.rot * 1.7)) * 0.7);
          poly(g, [[-r, -r * 0.6], [r * 0.7, -r * 0.8], [r, r * 0.5], [-r * 0.4, r * 0.9]], f.c);
          g.fillStyle = `rgba(255,255,255,${0.25 + 0.6 * Math.abs(Math.sin(f.rot * 2))})`;
          g.beginPath(); g.moveTo(-r, -r * 0.6); g.lineTo(r * 0.7, -r * 0.8); g.lineTo(0, 0); g.fill();
          g.restore();
        });
        g.globalAlpha = 1;
        flakes = flakes.filter((f) => f.life > 0);
      }

      /* ---------- Boucle ---------- */
      const loop = SG.loop((dt) => {
        // Physique des morceaux
        pieces.forEach((p) => {
          p.lift += (p.liftT - p.lift) * (1 - Math.exp(-dt * 14));
          if (p.held) {
            const k = 1 - Math.exp(-dt * 22);
            const tx = clamp(p.held.tx, -W / 2 / sq + 0.4, W / 2 / sq - 0.4);
            const ty = clamp(p.held.ty, (60 - cy) / sq + 0.4, (H - 95 - cy) / sq - 0.2);
            const vx = (tx - p.x) * k;
            p.x += vx; p.y += (ty - p.y) * k;
            p.tilt = (p.tilt || 0) + clamp(vx, -0.05, 0.05) * 0.4;
          }
          if (p.tilt) p.tilt *= Math.exp(-dt * 6);
          if (p.dropping && p.lift < 0.08) {
            p.dropping = false;
            const n = p.cells.length;
            A.thud(clamp(0.25 + n * 0.03, 0.25, 0.8), clamp(1.4 - n * 0.03, 0.7, 1.4));
            SG.haptic(8);
            spawnDust(p.x, p.y, 3 + n, 0.3 + Math.sqrt(n) * 0.3);
          }
        });
        // Étui
        if (sleeve && !sleeve.drag && mode === 'sleeve') {
          if (sleeve.flying) {
            sleeve.vel *= 1 + dt * 3; sleeve.off += sleeve.vel * dt; sleeve.rot += Math.sign(sleeve.vel) * dt * 0.5;
            if (Math.abs(sleeve.off) > ROWS / 2 + 1) sleeve.alpha = Math.max(0, sleeve.alpha - dt * 3);
            if (sleeve.alpha <= 0) {
              mode = 'foil';
              SG.hint(stage, 'Déchire l’aluminium du bout du doigt ✨');
            }
          } else sleeve.off *= Math.exp(-dt * 12);
        }
        if (foilFading) foilAlpha = Math.max(0, foilAlpha - dt * 1.6);

        g.drawImage(bg, 0, 0, W, H);
        pieces.forEach((p) => { if (!p.held) drawPiece(p); });
        if (foilAlpha > 0) drawFoil();
        if (mode === 'sleeve' && sleeve.alpha > 0) drawSleeve();
        drawParticles(dt);
        pieces.forEach((p) => { if (p.held) drawPiece(p); });
      });

      newBar();
      cv.onResize(layout);
      layout();

      return {
        destroy() {
          loop.stop(); ptr.destroy(); cv.destroy();
          timers.forEach(clearTimeout); acts.forEach((a) => clearTimeout(a.timer));
          if (peelLoop) peelLoop.stop();
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/pressure-wash.js */
/* Karcher — nettoyer au jet haute pression des dalles, une terrasse, une voiture, un nain de jardin */
(function () {

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };
  function srand(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) | 0;

  function rr(g, x, y, w, h, r) {

    x.fillStyle = 'rgb(128,128,128)'; x.fillRect(0, 0, w, h);
    x.imageSmoothingEnabled = true;
    [[200, 0.5], [100, 0.45], [50, 0.35], [24, 0.28], [12, 0.22], [6, 0.18], [3, 0.14]].forEach(([s0, a]) => {
      const s = s0 * k;
      const sw = Math.ceil(w / s) + 3, sh = Math.ceil(h / s) + 3;
      const sm = mk(sw, sh), sx = sm.getContext('2d'), id = sx.createImageData(sw, sh);
      for (let i = 0; i < id.data.length; i += 4) { id.data[i] = R() * 255; id.data[i + 1] = R() * 255; id.data[i + 2] = R() * 255; id.data[i + 3] = 255; }
      sx.putImageData(id, 0, 0);
      x.globalAlpha = a; x.drawImage(sm, -s * (1 + R()), -s * (1 + R()), sw * s, sh * s);
    });
    return x.getImageData(0, 0, w, h).data;
  }

  /* ---------- Surfaces ---------- */
  const SURFACES = {
    dalles: {
      name: 'Dalles', film: 0.62, biasK: 0.65, c1: [78, 72, 60], c2: [96, 94, 72], moss: [70, 108, 45], vertical: false,
      geo(sw, sh) {
        const T = Math.max(70, Math.min(sw, sh) / 3.2);
        const nx = Math.ceil(sw / T) + 1, ny = Math.ceil(sh / T) + 1;
        return { T, nx, ny, ox: (sw - nx * T) / 2, oy: (sh - ny * T) / 2 };
      },
      clean(c, sw, sh, G) {
        const R = srand(3);

        for (let i = 0; i < 2000; i++) { c.fillStyle = `rgba(120,100,90,${R() * 0.15})`; c.fillRect(R() * sw, R() * sh, 1.5, 1.5); }
        const pal = ['#f7c9b6', '#f4d4c2', '#f1c2b3', '#f8dacb', '#f5cdbd'];

    terrasse: {

        c.fillStyle = '#6f5242'; c.fillRect(0, 0, sw, sh);

        for (let j = 0; j < G.n; j++) {
          const y = j * G.P + 2, h = G.P - 5;
          const bounds = [-50, ...G.rows[j], sw + 50];
          for (let k = 0; k < bounds.length - 1; k++) {

            c.save();

        c.fillStyle = gr; c.fillRect(0, 0, sw, sh);

      bias(c, sw, sh, G) {

        gr.addColorStop(0, '#fff'); gr.addColorStop(0.25, 'rgba(255,255,255,0.2)'); gr.addColorStop(0.6, 'rgba(255,255,255,0.1)'); gr.addColorStop(1, 'rgba(255,255,255,0.9)');
        c.fillStyle = gr; c.fillRect(0, 0, sw, sh);
      },
    },
  };

  function carPath(c, G) {
